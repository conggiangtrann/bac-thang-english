port.","right":"When the server went down, I was preparing the report.","why":"Thì tiếp diễn luôn cần was/were trước V-ing."},{"wrong":"While the screen froze, I was writing.","right":"When the screen froze, I was writing.","why":"Màn hình đơ là việc ngắn, xảy ra trong tích tắc, nên dùng when; while đi với việc kéo dài."},{"wrong":"We was working late.","right":"We were working late.","why":"We, you, they đi với were; chỉ I, he, she, it đi với was."}]},"quiz":[{"q":"What time did the server stop?","o":["At two o'clock","At three o'clock","At eight o'clock"],"a":1},{"q":"What was Lan doing when the server stopped?","o":["Cleaning the data","Calling IT","Writing the summary"],"a":2},{"q":"While we ___, the screen froze.","o":["were working","was working","are working"],"a":0}],"practice":[{"s":"I ___ the summary when the server went down. (write)","a":"was writing","alt":[],"hint":"Việc đang diễn ra thì bị cắt ngang: was/were + V-ing."},{"s":"Minh and Hoa ___ the data at three o'clock. (clean)","a":"were cleaning","alt":[],"hint":"Chủ ngữ số nhiều + were + V-ing."},{"s":"___ we were working, the screen suddenly froze.","a":"While","alt":[],"hint":"\"Trong lúc\" + việc kéo dài."},{"s":"I was checking the backup ___ Mark called me.","a":"when","alt":[],"hint":"\"Thì\" + việc ngắn chen vào."},{"s":"What ___ you doing when the server stopped?","a":"were","alt":[],"hint":"Câu hỏi quá khứ tiếp diễn với you."}],"speak":["We were preparing the monthly report for BrightMart.","What were you doing when it stopped?","While we were working, the screen suddenly froze.","Minh called IT while I was checking the backup."],"write":{"vi":"Viết email ngắn cho khách hàng giải thích vì sao báo cáo bị chậm: hôm qua có sự cố kỹ thuật xảy ra khi nhóm bạn đang làm. Dùng quá khứ tiếp diễn với when và while.","en":"Write a short email to a client to explain why the report is late: a technical problem happened while your team was working on it. Use the past continuous with 'when' and 'while'.","min":40},"summary":["Quá khứ tiếp diễn: was/were + V-ing = lúc đó đang làm gì.","Việc dài (tiếp diễn) bị việc ngắn (quá khứ đơn) cắt ngang.","While + việc kéo dài; when + việc ngắn chen vào.","I/he/she/it → was; you/we/they → were."]},{"id":"x5_2","ch":5,"level":"A2","after":"s_wasdoing","title":"How we used to work","vi":"Thói quen cũ với USED TO","goals":["Sau bài này bạn có thể nói về thói quen hoặc tình trạng trong quá khứ mà nay không còn, bằng used to.","Sau bài này bạn có thể đặt câu phủ định và câu hỏi với didn't use to / Did you use to...?","Sau bài này bạn có thể so sánh cách làm việc trước kia và bây giờ (not ... anymore)."],"story":[{"who":"Sofia","en":"Lan, your dashboards are great. Did your team always use them?","vi":"Lan, dashboard của chị rất tuyệt. Nhóm chị lúc nào cũng dùng dashboard à?"},{"who":"Lan","en":"No. We used to make every report in Excel.","vi":"Không. Trước đây chúng tôi làm mọi báo cáo bằng Excel."},{"who":"Sofia","en":"Really? How long did that take?","vi":"Thật à? Việc đó mất bao lâu?"},{"who":"Lan","en":"It used to take three days. We copied the numbers by hand.","vi":"Trước đây mất ba ngày. Chúng tôi chép số liệu bằng tay."},{"who":"Sofia","en":"That sounds slow. Did you use to make mistakes?","vi":"Nghe chậm thật. Hồi đó các chị có hay bị sai không?"},{"who":"Lan","en":"Yes, sometimes. And we didn't use to check the data every day.","vi":"Có, thỉnh thoảng. Và hồi đó chúng tôi cũng không kiểm tra dữ liệu hằng ngày."},{"who":"Sofia","en":"So what changed?","vi":"Vậy rồi điều gì đã thay đổi?"},{"who":"Lan","en":"Two years ago, we started using Python and Power BI.","vi":"Hai năm trước, chúng tôi bắt đầu dùng Python và Power BI."},{"who":"Lan","en":"Now the report updates every morning by itself.","vi":"Giờ thì báo cáo tự cập nhật mỗi sáng."},{"who":"Sofia","en":"Wonderful. So you don't stay late anymore?","vi":"Tuyệt quá. Vậy là chị không còn phải ở lại muộn nữa?"},{"who":"Lan","en":"Not usually! I used to leave at nine. Now I leave at six.","vi":"Thường là không! Trước đây tôi về lúc chín giờ. Giờ tôi về lúc sáu giờ."}],"vocab":[{"w":"used to","ipa":"/ˈjuːst tə/","vi":"đã từng (thường), trước đây hay","ex":"We used to make reports in Excel."},{"w":"copy","ipa":"/ˈkɑːpi/","vi":"sao chép, chép lại","ex":"We copied the numbers."},{"w":"by hand","ipa":"/baɪ hænd/","vi":"bằng tay, làm thủ công","ex":"We copied the numbers by hand."},{"w":"slow","ipa":"/sloʊ/","vi":"chậm","ex":"That sounds slow."},{"w":"mistake","ipa":"/mɪˈsteɪk/","vi":"lỗi, sai sót","ex":"Did you use to make mistakes?"},{"w":"update","ipa":"/ʌpˈdeɪt/","vi":"cập nhật","ex":"The report updates every morning."},{"w":"by itself","ipa":"/baɪ ɪtˈself/","vi":"tự nó, tự động","ex":"The dashboard updates by itself."},{"w":"anymore","ipa":"/ˌeniˈmɔːr/","vi":"không... nữa (dùng trong câu phủ định)","ex":"I don't stay late anymore."}],"grammar":{"t":"USED TO: thói quen trong quá khứ, nay không còn","d":"Used to + động từ nguyên mẫu nói về việc ngày xưa hay làm, hoặc tình trạng ngày xưa, nhưng bây giờ đã thay đổi. Nó giống \"trước đây thường...\" trong tiếng Việt. Để nói hiện tại không còn như thế, dùng not ... anymore.","formula":["Khẳng định: S + used to + V nguyên mẫu (We used to work late.)","Phủ định: S + didn't use to + V nguyên mẫu","Câu hỏi: Did + S + use to + V nguyên mẫu?","Bây giờ không còn: S + don't/doesn't + V + anymore"],"ex":["It used to take three days. (trước đây mất ba ngày, giờ thì không)","We didn't use to check the data every day.","Did you use to make mistakes? – Yes, we did. / No, we didn't.","I don't stay late anymore.","So sánh: Two years ago, we started using Python. (một lần, dùng quá khứ đơn) – We used to use Excel. (thói quen lâu dài)"],"mistakes":[{"wrong":"I use to make reports in Excel.","right":"I used to make reports in Excel.","why":"Câu khẳng định viết used (có d), dù khi nói nghe gần giống nhau."},{"wrong":"Did you used to work late?","right":"Did you use to work late?","why":"Sau did dùng nguyên mẫu, nên bỏ d: use to."},{"wrong":"We used to working late.","right":"We used to work late.","why":"Sau used to luôn là động từ nguyên mẫu, không thêm -ing."}]},"quiz":[{"q":"How did Lan's team make reports before?","o":["On paper","In Power BI","In Excel"],"a":2},{"q":"When does Lan leave work now?","o":["At nine","At six","At eight"],"a":1},{"q":"We didn't ___ check the data every day.","o":["use to","used to","using to"],"a":0}],"practice":[{"s":"We ___ make every report in Excel, but now we use Power BI.","a":"used to","alt":[],"hint":"Thói quen cũ, nay không còn."},{"s":"It ___ take three days. Now it takes one hour.","a":"used to","alt":[],"hint":"Trước đây mất ba ngày."},{"s":"Did you ___ work late every day?","a":"use to","alt":[],"hint":"Sau did bỏ d."},{"s":"I didn't ___ check the data every morning.","a":"use to","alt":[],"hint":"Phủ định: didn't + use to."},{"s":"I don't copy the numbers by hand ___.","a":"anymore","alt":["any more"],"hint":"\"không... nữa\" đặt cuối câu."}],"speak":["We used to make every report in Excel.","It used to take three days.","We didn't use to check the data every day.","I used to leave at nine. Now I leave at six."],"write":{"vi":"Viết một đoạn ngắn cho bản tin nội bộ: so sánh cách nhóm bạn làm việc trước đây và bây giờ (công cụ, thời gian, giờ về). Dùng used to, didn't use to và not ... anymore.","en":"Write a short paragraph for the company newsletter: compare how your team used to work and how it works now. Use 'used to', 'didn't use to' and 'not ... anymore'.","min":40},"summary":["Used to + V nguyên mẫu = trước đây thường làm, giờ không còn.","Phủ định và câu hỏi: didn't use to / Did you use to...? (bỏ d).","Nói hiện tại đã khác: I don't ... anymore.","Việc xảy ra một lần trong quá khứ thì dùng quá khứ đơn, không dùng used to."]},{"id":"s_arrange","ch":5,"level":"A2","title":"Arranging a meeting","vi":"Hiện tại tiếp diễn cho lịch hẹn","goals":["Sau bài này bạn có thể nói về các lịch hẹn đã sắp xếp trong tương lai bằng thì hiện tại tiếp diễn.","Sau bài này bạn có thể hỏi lịch người khác: Are you free on...? What are you doing on...?","Sau bài này bạn có thể đề xuất và chốt giờ họp: Does ... work for you? How about...?"],"story":[{"who":"Lan","en":"Hi Sofia. We need a meeting to review the dashboard. Are you free on Monday?","vi":"Chào Sofia. Chúng ta cần họp để xem lại dashboard. Thứ Hai bà có rảnh không?"},{"who":"Sofia","en":"Sorry, I'm flying to a conference on Monday morning.","vi":"Xin lỗi, sáng thứ Hai tôi bay đi dự hội nghị."},{"who":"Lan","en":"OK. What are you doing on Tuesday?","vi":"Được. Thứ Ba bà có lịch gì?"},{"who":"Sofia","en":"I'm meeting our finance director at ten, but I'm free in the afternoon.","vi":"Lúc mười giờ tôi gặp giám đốc tài chính, nhưng buổi chiều tôi rảnh."},{"who":"Lan","en":"Does two o'clock, your time, work for you?","vi":"Hai giờ theo giờ bên bà có được không?"},{"who":"Sofia","en":"Hmm, I'm having lunch with a supplier until three. How about four?","vi":"Ừm, tôi ăn trưa với một nhà cung cấp đến ba giờ. Bốn giờ thì sao?"},{"who":"Lan","en":"Four is fine. Mark is joining us too.","vi":"Bốn giờ được. Mark cũng sẽ tham gia cùng."},{"who":"Sofia","en":"Great. Is he presenting the new numbers?","vi":"Tốt. Anh ấy sẽ trình bày số liệu mới à?"},{"who":"Lan","en":"No, I'm presenting them. Mark is talking about the budget.","vi":"Không, tôi sẽ trình bày. Mark sẽ nói về ngân sách."},{"who":"Sofia","en":"Perfect. Can you send me an invitation?","vi":"Hoàn hảo. Chị gửi lời mời họp cho tôi được không?"},{"who":"Lan","en":"Sure, I'll send it right away. See you on Tuesday at four.","vi":"Vâng, tôi gửi ngay. Hẹn gặp bà bốn giờ thứ Ba."}],"vocab":[{"w":"free","ipa":"/friː/","vi":"rảnh, không bận","ex":"Are you free on Monday?"},{"w":"fly (flew)","ipa":"/flaɪ/ (/fluː/)","vi":"bay, đi máy bay","ex":"I'm flying to Singapore on Monday."},{"w":"conference","ipa":"/ˈkɑːnfərəns/","vi":"hội nghị, hội thảo","ex":"She's going to a conference."},{"w":"supplier","ipa":"/səˈplaɪər/","vi":"nhà cung cấp","ex":"I'm having lunch with a supplier."},{"w":"Does ... work for you?","ipa":"/dʌz ... wɜːrk fɔːr juː/","vi":"... có tiện cho bạn không?","ex":"Does Tuesday work for you?"},{"w":"join","ipa":"/dʒɔɪn/","vi":"tham gia cùng","ex":"Mark is joining us too."},{"w":"invitation","ipa":"/ˌɪnvɪˈteɪʃn/","vi":"lời mời (họp)","ex":"Can you send me an invitation?"},{"w":"right away","ipa":"/raɪt əˈweɪ/","vi":"ngay lập tức","ex":"I'll send it right away."}],"grammar":{"t":"Hiện tại tiếp diễn để nói lịch hẹn trong tương lai","d":"Bạn đã biết am/is/are + V-ing nói việc đang xảy ra. Thì này còn dùng cho việc tương lai đã hẹn, đã sắp xếp xong: có giờ, có người, có vé. Nhớ thêm thời gian tương lai (on Monday, at ten, tomorrow) để người nghe hiểu bạn nói về tương lai.","formula":["Lịch hẹn: S + am/is/are + V-ing + thời gian tương lai (I'm meeting the director at ten.)","Hỏi lịch: What are you doing on + ngày? · Are you free on + ngày / at + giờ?","Đề xuất giờ: Does + ngày/giờ + work for you? · How about + ngày/giờ?"],"ex":["I'm flying to a conference on Monday morning.","Mark is joining us too. (đã hẹn sẵn)","What are you doing on Tuesday? – I'm meeting a supplier.","Are you free on Friday afternoon? – Yes, I am. / Sorry, I'm busy.","Does four o'clock work for you? – Yes, four is fine."],"mistakes":[{"wrong":"I meet our director tomorrow at ten.","right":"I'm meeting our director tomorrow at ten.","why":"Lịch hẹn cá nhân đã sắp xếp dùng hiện tại tiếp diễn thì tự nhiên hơn. Hiện tại đơn dành cho thời gian biểu cố định (The train leaves at ten)."},{"wrong":"Are you free in Monday?","right":"Are you free on Monday?","why":"Trước thứ trong tuần và ngày cụ thể dùng on; in dành cho tháng, năm, buổi (in the afternoon)."},{"wrong":"Does Tuesday work with you?","right":"Does Tuesday work for you?","why":"Cụm cố định là work for you (tiện cho bạn)."}]},"quiz":[{"q":"Why can't Sofia meet on Monday?","o":["She is flying to a conference","She is sick","She is on holiday"],"a":0},{"q":"What time is the meeting on Tuesday?","o":["Two o'clock","Three o'clock","Four o'clock"],"a":2},{"q":"I ___ the finance director at ten tomorrow.","o":["meet","am meeting","met"],"a":1}],"practice":[{"s":"I ___ to Singapore next Monday. (fly)","a":"am flying","alt":["'m flying"],"hint":"Lịch đã đặt vé: am/is/are + V-ing."},{"s":"What ___ you doing on Thursday afternoon?","a":"are","alt":[],"hint":"Hỏi lịch của người khác."},{"s":"Are you free ___ Friday?","a":"on","alt":[],"hint":"Giới từ trước thứ trong tuần."},{"s":"Does three o'clock ___ for you?","a":"work","alt":[],"hint":"\"... có tiện cho bạn không?\""},{"s":"Mark ___ us at the meeting tomorrow. (join)","a":"is joining","alt":["'s joining"],"hint":"Lịch đã sắp xếp với Mark."}],"speak":["Are you free on Monday?","I'm meeting our finance director at ten.","Does two o'clock, your time, work for you?","Mark is joining us too."],"write":{"vi":"Viết email cho một khách hàng để sắp xếp cuộc họp tuần sau: nói lịch bận của bạn (dùng hiện tại tiếp diễn) và đề xuất hai khung giờ, hỏi giờ nào tiện cho họ.","en":"Write an email to a client to arrange a meeting next week. Say when you are busy (use the present continuous) and suggest two times. Ask which one works for them.","min":40},"summary":["Am/is/are + V-ing + thời gian tương lai = lịch hẹn đã sắp xếp.","Hỏi lịch: What are you doing on...? / Are you free on...?","Đề xuất giờ: Does ... work for you? / How about...?","On + thứ/ngày; at + giờ; in + buổi (in the afternoon)."]},{"id":"x5_3","ch":5,"level":"A2","after":"s_arrange","title":"Can we reschedule?","vi":"Dời và hoãn lịch họp","goals":["Sau bài này bạn có thể báo lịch sự rằng bạn không đến họp được và nói lý do ngắn gọn.","Sau bài này bạn có thể đề nghị dời lịch bằng move ... to, postpone, bring forward với đúng giới từ.","Sau bài này bạn có thể cùng đồng nghiệp chốt một giờ họp mới."],"story":[{"who":"Mark","en":"Lan, I'm sorry, but I can't make it to our meeting at two.","vi":"Lan, xin lỗi nhé, nhưng tôi không dự cuộc họp lúc hai giờ được."},{"who":"Lan","en":"No problem. What happened?","vi":"Không sao. Có chuyện gì vậy?"},{"who":"Mark","en":"Something came up. The director wants to see me at two.","vi":"Có việc đột xuất. Giám đốc muốn gặp tôi lúc hai giờ."},{"who":"Mark","en":"Can we reschedule? Could we move it to four?","vi":"Mình đổi lịch được không? Dời sang bốn giờ được không?"},{"who":"Lan","en":"Sorry, I'm busy at four. I'm calling Sofia then.","vi":"Xin lỗi, bốn giờ tôi bận. Lúc đó tôi gọi cho Sofia."},{"who":"Mark","en":"OK. Could we postpone it until tomorrow morning?","vi":"Được. Vậy hoãn đến sáng mai được không?"},{"who":"Lan","en":"Tomorrow at nine works for me.","vi":"Chín giờ sáng mai thì tôi được."},{"who":"Mark","en":"Hmm, I have a call at nine thirty. Can we bring it forward to eight thirty?","vi":"Ừm, chín rưỡi tôi có cuộc gọi. Mình đưa lên sớm hơn, tám rưỡi được không?"},{"who":"Lan","en":"Sure, eight thirty is fine. I'll change the invitation.","vi":"Được, tám rưỡi ổn. Tôi sẽ sửa lời mời họp."},{"who":"Mark","en":"Thanks, Lan. And sorry again for the short notice.","vi":"Cảm ơn Lan. Và xin lỗi lần nữa vì báo gấp quá."},{"who":"Lan","en":"Don't worry. See you tomorrow at eight thirty.","vi":"Đừng lo. Hẹn gặp anh tám rưỡi sáng mai."}],"vocab":[{"w":"can't make it","ipa":"/kænt meɪk ɪt/","vi":"không đến được, không tham dự được","ex":"Sorry, I can't make it today."},{"w":"something came up","ipa":"/ˈsʌmθɪŋ keɪm ʌp/","vi":"có việc đột xuất","ex":"Something came up, so I left early."},{"w":"director","ipa":"/dəˈrektər/","vi":"giám đốc","ex":"The director wants to see me."},{"w":"reschedule","ipa":"/ˌriːˈskedʒuːl/","vi":"đổi lịch, xếp lại lịch","ex":"Can we reschedule the call?"},{"w":"move (to)","ipa":"/muːv/","vi":"dời (sang giờ/ngày khác)","ex":"Let's move the meeting to Friday."},{"w":"postpone","ipa":"/poʊstˈpoʊn/","vi":"hoãn (sang thời gian sau)","ex":"They postponed the meeting until Monday."},{"w":"bring forward","ipa":"/brɪŋ ˈfɔːrwərd/","vi":"đưa lên sớm hơn","ex":"Can we bring the call forward to nine?"},{"w":"short notice","ipa":"/ʃɔːrt ˈnoʊtɪs/","vi":"báo gấp, báo trước ít thời gian","ex":"Sorry for the short notice."}],"grammar":{"t":"Đổi lịch họp: move, postpone, bring forward và giới từ đi kèm","d":"Khi muốn đổi lịch, bạn chỉ cần vài động từ cố định cộng với giới từ đúng. Move dời sang giờ khác (sớm hay muộn đều được), postpone là hoãn muộn hơn, bring forward là đưa lên sớm hơn. Mở đầu bằng lời xin lỗi và lý do ngắn để nghe lịch sự.","formula":["Dời: Can we move + the meeting + to + giờ/ngày?","Hoãn muộn hơn: Could we postpone + the meeting + until/to + ngày?","Đưa sớm hơn: Can we bring + the meeting + forward + to + giờ?","Báo không đến được: I'm sorry, but I can't make it (to + sự kiện). Something came up."],"ex":["Could we move it to four? (dời sang bốn giờ)","Could we postpone it until tomorrow morning? (hoãn đến sáng mai)","Can we bring it forward to eight thirty? (đưa lên tám rưỡi)","Khi tân ngữ là it, đặt it ở giữa: bring it forward (không nói bring forward it).","Chốt lịch: Tomorrow at nine works for me. · Eight thirty is fine."],"mistakes":[{"wrong":"Let's move the meeting on Friday.","right":"Let's move the meeting to Friday.","why":"Dời SANG một thời điểm khác thì dùng to, không dùng on."},{"wrong":"Can we change the meeting to other day?","right":"Can we change the meeting to another day?","why":"Trước danh từ số ít dùng another (một ... khác); other phải đi với danh từ số nhiều hoặc có the."},{"wrong":"Can we bring forward it?","right":"Can we bring it forward?","why":"Với đại từ it/them, đặt nó giữa bring và forward."}]},"quiz":[{"q":"Why can't Mark come at two?","o":["He is sick","The director wants to see him","He has a flight"],"a":1},{"q":"When is the new meeting?","o":["Today at four","Tomorrow at nine","Tomorrow at eight thirty"],"a":2},{"q":"Can we move the meeting ___ Friday?","o":["to","on","at"],"a":0}],"practice":[{"s":"Can we move the meeting ___ Thursday?","a":"to","alt":[],"hint":"Dời SANG ngày khác."},{"s":"Sorry, I can't ___ it to the meeting today.","a":"make","alt":[],"hint":"\"Không đến được\" = can't ... it."},{"s":"Something ___ up, so I have to leave early.","a":"came","alt":[],"hint":"\"Có việc đột xuất\" – quá khứ của come."},{"s":"Could we ___ the call forward to nine?","a":"bring","alt":[],"hint":"Đưa lên sớm hơn."},{"s":"The client wants to ___ the meeting until next week.","a":"postpone","alt":[],"hint":"Hoãn sang thời gian muộn hơn."}],"speak":["I'm sorry, but I can't make it to our meeting at two.","Something came up.","Could we postpone it until tomorrow morning?","Sorry again for the short notice."],"write":{"vi":"Viết email cho khách hàng: xin lỗi vì không thể dự cuộc họp chiều nay, nói lý do ngắn gọn và đề xuất dời sang một giờ khác. Dùng can't make it và move/postpone.","en":"Write an email to a client: say sorry that you can't make it to this afternoon's meeting, give a short reason and suggest a new time. Use 'can't make it' and 'move' or 'postpone'.","min":40},"summary":["Báo không đến được: I'm sorry, but I can't make it. Something came up.","Move ... to (dời sang), postpone ... until (hoãn đến), bring ... forward to (đưa lên sớm).","Với it/them: move it, bring it forward.","Kết lịch sự: Sorry for the short notice."]},{"id":"s_rules","ch":6,"level":"A2","title":"Rules at work","vi":"Bắt buộc và không bắt buộc","goals":["Sau bài này bạn có thể nói điều bắt buộc ở chỗ làm bằng must và have to.","Sau bài này bạn có thể phân biệt mustn't (bị cấm) và don't have to (không cần).","Sau bài này bạn có thể giải thích các quy định bảo mật dữ liệu cho đồng nghiệp mới."],"story":[{"who":"Lan","en":"Welcome to the team, Hoa. Today I'm explaining our data security rules.","vi":"Chào mừng em vào nhóm, Hoa. Hôm nay chị sẽ giải thích các quy định bảo mật dữ liệu."},{"who":"Hoa","en":"Thanks, Lan. Are there many rules?","vi":"Cảm ơn chị Lan. Có nhiều quy định không chị?"},{"who":"Lan","en":"Not many, but they're important. First, you must lock your computer when you leave your desk.","vi":"Không nhiều, nhưng quan trọng. Đầu tiên, em phải khóa máy tính khi rời bàn."},{"who":"Hoa","en":"Do I have to change my password often?","vi":"Em có phải đổi mật khẩu thường xuyên không?"},{"who":"Lan","en":"Yes, you have to change it every three months.","vi":"Có, em phải đổi ba tháng một lần."},{"who":"Lan","en":"And you mustn't share it with anyone, not even me.","vi":"Và em tuyệt đối không được đưa nó cho ai, kể cả chị."},{"who":"Hoa","en":"Can I save client files on my laptop?","vi":"Em có được lưu file của khách hàng trên laptop không?"},{"who":"Lan","en":"No, you mustn't. You have to keep them on the company server.","vi":"Không, không được. Em phải để chúng trên máy chủ của công ty."},{"who":"Hoa","en":"OK. Do I have to come to the office every day?","vi":"Vâng. Em có phải đến văn phòng mỗi ngày không?"},{"who":"Lan","en":"No, you don't have to. You can work from home on Fridays.","vi":"Không, không cần. Thứ Sáu em có thể làm việc ở nhà."},{"who":"Hoa","en":"Great. Thanks, Lan. That's very clear.","vi":"Tuyệt quá. Cảm ơn chị Lan. Rất rõ ràng ạ."}],"vocab":[{"w":"security","ipa":"/səˈkjʊrəti/","vi":"an ninh, bảo mật","ex":"data security rules"},{"w":"rule","ipa":"/ruːl/","vi":"quy định, luật lệ","ex":"The rules are important."},{"w":"lock","ipa":"/lɑːk/","vi":"khóa","ex":"Lock your computer when you leave."},{"w":"save (a file)","ipa":"/seɪv/","vi":"lưu (file)","ex":"Can I save client files on my laptop?"},{"w":"password","ipa":"/ˈpæswɜːrd/","vi":"mật khẩu","ex":"Change your password every three months."},{"w":"not even","ipa":"/nɑːt ˈiːvn/","vi":"ngay cả... cũng không","ex":"Don't tell anyone, not even me."},{"w":"laptop","ipa":"/ˈlæptɑːp/","vi":"máy tính xách tay","ex":"Don't save client files on your laptop."},{"w":"work from home","ipa":"/wɜːrk frəm hoʊm/","vi":"làm việc ở nhà","ex":"You can work from home on Fridays."}],"grammar":{"t":"Bắt buộc và không bắt buộc: must, have to, mustn't, don't have to","d":"Must và have to đều nghĩa là \"phải\"; trong công việc hằng ngày người Mỹ dùng have to nhiều hơn, must nghe mạnh và trang trọng hơn (thường thấy trong nội quy). Điểm quan trọng nhất: mustn't nghĩa là \"cấm, không được\", còn don't have to nghĩa là \"không cần, không bắt buộc\" – hai nghĩa rất khác nhau.","formula":["Bắt buộc: S + must + V · S + have to / has to + V","Cấm: S + mustn't (must not) + V","Không cần: S + don't / doesn't have to + V","Câu hỏi: Do / Does + S + have to + V?"],"ex":["You must lock your computer. (nội quy)","She has to change her password every three months. (he/she/it → has to)","You mustn't share your password. (cấm)","You don't have to come in on Fridays. (không cần, tùy bạn)","Do I have to come every day? – Yes, you do. / No, you don't."],"mistakes":[{"wrong":"You don't have to share your password. (muốn nói: cấm)","right":"You mustn't share your password.","why":"Don't have to chỉ là \"không cần\"; muốn nói \"cấm\" phải dùng mustn't."},{"wrong":"She have to lock her computer.","right":"She has to lock her computer.","why":"Chủ ngữ he/she/it dùng has to."},{"wrong":"You must to keep files on the server.","right":"You must keep files on the server.","why":"Sau must dùng động từ nguyên mẫu, không có to (khác với have to)."}]},"quiz":[{"q":"How often does Hoa have to change her password?","o":["Every three months","Every month","Every week"],"a":0},{"q":"Where must Hoa keep client files?","o":["On her laptop","On a USB drive","On the company server"],"a":2},{"q":"You ___ come in on Fridays. You can work from home.","o":["mustn't","don't have to","must"],"a":1}],"practice":[{"s":"You ___ share your password with anyone. (cấm)","a":"mustn't","alt":["must not"],"hint":"Bị cấm, không được làm."},{"s":"Hoa ___ to change her password every three months.","a":"has","alt":[],"hint":"She + ... to."},{"s":"You ___ come to the office on Fridays. (không cần)","a":"don't have to","alt":["do not have to"],"hint":"Không bắt buộc, tùy bạn."},{"s":"___ I have to lock my computer at lunch?","a":"Do","alt":[],"hint":"Câu hỏi với have to dùng trợ động từ."},{"s":"All staff ___ lock their computers when they leave. (bắt buộc)","a":"must","alt":["have to"],"hint":"Nội quy bắt buộc."}],"speak":["You must lock your computer when you leave your desk.","Do I have to change my password often?","You mustn't share it with anyone.","No, you don't have to. You can work from home on Fridays."],"write":{"vi":"Viết email ngắn cho một nhân viên mới, liệt kê 4 quy định ở nhóm bạn: điều bắt buộc, điều bị cấm và điều không cần làm. Dùng must, have to, mustn't và don't have to.","en":"Write a short email to a new employee with four rules for your team: things they must do, things they mustn't do and things they don't have to do.","min":40},"summary":["Must / have to = phải. He/she/it → has to.","Mustn't = cấm, không được làm.","Don't have to = không cần (nhưng làm cũng được).","Câu hỏi: Do I have to...? – Yes, you do. / No, you don't."]},{"id":"x6_1","ch":6,"level":"A2","after":"s_rules","title":"Shall I help?","vi":"Đề nghị giúp đỡ đồng nghiệp","goals":["Sau bài này bạn có thể đề nghị giúp người khác bằng Shall I...?, Would you like me to...?, Do you want me to...?","Sau bài này bạn có thể nhận lời hoặc từ chối lời giúp đỡ một cách lịch sự.","Sau bài này bạn có thể dùng I'll... để tự nguyện làm một việc ngay lập tức."],"story":[{"who":"Lan","en":"Oh no. Sofia needs the slides at five, and I'm not ready.","vi":"Ôi không. Sofia cần bộ slide lúc năm giờ, mà tôi chưa xong."},{"who":"Mark","en":"Shall I check the numbers for you?","vi":"Để tôi kiểm tra số liệu giúp chị nhé?"},{"who":"Lan","en":"Yes, please. That would be great.","vi":"Vâng, nhờ anh. Thế thì tốt quá."},{"who":"Minh","en":"Would you like me to make the charts?","vi":"Chị có muốn em làm các biểu đồ không?"},{"who":"Lan","en":"That's very kind of you, Minh. Could you do the sales chart?","vi":"Em tốt quá, Minh. Em làm giúp biểu đồ doanh số được không?"},{"who":"Minh","en":"Sure. I'll start right now.","vi":"Dạ được. Em bắt đầu luôn đây."},{"who":"Mark","en":"Do you want me to call Sofia and explain?","vi":"Chị có muốn tôi gọi cho Sofia giải thích không?"},{"who":"Lan","en":"No, thanks. I'll write to her myself.","vi":"Không cần đâu, cảm ơn anh. Tôi sẽ tự viết cho bà ấy."},{"who":"Mark","en":"OK. Shall I order some coffee for everyone?","vi":"Được. Hay để tôi gọi cà phê cho mọi người nhé?"},{"who":"Lan","en":"Yes, please! You're the best.","vi":"Vâng, nhờ anh! Anh tuyệt nhất."},{"who":"Mark","en":"No problem. We're a team.","vi":"Không có gì. Chúng ta là một đội mà."}],"vocab":[{"w":"Shall I...?","ipa":"/ʃæl aɪ/","vi":"Để tôi... nhé?","ex":"Shall I check the numbers?"},{"w":"Would you like me to...?","ipa":"/wʊd juː laɪk mi tə/","vi":"Bạn có muốn tôi... không? (lịch sự)","ex":"Would you like me to make the charts?"},{"w":"Do you want me to...?","ipa":"/duː juː wɑːnt mi tə/","vi":"Bạn có muốn tôi... không? (thân mật)","ex":"Do you want me to call her?"},{"w":"That would be great.","ipa":"/ðæt wʊd bi ɡreɪt/","vi":"Thế thì tốt quá.","ex":"Yes, please. That would be great."},{"w":"kind","ipa":"/kaɪnd/","vi":"tốt bụng, tử tế","ex":"That's very kind of you."},{"w":"slides","ipa":"/slaɪdz/","vi":"các trang trình chiếu","ex":"Sofia needs the slides at five."},{"w":"explain","ipa":"/ɪkˈspleɪn/","vi":"giải thích","ex":"I'll call her and explain."},{"w":"myself","ipa":"/maɪˈself/","vi":"tự tôi, chính tôi","ex":"I'll write to her myself."}],"grammar":{"t":"Đề nghị giúp đỡ và cách đáp lại","d":"Khi muốn giúp ai đó, người bản xứ thường hỏi chứ không nói thẳng \"Tôi giúp bạn\". Shall I...? và Would you like me to...? là cách lịch sự nhất; Do you want me to...? thân mật hơn. Nếu bạn quyết định làm ngay, hãy dùng I'll + V.","formula":["Đề nghị: Shall I + V? · Would you like me to + V? · Do you want me to + V?","Tự nguyện ngay: I'll + V (I'll start right now.)","Nhận lời: Yes, please. That would be great. / That's very kind of you.","Từ chối lịch sự: No, thanks. I'll + V + myself. / It's OK, thanks."],"ex":["Shall I check the numbers for you?","Would you like me to make the charts?","Do you want me to call Sofia?","Sure. I'll start right now.","No, thanks. I'll write to her myself."],"mistakes":[{"wrong":"Do you want I help you?","right":"Do you want me to help you?","why":"Cấu trúc đúng là want + me + to + V; không dùng I sau want."},{"wrong":"Would you like me check the data?","right":"Would you like me to check the data?","why":"Sau would like me phải có to trước động từ."},{"wrong":"I help you!","right":"I'll help you!","why":"Quyết định giúp ngay lúc nói dùng will ('ll), không dùng hiện tại đơn."}]},"quiz":[{"q":"What does Mark offer to check?","o":["The charts","The numbers","The email"],"a":1},{"q":"Who will write to Sofia?","o":["Mark","Minh","Lan"],"a":2},{"q":"Would you like me ___ the charts?","o":["make","to make","making"],"a":1}],"practice":[{"s":"___ I check the numbers for you?","a":"Shall","alt":[],"hint":"\"Để tôi... nhé?\""},{"s":"Would you like me ___ make the slides?","a":"to","alt":[],"hint":"would like me + ... + V"},{"s":"Do you want ___ to call the client?","a":"me","alt":[],"hint":"want + (tôi) + to + V"},{"s":"Don't worry. I ___ do it right now.","a":"will","alt":["'ll"],"hint":"Quyết định ngay lúc nói."},{"s":"Yes, please. That ___ be great.","a":"would","alt":[],"hint":"\"Thế thì tốt quá.\""}],"speak":["Shall I check the numbers for you?","Would you like me to make the charts?","Yes, please. That would be great.","No, thanks. I'll write to her myself."],"write":{"vi":"Đồng nghiệp của bạn đang quá tải trước hạn nộp báo cáo. Viết tin nhắn đề nghị giúp hai việc cụ thể, dùng Shall I...? và Would you like me to...?, và nói bạn có thể bắt đầu khi nào.","en":"Your colleague has too much work before a report deadline. Write a message offering help with two tasks. Use 'Shall I...?' and 'Would you like me to...?' and say when you can start.","min":40},"summary":["Đề nghị lịch sự: Shall I + V? / Would you like me to + V?","Thân mật: Do you want me to + V?","Nhận: Yes, please. That would be great. Từ chối: No, thanks. I'll do it myself.","Quyết định giúp ngay: I'll + V."]},{"id":"s_ever","ch":6,"level":"A2","title":"Have you ever…?","vi":"Hiện tại hoàn thành: trải nghiệm","goals":["Sau bài này bạn có thể hỏi và kể về trải nghiệm bằng thì hiện tại hoàn thành (have/has + V3).","Sau bài này bạn có thể dùng ever trong câu hỏi và never trong câu trả lời.","Sau bài này bạn có thể phân biệt been to (đã đi và đã về) với gone to (đã đi, chưa về)."],"story":[{"who":"Mark","en":"Has anyone here ever been to Australia?","vi":"Ở đây đã có ai từng đến Úc chưa?"},{"who":"Lan","en":"No, I haven't. But I've been to Singapore and Japan.","vi":"Tôi chưa. Nhưng tôi đã từng đến Singapore và Nhật."},{"who":"Minh","en":"I've never been abroad. Has Hoa been to Australia?","vi":"Em chưa bao giờ ra nước ngoài. Chị Hoa đã đến Úc chưa?"},{"who":"Lan","en":"Yes, she has. Actually, she isn't here today. She's gone to Bangkok for a workshop.","vi":"Rồi. Thật ra hôm nay Hoa không có ở đây. Cô ấy đã đi Bangkok dự một buổi hội thảo."},{"who":"Mark","en":"Lucky her! Minh, have you ever used Tableau?","vi":"Sướng thật! Minh, em đã bao giờ dùng Tableau chưa?"},{"who":"Minh","en":"Yes, I have. I've also tried Power BI.","vi":"Rồi ạ. Em cũng đã thử Power BI."},{"who":"Mark","en":"And has anyone ever written Python code?","vi":"Còn ai đã từng viết code Python chưa?"},{"who":"Lan","en":"I have. I've written a few scripts for our reports.","vi":"Tôi rồi. Tôi đã viết vài đoạn mã cho các báo cáo của nhóm."},{"who":"Minh","en":"I've never written any code. I have no experience.","vi":"Em chưa từng viết code. Em chưa có kinh nghiệm gì cả."},{"who":"Lan","en":"It isn't too hard. Have you ever taken an online course?","vi":"Không khó lắm đâu. Em đã bao giờ học khóa học trực tuyến chưa?"},{"who":"Minh","en":"No, never. Maybe I'll start one this month!","vi":"Chưa bao giờ. Có lẽ tháng này em sẽ bắt đầu một khóa!"}],"vocab":[{"w":"ever","ipa":"/ˈevər/","vi":"từng, bao giờ (trong câu hỏi)","ex":"Have you ever been to Japan?"},{"w":"abroad","ipa":"/əˈbrɔːd/","vi":"ở nước ngoài, ra nước ngoài","ex":"I've never been abroad."},{"w":"actually","ipa":"/ˈæktʃuəli/","vi":"thật ra","ex":"Actually, she isn't here today."},{"w":"workshop","ipa":"/ˈwɜːrkʃɑːp/","vi":"buổi hội thảo thực hành","ex":"She's gone to a workshop."},{"w":"code","ipa":"/koʊd/","vi":"mã lập trình, code","ex":"Have you ever written Python code?"},{"w":"script","ipa":"/skrɪpt/","vi":"đoạn mã chạy tự động","ex":"I've written a few scripts."},{"w":"experience","ipa":"/ɪkˈspɪriəns/","vi":"kinh nghiệm, trải nghiệm","ex":"I have no experience with Python."},{"w":"online course","ipa":"/ˌɑːnlaɪn ˈkɔːrs/","vi":"khóa học trực tuyến","ex":"Have you ever taken an online course?"}],"grammar":{"t":"Hiện tại hoàn thành: kể trải nghiệm với ever / never, been và gone","d":"Hiện tại hoàn thành (have/has + V3) dùng để nói về trải nghiệm trong đời, khi KHÔNG nói rõ thời gian, giống \"đã từng... chưa?\" trong tiếng Việt. Hỏi thì thêm ever, trả lời \"chưa bao giờ\" thì dùng never. Nếu có thời gian cụ thể (last year, in 2023) thì quay về quá khứ đơn.","formula":["Khẳng định: S + have/has + V3 (I've been to Japan. She has used Tableau.)","Phủ định: S + haven't/hasn't + V3 · S + have/has + never + V3","Câu hỏi: Have/Has + S + ever + V3? → Yes, I have. / No, I haven't.","been to = đã đi và đã về · gone to = đã đi và vẫn còn ở đó"],"ex":["V3 thường gặp: be → been, go → gone, write → written, take → taken, use → used, try → tried","Have you ever used Tableau? – Yes, I have.","I've never written any code.","Hoa has been to Australia. (đi rồi, đã về) · Hoa has gone to Bangkok. (giờ đang ở Bangkok)","Có thời gian cụ thể → quá khứ đơn: I went to Japan in 2023."],"mistakes":[{"wrong":"Have you ever go to Australia?","right":"Have you ever been to Australia?","why":"Sau have/has dùng V3; nói về trải nghiệm đi đâu đó thường dùng been to."},{"wrong":"I have went to Japan last year.","right":"I went to Japan last year.","why":"Có thời gian cụ thể (last year) thì dùng quá khứ đơn, không dùng hiện tại hoàn thành."},{"wrong":"She has been to Bangkok. (muốn nói: giờ cô ấy đang ở Bangkok)","right":"She has gone to Bangkok.","why":"Been to là đi rồi về; người vẫn đang ở đó thì dùng gone to."}]},"quiz":[{"q":"Which countries has Lan been to?","o":["Australia and Japan","Singapore and Japan","Thailand and Singapore"],"a":1},{"q":"Where is Hoa today?","o":["In Bangkok","In the office","In Australia"],"a":0},{"q":"Minh has never ___ any code.","o":["write","wrote","written"],"a":2}],"practice":[{"s":"Have you ever ___ to Japan?","a":"been","alt":[],"hint":"Trải nghiệm đi đâu đó: have + ... to."},{"s":"I have never ___ Tableau. (use)","a":"used","alt":[],"hint":"V3 của use."},{"s":"Hoa isn't here. She has ___ to Bangkok.","a":"gone","alt":[],"hint":"Đã đi và vẫn đang ở đó."},{"s":"___ Mark ever written Python code?","a":"Has","alt":[],"hint":"Câu hỏi với he/she: ... + S + ever + V3?"},{"s":"No, I ___. I've never been abroad.","a":"haven't","alt":["have not"],"hint":"Trả lời ngắn phủ định."}],"speak":["Has anyone here ever been to Australia?","I've been to Singapore and Japan.","She's gone to Bangkok for a workshop.","I've never written any code."],"write":{"vi":"Viết một đoạn giới thiệu bản thân cho nhóm dự án quốc tế: kể 3 công cụ bạn đã từng dùng, những nơi bạn đã từng đến và một việc bạn chưa bao giờ làm. Dùng hiện tại hoàn thành với ever/never.","en":"Write a short introduction for an international project team: three tools you have used, places you have been to and one thing you have never done. Use the present perfect with 'ever' and 'never'.","min":40},"summary":["Kể trải nghiệm (không nói thời gian): have/has + V3.","Hỏi: Have you ever + V3? Trả lời: Yes, I have. / No, I haven't. / I've never + V3.","Been to = đi rồi về; gone to = đi rồi, vẫn ở đó.","Có thời gian cụ thể (last year, in 2023) → dùng quá khứ đơn."]},{"id":"x6_2","ch":6,"level":"A2","after":"s_ever","title":"Have you finished yet?","vi":"Báo cáo tiến độ: just, already, yet","goals":["Sau bài này bạn có thể báo cáo tiến độ công việc bằng hiện tại hoàn thành với just, already, yet.","Sau bài này bạn có thể hỏi đồng nghiệp đã xong việc chưa: Have you ... yet?","Sau bài này bạn có thể trả lời ngắn và rõ trong buổi họp đầu ngày (stand-up)."],"story":[{"who":"Mark","en":"Good morning, everyone. Lan, have you finished the sales dashboard yet?","vi":"Chào buổi sáng mọi người. Lan, chị đã làm xong dashboard doanh số chưa?"},{"who":"Lan","en":"Not yet, but I've already built the main charts.","vi":"Chưa, nhưng tôi đã dựng xong các biểu đồ chính rồi."},{"who":"Mark","en":"Great. Have you checked the data with Minh?","vi":"Tốt. Chị đã kiểm tra dữ liệu với Minh chưa?"},{"who":"Lan","en":"Yes, we've just checked it. Everything looks correct.","vi":"Rồi, chúng tôi vừa kiểm tra xong. Mọi thứ đều đúng."},{"who":"Mark","en":"Minh, what about the customer survey?","vi":"Minh, còn khảo sát khách hàng thì sao?"},{"who":"Minh","en":"I've just received the results. I haven't cleaned them yet.","vi":"Em vừa nhận được kết quả. Em vẫn chưa làm sạch dữ liệu."},{"who":"Mark","en":"OK. Hoa, has BrightMart signed the new contract yet?","vi":"Được. Hoa, BrightMart đã ký hợp đồng mới chưa?"},{"who":"Hoa","en":"Yes, they've already signed it. I've just sent you a copy.","vi":"Rồi, họ đã ký rồi. Em vừa gửi anh một bản."},{"who":"Mark","en":"Excellent. Then we can start the next project in June.","vi":"Tuyệt vời. Vậy chúng ta có thể bắt đầu dự án tiếp theo vào tháng Sáu."},{"who":"Lan","en":"Have you told Sofia's team yet?","vi":"Anh đã báo cho nhóm của Sofia chưa?"},{"who":"Mark","en":"Not yet. I'll email them after this meeting.","vi":"Chưa. Tôi sẽ gửi email cho họ sau buổi họp này."}],"vocab":[{"w":"stand-up (meeting)","ipa":"/ˈstænd ʌp/","vi":"buổi họp nhanh đầu ngày","ex":"Let's start the stand-up."},{"w":"just","ipa":"/dʒʌst/","vi":"vừa mới","ex":"I've just received the results."},{"w":"already","ipa":"/ɔːlˈredi/","vi":"đã... rồi","ex":"They've already signed it."},{"w":"yet","ipa":"/jet/","vi":"chưa (câu hỏi), vẫn chưa (câu phủ định)","ex":"Have you finished yet?"},{"w":"main","ipa":"/meɪn/","vi":"chính, chủ yếu","ex":"I've built the main charts."},{"w":"survey","ipa":"/ˈsɜːrveɪ/","vi":"cuộc khảo sát","ex":"the customer survey"},{"w":"receive","ipa":"/rɪˈsiːv/","vi":"nhận được","ex":"I've just received the results."},{"w":"sign a contract","ipa":"/saɪn ə ˈkɑːntrækt/","vi":"ký hợp đồng","ex":"They signed the contract yesterday."}],"grammar":{"t":"Hiện tại hoàn thành với just, already, yet","d":"Khi báo cáo tiến độ, ta quan tâm kết quả bây giờ (xong chưa?), nên dùng hiện tại hoàn thành. Just = vừa mới, already = đã xong rồi (thường sớm hơn mong đợi), yet = chưa / vẫn chưa. Just và already đứng giữa have và V3; yet đứng cuối câu hỏi hoặc câu phủ định.","formula":["Vừa mới: S + have/has + just + V3 (I've just sent it.)","Đã rồi: S + have/has + already + V3 (They've already signed it.)","Hỏi xong chưa: Have/Has + S + V3 + ... + yet?","Vẫn chưa: S + haven't/hasn't + V3 + ... + yet · Trả lời ngắn: Not yet."],"ex":["We've just checked the data. (vừa xong cách đây ít phút)","I've already built the main charts.","Have you finished the dashboard yet? – Not yet.","I haven't cleaned the data yet.","V3 thường gặp trong công việc: send → sent, build → built, finish → finished, tell → told"],"mistakes":[{"wrong":"I haven't finished already.","right":"I haven't finished yet.","why":"Câu phủ định dùng yet (vẫn chưa); already dùng trong câu khẳng định."},{"wrong":"Have you yet sent the report?","right":"Have you sent the report yet?","why":"Yet đứng ở cuối câu."},{"wrong":"I've just finish it.","right":"I've just finished it.","why":"Sau have/has (kể cả khi có just) phải dùng V3."}]},"quiz":[{"q":"Has Lan finished the sales dashboard?","o":["Yes, she has","Not yet","She hasn't started"],"a":1},{"q":"What has Hoa just sent to Mark?","o":["A copy of the contract","The survey results","The dashboard"],"a":0},{"q":"I haven't cleaned the data ___.","o":["already","just","yet"],"a":2}],"practice":[{"s":"Have you sent the report to Sofia ___?","a":"yet","alt":[],"hint":"Hỏi \"... chưa?\", đặt cuối câu."},{"s":"Don't worry. I've ___ fixed it.","a":"already","alt":["just"],"hint":"\"Đã ... rồi\" (xong sớm)."},{"s":"Minh has ___ received the results. They arrived five minutes ago.","a":"just","alt":[],"hint":"Vừa mới."},{"s":"We haven't signed the contract ___.","a":"yet","alt":[],"hint":"Vẫn chưa."},{"s":"She has just ___ the file to the client. (send)","a":"sent","alt":[],"hint":"V3 của send."}],"speak":["Have you finished the sales dashboard yet?","Not yet, but I've already built the main charts.","I've just received the results.","I haven't cleaned them yet."],"write":{"vi":"Viết tin nhắn cập nhật tiến độ dự án cho quản lý: 2 việc đã xong (already/just) và 2 việc chưa xong (yet), cùng kế hoạch tiếp theo.","en":"Write a progress update to your manager: two tasks you have done (use 'already' or 'just') and two tasks you haven't done yet, plus your next step.","min":40},"summary":["Báo tiến độ dùng hiện tại hoàn thành: have/has + V3.","Just (vừa mới) và already (đã rồi) đứng giữa have và V3.","Yet đứng cuối câu hỏi (... chưa?) và câu phủ định (vẫn chưa).","Trả lời nhanh: Not yet. / Yes, I've just done it."]},{"id":"s_advice","ch":6,"level":"A2","title":"Giving advice","vi":"Khuyên nhủ","goals":["Sau bài này bạn có thể đưa lời khuyên bằng should và shouldn't.","Sau bài này bạn có thể gợi ý thân mật bằng Why don't you...? và khuyên mạnh hơn bằng If I were you, I'd...","Sau bài này bạn có thể xin lời khuyên trước một buổi thuyết trình: What should I do?"],"story":[{"who":"Mai","en":"Lan, can I ask you something? I'm giving my first presentation on Friday.","vi":"Chị Lan, em hỏi chị một chút được không? Thứ Sáu này em thuyết trình lần đầu."},{"who":"Lan","en":"Of course. How do you feel?","vi":"Tất nhiên rồi. Em thấy thế nào?"},{"who":"Mai","en":"Very nervous. What should I do?","vi":"Em hồi hộp lắm. Em nên làm gì ạ?"},{"who":"Lan","en":"You should say your talk out loud a few times at home.","vi":"Em nên nói to bài của mình vài lần ở nhà."},{"who":"Mai","en":"Should I learn every word by heart?","vi":"Em có nên học thuộc lòng từng chữ không?"},{"who":"Lan","en":"No, you shouldn't. Just remember the main points.","vi":"Không, không nên. Chỉ cần nhớ các ý chính thôi."},{"who":"Mai","en":"My slides have a lot of text. Is that a problem?","vi":"Slide của em có rất nhiều chữ. Như vậy có sao không ạ?"},{"who":"Lan","en":"Yes, a little. If I were you, I'd use more charts and fewer words.","vi":"Có, hơi có vấn đề. Nếu chị là em, chị sẽ dùng nhiều biểu đồ hơn và ít chữ hơn."},{"who":"Mai","en":"Good idea. What about questions from the managers?","vi":"Ý hay ạ. Còn câu hỏi của các quản lý thì sao?"},{"who":"Lan","en":"Why don't you prepare answers to three or four likely questions?","vi":"Sao em không chuẩn bị sẵn câu trả lời cho ba bốn câu hỏi có khả năng được hỏi?"},{"who":"Mai","en":"Thanks, Lan. That's really good advice. I feel much better now.","vi":"Cảm ơn chị Lan. Lời khuyên hay thật. Giờ em thấy đỡ hơn nhiều rồi."}],"vocab":[{"w":"advice","ipa":"/ədˈvaɪs/","vi":"lời khuyên (không đếm được)","ex":"That's really good advice."},{"w":"presentation","ipa":"/ˌpriːzenˈteɪʃn/","vi":"bài thuyết trình","ex":"I'm giving my first presentation."},{"w":"talk","ipa":"/tɔːk/","vi":"bài nói","ex":"Say your talk out loud."},{"w":"out loud","ipa":"/aʊt laʊd/","vi":"thành tiếng, nói to","ex":"Say it out loud a few times."},{"w":"by heart","ipa":"/baɪ hɑːrt/","vi":"thuộc lòng","ex":"Don't learn every word by heart."},{"w":"text","ipa":"/tekst/","vi":"chữ, phần văn bản","ex":"My slides have a lot of text."},{"w":"fewer","ipa":"/ˈfjuːər/","vi":"ít hơn (với danh từ đếm được)","ex":"Use fewer words."},{"w":"likely","ipa":"/ˈlaɪkli/","vi":"có khả năng xảy ra","ex":"Prepare answers to likely questions."}],"grammar":{"t":"Đưa lời khuyên: should, Why don't you...?, If I were you","d":"Should + động từ nguyên mẫu nghĩa là \"nên\", shouldn't là \"không nên\". Why don't you + V? là gợi ý nhẹ nhàng, thân thiện. If I were you, I'd + V (\"nếu tôi là bạn, tôi sẽ...\") là lời khuyên mạnh hơn; ở bài này bạn chỉ cần học thuộc nó như một cụm cố định.","formula":["Khuyên nên: S + should + V nguyên mẫu","Khuyên không nên: S + shouldn't + V nguyên mẫu","Xin lời khuyên: What should I + V? · Should I + V?","Gợi ý: Why don't you + V? · Khuyên mạnh: If I were you, I'd (= I would) + V"],"ex":["You should say your talk out loud a few times.","You shouldn't read from your slides.","Should I learn every word by heart? – No, you shouldn't.","Why don't you prepare some answers?","If I were you, I'd use more charts. (luôn dùng were, kể cả với I)"],"mistakes":[{"wrong":"You should to prepare more.","right":"You should prepare more.","why":"Sau should dùng động từ nguyên mẫu, không có to."},{"wrong":"If I am you, I will use more charts.","right":"If I were you, I'd use more charts.","why":"Đây là cụm cố định: If I were you, I'd... (tưởng tượng, không có thật)."},{"wrong":"Can you give me an advice?","right":"Can you give me some advice? / a piece of advice?","why":"Advice không đếm được nên không dùng a/an và không thêm -s."}]},"quiz":[{"q":"When is Mai's presentation?","o":["On Monday","On Friday","Tomorrow"],"a":1},{"q":"What does Lan say about Mai's slides?","o":["Add more text","Use no slides","Use more charts and fewer words"],"a":2},{"q":"You ___ learn every word by heart.","o":["shouldn't","should to","don't should"],"a":0}],"practice":[{"s":"You ___ say your talk out loud a few times. (nên)","a":"should","alt":[],"hint":"\"Nên\" + V nguyên mẫu."},{"s":"You ___ read every word from your slides. (không nên)","a":"shouldn't","alt":["should not"],"hint":"\"Không nên\"."},{"s":"___ don't you prepare answers to some questions?","a":"Why","alt":[],"hint":"Gợi ý thân mật: ... don't you + V?"},{"s":"If I ___ you, I'd use more charts.","a":"were","alt":[],"hint":"Cụm cố định: If I ... you."},{"s":"What ___ I do if I forget a word?","a":"should","alt":[],"hint":"Xin lời khuyên."}],"speak":["What should I do?","You should say your talk out loud a few times.","If I were you, I'd use more charts and fewer words.","Why don't you prepare answers to three or four likely questions?"],"write":{"vi":"Một đồng nghiệp mới sắp có buổi họp đầu tiên với khách hàng nước ngoài và nhờ bạn khuyên. Viết tin nhắn trả lời với ít nhất 4 lời khuyên, dùng should, shouldn't, Why don't you...? và If I were you.","en":"A new colleague has their first meeting with a foreign client and asks for your advice. Write a reply with at least four tips using 'should', 'shouldn't', 'Why don't you...?' and 'If I were you'.","min":40},"summary":["Should / shouldn't + V nguyên mẫu = nên / không nên.","Why don't you + V? = gợi ý nhẹ nhàng.","If I were you, I'd + V = lời khuyên mạnh, luôn dùng were.","Advice không đếm được: some advice, a piece of advice."]},{"id":"s_complaint","ch":6,"level":"A2","title":"A complaint from a client","vi":"Xử lý lời phàn nàn","goals":["Sau bài này bạn có thể xin lỗi khách hàng một cách chuyên nghiệp với I'm sorry for/about... và I apologize for...","Sau bài này bạn có thể hứa khắc phục bằng will và I'll make sure that...","Sau bài này bạn có thể giữ bình tĩnh và xử lý một lời phàn nàn về số liệu sai."],"story":[{"who":"Sofia","en":"Lan, I need to talk about last week's report. Some numbers were wrong.","vi":"Lan, tôi cần nói về báo cáo tuần trước. Một số con số bị sai."},{"who":"Lan","en":"Oh no. I'm very sorry about that. Which numbers?","vi":"Ôi không. Tôi rất xin lỗi về chuyện đó. Những con số nào ạ?"},{"who":"Sofia","en":"The sales for March. They were twice the real figures.","vi":"Doanh số tháng Ba. Chúng cao gấp đôi số liệu thật."},{"who":"Lan","en":"I'm sorry for the mistake. I think we counted some orders twice.","vi":"Tôi xin lỗi vì sai sót. Tôi nghĩ chúng tôi đã đếm một số đơn hàng hai lần."},{"who":"Sofia","en":"My manager used those numbers in a meeting. It was embarrassing.","vi":"Sếp tôi đã dùng những số đó trong một cuộc họp. Thật là ngượng."},{"who":"Lan","en":"I completely understand. I'll check the whole report today.","vi":"Tôi hoàn toàn hiểu. Hôm nay tôi sẽ kiểm tra lại toàn bộ báo cáo."},{"who":"Sofia","en":"When can I get the correct version?","vi":"Khi nào tôi nhận được bản đúng?"},{"who":"Lan","en":"I'll send it to you tomorrow morning.","vi":"Sáng mai tôi sẽ gửi cho bà."},{"who":"Lan","en":"And I'll make sure that we check every total before we send a report.","vi":"Và tôi sẽ đảm bảo rằng chúng tôi kiểm tra mọi con số tổng trước khi gửi báo cáo."},{"who":"Sofia","en":"Thank you, Lan. I appreciate that.","vi":"Cảm ơn Lan. Tôi rất ghi nhận điều đó."},{"who":"Lan","en":"Again, I apologize for the trouble. It won't happen again.","vi":"Một lần nữa, tôi xin lỗi vì sự phiền phức này. Chuyện này sẽ không lặp lại."}],"vocab":[{"w":"complaint","ipa":"/kəmˈpleɪnt/","vi":"lời phàn nàn, khiếu nại","ex":"We received a complaint from a client."},{"w":"figure","ipa":"/ˈfɪɡjər/","vi":"con số, số liệu","ex":"the real figures"},{"w":"count","ipa":"/kaʊnt/","vi":"đếm, tính","ex":"We counted some orders twice."},{"w":"embarrassing","ipa":"/ɪmˈbærəsɪŋ/","vi":"gây ngượng, xấu hổ","ex":"It was embarrassing."},{"w":"completely","ipa":"/kəmˈpliːtli/","vi":"hoàn toàn","ex":"I completely understand."},{"w":"make sure","ipa":"/meɪk ʃʊr/","vi":"đảm bảo, chắc chắn","ex":"I'll make sure that we check every total."},{"w":"appreciate","ipa":"/əˈpriːʃieɪt/","vi":"cảm kích, ghi nhận","ex":"I appreciate that."},{"w":"apologize","ipa":"/əˈpɑːlədʒaɪz/","vi":"xin lỗi (trang trọng)","ex":"I apologize for the trouble."}],"grammar":{"t":"Xin lỗi và hứa khắc phục: sorry for/about, apologize for, will, make sure","d":"Một lời xin lỗi chuyên nghiệp có ba phần: nhận lỗi, hứa sửa, cam kết không lặp lại. Sau sorry for và apologize for dùng danh từ hoặc V-ing. Lời hứa dùng will ('ll); sau I'll make sure (that) thì động từ ở hiện tại đơn, dù ý nói về tương lai.","formula":["Xin lỗi: I'm (very) sorry for/about + danh từ · I'm sorry for + V-ing","Trang trọng: I apologize for + danh từ / V-ing","Hứa: I'll (= I will) + V · It won't (= will not) happen again.","Cam kết: I'll make sure (that) + S + V hiện tại đơn"],"ex":["I'm very sorry about that. · I'm sorry for the mistake.","I'm sorry for sending the wrong file.","I apologize for the trouble.","I'll send it to you tomorrow morning.","I'll make sure that we check every total. (không nói: we will check)"],"mistakes":[{"wrong":"I'm sorry for make the mistake.","right":"I'm sorry for making the mistake.","why":"Sau giới từ for, động từ phải thêm -ing."},{"wrong":"I'll make sure that we will check every total.","right":"I'll make sure that we check every total.","why":"Sau make sure (that), dùng hiện tại đơn để nói về tương lai."},{"wrong":"I apologize you for the mistake.","right":"I apologize for the mistake. / I apologize to you for the mistake.","why":"Apologize không đi thẳng với người; phải có to + người, for + lỗi."}]},"quiz":[{"q":"What was wrong in the report?","o":["The dates","The sales for March","The client's name"],"a":1},{"q":"When will Lan send the correct version?","o":["Tomorrow morning","Next week","Today at noon"],"a":0},{"q":"I'm sorry for ___ the wrong file.","o":["sent","send","sending"],"a":2}],"practice":[{"s":"I'm very sorry ___ the mistake.","a":"for","alt":["about"],"hint":"sorry + giới từ + lỗi."},{"s":"I apologize for ___ you the wrong numbers. (send)","a":"sending","alt":[],"hint":"Sau for dùng V-ing."},{"s":"I ___ send you the new version tomorrow.","a":"will","alt":["'ll"],"hint":"Lời hứa."},{"s":"I'll make ___ that we check every total.","a":"sure","alt":[],"hint":"\"Đảm bảo\"."},{"s":"Don't worry. It ___ happen again.","a":"won't","alt":["will not"],"hint":"Hứa không lặp lại."}],"speak":["I'm very sorry about that.","I'll send it to you tomorrow morning.","I'll make sure that we check every total before we send a report.","Again, I apologize for the trouble. It won't happen again."],"write":{"vi":"Khách hàng phàn nàn rằng biểu đồ trong báo cáo tuần trước dùng sai tháng. Viết email trả lời: xin lỗi, giải thích ngắn nguyên nhân, hứa gửi bản đúng và cam kết không lặp lại (dùng I'll make sure that...).","en":"A client complains that a chart in last week's report showed the wrong month. Write a reply: apologize, briefly explain why, promise a correct version and say how you will stop it from happening again.","min":40},"summary":["Xin lỗi: I'm sorry for/about + danh từ; I'm sorry for + V-ing; I apologize for...","Hứa: I'll + V; It won't happen again.","I'll make sure (that) + S + V hiện tại đơn.","Ba bước: nhận lỗi → hứa sửa → cam kết không lặp lại."]},{"id":"x6_3","ch":6,"level":"A2","after":"s_complaint","title":"By Friday or until Friday?","vi":"Giới từ thời hạn: by, until, before, within","goals":["Sau bài này bạn có thể nói hạn chót đúng cách với by (by Friday).","Sau bài này bạn có thể phân biệt by (hạn chót) với until (kéo dài đến), before (trước) và within (trong vòng).","Sau bài này bạn có thể giao và nhận việc kèm thời hạn rõ ràng trong nhóm."],"story":[{"who":"Mark","en":"OK, team. Sofia needs the new dashboard by Friday.","vi":"Được rồi cả nhóm. Sofia cần dashboard mới chậm nhất vào thứ Sáu."},{"who":"Lan","en":"By Friday? What time at the latest?","vi":"Hạn thứ Sáu à? Muộn nhất là mấy giờ?"},{"who":"Mark","en":"By the end of the day on Friday, her time.","vi":"Trước cuối ngày thứ Sáu, theo giờ bên bà ấy."},{"who":"Mark","en":"Minh, can you clean the data by Wednesday?","vi":"Minh, em làm sạch dữ liệu xong trước thứ Tư được không?"},{"who":"Minh","en":"Yes. But I'm on a training course until Tuesday afternoon.","vi":"Được ạ. Nhưng em đi khóa đào tạo đến chiều thứ Ba."},{"who":"Mark","en":"That's fine. Just start after the course.","vi":"Không sao. Em cứ bắt đầu sau khóa học."},{"who":"Mark","en":"Lan, can you build the charts within two days after that?","vi":"Lan, chị dựng biểu đồ trong vòng hai ngày sau đó được không?"},{"who":"Lan","en":"Sure. And I'll test everything before Friday morning.","vi":"Được. Và tôi sẽ kiểm thử mọi thứ trước sáng thứ Sáu."},{"who":"Mark","en":"Good. I'm in Singapore until Thursday, but I'll check my email.","vi":"Tốt. Tôi ở Singapore đến thứ Năm, nhưng tôi vẫn xem email."},{"who":"Lan","en":"Should we send Sofia a draft before the final version?","vi":"Mình có nên gửi Sofia bản nháp trước bản cuối không?"},{"who":"Mark","en":"Yes, please. Send her a draft by Thursday at noon.","vi":"Có. Gửi bà ấy bản nháp chậm nhất trưa thứ Năm nhé."}],"vocab":[{"w":"until","ipa":"/ənˈtɪl/","vi":"cho đến (khi)","ex":"I'm on a course until Tuesday."},{"w":"within","ipa":"/wɪˈðɪn/","vi":"trong vòng (một khoảng thời gian)","ex":"within two days"},{"w":"at the latest","ipa":"/æt ðə ˈleɪtɪst/","vi":"muộn nhất, chậm nhất","ex":"By Friday at the latest."},{"w":"the end of the day","ipa":"/ði end əv ðə deɪ/","vi":"cuối ngày (làm việc)","ex":"by the end of the day"},{"w":"training course","ipa":"/ˈtreɪnɪŋ kɔːrs/","vi":"khóa đào tạo","ex":"I'm on a training course."},{"w":"test","ipa":"/test/","vi":"kiểm thử, chạy thử","ex":"I'll test everything before Friday."},{"w":"draft","ipa":"/dræft/","vi":"bản nháp","ex":"Send her a draft first."},{"w":"final","ipa":"/ˈfaɪnl/","vi":"cuối cùng, chính thức","ex":"the final version"}],"grammar":{"t":"Giới từ chỉ thời hạn: by, until, before, within","d":"Tiếng Việt nói \"đến thứ Sáu\" cho cả hai nghĩa, nhưng tiếng Anh tách rõ. BY là hạn chót: việc phải xong vào hoặc trước mốc đó. UNTIL là một việc kéo dài liên tục đến mốc đó rồi dừng. BEFORE là trước mốc (không tính mốc), WITHIN là trong vòng một khoảng thời gian.","formula":["Hạn chót: finish / send / need + by + mốc (by Friday, by noon)","Kéo dài đến: be / stay / work / wait + until + mốc (until Tuesday)","Trước mốc: before + mốc / sự việc (before Friday morning)","Trong vòng: within + khoảng thời gian (within two days, within 24 hours)"],"ex":["Sofia needs the dashboard by Friday. (thứ Năm hay thứ Sáu đều được, miễn không muộn hơn)","I'm on a training course until Tuesday afternoon. (học liên tục, chiều thứ Ba mới xong)","I'll test everything before Friday morning.","Can you build the charts within two days?","Mẹo: hỏi \"việc này kéo dài hay chỉ cần xong?\" Kéo dài → until; cần xong → by."],"mistakes":[{"wrong":"Please send me the report until Friday.","right":"Please send me the report by Friday.","why":"Gửi báo cáo là việc xảy ra một lần, có hạn chót, nên dùng by; until chỉ dùng cho việc kéo dài."},{"wrong":"I'm on leave by Tuesday.","right":"I'm on leave until Tuesday.","why":"Nghỉ phép là trạng thái kéo dài liên tục đến thứ Ba, nên dùng until."},{"wrong":"Please reply within Friday.","right":"Please reply by Friday. / Please reply within two days.","why":"Within đi với một khoảng thời gian (two days), không đi với một mốc (Friday)."}]},"quiz":[{"q":"When does Sofia need the dashboard?","o":["By Monday","By Wednesday","By Friday"],"a":2},{"q":"Why can't Minh start on Monday?","o":["He is on a training course","He is sick","He is in Singapore"],"a":0},{"q":"I'm in a workshop ___ three o'clock, so please call me after that.","o":["by","until","within"],"a":1}],"practice":[{"s":"Please send me the report ___ Friday. (hạn chót)","a":"by","alt":[],"hint":"Xong vào hoặc trước mốc."},{"s":"I'm on holiday ___ next Monday. (kéo dài)","a":"until","alt":["till"],"hint":"Trạng thái kéo dài đến mốc."},{"s":"The client wants an answer ___ 24 hours.","a":"within","alt":[],"hint":"Trong vòng một khoảng thời gian."},{"s":"Let's check the numbers ___ we send them to Sofia.","a":"before","alt":[],"hint":"Trước một việc khác."},{"s":"We need the data by Wednesday at the ___.","a":"latest","alt":[],"hint":"\"Chậm nhất\"."}],"speak":["Sofia needs the new dashboard by Friday.","I'm on a training course until Tuesday afternoon.","Can you build the charts within two days?","Send her a draft by Thursday at noon."],"write":{"vi":"Viết email giao việc cho hai đồng nghiệp trong một dự án: mỗi người một việc kèm hạn chót rõ ràng. Dùng by, until, before và within ít nhất một lần mỗi từ.","en":"Write an email giving tasks to two colleagues on a project, each with a clear deadline. Use 'by', 'until', 'before' and 'within' at least once each.","min":40},"summary":["By + mốc = hạn chót (xong vào hoặc trước mốc).","Until + mốc = kéo dài liên tục đến mốc.","Before + mốc/sự việc = trước đó; within + khoảng thời gian = trong vòng.","At the latest = chậm nhất: by Friday at the latest."]},{"id":"x7_1","ch":7,"level":"B1","after":"u9","title":"Saying big numbers","vi":"Đọc số lớn, số thập phân và phân số","goals":["Sau bài này bạn có thể đọc đúng số hàng nghìn, triệu, tỷ trong báo cáo.","Sau bài này bạn có thể đọc số thập phân, phần trăm và phân số như người bản xứ.","Sau bài này bạn có thể tránh lỗi \"two millions\" và lỗi dấu phẩy, dấu chấm kiểu Việt Nam."],"story":[{"who":"Mark","en":"Lan, can you read me the key numbers before the meeting?","vi":"Lan, chị đọc cho tôi nghe các con số chính trước cuộc họp được không?"},{"who":"Lan","en":"Sure. Total revenue was one point two million dollars.","vi":"Được chứ. Tổng doanh thu là một phẩy hai triệu đô la."},{"who":"Mark","en":"Good. And how many customers do we have now?","vi":"Tốt. Còn bây giờ chúng ta có bao nhiêu khách hàng?"},{"who":"Lan","en":"Forty-five thousand, six hundred. That's about a third more than last year.","vi":"Bốn mươi lăm nghìn sáu trăm. Nhiều hơn năm ngoái khoảng một phần ba."},{"who":"Mark","en":"Nice. What about the average order value?","vi":"Hay đấy. Còn giá trị đơn hàng trung bình thì sao?"},{"who":"Lan","en":"It's twenty-six dollars and fifty cents.","vi":"Là hai mươi sáu đô la năm mươi xu."},{"who":"Mark","en":"And the return rate?","vi":"Còn tỷ lệ trả hàng?"},{"who":"Lan","en":"It went down from four point five percent to three point eight percent.","vi":"Nó giảm từ bốn phẩy năm phần trăm xuống ba phẩy tám phần trăm."},{"who":"Mark","en":"Great. Just one small thing. In the last meeting, you said \"two millions\".","vi":"Tuyệt. Chỉ một điều nhỏ thôi. Ở cuộc họp trước, chị đã nói \"two millions\"."},{"who":"Lan","en":"Oh no. So I should say \"two million\", without an s?","vi":"Ôi không. Vậy tôi nên nói \"two million\", không có chữ s à?"},{"who":"Mark","en":"Exactly. But we say \"millions of customers\" when there's no number before it.","vi":"Chính xác. Nhưng ta nói \"millions of customers\" khi không có con số đứng trước."},{"who":"Lan","en":"Got it. Two million dollars, but millions of people.","vi":"Hiểu rồi. Hai triệu đô la, nhưng hàng triệu người."},{"who":"Mark","en":"Perfect. Your numbers are clear, and that's what the client needs.","vi":"Hoàn hảo. Số liệu của chị rõ ràng, và đó là điều khách hàng cần."}],"vocab":[{"w":"revenue","ipa":"/ˈrevənuː/","vi":"doanh thu","ex":"Total revenue was $1.2 million."},{"w":"million","ipa":"/ˈmɪljən/","vi":"triệu","ex":"two million dollars"},{"w":"billion","ipa":"/ˈbɪljən/","vi":"tỷ (một nghìn triệu)","ex":"The company is worth three billion dollars."},{"w":"point (in numbers)","ipa":"/pɔɪnt/","vi":"phẩy (dấu thập phân)","ex":"3.8 = three point eight"},{"w":"a third","ipa":"/ə θɝːd/","vi":"một phần ba","ex":"about a third more than last year"},{"w":"average","ipa":"/ˈævərɪdʒ/","vi":"trung bình","ex":"the average order value"},{"w":"order value","ipa":"/ˈɔːrdər ˈvæljuː/","vi":"giá trị đơn hàng","ex":"The order value went up."},{"w":"return rate","ipa":"/rɪˈtɝːn reɪt/","vi":"tỷ lệ trả hàng","ex":"The return rate is 3.8%."}],"grammar":{"t":"Cách đọc số lớn, số thập phân, phần trăm và phân số","d":"Người làm data đọc số mỗi ngày, nên đọc sai số là mất điểm ngay. Tiếng Anh nhóm số theo hàng nghìn (thousand, million, billion) và dùng dấu chấm cho phần thập phân, ngược với tiếng Việt. Sau dấu chấm (point), ta đọc từng chữ số một.","formula":["Số lớn: số + hundred / thousand / million / billion (KHÔNG thêm -s): two million, five thousand","Không có số đứng trước: hundreds of / thousands of / millions of + danh từ số nhiều","Số thập phân: dấu chấm đọc là point, sau đó đọc từng chữ số: 3.85 = three point eight five","Phân số: 1/2 = a half · 1/3 = a third · 1/4 = a quarter · 3/4 = three quarters"],"ex":["45,600 = forty-five thousand, six hundred","1,200,000 = one point two million (hoặc one million, two hundred thousand)","$26.50 = twenty-six dollars and fifty cents (nói nhanh: twenty-six fifty)","Chú ý: tiếng Việt viết 1.200.000 và 3,8 — tiếng Anh viết 1,200,000 và 3.8","0.5 = zero point five (người Anh còn nói nought point five)","Phần trăm: 12% = twelve percent (percent không bao giờ thêm -s)"],"mistakes":[{"wrong":"Revenue was two millions dollars.","right":"Revenue was two million dollars.","why":"Khi có con số đứng trước, million/thousand/hundred không thêm -s."},{"wrong":"The rate is three comma eight percent.","right":"The rate is three point eight percent.","why":"Tiếng Anh dùng dấu chấm cho số thập phân và đọc là point, không phải comma."},{"wrong":"1.25 = one point twenty-five","right":"1.25 = one point two five","why":"Sau point phải đọc từng chữ số một."}]},"quiz":[{"q":"What was the total revenue?","o":["$1.2 million","$12 million","$2.1 million"],"a":0},{"q":"What was Lan's mistake in the last meeting?","o":["She forgot the revenue","She said \"two millions\"","She was late"],"a":1},{"q":"How do you say 0.75?","o":["zero comma seven five","zero point seventy-five","zero point seven five"],"a":2}],"practice":[{"s":"Revenue was two ___ dollars. (2,000,000)","a":"million","alt":[],"hint":"Có số đứng trước thì không thêm -s."},{"s":"The return rate fell to three ___ eight percent. (3.8%)","a":"point","alt":[],"hint":"Dấu thập phân đọc là gì?"},{"s":"BrightMart has ___ of customers across Asia. (rất nhiều, hàng triệu)","a":"millions","alt":[],"hint":"Không có con số đứng trước: ___ of + danh từ."},{"s":"About a ___ of our customers are new. (1/3)","a":"third","alt":[],"hint":"1/3 đọc là a ___."},{"s":"We have forty-five ___, six hundred customers. (45,600)","a":"thousand","alt":[],"hint":"Hàng nghìn, không thêm -s."}],"speak":["Total revenue was one point two million dollars.","That's about a third more than last year.","It went down from four point five percent to three point eight percent.","Two million dollars, but millions of people."],"write":{"vi":"Viết một tin nhắn gửi quản lý, báo cáo 4 con số chính của tháng này (doanh thu, số khách hàng, giá trị đơn hàng trung bình, một tỷ lệ phần trăm). Viết các con số bằng chữ để luyện cách đọc.","en":"Write a message to your manager with four key numbers for this month (revenue, number of customers, average order value and one percentage). Write the numbers in words to practise saying them.","min":60},"summary":["Có số đứng trước thì hundred, thousand, million, billion không thêm -s: two million.","Không có số đứng trước thì dùng thousands of / millions of + danh từ.","Dấu thập phân tiếng Anh là dấu chấm, đọc là point, sau đó đọc từng chữ số.","Phân số hay dùng: a half, a third, a quarter, three quarters."]},{"id":"s_since","ch":7,"level":"B1","title":"How long have you worked here?","vi":"Hiện tại hoàn thành với for / since","goals":["Sau bài này bạn có thể hỏi và trả lời \"How long have you…?\" khi gặp khách hàng mới.","Sau bài này bạn có thể phân biệt for (khoảng thời gian) và since (mốc thời gian).","Sau bài này bạn có thể giới thiệu kinh nghiệm làm việc của mình một cách tự nhiên."],"story":[{"who":"Mark","en":"Daniel, I'd like you to meet Lan. She's our lead data analyst.","vi":"Daniel, tôi muốn giới thiệu anh với Lan. Cô ấy là chuyên viên phân tích dữ liệu chính của chúng tôi."},{"who":"Daniel","en":"Nice to meet you, Lan. How long have you worked at DataPeak?","vi":"Rất vui được gặp chị, Lan. Chị làm ở DataPeak bao lâu rồi?"},{"who":"Lan","en":"I've worked here for four years. Before that, I worked at a bank in Hanoi.","vi":"Tôi làm ở đây được bốn năm rồi. Trước đó, tôi làm ở một ngân hàng tại Hà Nội."},{"who":"Daniel","en":"And how long have you been in your current role?","vi":"Còn chị giữ vị trí hiện tại bao lâu rồi?"},{"who":"Lan","en":"I've been a lead analyst since January last year. How about you?","vi":"Tôi làm chuyên viên phân tích chính từ tháng Một năm ngoái. Còn anh thì sao?"},{"who":"Daniel","en":"I've been with FreshWay since 2019, but I've only lived in Vietnam for six months.","vi":"Tôi làm cho FreshWay từ năm 2019, nhưng tôi mới sống ở Việt Nam được sáu tháng."},{"who":"Lan","en":"Really? How do you like Ho Chi Minh City so far?","vi":"Thật à? Đến giờ anh thấy Thành phố Hồ Chí Minh thế nào?"},{"who":"Daniel","en":"I love it. Actually, I've known Mark since my first week here.","vi":"Tôi rất thích. Thật ra, tôi quen Mark từ tuần đầu tiên tôi đến đây."},{"who":"Mark","en":"That's right. We've worked on two small projects together since then.","vi":"Đúng vậy. Từ đó đến nay chúng tôi đã làm chung hai dự án nhỏ."},{"who":"Daniel","en":"Lan, have you worked with logistics data before?","vi":"Lan, chị đã từng làm với dữ liệu hậu cần chưa?"},{"who":"Lan","en":"Yes. I've worked with delivery data for about two years.","vi":"Rồi. Tôi làm với dữ liệu giao hàng được khoảng hai năm rồi."},{"who":"Daniel","en":"Great. Then I think our project is in good hands.","vi":"Tuyệt. Vậy tôi nghĩ dự án của chúng tôi đang ở trong tay người giỏi rồi."}],"vocab":[{"w":"lead (analyst)","ipa":"/liːd/","vi":"chính, phụ trách chính","ex":"She's our lead data analyst."},{"w":"role","ipa":"/roʊl/","vi":"vai trò, vị trí công việc","ex":"How long have you been in your current role?"},{"w":"current","ipa":"/ˈkɝːənt/","vi":"hiện tại","ex":"my current project"},{"w":"be with (a company)","ipa":"/bi wɪð/","vi":"làm việc cho (một công ty)","ex":"I've been with FreshWay since 2019."},{"w":"so far","ipa":"/soʊ fɑːr/","vi":"cho đến giờ","ex":"How do you like it so far?"},{"w":"since then","ipa":"/sɪns ðen/","vi":"từ đó đến nay","ex":"We've worked together since then."},{"w":"logistics","ipa":"/loʊˈdʒɪstɪks/","vi":"hậu cần, vận chuyển kho bãi","ex":"logistics data"},{"w":"in good hands","ipa":"/ɪn ɡʊd hændz/","vi":"được giao cho người đáng tin, giỏi","ex":"Your project is in good hands."}],"grammar":{"t":"Thì hiện tại hoàn thành với FOR và SINCE","d":"Dùng khi một việc BẮT ĐẦU trong quá khứ và VẪN CÒN tiếp tục đến bây giờ. FOR trả lời câu hỏi \"bao lâu\" (một khoảng thời gian), còn SINCE trả lời câu hỏi \"từ khi nào\" (một mốc thời gian). Tiếng Việt chỉ cần nói \"tôi làm ở đây 4 năm rồi\", nhưng tiếng Anh bắt buộc phải dùng have/has + V3.","formula":["Khẳng định: S + have/has + V3 + for/since + thời gian","Câu hỏi: How long + have/has + S + V3?","FOR + khoảng thời gian: for four years, for six months, for a long time","SINCE + mốc thời gian: since 2019, since January, since last year, since my first week"],"ex":["I've worked here for four years. (bắt đầu 4 năm trước, bây giờ vẫn làm)","She has been a lead analyst since January last year.","How long have you known Mark? — Since my first week here.","So sánh: I worked at a bank for two years. (quá khứ đơn: việc đã kết thúc, giờ không làm nữa)","Các động từ hay đi với for/since: work, live, know, be, have, use"],"mistakes":[{"wrong":"I work here for four years.","right":"I've worked here for four years.","why":"Việc bắt đầu trong quá khứ và còn tiếp tục đến nay phải dùng have/has + V3, không dùng hiện tại đơn."},{"wrong":"I've lived in Vietnam since six months.","right":"I've lived in Vietnam for six months.","why":"\"Sáu tháng\" là một khoảng thời gian nên dùng for; since chỉ đi với mốc thời gian."},{"wrong":"How long do you know Mark?","right":"How long have you known Mark?","why":"Hỏi \"bao lâu rồi\" cho việc còn đang tiếp diễn thì dùng How long have/has + S + V3."}]},"quiz":[{"q":"How long has Lan worked at DataPeak?","o":["For two years","For four years","Since 2019"],"a":1},{"q":"How long has Daniel lived in Vietnam?","o":["Since 2019","For four years","For six months"],"a":2},{"q":"I have known Mark ___ 2020.","o":["since","for","from"],"a":0}],"practice":[{"s":"Lan has worked at DataPeak ___ four years.","a":"for","alt":[],"hint":"\"Bốn năm\" là khoảng thời gian."},{"s":"Daniel has been with FreshWay ___ 2019.","a":"since","alt":[],"hint":"\"2019\" là một mốc thời gian."},{"s":"How long ___ you known Mark?","a":"have","alt":[],"hint":"Câu hỏi How long + have/has + S + V3."},{"s":"She ___ lived in Ho Chi Minh City since she was a child.","a":"has","alt":["'s"],"hint":"Chủ ngữ she đi với has hay have?"},{"s":"I have ___ him for ten years. (know)","a":"known","alt":[],"hint":"V3 của know là gì?"}],"speak":["How long have you worked at DataPeak?","I've worked here for four years.","I've been a lead analyst since January last year.","I've worked with delivery data for about two years."],"write":{"vi":"Bạn sắp gặp một khách hàng mới. Viết một đoạn giới thiệu ngắn về kinh nghiệm của bạn: bạn làm ở công ty bao lâu rồi, giữ vị trí hiện tại từ khi nào, đã làm với loại dữ liệu nào và trong bao lâu. Dùng cả for và since.","en":"You are meeting a new client. Write a short introduction about your experience: how long you have worked at your company, since when you have been in your current role, and what kind of data you have worked with and for how long. Use both for and since.","min":60},"summary":["Việc bắt đầu trong quá khứ và vẫn còn tiếp tục: have/has + V3.","FOR + khoảng thời gian (for four years); SINCE + mốc thời gian (since 2019).","Hỏi \"bao lâu rồi\": How long have you + V3?","Nếu việc đã kết thúc hẳn thì dùng quá khứ đơn: I worked at a bank for two years."]},{"id":"s_present","ch":7,"level":"B1","title":"Opening a presentation","vi":"Mở đầu và dẫn dắt bài trình bày","goals":["Sau bài này bạn có thể mở đầu một bài trình bày rõ ràng và tự tin.","Sau bài này bạn có thể dùng các cụm từ dẫn dắt để chuyển từ phần này sang phần khác.","Sau bài này bạn có thể kết thúc bài trình bày và mời người nghe đặt câu hỏi."],"story":[{"who":"Sofia","en":"Good morning, everyone. Lan from DataPeak is here to present our quarterly results.","vi":"Chào buổi sáng mọi người. Chị Lan từ DataPeak đến đây để trình bày kết quả quý của chúng ta."},{"who":"Lan","en":"Thank you, Sofia. Good morning, everyone, and thank you for coming.","vi":"Cảm ơn bà Sofia. Chào buổi sáng mọi người, và cảm ơn các anh chị đã đến."},{"who":"Lan","en":"Today I'm going to talk about BrightMart's sales in the third quarter.","vi":"Hôm nay tôi sẽ nói về doanh số của BrightMart trong quý ba."},{"who":"Lan","en":"I've divided my talk into three parts.","vi":"Tôi đã chia bài nói của mình thành ba phần."},{"who":"Lan","en":"First, I'll show you the overall results. Then, I'll look at each region. Finally, I'll make some recommendations.","vi":"Đầu tiên, tôi sẽ cho các anh chị xem kết quả tổng thể. Sau đó, tôi sẽ xem từng khu vực. Cuối cùng, tôi sẽ đưa ra một vài đề xuất."},{"who":"Lan","en":"Please feel free to ask questions at the end.","vi":"Xin cứ thoải mái đặt câu hỏi ở cuối buổi."},{"who":"Lan","en":"So, let's start with the overall results. Total sales grew by eight percent.","vi":"Vậy, hãy bắt đầu với kết quả tổng thể. Tổng doanh số tăng tám phần trăm."},{"who":"Lan","en":"Moving on to the regions, the North did very well, but the South was weaker.","vi":"Chuyển sang các khu vực, miền Bắc làm rất tốt, nhưng miền Nam yếu hơn."},{"who":"Lan","en":"As you can see on this slide, online orders in the South doubled.","vi":"Như các anh chị thấy trên trang chiếu này, đơn hàng trực tuyến ở miền Nam tăng gấp đôi."},{"who":"Lan","en":"Now let's turn to my recommendations. My first recommendation is to move more of the budget to online ads.","vi":"Bây giờ chúng ta chuyển sang các đề xuất. Đề xuất đầu tiên của tôi là chuyển thêm ngân sách sang quảng cáo trực tuyến."},{"who":"Lan","en":"To sum up, it was a good quarter, and online sales are the key to growth.","vi":"Tóm lại, đây là một quý tốt, và bán hàng trực tuyến là chìa khóa để tăng trưởng."},{"who":"Lan","en":"Thank you for listening. I'm happy to take your questions now.","vi":"Cảm ơn các anh chị đã lắng nghe. Bây giờ tôi sẵn sàng trả lời câu hỏi."}],"vocab":[{"w":"feel free to","ipa":"/fiːl friː tə/","vi":"cứ thoải mái (làm gì)","ex":"Feel free to ask questions."},{"w":"move on to","ipa":"/muːv ɑːn tə/","vi":"chuyển sang (phần tiếp theo)","ex":"Moving on to the regions…"},{"w":"turn to","ipa":"/tɝːn tə/","vi":"chuyển sang (chủ đề)","ex":"Now let's turn to the costs."},{"w":"to sum up","ipa":"/tə sʌm ʌp/","vi":"tóm lại","ex":"To sum up, it was a good quarter."},{"w":"slide","ipa":"/slaɪd/","vi":"trang chiếu (trong bài thuyết trình)","ex":"As you can see on this slide…"},{"w":"recommendation","ipa":"/ˌrekəmenˈdeɪʃn/","vi":"đề xuất, khuyến nghị","ex":"My first recommendation is…"},{"w":"growth","ipa":"/ɡroʊθ/","vi":"sự tăng trưởng","ex":"the key to growth"},{"w":"the key to","ipa":"/ðə kiː tə/","vi":"chìa khóa để, yếu tố quyết định","ex":"Online sales are the key to growth."}],"grammar":{"t":"Ngôn ngữ dẫn dắt bài trình bày (signposting)","d":"\"Signposting\" giống như biển chỉ đường: những câu ngắn báo cho người nghe biết bạn đang ở đâu trong bài và sắp nói gì. Người nghe bằng tiếng nước ngoài rất cần những biển này để không bị lạc. Chỉ cần thuộc khoảng mười câu là bạn có khung cho mọi bài trình bày.","formula":["Mở đầu: Today I'm going to talk about + danh từ… / I'd like to show you…","Liệt kê các phần: First, … Then, … Finally, …","Chuyển phần: Moving on to + danh từ, … / Now let's turn to + danh từ.","Kết thúc: To sum up, … / Thank you for listening. I'm happy to take your questions."],"ex":["Today I'm going to talk about our sales in the third quarter.","I've divided my talk into three parts.","Moving on to the regions, the North did very well.","As you can see on this slide, online orders doubled.","To sum up, online sales are the key to growth."],"mistakes":[{"wrong":"Today I will present about our sales.","right":"Today I'm going to talk about our sales.","why":"present không đi với about (present our sales). Muốn dùng about thì dùng talk about."},{"wrong":"Moving on to talk the regions, …","right":"Moving on to the regions, …","why":"to ở đây là giới từ, sau nó là danh từ (hoặc V-ing), không phải động từ nguyên mẫu."},{"wrong":"Thank you for your listening.","right":"Thank you for listening.","why":"Câu cố định là \"Thank you for listening\", không có your."}]},"quiz":[{"q":"How many parts does Lan's talk have?","o":["Two","Three","Four"],"a":1},{"q":"Which region was weaker?","o":["The South","The North","The East"],"a":0},{"q":"Which phrase do you use to change to the next part?","o":["To sum up","Thank you for listening","Moving on to"],"a":2}],"practice":[{"s":"Today I'm ___ to talk about our sales in the third quarter.","a":"going","alt":[],"hint":"Kế hoạch đã định: be + ___ + to + V."},{"s":"___, I'll show you the overall results. Then, I'll look at each region.","a":"First","alt":["Firstly"],"hint":"Từ mở đầu danh sách các phần."},{"s":"Moving ___ to the regions, the North did very well.","a":"on","alt":[],"hint":"Moving ___ to = chuyển sang."},{"s":"Now let's ___ to my recommendations.","a":"turn","alt":["move"],"hint":"Let's ___ to + danh từ = chuyển sang chủ đề."},{"s":"To sum ___, it was a good quarter.","a":"up","alt":[],"hint":"Cụm từ nghĩa là \"tóm lại\"."}],"speak":["Today I'm going to talk about BrightMart's sales in the third quarter.","Moving on to the regions, the North did very well.","Now let's turn to my recommendations.","To sum up, it was a good quarter."],"write":{"vi":"Bạn sắp trình bày kết quả một dự án cho khách hàng. Viết phần mở đầu và phần kết: chào, nói chủ đề, chia bài thành ba phần, dùng ít nhất hai câu chuyển ý, rồi tóm tắt và mời đặt câu hỏi.","en":"You will present the results of a project to a client. Write the opening and the closing: greet the audience, say the topic, divide the talk into three parts, use at least two linking phrases, then sum up and invite questions.","min":60},"summary":["Mở đầu bằng Today I'm going to talk about… và nói rõ bài có mấy phần.","Liệt kê bằng First, Then, Finally; chuyển phần bằng Moving on to… / Now let's turn to…","Kết bằng To sum up, … rồi Thank you for listening.","Nhớ: talk about, nhưng present + danh từ (không có about)."]},{"id":"s_passive","ch":7,"level":"B1","title":"How the data is collected","vi":"Câu bị động thì hiện tại","goals":["Sau bài này bạn có thể mô tả một quy trình dữ liệu bằng câu bị động.","Sau bài này bạn có thể chuyển câu chủ động sang bị động và dùng by để nói ai/cái gì thực hiện.","Sau bài này bạn có thể hỏi về một quy trình: How is…? When are…?"],"story":[{"who":"Sofia","en":"Lan, our directors want to know where the numbers in the dashboard come from.","vi":"Lan, các giám đốc của chúng tôi muốn biết số liệu trong dashboard đến từ đâu."},{"who":"Lan","en":"Sure. Let me explain how the data is collected.","vi":"Được ạ. Để tôi giải thích dữ liệu được thu thập như thế nào."},{"who":"Lan","en":"Every time a customer buys something, the sale is recorded by the cash register.","vi":"Mỗi khi khách hàng mua gì đó, giao dịch được máy tính tiền ghi lại."},{"who":"Lan","en":"Online orders are stored in a separate system.","vi":"Đơn hàng trực tuyến được lưu trong một hệ thống riêng."},{"who":"Sofia","en":"And how is the data sent to DataPeak?","vi":"Thế dữ liệu được gửi sang DataPeak bằng cách nào?"},{"who":"Lan","en":"Every night at midnight, all the files are copied to the cloud.","vi":"Mỗi đêm lúc nửa đêm, tất cả các tệp được sao chép lên đám mây."},{"who":"Lan","en":"Then the data is checked automatically for errors.","vi":"Sau đó dữ liệu được kiểm tra lỗi một cách tự động."},{"who":"Sofia","en":"What happens if there's an error?","vi":"Nếu có lỗi thì sao?"},{"who":"Lan","en":"Our team is notified by email, and the problem is fixed before 8 a.m.","vi":"Nhóm của chúng tôi được báo qua email, v
