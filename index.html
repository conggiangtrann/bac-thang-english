:[{"wrong":"Sofia is the client who she manages the team.","right":"Sofia is the client who manages the team.","why":"who đã thay cho she, không lặp lại đại từ."},{"wrong":"PeakView is the app who shows sales.","right":"PeakView is the app which/that shows sales.","why":"who chỉ dùng cho người; vật dùng which hoặc that."},{"wrong":"Hue is the city which BrightMart has its best store.","right":"Hue is the city where BrightMart has its best store.","why":"Nói về nơi chốn mà phía sau là câu đầy đủ (S + V + tân ngữ) thì dùng where."}]},"quiz":[{"q":"Who is Sofia?","o":["The IT guy at BrightMart","The client who manages the data team at BrightMart","A new analyst"],"a":1},{"q":"What is Hue?","o":["The city where BrightMart has its best store","A new app","A client"],"a":0},{"q":"This is the report ___ Sofia asked for.","o":["who","where","that"],"a":2}],"practice":[{"s":"Sofia is the client ___ manages the data team.","a":"who","alt":["that"],"hint":"Mô tả người."},{"s":"PeakView is the app ___ shows sales every morning.","a":"which","alt":["that"],"hint":"Mô tả vật."},{"s":"Hue is the city ___ BrightMart has its best store.","a":"where","alt":[],"hint":"Mô tả nơi chốn."},{"s":"Tom is the IT guy ___ looks after the servers.","a":"who","alt":["that"],"hint":"Mô tả người."},{"s":"ChartPro is the tool ___ we chose last month.","a":"that","alt":["which"],"hint":"Mô tả vật, làm tân ngữ (có thể bỏ, nhưng ở đây hãy điền)."}],"speak":["Sofia is the client who manages the data team at BrightMart.","It's the app which shows BrightMart's sales every morning.","Hue is the city where BrightMart has its best store.","He's the one that helped us find the missing October data."],"write":{"vi":"Một đồng nghiệp mới vừa vào nhóm bạn. Viết email giới thiệu cho họ ít nhất hai người, hai công cụ và một địa điểm quan trọng trong công việc. Dùng who, which, that và where.","en":"A new colleague has just joined your team. Write an email introducing at least two people, two tools and one important place in your work. Use who, which, that and where.","min":60},"summary":["who/that cho người; which/that cho vật; where cho nơi chốn.","Mệnh đề quan hệ đứng ngay sau danh từ nó mô tả.","Không lặp đại từ sau who/which: the client who manages (không phải who she manages).","Khi làm tân ngữ có thể bỏ that/which: the tool (that) we chose."]},{"id":"s_interview","ch":9,"level":"B1","title":"A job interview","vi":"Hiện tại hoàn thành và quá khứ đơn","goals":["Sau bài này bạn có thể giới thiệu kinh nghiệm làm việc của mình trong buổi phỏng vấn.","Sau bài này bạn có thể chọn đúng giữa hiện tại hoàn thành và quá khứ đơn khi nói về CV.","Sau bài này bạn có thể trả lời các câu hỏi Have you ever…? và When did you…? một cách tự nhiên."],"story":[{"who":"Karen","en":"Thanks for coming in, Lan. Tell me a little about your experience.","vi":"Cảm ơn chị đã đến, Lan. Chị kể một chút về kinh nghiệm của mình nhé."},{"who":"Lan","en":"Sure. I've worked as a data analyst for six years. I started my career at a bank in 2020.","vi":"Vâng. Tôi đã làm chuyên viên phân tích dữ liệu được sáu năm. Tôi bắt đầu sự nghiệp ở một ngân hàng vào năm 2020."},{"who":"Lan","en":"Then I joined DataPeak in 2021, and I've been there since then.","vi":"Sau đó tôi vào DataPeak năm 2021, và tôi làm ở đó từ đó đến nay."},{"who":"Karen","en":"What have you achieved at DataPeak?","vi":"Ở DataPeak chị đã đạt được những gì?"},{"who":"Lan","en":"I've built more than thirty dashboards for retail clients. Last year, I led a big project for BrightMart.","vi":"Tôi đã xây dựng hơn ba mươi dashboard cho các khách hàng bán lẻ. Năm ngoái, tôi dẫn dắt một dự án lớn cho BrightMart."},{"who":"Karen","en":"What exactly did you do on that project?","vi":"Cụ thể chị đã làm gì trong dự án đó?"},{"who":"Lan","en":"I cleaned five years of sales data and created a model that predicted demand. It cut waste by twelve percent.","vi":"Tôi làm sạch dữ liệu bán hàng của năm năm và tạo một mô hình dự báo nhu cầu. Nó giảm lãng phí được mười hai phần trăm."},{"who":"Karen","en":"Impressive. Have you ever managed a team?","vi":"Ấn tượng đấy. Chị đã bao giờ quản lý một nhóm chưa?"},{"who":"Lan","en":"Yes, I have. I've managed two junior analysts since January.","vi":"Rồi ạ. Tôi quản lý hai chuyên viên phân tích mới vào nghề từ tháng Một."},{"who":"Karen","en":"And when did you get your cloud certificate?","vi":"Còn chứng chỉ điện toán đám mây, chị lấy khi nào?"},{"who":"Lan","en":"I got it in March. I've used those skills in almost every project since then.","vi":"Tôi lấy hồi tháng Ba. Từ đó đến nay tôi đã dùng các kỹ năng đó trong gần như mọi dự án."},{"who":"Karen","en":"So why did you apply for this position?","vi":"Vậy tại sao chị ứng tuyển vị trí này?"},{"who":"Lan","en":"I've learned a lot at DataPeak, but now I'm ready for a bigger challenge.","vi":"Tôi đã học được rất nhiều ở DataPeak, nhưng giờ tôi sẵn sàng cho một thử thách lớn hơn."}],"vocab":[{"w":"apply for","ipa":"/əˈplaɪ fɔːr/","vi":"ứng tuyển, nộp đơn xin","ex":"She applied for a senior job."},{"w":"experience","ipa":"/ɪkˈspɪriəns/","vi":"kinh nghiệm","ex":"I have six years of experience."},{"w":"achieve","ipa":"/əˈtʃiːv/","vi":"đạt được","ex":"What have you achieved this year?"},{"w":"lead (led, led)","ipa":"/liːd/ – /lɛd/","vi":"dẫn dắt, chỉ huy","ex":"I led a project for BrightMart."},{"w":"demand","ipa":"/dɪˈmænd/","vi":"nhu cầu (của thị trường)","ex":"Demand is high in December."},{"w":"waste","ipa":"/weɪst/","vi":"sự lãng phí","ex":"The model cut waste by 12%."},{"w":"junior","ipa":"/ˈdʒuːnjər/","vi":"cấp dưới, mới vào nghề","ex":"She manages two junior analysts."},{"w":"certificate","ipa":"/sərˈtɪfɪkət/","vi":"chứng chỉ","ex":"I got a cloud certificate in March."}],"grammar":{"t":"Hiện tại hoàn thành và quá khứ đơn khi nói về CV","d":"Khi kể kinh nghiệm, dùng quá khứ đơn cho việc đã xong ở một thời điểm cụ thể (in 2020, last year, in March). Dùng hiện tại hoàn thành khi KHÔNG nói thời điểm, khi việc còn kéo dài đến bây giờ (for, since), hoặc khi nói về trải nghiệm (ever, never). Mẹo: câu hỏi mở đầu thường dùng hiện tại hoàn thành, câu hỏi chi tiết tiếp theo dùng quá khứ đơn.","formula":["Quá khứ đơn: S + V2/ed + mốc thời gian cụ thể (in 2021, last year, two years ago)","Hiện tại hoàn thành: S + have/has + V3 (không có mốc; hoặc với for / since / ever / so far)","Câu hỏi: Have you ever + V3? → Yes, I have. → When / What did you + V?"],"ex":["I joined DataPeak in 2021. (mốc thời gian rõ → quá khứ đơn)","I've worked at DataPeak since 2021. (vẫn đang làm → hiện tại hoàn thành)","I've built more than thirty dashboards. (tổng kết, không nói khi nào)","Last year, I led a project for BrightMart. (có 'last year')","Have you ever managed a team? – Yes. I managed a team of five in 2023."],"mistakes":[{"wrong":"I have joined DataPeak in 2021.","right":"I joined DataPeak in 2021.","why":"Có mốc thời gian cụ thể 'in 2021' thì phải dùng quá khứ đơn."},{"wrong":"I work here since 2021.","right":"I've worked here since 2021.","why":"Việc bắt đầu trong quá khứ và vẫn còn tiếp diễn, đi với 'since' → hiện tại hoàn thành."},{"wrong":"I have finished my degree last year.","right":"I finished my degree last year.","why":"'Last year' là thời gian đã kết thúc → quá khứ đơn."}]},"quiz":[{"q":"How long has Lan worked as a data analyst?","o":["Four years","Six years","Two years"],"a":1},{"q":"What did Lan's model do?","o":["It cut waste by twelve percent","It replaced the bank's system","It hired new staff"],"a":0},{"q":"Choose the correct sentence.","o":["I have joined the company in 2021.","I have join the company in 2021.","I joined the company in 2021."],"a":2}],"practice":[{"s":"I ___ at a bank in 2020.","a":"worked","alt":[],"hint":"Có mốc 'in 2020' → quá khứ đơn của work."},{"s":"I ___ more than thirty dashboards so far.","a":"have built","alt":["'ve built"],"hint":"'So far' (tính đến nay) → have + V3 của build."},{"s":"When ___ you finish your degree?","a":"did","alt":[],"hint":"Hỏi thời điểm cụ thể → dùng trợ động từ quá khứ."},{"s":"She ___ two junior analysts since January.","a":"has managed","alt":["'s managed"],"hint":"'Since January' → has + V3 của manage."},{"s":"Last year, I ___ a project for BrightMart.","a":"led","alt":[],"hint":"Quá khứ của lead (bất quy tắc)."}],"speak":["I've worked as a data analyst for six years.","Last year, I led a big project for BrightMart.","Have you ever managed a team?","I've learned a lot, but now I'm ready for a bigger challenge."],"write":{"vi":"Bạn đang ứng tuyển một vị trí chuyên viên phân tích cấp cao. Viết đoạn 'About me' giới thiệu kinh nghiệm làm việc của bạn: bạn đã làm bao lâu, đã làm những gì, và một dự án cụ thể năm ngoái. Dùng cả hiện tại hoàn thành và quá khứ đơn.","en":"You are applying for a senior analyst position. Write an 'About me' paragraph about your work experience: how long you have worked, what you have done, and one specific project from last year. Use both the present perfect and the past simple.","min":60},"summary":["Quá khứ đơn: việc đã xong ở thời điểm cụ thể (in 2021, last year, in March).","Hiện tại hoàn thành: kinh nghiệm không nói thời điểm, hoặc việc còn kéo dài (for, since, so far).","Hỏi chung bằng Have you ever…?, hỏi chi tiết bằng When/What did you…?","Không bao giờ ghép have + V3 với mốc thời gian đã qua như 'last year', 'in 2020'."]},{"id":"x9_1","ch":9,"level":"B1","after":"s_interview","title":"What does your job involve?","vi":"Nói về trách nhiệm trong công việc","goals":["Sau bài này bạn có thể giải thích rõ công việc hằng ngày của mình gồm những gì.","Sau bài này bạn có thể dùng đúng be responsible for, be in charge of, report to, deal with.","Sau bài này bạn có thể giới thiệu ai làm gì trong nhóm cho đồng nghiệp mới."],"story":[{"who":"Minh","en":"Lan, I'm still a bit confused about who does what here. Can you explain?","vi":"Chị Lan, em vẫn hơi rối không biết ở đây ai làm việc gì. Chị giải thích giúp em được không?"},{"who":"Lan","en":"Of course. I'm responsible for the BrightMart account. I report to Daniel, the Head of Data.","vi":"Được chứ. Chị phụ trách khách hàng BrightMart. Chị báo cáo cho anh Daniel, trưởng bộ phận Dữ liệu."},{"who":"Minh","en":"So what does your job involve day to day?","vi":"Vậy hằng ngày công việc của chị gồm những gì?"},{"who":"Lan","en":"It involves cleaning data, building dashboards and meeting the client every week.","vi":"Nó gồm làm sạch dữ liệu, xây dashboard và họp với khách hàng hằng tuần."},{"who":"Minh","en":"And Mark? Is he your boss?","vi":"Còn anh Mark? Anh ấy là sếp của chị à?"},{"who":"Lan","en":"No, Mark is in charge of the project schedule. He deals with deadlines and budgets.","vi":"Không, Mark chịu trách nhiệm lịch trình dự án. Anh ấy lo các hạn chót và ngân sách."},{"who":"Minh","en":"Who deals with technical problems, like server issues?","vi":"Ai xử lý các vấn đề kỹ thuật, ví dụ sự cố máy chủ ạ?"},{"who":"Lan","en":"That's the IT team. They're responsible for keeping our systems running.","vi":"Đó là nhóm IT. Họ chịu trách nhiệm giữ cho hệ thống luôn chạy."},{"who":"Minh","en":"And what will I be responsible for?","vi":"Thế em sẽ phụ trách việc gì ạ?"},{"who":"Lan","en":"At first, you'll be in charge of the weekly sales report. You'll report to me.","vi":"Lúc đầu, em sẽ phụ trách báo cáo doanh số hằng tuần. Em sẽ báo cáo cho chị."},{"who":"Minh","en":"Does that involve talking to the client?","vi":"Việc đó có bao gồm nói chuyện với khách hàng không ạ?"},{"who":"Lan","en":"Not yet. But in a few months, you'll take on more client work.","vi":"Chưa đâu. Nhưng vài tháng nữa, em sẽ nhận thêm việc làm với khách hàng."}],"vocab":[{"w":"be responsible for","ipa":"/bi rɪˈspɑːnsəbəl fɔːr/","vi":"chịu trách nhiệm, phụ trách","ex":"I'm responsible for the BrightMart account."},{"w":"be in charge of","ipa":"/bi ɪn tʃɑːrdʒ ʌv/","vi":"phụ trách, nắm quyền quản lý","ex":"Mark is in charge of the schedule."},{"w":"report to","ipa":"/rɪˈpɔːrt tuː/","vi":"báo cáo cho (cấp trên)","ex":"I report to the Head of Data."},{"w":"involve","ipa":"/ɪnˈvɑːlv/","vi":"bao gồm, đòi hỏi","ex":"My job involves a lot of travel."},{"w":"deal with","ipa":"/diːl wɪð/","vi":"xử lý, giải quyết","ex":"She deals with client complaints."},{"w":"account","ipa":"/əˈkaʊnt/","vi":"khách hàng (mà công ty phục vụ)","ex":"He manages three big accounts."},{"w":"day to day","ipa":"/ˌdeɪ tə ˈdeɪ/","vi":"hằng ngày, thường nhật","ex":"What do you do day to day?"},{"w":"take on","ipa":"/teɪk ɑːn/","vi":"nhận thêm (việc, trách nhiệm)","ex":"She took on a new project."}],"grammar":{"t":"Nói về trách nhiệm công việc","d":"Khi người khác hỏi 'Bạn làm gì?', đừng chỉ nói chức danh. Hãy nói bạn phụ trách việc gì, báo cáo cho ai và công việc gồm những gì. Chú ý: sau giới từ (for, of, with) và sau động từ involve, ta dùng danh từ hoặc V-ing.","formula":["S + be responsible for / be in charge of + danh từ / V-ing","S + report to + người (cấp trên)","S + deal with + vấn đề / người","My job involves + V-ing / danh từ"],"ex":["I'm responsible for the weekly report.","She is in charge of training new staff.","Minh reports to Lan.","Mark deals with the budget.","My job involves meeting clients every week."],"mistakes":[{"wrong":"I'm responsible to clean the data.","right":"I'm responsible for cleaning the data.","why":"Đi với giới từ 'for', và sau giới từ dùng V-ing."},{"wrong":"My job involves to meet clients.","right":"My job involves meeting clients.","why":"Sau 'involve' dùng V-ing, không dùng 'to + V'."},{"wrong":"I report for Daniel.","right":"I report to Daniel.","why":"Báo cáo cho cấp trên là 'report to'."}]},"quiz":[{"q":"Who does Lan report to?","o":["Mark","Daniel","Sofia"],"a":1},{"q":"What is Mark in charge of?","o":["The project schedule","Server problems","The weekly sales report"],"a":0},{"q":"My job involves ___ dashboards.","o":["build","to build","building"],"a":2}],"practice":[{"s":"I'm responsible ___ the BrightMart account.","a":"for","alt":[],"hint":"Giới từ đi với 'responsible'."},{"s":"Who do you report ___?","a":"to","alt":[],"hint":"Báo cáo cho ai: report ___."},{"s":"Her job involves ___ (meet) clients every week.","a":"meeting","alt":[],"hint":"Sau involve dùng V-ing."},{"s":"Mark is in ___ of the project schedule.","a":"charge","alt":[],"hint":"Cụm 'be in ___ of' = phụ trách."},{"s":"The IT team deals ___ server problems.","a":"with","alt":[],"hint":"Xử lý một vấn đề: deal ___ ."}],"speak":["I'm responsible for the BrightMart account.","I report to Daniel, the Head of Data.","It involves cleaning data and building dashboards.","Mark is in charge of the project schedule."],"write":{"vi":"Bạn đang cập nhật hồ sơ LinkedIn. Viết đoạn mô tả công việc hiện tại: bạn phụ trách việc gì, báo cáo cho ai, công việc hằng ngày gồm những gì và bạn xử lý những vấn đề nào.","en":"You are updating your LinkedIn profile. Describe your current job: what you are responsible for, who you report to, what your day-to-day work involves and what problems you deal with.","min":60},"summary":["be responsible for / be in charge of + danh từ hoặc V-ing: phụ trách việc gì.","report to + người: báo cáo cho cấp trên nào.","My job involves + V-ing: công việc gồm những gì.","deal with: xử lý, giải quyết vấn đề; take on: nhận thêm việc mới."]},{"id":"s_strengths","ch":9,"level":"B1","title":"Talking about your strengths","vi":"Nói về điểm mạnh, điểm yếu","goals":["Sau bài này bạn có thể trả lời câu hỏi 'What are your strengths and weaknesses?' một cách tự tin.","Sau bài này bạn có thể dùng tính từ tính cách và cấu trúc good at + V-ing.","Sau bài này bạn có thể dùng V-ing làm chủ ngữ để nói về một hoạt động."],"story":[{"who":"Karen","en":"Let's talk about you now. What are your main strengths?","vi":"Giờ ta nói về chị nhé. Điểm mạnh chính của chị là gì?"},{"who":"Lan","en":"I think I'm very organized and reliable. I always meet my deadlines.","vi":"Tôi nghĩ tôi rất ngăn nắp và đáng tin cậy. Tôi luôn kịp hạn chót."},{"who":"Karen","en":"Can you give me an example?","vi":"Chị cho tôi một ví dụ được không?"},{"who":"Lan","en":"Sure. Last quarter, three clients needed reports in the same week, and I delivered all of them on time.","vi":"Vâng. Quý trước, ba khách hàng cần báo cáo trong cùng một tuần, và tôi giao đúng hạn cả ba."},{"who":"Karen","en":"What else are you good at?","vi":"Chị còn giỏi việc gì nữa?"},{"who":"Lan","en":"I'm good at explaining numbers to people who aren't technical. Telling a clear story with data is my favorite part of the job.","vi":"Tôi giỏi giải thích số liệu cho người không rành kỹ thuật. Kể một câu chuyện rõ ràng bằng dữ liệu là phần tôi thích nhất trong công việc."},{"who":"Karen","en":"And what about your weaknesses?","vi":"Còn điểm yếu của chị thì sao?"},{"who":"Lan","en":"To be honest, I'm a bit of a perfectionist. Checking every small detail sometimes takes me too long.","vi":"Thật lòng mà nói, tôi hơi cầu toàn. Việc kiểm tra từng chi tiết nhỏ đôi khi làm tôi mất quá nhiều thời gian."},{"who":"Karen","en":"How are you dealing with that?","vi":"Chị đang khắc phục điều đó thế nào?"},{"who":"Lan","en":"I've started setting a time limit for each task. Asking for feedback early also helps a lot.","vi":"Tôi đã bắt đầu đặt giới hạn thời gian cho từng việc. Xin góp ý sớm cũng giúp ích rất nhiều."},{"who":"Karen","en":"That's a good answer. Would you say you're a team player?","vi":"Câu trả lời hay đấy. Chị có cho rằng mình là người làm việc nhóm tốt không?"},{"who":"Lan","en":"Definitely. I'm patient, and I enjoy helping new colleagues. Working with others makes me better at my job.","vi":"Chắc chắn rồi. Tôi kiên nhẫn và thích giúp đồng nghiệp mới. Làm việc cùng người khác giúp tôi làm tốt công việc hơn."}],"vocab":[{"w":"strength","ipa":"/strɛŋkθ/","vi":"điểm mạnh","ex":"Her main strength is patience."},{"w":"weakness","ipa":"/ˈwiːknəs/","vi":"điểm yếu","ex":"Everyone has a weakness."},{"w":"organized","ipa":"/ˈɔːrɡənaɪzd/","vi":"ngăn nắp, có tổ chức","ex":"He is very organized."},{"w":"reliable","ipa":"/rɪˈlaɪəbəl/","vi":"đáng tin cậy","ex":"She is reliable and never late."},{"w":"perfectionist","ipa":"/pərˈfɛkʃənɪst/","vi":"người cầu toàn","ex":"I'm a bit of a perfectionist."},{"w":"patient","ipa":"/ˈpeɪʃənt/","vi":"kiên nhẫn","ex":"Be patient with new staff."},{"w":"team player","ipa":"/tiːm ˈpleɪər/","vi":"người làm việc nhóm tốt","ex":"We need a real team player."},{"w":"deliver","ipa":"/dɪˈlɪvər/","vi":"giao, hoàn thành (sản phẩm)","ex":"We delivered the report on time."}],"grammar":{"t":"Tính từ tính cách, good at + V-ing, V-ing làm chủ ngữ","d":"Để nói điểm mạnh, dùng tính từ tính cách (organized, reliable, patient) và cấu trúc good at + V-ing. Khi muốn lấy cả một hoạt động làm chủ ngữ (Việc kiểm tra…, Việc làm việc nhóm…), ta dùng V-ing ở đầu câu, và động từ theo sau chia số ít.","formula":["S + be + (very / quite / a bit) + tính từ tính cách","S + be + good at / bad at + V-ing / danh từ","V-ing (+ …) + động từ số ít (is / helps / takes / makes) + …"],"ex":["I'm very organized and reliable.","I'm good at explaining numbers.","He's not very good at public speaking.","Checking every detail takes a long time.","Working with others makes me better at my job."],"mistakes":[{"wrong":"I'm good at explain data.","right":"I'm good at explaining data.","why":"Sau giới từ 'at' phải dùng V-ing."},{"wrong":"Check details take a long time.","right":"Checking details takes a long time.","why":"Hoạt động làm chủ ngữ → V-ing, và động từ chia số ít (takes)."},{"wrong":"I am very patience.","right":"I am very patient.","why":"'Patience' là danh từ (sự kiên nhẫn); sau 'be' cần tính từ 'patient'."}]},"quiz":[{"q":"What is Lan's weakness?","o":["She is often late","She is a bit of a perfectionist","She is not patient"],"a":1},{"q":"How is Lan dealing with her weakness?","o":["She sets a time limit for each task","She works at night","She asks Mark to check everything"],"a":0},{"q":"___ for feedback early helps a lot.","o":["Ask","To asked","Asking"],"a":2}],"practice":[{"s":"I'm good at ___ (explain) data to clients.","a":"explaining","alt":[],"hint":"Sau 'at' dùng V-ing."},{"s":"___ (work) with others makes me better.","a":"Working","alt":[],"hint":"V-ing làm chủ ngữ."},{"s":"She always meets her deadlines. She is very ___.","a":"reliable","alt":["organized"],"hint":"Tính từ: đáng tin cậy."},{"s":"Checking every detail ___ (take) a lot of time.","a":"takes","alt":[],"hint":"Chủ ngữ V-ing → động từ số ít."},{"s":"He is not very good ___ public speaking.","a":"at","alt":[],"hint":"Giới từ sau 'good'."}],"speak":["I'm very organized and reliable.","I'm good at explaining numbers to people who aren't technical.","To be honest, I'm a bit of a perfectionist.","Working with others makes me better at my job."],"write":{"vi":"Nhà tuyển dụng gửi email hỏi: 'What are your strengths and weaknesses?' Viết câu trả lời: hai điểm mạnh kèm ví dụ thật, một điểm yếu và cách bạn đang khắc phục nó.","en":"A recruiter emails you: 'What are your strengths and weaknesses?' Write your answer: two strengths with real examples, one weakness and how you are dealing with it.","min":60},"summary":["Dùng tính từ tính cách để nói điểm mạnh: organized, reliable, patient, a team player.","good at / bad at + V-ing: giỏi / kém việc gì.","V-ing có thể làm chủ ngữ, động từ theo sau chia số ít: Checking details takes time.","Khi nói điểm yếu, luôn kèm cách bạn đang khắc phục."]},{"id":"x9_2","ch":9,"level":"B1","after":"s_strengths","title":"Writing your CV","vi":"Viết CV tiếng Anh có sức nặng","goals":["Sau bài này bạn có thể viết các gạch đầu dòng CV bằng động từ hành động mạnh.","Sau bài này bạn có thể thêm kết quả có số liệu với by, from… to….","Sau bài này bạn có thể chọn đúng thì cho công việc hiện tại và công việc cũ trong CV."],"story":[{"who":"Minh","en":"Lan, could you look at my CV? I'm applying for an internal position.","vi":"Chị Lan, chị xem giúp em CV được không? Em đang ứng tuyển một vị trí nội bộ."},{"who":"Lan","en":"Sure. Hmm, this line says, \"I was responsible for some reports.\" It's a bit weak.","vi":"Được. Ừm, dòng này ghi \"Tôi chịu trách nhiệm một số báo cáo.\" Hơi yếu đấy."},{"who":"Minh","en":"What should I write instead?","vi":"Vậy em nên viết gì thay vào?"},{"who":"Lan","en":"Start with a strong action verb, like \"created\" or \"improved\". And don't use \"I\".","vi":"Bắt đầu bằng một động từ hành động mạnh, như \"created\" hay \"improved\". Và đừng dùng \"I\"."},{"who":"Minh","en":"OK. How about \"Created weekly sales reports for three clients\"?","vi":"Vâng. Thế \"Tạo báo cáo doanh số hằng tuần cho ba khách hàng\" thì sao ạ?"},{"who":"Lan","en":"Much better. Now add a result. Did your work save time or money?","vi":"Tốt hơn nhiều. Giờ thêm kết quả. Công việc của em có tiết kiệm thời gian hay tiền không?"},{"who":"Minh","en":"Yes. The new reports cut manual work from ten hours a week to two.","vi":"Có ạ. Báo cáo mới giảm việc làm tay từ mười tiếng một tuần xuống còn hai."},{"who":"Lan","en":"Perfect. Then write, \"Reduced manual reporting time by 80 percent.\"","vi":"Hoàn hảo. Vậy viết \"Giảm 80% thời gian làm báo cáo thủ công.\""},{"who":"Minh","en":"Should I use the past or the present?","vi":"Em nên dùng thì quá khứ hay hiện tại ạ?"},{"who":"Lan","en":"Use the past for old jobs. For your current job, use the present, like \"Manage the sales dashboard.\"","vi":"Dùng quá khứ cho công việc cũ. Với công việc hiện tại, dùng hiện tại, ví dụ \"Quản lý dashboard doanh số.\""},{"who":"Minh","en":"Got it. And what about my skills section?","vi":"Em hiểu rồi. Còn phần kỹ năng thì sao ạ?"},{"who":"Lan","en":"Keep it short and specific: SQL, Python, Power BI. Recruiters usually read a CV very quickly.","vi":"Viết ngắn và cụ thể: SQL, Python, Power BI. Nhà tuyển dụng thường đọc CV rất nhanh."}],"vocab":[{"w":"CV","ipa":"/ˌsiː ˈviː/","vi":"sơ yếu lý lịch (Mỹ hay gọi là résumé)","ex":"Please send your CV by Friday."},{"w":"position","ipa":"/pəˈzɪʃən/","vi":"vị trí công việc","ex":"She applied for a new position."},{"w":"internal","ipa":"/ɪnˈtɜːrnəl/","vi":"nội bộ","ex":"It's an internal job opening."},{"w":"action verb","ipa":"/ˈækʃən vɜːrb/","vi":"động từ hành động","ex":"Start each line with an action verb."},{"w":"reduce","ipa":"/rɪˈduːs/","vi":"giảm","ex":"We reduced costs by 10%."},{"w":"manual","ipa":"/ˈmænjuəl/","vi":"thủ công, làm bằng tay","ex":"Manual work takes too long."},{"w":"current","ipa":"/ˈkɜːrənt/","vi":"hiện tại","ex":"What is your current job?"},{"w":"recruiter","ipa":"/rɪˈkruːtər/","vi":"nhà tuyển dụng","ex":"A recruiter called me today."}],"grammar":{"t":"Gạch đầu dòng CV: động từ hành động + việc làm + kết quả","d":"Một dòng CV tốt không bắt đầu bằng 'I' mà bằng một động từ hành động (Built, Led, Improved, Reduced), sau đó là việc bạn làm và kết quả có con số. Dùng 'by' để nói mức thay đổi, 'from… to…' để nói điểm đầu và điểm cuối. Công việc cũ dùng quá khứ, công việc hiện tại dùng hiện tại.","formula":["Động từ hành động + việc làm + kết quả: Built 30 dashboards for retail clients.","Mức thay đổi: increased / reduced + X + by + %; điểm đầu – cuối: from A to B","Công việc cũ: Managed…, Led… | Công việc hiện tại: Manage…, Lead…"],"ex":["Created weekly sales reports for three clients.","Reduced manual reporting time by 80%.","Cut report time from ten hours to two hours a week.","Increased customer response rate from 12% to 20%.","Động từ mạnh nên dùng: built, led, designed, improved, reduced, launched, trained."],"mistakes":[{"wrong":"I was responsible for some reports.","right":"Created weekly sales reports for three clients.","why":"Câu yếu và mơ hồ; CV cần động từ hành động và chi tiết cụ thể."},{"wrong":"Reduced costs 15%.","right":"Reduced costs by 15%.","why":"Nói mức tăng/giảm phải có giới từ 'by'."},{"wrong":"Responsible for make reports.","right":"Prepared monthly reports for the sales team.","why":"Sai ngữ pháp (for + make) và không có động từ hành động."}]},"quiz":[{"q":"Why is Minh updating his CV?","o":["He wants an internal position","He is leaving Vietnam","His manager asked him to"],"a":0},{"q":"How much did Minh's new reports reduce manual work?","o":["Two days a week","From ten hours to eight","By 80 percent"],"a":2},{"q":"Which is the strongest CV line?","o":["I did some work on sales.","Increased online sales by 15% in six months.","I was in a sales project."],"a":1}],"practice":[{"s":"Reduced manual work ___ 80 percent.","a":"by","alt":[],"hint":"Giới từ chỉ mức thay đổi."},{"s":"Cut report time ___ ten hours to two.","a":"from","alt":[],"hint":"Điểm bắt đầu: ___ A to B."},{"s":"___ (create) a new dashboard for the sales team in 2023.","a":"Created","alt":[],"hint":"Công việc cũ → quá khứ, động từ hành động ở đầu dòng."},{"s":"Current job: ___ (lead) a team of three analysts.","a":"Lead","alt":[],"hint":"Công việc hiện tại → dùng hiện tại, không có 'I'."},{"s":"Increased customer response rate ___ 12% to 20%.","a":"from","alt":[],"hint":"Điểm đầu và điểm cuối."}],"speak":["Start with a strong action verb.","Reduced manual reporting time by 80 percent.","Use the past for old jobs.","Keep it short and specific."],"write":{"vi":"Viết phần 'Work experience' trong CV của bạn: tên công việc gần đây nhất và 4 gạch đầu dòng, mỗi dòng bắt đầu bằng động từ hành động, ít nhất hai dòng có số liệu. Thêm một dòng kỹ năng.","en":"Write the 'Work experience' part of your CV: your latest job title and four bullet points. Start each one with an action verb, and include numbers in at least two of them. Add one line of skills.","min":60},"summary":["Mỗi dòng CV: động từ hành động + việc làm + kết quả có số liệu.","Dùng 'by' cho mức thay đổi, 'from… to…' cho điểm đầu và điểm cuối.","Không dùng 'I'; công việc cũ dùng quá khứ, công việc hiện tại dùng hiện tại.","Phần kỹ năng: ngắn, cụ thể, đúng tên công cụ."]},{"id":"s_goals","ch":9,"level":"B1","title":"Career goals","vi":"Mục tiêu nghề nghiệp","goals":["Sau bài này bạn có thể nói về mục tiêu nghề nghiệp ngắn hạn và dài hạn.","Sau bài này bạn có thể phân biệt be going to, plan to, hope to và would like to.","Sau bài này bạn có thể trả lời câu hỏi 'Where do you see yourself in five years' time?'."],"story":[{"who":"Daniel","en":"Thanks, Lan. You've had a great year. Now let's talk about the future.","vi":"Cảm ơn Lan. Em đã có một năm rất tốt. Giờ mình nói về tương lai nhé."},{"who":"Lan","en":"Sure. I've thought about it a lot.","vi":"Vâng. Em đã suy nghĩ về điều này nhiều rồi."},{"who":"Daniel","en":"Where do you see yourself in five years' time?","vi":"Em thấy mình ở đâu trong năm năm tới?"},{"who":"Lan","en":"I'd like to lead a small analytics team. I really enjoy helping junior colleagues grow.","vi":"Em muốn dẫn dắt một nhóm phân tích nhỏ. Em rất thích giúp các bạn đồng nghiệp trẻ phát triển."},{"who":"Daniel","en":"That's a good goal. What are you going to do next year?","vi":"Mục tiêu tốt đấy. Năm tới em định làm gì?"},{"who":"Lan","en":"I'm going to take a course in machine learning. I've already signed up for it.","vi":"Em sẽ học một khóa về máy học. Em đã đăng ký rồi."},{"who":"Daniel","en":"Great. Do you plan to get any new certificates?","vi":"Tốt. Em có dự định lấy chứng chỉ mới nào không?"},{"who":"Lan","en":"Yes, I plan to take an advanced cloud exam in June. I hope to pass it on the first try.","vi":"Có ạ, em dự định thi một kỳ thi điện toán đám mây nâng cao vào tháng Sáu. Em hy vọng đỗ ngay lần đầu."},{"who":"Daniel","en":"How can the company support you?","vi":"Công ty có thể hỗ trợ em thế nào?"},{"who":"Lan","en":"I'd like to present at more client meetings. That would help me build my confidence.","vi":"Em muốn được thuyết trình trong nhiều buổi họp khách hàng hơn. Việc đó sẽ giúp em tự tin hơn."},{"who":"Daniel","en":"I'm happy to arrange that. Let's review your progress in six months.","vi":"Anh sẵn lòng sắp xếp. Sáu tháng nữa mình cùng xem lại tiến bộ của em nhé."},{"who":"Lan","en":"Thank you. I hope to have some good results to show you by then.","vi":"Em cảm ơn anh. Em hy vọng đến lúc đó sẽ có kết quả tốt để cho anh xem."}],"vocab":[{"w":"performance review","ipa":"/pərˈfɔːrməns rɪˈvjuː/","vi":"buổi đánh giá hiệu quả công việc","ex":"My performance review is next week."},{"w":"career","ipa":"/kəˈrɪr/","vi":"sự nghiệp","ex":"She wants a career in data."},{"w":"in five years' time","ipa":"/ɪn faɪv jɪrz taɪm/","vi":"năm năm nữa (tính từ bây giờ)","ex":"In five years' time, I'd like to be a manager."},{"w":"sign up for","ipa":"/saɪn ʌp fɔːr/","vi":"đăng ký (khóa học, sự kiện)","ex":"I signed up for a Python course."},{"w":"machine learning","ipa":"/məˈʃiːn ˈlɜːrnɪŋ/","vi":"máy học","ex":"He is studying machine learning."},{"w":"advanced","ipa":"/ədˈvænst/","vi":"nâng cao","ex":"This is an advanced course."},{"w":"confidence","ipa":"/ˈkɑːnfɪdəns/","vi":"sự tự tin","ex":"Practice builds confidence."},{"w":"progress","ipa":"/ˈprɑːɡrɛs/","vi":"sự tiến bộ","ex":"We will review your progress in June."}],"grammar":{"t":"Nói về kế hoạch và mong muốn","d":"Mỗi cấu trúc mang một mức độ chắc chắn khác nhau. 'Be going to' dùng cho kế hoạch đã quyết định; 'plan to' là dự định; 'hope to' là hy vọng, chưa chắc; 'would like to' là mong muốn, nói lịch sự. Tất cả đều theo sau bằng động từ nguyên mẫu. 'In + khoảng thời gian + time' nghĩa là '… nữa' tính từ bây giờ.","formula":["be going to + V: kế hoạch đã quyết định (I'm going to take a course.)","plan to / hope to + V: dự định / hy vọng (I plan to take an exam.)","would like to + V ('d like to): mong muốn, lịch sự (I'd like to lead a team.)","in + khoảng thời gian + time: … nữa (in five years' time, in two weeks' time)"],"ex":["I'm going to start the course in May. (đã đăng ký rồi)","We plan to hire two new analysts.","I hope to pass the exam on the first try.","I'd like to work abroad one day.","In five years' time, I'd like to lead a team."],"mistakes":[{"wrong":"I would like lead a team.","right":"I would like to lead a team.","why":"Sau 'would like' phải có 'to' trước động từ."},{"wrong":"I hope pass the exam.","right":"I hope to pass the exam.","why":"Sau 'hope' dùng 'to + V'."},{"wrong":"After five years, I want to be a manager.","right":"In five years' time, I'd like to be a manager.","why":"Nói '5 năm nữa tính từ bây giờ' dùng 'in five years' (time)', không dùng 'after five years'."}]},"quiz":[{"q":"What would Lan like to do in five years?","o":["Move abroad","Change careers","Lead a small team"],"a":2},{"q":"When is Lan's cloud exam?","o":["In March","In June","In December"],"a":1},{"q":"I'd like ___ at more client meetings.","o":["to present","present","presenting"],"a":0}],"practice":[{"s":"I'd like ___ lead a team one day.","a":"to","alt":[],"hint":"Sau would like cần một từ trước động từ."},{"s":"In five years' ___, I hope to be a manager.","a":"time","alt":[],"hint":"Cụm 'in five years' ___' = năm năm nữa."},{"s":"I've booked the course. I'm ___ to start in May.","a":"going","alt":[],"hint":"Kế hoạch đã quyết định: be ___ to."},{"s":"We plan ___ hire two new analysts.","a":"to","alt":[],"hint":"plan + ___ + V."},{"s":"She hopes ___ (pass) the exam on the first try.","a":"to pass","alt":[],"hint":"hope + to + V."}],"speak":["Where do you see yourself in five years' time?","I'd like to lead a small analytics team.","I'm going to take a course in machine learning.","I hope to pass it on the first try."],"write":{"vi":"Công ty yêu cầu bạn điền phần 'Career goals' trong mẫu đánh giá hiệu quả công việc. Viết về: điều bạn sẽ làm năm tới, chứng chỉ hoặc khóa học bạn dự định, và bạn muốn ở đâu năm năm nữa.","en":"Your company asks you to fill in the 'Career goals' part of your performance review form. Write about what you are going to do next year, a course or certificate you plan to take, and where you would like to be in five years' time.","min":60},"summary":["be going to + V: kế hoạch đã quyết định.","plan to / hope to + V: dự định / hy vọng; would like to + V: mong muốn lịch sự.","Luôn có 'to' sau would like, plan, hope.","'In five years' time' = năm năm nữa; đừng nói 'after five years'."]},{"id":"x9_3","ch":9,"level":"B1","after":"s_goals","title":"Getting used to it","vi":"Thói quen cũ và việc làm quen với môi trường mới","goals":["Sau bài này bạn có thể nói về thói quen trong quá khứ với used to.","Sau bài này bạn có thể phân biệt used to, be used to và get used to.","Sau bài này bạn có thể kể về những thay đổi khi bắt đầu một công việc mới."],"story":[{"who":"Lan","en":"So, Minh, you've been here for three months now. How's it going?","vi":"Thế nào Minh, em ở đây được ba tháng rồi. Mọi việc ổn chứ?"},{"who":"Minh","en":"Better, thanks. At first, it was hard. I wasn't used to working in English all day.","vi":"Ổn hơn rồi chị ạ. Lúc đầu khó lắm. Em chưa quen làm việc bằng tiếng Anh cả ngày."},{"who":"Lan","en":"I remember that feeling. I used to prepare every sentence before a call.","vi":"Chị nhớ cảm giác đó. Hồi trước chị từng chuẩn bị từng câu một trước mỗi cuộc gọi."},{"who":"Minh","en":"Really? You speak so naturally now.","vi":"Thật ạ? Giờ chị nói tự nhiên lắm mà."},{"who":"Lan","en":"Thanks. I got used to it slowly. Practice is the only secret.","vi":"Cảm ơn em. Chị quen dần thôi. Luyện tập là bí quyết duy nhất."},{"who":"Minh","en":"I'm also getting used to the daily stand-up at 8:30. I used to start work at ten.","vi":"Em cũng đang dần quen với buổi họp đứng hằng ngày lúc 8 giờ 30. Trước đây em toàn bắt đầu làm lúc mười giờ."},{"who":"Lan","en":"Did you use to work from home at your old company?","vi":"Ở công ty cũ em có hay làm việc tại nhà không?"},{"who":"Minh","en":"Yes, I did. I didn't use to wear a shirt at all!","vi":"Có ạ. Hồi đó em chẳng bao giờ mặc sơ mi cả!"},{"who":"Lan","en":"Ha! Well, you'll soon be used to office life.","vi":"Ha! Thôi, em sẽ sớm quen với cuộc sống văn phòng thôi."},{"who":"Minh","en":"I hope so. At least I'm used to the tools now. SQL feels easy.","vi":"Em mong thế. Ít ra giờ em đã quen với các công cụ. SQL thấy dễ rồi."},{"who":"Lan","en":"Great. Next month you'll start client calls. You'll get used to those too.","vi":"Tốt lắm. Tháng sau em sẽ bắt đầu gọi cho khách hàng. Em cũng sẽ quen với việc đó thôi."}],"vocab":[{"w":"used to + V","ipa":"/ˈjuːst tə/","vi":"đã từng (thói quen cũ, nay không còn)","ex":"I used to work at a bank."},{"w":"be used to + V-ing","ipa":"/bi ˈjuːst tə/","vi":"đã quen với","ex":"I'm used to working late."},{"w":"get used to + V-ing","ipa":"/ɡɛt ˈjuːst tə/","vi":"dần quen với","ex":"You'll get used to the noise."},{"w":"at first","ipa":"/æt fɜːrst/","vi":"lúc đầu","ex":"At first, the job was hard."},{"w":"naturally","ipa":"/ˈnætʃərəli/","vi":"một cách tự nhiên","ex":"She speaks very naturally."},{"w":"secret","ipa":"/ˈsiːkrət/","vi":"bí quyết, bí mật","ex":"What's your secret?"},{"w":"stand-up (meeting)","ipa":"/ˈstænd ʌp/","vi":"buổi họp đứng ngắn hằng ngày","ex":"Our stand-up starts at 8:30."},{"w":"role","ipa":"/roʊl/","vi":"vai trò, vị trí công việc","ex":"She is new in her role."}],"grammar":{"t":"Used to, be used to và get used to","d":"Ba cấu trúc nhìn giống nhau nhưng nghĩa khác hẳn. 'Used to + V' nói về thói quen hoặc trạng thái trong quá khứ mà bây giờ không còn. 'Be used to + V-ing' nghĩa là đã quen với việc gì. 'Get used to + V-ing' nghĩa là đang dần quen hoặc sẽ quen. Mẹo: nếu có 'be' hoặc 'get' đứng trước, theo sau là V-ing hoặc danh từ.","formula":["used to + V: thói quen cũ (I used to start work at ten.)","Phủ định / câu hỏi: didn't use to + V / Did you use to + V?","be used to + V-ing / danh từ: đã quen (I'm used to the tools.)","get used to + V-ing / danh từ: dần quen (You'll get used to it.)"],"ex":["I used to prepare every sentence before a call. (bây giờ không còn)","I didn't use to wear a shirt.","I'm not used to working in English all day. (chưa quen)","I'm getting used to the early meetings. (đang quen dần)","You'll soon get used to office life."],"mistakes":[{"wrong":"I used to working in English.","right":"I'm used to working in English.","why":"Muốn nói 'đã quen' phải có 'be' trước 'used to', theo sau là V-ing."},{"wrong":"I'm used to get up early.","right":"I'm used to getting up early.","why":"Sau 'be used to' dùng V-ing, không dùng động từ nguyên mẫu."},{"wrong":"Did you used to work from home?","right":"Did you use to work from home?","why":"Sau 'did' dùng 'use' (không có -d)."}]},"quiz":[{"q":"How long has Minh worked there?","o":["Three weeks","Three years","Three months"],"a":2},{"q":"What did Minh use to do at his old company?","o":["Work from home","Start work at 8:30","Make client calls"],"a":0},{"q":"I'm not ___ to working in English all day.","o":["use","used","using"],"a":1}],"practice":[{"s":"I ___ to work from home, but now I go to the office.","a":"used","alt":[],"hint":"Thói quen cũ, nay không còn."},{"s":"She isn't used to ___ (speak) English all day.","a":"speaking","alt":[],"hint":"Sau be used to dùng V-ing."},{"s":"Don't worry. You'll soon get ___ to it.","a":"used","alt":[],"hint":"get ___ to = dần quen."},{"s":"Did you ___ to work at a bank?","a":"use","alt":[],"hint":"Sau 'did' không thêm -d."},{"s":"I'm getting used to ___ (start) work at 8:30.","a":"starting","alt":[],"hint":"Sau get used to dùng V-ing."}],"speak":["I wasn't used to working in English all day.","I used to prepare every sentence before a call.","I'm getting used to the daily stand-up.","You'll get used to those too."],"write":{"vi":"Một đồng nghiệp mới hỏi bạn về những ngày đầu đi làm. Viết tin nhắn kể: trước đây bạn thường làm gì (used to), lúc đầu bạn chưa quen với điều gì, và bây giờ bạn đã quen với điều gì.","en":"A new colleague asks about your first months at work. Write a message describing what you used to do before, what you weren't used to at first, and what you are used to now.","min":60},"summary":["used to + V: thói quen cũ, nay không còn; phủ định didn't use to.","be used to + V-ing: đã quen với việc gì.","get used to + V-ing: dần quen, sẽ quen.","Có 'be' hoặc 'get' phía trước → theo sau là V-ing hoặc danh từ."]},{"id":"s_if2","ch":9,"level":"B1","title":"If I were the manager…","vi":"Câu điều kiện loại 2","goals":["Sau bài này bạn có thể nói về những tình huống tưởng tượng, không có thật ở hiện tại.","Sau bài này bạn có thể dùng đúng câu điều kiện loại 2 với If I were… và would / could.","Sau bài này bạn có thể đưa ra ý tưởng cải tiến công việc một cách nhẹ nhàng."],"story":[{"who":"Mark","en":"Let's imagine something fun. If you were the CEO for one day, what would you change?","vi":"Thử tưởng tượng một chuyện vui nhé. Nếu các bạn làm giám đốc điều hành một ngày, các bạn sẽ thay đổi gì?"},{"who":"Lan","en":"If I were the CEO, I would give everyone one training day every month.","vi":"Nếu tôi là giám đốc, tôi sẽ cho mọi người một ngày đào tạo mỗi tháng."},{"who":"Minh","en":"Nice. If I had the budget, I'd buy faster laptops for the whole team.","vi":"Hay đấy. Nếu em có ngân sách, em sẽ mua laptop nhanh hơn cho cả nhóm."},{"who":"Mark","en":"Ha! Your laptop isn't that slow, Minh.","vi":"Ha! Laptop của em đâu có chậm đến thế, Minh."},{"who":"Minh","en":"It is! If it were faster, I could finish my reports in half the time.","vi":"Chậm thật mà! Nếu nó nhanh hơn, em có thể làm xong báo cáo trong một nửa thời gian."},{"who":"Lan","en":"What about you, Mark? What would you do?","vi":"Còn anh thì sao, Mark? Anh sẽ làm gì?"},{"who":"Mark","en":"I'd cancel half of our meetings. If we had fewer meetings, we'd have more time for real work.","vi":"Tôi sẽ hủy một nửa số cuộc họp. Nếu ít họp hơn, chúng ta sẽ có nhiều thời gian hơn cho công việc thật."},{"who":"Lan","en":"I agree. And if clients could see our dashboards live, they wouldn't need so many update calls.","vi":"Tôi đồng ý. Và nếu khách hàng có thể xem dashboard trực tiếp, họ sẽ không cần nhiều cuộc gọi cập nhật như vậy."},{"who":"Minh","en":"Would you change the office too?","vi":"Anh có thay đổi cả văn phòng không?"},{"who":"Mark","en":"Definitely. If I could, I'd move us to a building with a view of the river.","vi":"Chắc chắn rồi. Nếu được, tôi sẽ chuyển chúng ta đến một tòa nhà nhìn ra sông."},{"who":"Lan","en":"Let's be realistic. If we wrote these ideas down, maybe the managers would listen.","vi":"Thực tế chút nào. Nếu chúng ta viết những ý tưởng này ra, có lẽ các quản lý sẽ lắng nghe."},{"who":"Mark","en":"Good idea. I'll send them a short list this afternoon.","vi":"Ý hay đấy. Chiều nay tôi sẽ gửi họ một danh sách ngắn."}],"vocab":[{"w":"imagine","ipa":"/ɪˈmædʒɪn/","vi":"tưởng tượng","ex":"Imagine you had more time."},{"w":"CEO","ipa":"/ˌsiː iː ˈoʊ/","vi":"giám đốc điều hành","ex":"The CEO visited our office."},{"w":"training","ipa":"/ˈtreɪnɪŋ/","vi":"sự đào tạo","ex":"We need more training on Python."},{"w":"whole","ipa":"/hoʊl/","vi":"toàn bộ, cả","ex":"The whole team was there."},{"w":"cancel","ipa":"/ˈkænsəl/","vi":"hủy","ex":"They canceled the meeting."},{"w":"live","ipa":"/laɪv/","vi":"trực tiếp, theo thời gian thực","ex":"Clients can see the data live."},{"w":"view","ipa":"/vjuː/","vi":"tầm nhìn, cảnh nhìn ra","ex":"The office has a great view."},{"w":"realistic","ipa":"/ˌriːəˈlɪstɪk/","vi":"thực tế","ex":"Let's set a realistic goal."}],"grammar":{"t":"Câu điều kiện loại 2","d":"Câu điều kiện loại 2 dùng cho tình huống không có thật hoặc khó xảy ra ở hiện tại hay tương lai (tôi không phải giám đốc, nhưng thử tưởng tượng). Mệnh đề 'if' dùng quá khứ đơn, nhưng nghĩa vẫn là hiện tại. Khác với loại 1 (If we launch next month, we will…) là chuyện có thể xảy ra thật.","formula":["If + S + V2/ed (quá khứ đơn), S + would / could + V","Với to be: If I / he / she / it + were…","Câu hỏi: What would you do if + S + V2/ed?"],"ex":["If I were the CEO, I would give everyone a training day.","If I had the budget, I'd buy faster laptops.","If it were faster, I could finish in half the time.","If we had fewer meetings, we'd have more time.","What would you change if you were the manager?"],"mistakes":[{"wrong":"If I am the CEO, I would change it.","right":"If I were the CEO, I would change it.","why":"Loại 2 dùng quá khứ trong mệnh đề if; với 'be' dùng 'were' cho mọi ngôi."},{"wrong":"If I would have more money, I would buy a car.","right":"If I had more money, I would buy a car.","why":"Không dùng 'would' trong mệnh đề 'if'."},{"wrong":"If we have fewer meetings, we would have more time.","right":"If we had fewer meetings, we would have more time.","why":"Hai vế phải khớp: 'would' ở vế sau thì vế 'if' dùng quá khứ."}]},"quiz":[{"q":"What would Lan do if she were the CEO?","o":["Buy new laptops","Give everyone a training day every month","Move the office"],"a":1},{"q":"Why does Minh want a faster laptop?","o":["To finish his reports faster","To play games","To work from home"],"a":0},{"q":"If I ___ more time, I would learn Japanese.","o":["will have","have","had"],"a":2}],"practice":[{"s":"If I ___ the manager, I would change the schedule.","a":"were","alt":["was"],"hint":"Loại 2, động từ 'be' cho mọi ngôi."},{"s":"If we had a bigger budget, we ___ hire more people.","a":"would","alt":["could","'d"],"hint":"would / could + V."},{"s":"If she ___ (know) the answer, she would tell us.","a":"knew","alt":[],"hint":"Quá khứ của know."},{"s":"What ___ you do if you lost your job?","a":"would","alt":[],"hint":"Câu hỏi giả định: What ___ you do…?"},{"s":"If the laptops were faster, we ___ finish earlier.","a":"could","alt":["would"],"hint":"Khả năng giả định."}],"speak":["If I were the CEO, I would give everyone a training day.","If I had the budget, I'd buy faster laptops.","If we had fewer meetings, we'd have more time for real work.","What would you do?"],"write":{"vi":"Quản lý của bạn hỏi: 'If you were the manager of our team for a month, what would you change?' Viết câu trả lời với ít nhất ba thay đổi và lý do, dùng câu điều kiện loại 2.","en":"Your manager asks: 'If you were the manager of our team for a month, what would you change?' Write your answer with at least three changes and the reasons, using the second conditional.","min":60},"summary":["Loại 2 = tình huống tưởng tượng, không có thật ở hiện tại.","If + quá khứ đơn, would / could + V.","Với 'be', dùng 'were' cho mọi ngôi: If I were…","Không bao giờ dùng 'would' trong mệnh đề 'if'."]},{"id":"s_network","ch":9,"level":"B1","title":"At a conference","vi":"Kết nối tại hội thảo","goals":["Sau bài này bạn có thể bắt chuyện với người lạ tại hội thảo một cách tự nhiên.","Sau bài này bạn có thể dùng các câu hỏi gợi chuyện như What brings you here?","Sau bài này bạn có thể kết thúc cuộc trò chuyện và giữ liên lạc sau đó."],"story":[{"who":"Priya","en":"Hi, is this seat free?","vi":"Chào chị, ghế này còn trống không?"},{"who":"Lan","en":"Yes, please sit down. I'm Lan, from DataPeak in Vietnam.","vi":"Còn, mời chị ngồi. Tôi là Lan, ở DataPeak, Việt Nam."},{"who":"Priya","en":"Nice to meet you. I'm Priya. I work for a logistics company in Kuala Lumpur.","vi":"Rất vui được gặp chị. Tôi là Priya. Tôi làm cho một công ty logistics ở Kuala Lumpur."},{"who":"Lan","en":"So, what brings you here?","vi":"Vậy điều gì đưa chị đến đây?"},{"who":"Priya","en":"Mainly the talks on data engineering. How about you?","vi":"Chủ yếu là các bài nói về kỹ thuật dữ liệu. Còn chị?"},{"who":"Lan","en":"Our team is moving to the cloud, so I wanted to learn from other companies.","vi":"Nhóm tôi đang chuyển lên điện toán đám mây, nên tôi muốn học hỏi từ các công ty khác."},{"who":"Priya","en":"Did you enjoy the keynote this morning?","vi":"Chị có thích bài phát biểu chính sáng nay không?"},{"who":"Lan","en":"Yes, I found it really useful. The part about data quality was excellent.","vi":"Có, tôi thấy rất hữu ích. Phần về chất lượng dữ liệu thật xuất sắc."},{"who":"Priya","en":"We've had big data quality problems too. Maybe we could share some ideas.","vi":"Chúng tôi cũng gặp vấn đề lớn về chất lượng dữ liệu. Có lẽ mình có thể chia sẻ ý tưởng với nhau."},{"who":"Lan","en":"I'd love that. Here's my business card. Are you on LinkedIn?","vi":"Tôi rất muốn. Đây là danh thiếp của tôi. Chị có dùng LinkedIn không?"},{"who":"Priya","en":"Yes, I am. I'll send you a connection request tonight.","vi":"Có. Tối nay tôi sẽ gửi chị lời mời kết nối."},{"who":"Lan","en":"Great. Let's keep in touch. I'll follow up next week with our data quality checklist.","vi":"Tuyệt. Mình giữ liên lạc nhé. Tuần sau tôi sẽ gửi tiếp cho chị bảng kiểm tra chất lượng dữ liệu của chúng tôi."},{"who":"Priya","en":"Perfect. It was really nice talking to you.","vi":"Tuyệt quá. Nói chuyện với chị rất vui."}],"vocab":[{"w":"conference","ipa":"/ˈkɑːnfərəns/","vi":"hội thảo, hội nghị","ex":"I'm going to a conference in Singapore."},{"w":"What brings you here?","ipa":"/wʌt brɪŋz juː hɪr/","vi":"Điều gì đưa bạn đến đây?","ex":"So, what brings you here?"},{"w":"logistics","ipa":"/ləˈdʒɪstɪks/","vi":"hậu cần, vận chuyển hàng hóa","ex":"He works in logistics."},{"w":"keynote","ipa":"/ˈkiːnoʊt/","vi":"bài phát biểu chính","ex":"The keynote starts at nine."},{"w":"business card","ipa":"/ˈbɪznəs kɑːrd/","vi":"danh thiếp","ex":"Here's my business card."},{"w":"connection request","ipa":"/kəˈnɛkʃən rɪˈkwɛst/","vi":"lời mời kết nối (trên mạng xã hội)","ex":"I accepted her connection request."},{"w":"keep in touch","ipa":"/kiːp ɪn tʌtʃ/","vi":"giữ liên lạc","ex":"Let's keep in touch."},{"w":"follow up","ipa":"/ˈfɑːloʊ ʌp/","vi":"liên hệ tiếp sau đó","ex":"I'll follow up with an email."}],"grammar":{"t":"Cụm từ kết nối (networking) tại hội thảo","d":"Networking có bốn bước: mở lời, hỏi chuyện, trao thông tin liên lạc và chào kết thúc. Mỗi bước có vài câu cố định mà người bản xứ dùng rất nhiều. Học thuộc nguyên câu sẽ giúp bạn tự tin hơn là tự dịch từ tiếng Việt.","formula":["Mở lời: Is this seat free? / Hi, I don't think we've met. I'm…","Hỏi chuyện: What brings you here? / Did you enjoy the keynote? / What do you think of…?","Giữ liên lạc: Here's my card. / Let's keep in touch. / I'll follow up with an email.","Kết thúc: It was (really) nice talking to you. / Enjoy the rest of the conference."],"ex":["What brings you here? – I'm here for the talks on AI.","Did you enjoy the keynote this morning?","Here's my business card. Are you on LinkedIn?","Let's keep in touch.","Email theo sau: It was great to meet you at the conference yesterday. As promised, I'm attaching…"],"mistakes":[{"wrong":"What brings you come here?","right":"What brings you here?","why":"Câu cố định, không thêm động từ 'come'."},{"wrong":"Let's keep in contact with.","right":"Let's keep in touch.","why":"Cụm cố định là 'keep in touch'; không kết thúc câu bằng 'with'."},{"wrong":"(Lúc chia tay) Nice to meet you!","right":"It was nice talking to you.","why":"'Nice to meet you' dùng lúc mới gặp; khi chia tay nên nói 'It was nice talking to you / meeting you'."}]},"quiz":[{"q":"Where does Priya work?","o":["At a bank in Singapore","At a logistics company in Kuala Lumpur","At DataPeak"],"a":1},{"q":"What will Lan send Priya next week?","o":["A data quality checklist","A job offer","The keynote slides"],"a":0},{"q":"Which is a good way to end a conversation?","o":["What brings you here?","Is this seat free?","It was nice talking to you."],"a":2}],"practice":[{"s":"So, what ___ you here?","a":"brings","alt":[],"hint":"Câu hỏi cố định khi gặp ở hội thảo."},{"s":"Let's keep in ___.","a":"touch","alt":[],"hint":"Giữ liên lạc."},{"s":"It was really nice ___ to you.","a":"talking","alt":["speaking"],"hint":"Câu chào khi chia tay, V-ing."},{"s":"I'll follow ___ with an email next week.","a":"up","alt":[],"hint":"follow ___ = liên hệ tiếp."},{"s":"Here's my business ___.","a":"card","alt":[],"hint":"Danh thiếp."}],"speak":["So, what brings you here?","Did you enjoy the keynote this morning?","Let's keep in touch.","It was really nice talking to you."],"write":{"vi":"Hôm qua bạn gặp một chuyên gia dữ liệu tại hội thảo. Viết email theo sau (follow-up): nhắc lại bạn đã gặp ở đâu và nói chuyện về gì, gửi kèm tài liệu đã hứa và đề nghị giữ liên lạc.","en":"Yesterday you met a data professional at a conference. Write a follow-up email: remind them where you met and what you talked about, attach the document you promised, and suggest keeping in touch.","min":60},"summary":["Mở lời đơn giản: Is this seat free? / I don't think we've met.","Câu hỏi gợi chuyện quen thuộc: What brings you here? Did you enjoy the keynote?","Giữ liên lạc: Here's my card. Let's keep in touch. I'll follow up with an email.","Chia tay: It was nice talking to you, không dùng Nice to meet you."]},{"id":"s_nego","ch":10,"level":"B2","title":"Negotiating a deadline","vi":"Đàm phán thời hạn","goals":["Sau bài này bạn có thể đàm phán thời hạn với khách hàng mà không làm mất lòng họ.","Sau bài này bạn có thể dùng cấu trúc mặc cả có điều kiện: If you can…, we could…","Sau bài này bạn có thể đưa ra đề nghị lịch sự với Would it be possible to…? và What if we…?"],"story":[{"who":"Sofia","en":"Lan, our board meeting is on Friday. We need the new dashboard in three days.","vi":"Lan, cuộc họp hội đồng quản trị của chúng tôi là vào thứ Sáu. Chúng tôi cần dashboard mới trong ba ngày."},{"who":"Lan","en":"I understand the pressure, Sofia. But realistically, the full dashboard would take two weeks.","vi":"Tôi hiểu áp lực của chị, Sofia. Nhưng thực tế mà nói, dashboard đầy đủ sẽ mất hai tuần."},{"who":"Sofia","en":"Two weeks is far too long. Is there any way to speed things up?","vi":"Hai tuần thì quá lâu. Có cách nào làm nhanh hơn không?"},{"who":"Lan","en":"Would it be possible to start with a smaller version? If you can accept three key charts by Friday, we could deliver the rest a week later.","vi":"Liệu có thể bắt đầu bằng một phiên bản nhỏ hơn không? Nếu chị chấp nhận ba biểu đồ chính vào thứ Sáu, chúng tôi có thể giao phần còn lại một tuần sau."},{"who":"Sofia","en":"Which three charts?","vi":"Ba biểu đồ nào?"},{"who":"Lan","en":"Revenue by region, top products and monthly growth. Those are the ones your board looks at most.","vi":"Doanh thu theo khu vực, sản phẩm bán chạy nhất và tăng trưởng hằng tháng. Đó là những biểu đồ hội đồng của chị xem nhiều nhất."},{"who":"Sofia","en":"That might work. But the numbers would need to be fully checked.","vi":"Cách đó có thể được. Nhưng số liệu cần được kiểm tra kỹ hoàn toàn."},{"who":"Lan","en":"Of course. If your team can send us the store data by tomorrow morning, we could finish all the checks by Thursday.","vi":"Tất nhiên. Nếu nhóm của chị gửi dữ liệu cửa hàng trước sáng mai, chúng tôi có thể kiểm tra xong toàn bộ trước thứ Năm."},{"who":"Sofia","en":"I'll make sure they do. And what if we added a fourth chart, on customer returns?","vi":"Tôi sẽ đảm bảo họ gửi. Thế nếu chúng ta thêm biểu đồ thứ tư, về hàng bị trả lại thì sao?"},{"who":"Lan","en":"If we included returns, we'd need an extra day. Would it be possible to move that chart to next week?","vi":"Nếu thêm phần hàng trả lại, chúng tôi sẽ cần thêm một ngày. Có thể dời biểu đồ đó sang tuần sau được không?"},{"who":"Sofia","en":"Fine. So, three charts on Friday, and the complete dashboard by the twenty-fifth.","vi":"Được. Vậy ba biểu đồ vào thứ Sáu, và dashboard hoàn chỉnh trước ngày hai mươi lăm."},{"who":"Lan","en":"Exactly. I'll send you a written summary of what we agreed within the hour.","vi":"Chính xác. Trong vòng một giờ tôi sẽ gửi chị bản tóm tắt bằng văn bản những gì chúng ta đã thống nhất."}],"vocab":[{"w":"board meeting","ipa":"/bɔːrd ˈmiːtɪŋ/","vi":"cuộc họp hội đồng quản trị","ex":"The board meeting is on Friday."},{"w":"pressure","ipa":"/ˈprɛʃər/","vi":"áp lực","ex":"The team is under a lot of pressure."},{"w":"realistically","ipa":"/ˌriːəˈlɪstɪkli/","vi":"thực tế mà nói","ex":"Realistically, we need two weeks."},{"w":"speed up","ipa":"/spiːd ʌp/","vi":"tăng tốc, làm nhanh hơn","ex":"Can we speed up the process?"},{"w":"version","ipa":"/ˈvɜːrʒən/","vi":"phiên bản","ex":"Let's start with a simple version."},{"w":"key","ipa":"/kiː/","vi":"chính, quan trọng nhất","ex":"These are our key numbers."},{"w":"returns","ipa":"/rɪˈtɜːrnz/","vi":"hàng bị trả lại","ex":"Returns rose after the holidays."},{"w":"within","ipa":"/wɪˈðɪn/","vi":"trong vòng","ex":"I'll reply within the hour."}],"grammar":{"t":"Mặc cả có điều kiện khi đàm phán","d":"Trong đàm phán, đừng chỉ nói 'không'. Hãy đổi điều kiện lấy nhượng bộ: 'nếu bên anh làm X, bên tôi có thể làm Y'. Dùng 'could' và 'would' thay cho 'can' và 'will' để lời đề nghị mềm hơn, nghe như đang thăm dò chứ không ép buộc. 'Would it be possible to…?' là cách xin một điều rất lịch sự.","formula":["If you can + V, we could + V (đề nghị trao đổi có thật)","If you / we + V2/ed, we would / could + V (thăm dò, mềm hơn)","Would it be possible to + V? (đề nghị lịch sự)","What if we + V2/ed…? (gợi ý một phương án)"],"ex":["If you can accept three charts by Friday, we could deliver the rest next week.","If you sent the data today, we could start tomorrow.","Would it be possible to move the deadline to Monday?","What if we added a fourth chart?","So với: 'Give us two weeks.' (quá cứng) → 'Would it be possible to have two weeks?'"],"mistakes":[{"wrong":"Would it be possible to moving the deadline?","right":"Would it be possible to move the deadline?","why":"Sau 'to' dùng động từ nguyên mẫu."},{"wrong":"If you can send the data, we could to finish by Friday.","right":"If you can send the data, we could finish by Friday.","why":"Sau 'could' là động từ nguyên mẫu không 'to'."},{"wrong":"You must give us two weeks.","right":"Would it be possible to have two weeks?","why":"'Must' nghe như ra lệnh với khách hàng; dùng câu hỏi lịch sự."}]},"quiz":[{"q":"Why does Sofia need the dashboard quickly?","o":["For a new store opening","For a press release","For a board meeting on Friday"],"a":2},{"q":"What must Sofia's team send by tomorrow morning?","o":["The budget","The store data","A fourth chart"],"a":1},{"q":"Which is the most polite way to ask for more time?","o":["Would it be possible to extend the deadline?","Give us more time.","We need more time, OK?"],"a":0}],"practice":[{"s":"Would it be possible ___ move the meeting to Monday?","a":"to","alt":[],"hint":"Would it be possible + ___ + V."},{"s":"If you can send the data today, we ___ finish by Friday.","a":"could","alt":["can"],"hint":"Đề nghị mềm: ___ + V."},{"s":"If you ___ (give) us one more week, we could add the returns chart.","a":"gave","alt":["could give"],"hint":"Thăm dò: quá khứ đơn trong vế if."},{"s":"What ___ we started with a smaller version?","a":"if","alt":[],"hint":"Gợi ý phương án: What ___ we…?"},{"s":"Would it be ___ to get the files by noon?","a":"possible","alt":[],"hint":"Would it be ___ to…?"}],"speak":["Is there any way to speed things up?","Would it be possible to start with a smaller version?","If you can accept three key charts by Friday, we could deliver the rest a week later.","What if we added a fourth chart?"],"write":{"vi":"Khách hàng muốn nhận báo cáo phân tích trong 5 ngày, nhưng bạn cần 3 tuần. Viết email đàm phán: thể hiện bạn hiểu áp lực của họ, đề xuất giao một phần trước, đặt điều kiện cho phía họ (ví dụ gửi dữ liệu sớm) và chốt mốc thời gian mới.","en":"Your client wants an analysis report in five days, but you need three weeks. Write a negotiation email: show that you understand their pressure, offer to deliver part of the work first, set a condition for their side (for example, sending data early) and confirm the new dates.","min":100},"summary":["Đổi điều kiện lấy nhượng bộ: If you can…, we could…","Dùng could / would để đề nghị mềm mỏng hơn can / will.","Would it be possible to + V? là cách xin rất lịch sự.","What if we + quá khứ đơn…? để gợi ý phương án; luôn chốt lại bằng văn bản."]},{"id":"x10_1","ch":10,"level":"B2","after":"s_nego","title":"What we really need is…","vi":"Chuẩn bị đàm phán và nhấn mạnh ưu tiên","goals":["Sau bài này bạn có thể xác định ưu tiên và giới hạn của mình trước một buổi đàm phán.","Sau bài này bạn có thể dùng câu chẻ với What… để nhấn mạnh điều quan trọng nhất.","Sau bài này bạn có thể phân biệt điều bắt buộc phải có và điều có thì tốt."],"story":[{"who":"Mark","en":"Before we meet Sofia tomorrow, let's get our priorities clear.","vi":"Trước khi gặp Sofia ngày mai, mình làm rõ các ưu tiên đã."},{"who":"Lan","en":"Agreed. What matters most to us is the monthly price. We can't go below eight thousand dollars.","vi":"Đồng ý. Điều quan trọng nhất với chúng ta là giá hằng tháng. Chúng ta không thể xuống dưới tám nghìn đô."},{"who":"Mark","en":"Right. That's our walk-away point. What about the timeline?","vi":"Đúng. Đó là điểm dừng của chúng ta. Còn tiến độ thì sao?"},{"who":"Lan","en":"The timeline is flexible. What we really need is access to their raw sales data.","vi":"Tiến độ thì linh hoạt. Cái chúng ta thực sự cần là quyền truy cập dữ liệu bán hàng thô của họ."},{"who":"Mark","en":"Good point. Without the data, the model is useless.","vi":"Ý hay. Không có dữ liệu thì mô hình vô dụng."},{"who":"Lan","en":"Exactly. So data access is a must-have, and weekly calls are a nice-to-have.","vi":"Chính xác. Vậy quyền truy cập dữ liệu là bắt buộc, còn các cuộc gọi hằng tuần là có thì tốt."},{"who":"Mark","en":"And what do you think Sofia wants?","vi":"Thế em nghĩ Sofia muốn gì?"},{"who":"Lan","en":"What she cares about most is speed. Her board wants results before the summer.","vi":"Điều chị ấy quan tâm nhất là tốc độ. Hội đồng của chị ấy muốn có kết quả trước mùa hè."},{"who":"Mark","en":"Then speed is our strongest card.","vi":"Vậy tốc độ là lá bài mạnh nhất của chúng ta."},{"who":"Lan","en":"True. The thing we should avoid is offering a discount too early.","vi":"Đúng. Điều chúng ta nên tránh là giảm giá quá sớm."},{"who":"Mark","en":"Yes. What I'd suggest is that we listen first and make our offer second.","vi":"Phải. Anh đề nghị là mình lắng nghe trước, rồi mới đưa ra đề xuất."},{"who":"Lan","en":"Sounds like a plan. I'll prepare a one-page summary of our position tonight.","vi":"Nghe được đấy. Tối nay em sẽ soạn bản tóm tắt một trang về lập trường của chúng ta."}],"vocab":[{"w":"priority","ipa":"/praɪˈɔːrəti/","vi":"ưu tiên","ex":"Data access is our top priority."},{"w":"walk-away point","ipa":"/ˈwɔːk əˌweɪ pɔɪnt/","vi":"điểm dừng (mức tối thiểu chấp nhận được)","ex":"Eight thousand is our walk-away point."},{"w":"flexible","ipa":"/ˈflɛksəbəl/","vi":"linh hoạt","ex":"Our timeline is flexible."},{"w":"raw data","ipa":"/rɔː ˈdeɪtə/","vi":"dữ liệu thô","ex":"We need the raw data, not a summary."},{"w":"useless","ipa":"/ˈjuːsləs/","vi":"vô dụng","ex":"The model is useless without data."},{"w":"must-have","ipa":"/ˈmʌst hæv/","vi":"điều bắt buộc phải có","ex":"Security is a must-have."},{"w":"nice-to-have","ipa":"/ˈnaɪs tə hæv/","vi":"điều có thì tốt, không bắt buộc","ex":"Weekly calls are a nice-to-have."},{"w":"discount","ipa":"/ˈdɪskaʊnt/","vi":"sự giảm giá","ex":"They asked for a ten percent discount."}],"grammar":{"t":"Câu chẻ với What… để nhấn mạnh","d":"Thay vì nói 'We need the data', người bản xứ hay nói 'What we need is the data' để đưa thông tin quan trọng nhất về cuối câu, nơi người nghe chú ý nhất. Cấu trúc này rất hữu ích khi đàm phán, thuyết trình hay viết email cần nhấn mạnh ưu tiên.","formula":["What + S + V + is / was + danh từ / (that) mệnh đề / to V","What matters (most) / What counts + is + danh từ","The thing (that) + S + V + is + …"],"ex":["We need access to the data. → What we need is access to the data.","What matters most is the price.","What she cares about most is speed.","The thing we should avoid is a quick discount.","What I'd suggest is that we listen first."],"mistakes":[{"wrong":"What we need it is the data.","right":"What we need is the data.","why":"Không thêm 'it'; mệnh đề 'What we need' đã là chủ ngữ."},{"wrong":"The thing what we need is more time.","right":"The thing (that) we need is more time.","why":"Sau 'the thing' dùng 'that' hoặc bỏ trống, không dùng 'what'."},{"wrong":"What matter most is the price.","right":"What matters most is the price.","why":"'What' làm chủ ngữ số ít → động từ thêm -s."}]},"quiz":[{"q":"What is the lowest monthly price Lan and Mark can accept?","o":["$6,000","$10,000","$8,000"],"a":2},{"q":"What does Sofia care about most?","o":["Speed","A discount","Weekly calls"],"a":0},{"q":"Choose the correct sentence.","o":["What we need it is more time.","What we need is more time.","The thing what we need is more time."],"a":1}],"practice":[{"s":"___ we really need is access to the raw data.","a":"What","alt":[],"hint":"Câu chẻ bắt đầu bằng từ để hỏi nào?"},{"s":"What matters most to us ___ the price.","a":"is","alt":[],"hint":"Động từ 'be' số ít nối hai phần."},{"s":"The thing ___ we should avoid is a quick discount.","a":"that","alt":[],"hint":"Từ nối sau 'the thing' (không dùng 'what')."},{"s":"What she ___ (care) about most is speed.","a":"cares","alt":[],"hint":"Chủ ngữ she → động từ thêm -s."},{"s":"What I'd suggest ___ that we listen first.","a":"is","alt":[],"hint":"Nối hai phần câu chẻ."}],"speak":["What matters most to us is the monthly price.","What we really need is access to their raw sales data.","The thing we should avoid is offering a discount too early.","What I'd suggest is that we listen first."],"write":{"vi":"Ngày mai bạn đàm phán hợp đồng với một khách hàng mới. Viết email cho quản lý tóm tắt lập trường của nhóm: điều quan trọng nhất, mức giá tối thiểu, điều bắt buộc phải có, điều có thì tốt, và điều cần tránh. Dùng ít nhất ba câu chẻ với What… hoặc The thing….","en":"Tomorrow you will negotiate a contract with a new client. Write an email to your manager summarizing your team's position: what matters most, your walk-away price, the must-haves, the nice-to-haves and what to avoid. Use at least three cleft sentences with What… or The thing….","min":100},"summary":["Trước khi đàm phán: xác định ưu tiên, điểm dừng, điều bắt buộc và điều có thì tốt.","Câu chẻ What + S + V + is… đưa ý quan trọng nhất về cuối câu.","What matters most is… / The thing we should avoid is…","Không thêm 'it' sau mệnh đề What; sau 'the thing' dùng 'that', không dùng 'what'."]},{"id":"s_terms","ch":10,"level":"B2","title":"Price and terms","vi":"Đề xuất và nhượng bộ","goals":["Sau bài này bạn có thể từ chối một mức giá một cách lịch sự với I'm afraid….","Sau bài này bạn có thể nhượng bộ có điều kiện với we'd be willing to… và in return.","Sau bài này bạn có thể đề nghị thỏa hiệp và chốt thỏa thuận."],"story":[{"who":"Sofia","en":"We've reviewed your proposal. To be honest, ten thousand dollars a month is more than we planned.","vi":"Chúng tôi đã xem đề xuất của các anh chị. Thật lòng mà nói, mười nghìn đô một tháng cao hơn dự tính của chúng tôi."},{"who":"Mark","en":"I understand. What figure did you have in mind?","vi":"Tôi hiểu. Chị đã nghĩ đến con số nào?"},{"who":"Sofia","en":"Something closer to seven thousand.","vi":"Khoảng gần bảy nghìn."},{"who":"Lan","en":"I'm afraid we can't go that low. The project includes daily data checks and a forecasting model.","vi":"Tôi e là chúng tôi không thể xuống thấp như vậy. Dự án bao gồm kiểm tra dữ liệu hằng ngày và một mô hình dự báo."},{"who":"Sofia","en":"Could you reduce the scope to bring the price down?","vi":"Các anh chị có thể thu hẹp phạm vi để giảm giá không?"},{"who":"Mark","en":"We'd be willing to drop the weekly training sessions. That would bring it down to nine thousand.","vi":"Chúng tôi sẵn sàng bỏ các buổi đào tạo hằng tuần. Như vậy giá sẽ còn chín nghìn."},{"who":"Sofia","en":"That's still a bit high. What if we signed a two-year contract instead of one?","vi":"Vẫn hơi cao. Nếu chúng tôi ký hợp đồng hai năm thay vì một năm thì sao?"},{"who":"Lan","en":"In that case, we'd be willing to offer eight and a half. In return, we'd need access to your raw data from day one.","vi":"Nếu vậy, chúng tôi sẵn sàng đưa ra mức tám nghìn rưỡi. Đổi lại, chúng tôi cần quyền truy cập dữ liệu thô của chị ngay từ ngày đầu."},{"who":"Sofia","en":"Eight and a half is close. Could we meet halfway? Let's say eight thousand.","vi":"Tám nghìn rưỡi là gần rồi. Hai bên nhường nhau một chút được không? Chẳng hạn tám nghìn."},{"who":"Mark","en":"I'm afraid eight is too low for the full scope. But at eight and a half, we could add a free review every quarter.","vi":"Tôi e là tám nghìn quá thấp cho toàn bộ phạm vi công việc. Nhưng ở mức tám nghìn rưỡi, chúng tôi có thể thêm một buổi đánh giá miễn phí mỗi quý."},{"who":"Sofia","en":"A free review every quarter… All right. That's a deal.","vi":"Một buổi đánh giá miễn phí mỗi quý… Được rồi. Thỏa thuận thế nhé."},{"who":"Lan","en":"Wonderful. We'll send you the updated contract by Monday.","vi":"Tuyệt vời. Chúng tôi sẽ gửi chị hợp đồng cập nhật trước thứ Hai."}],"vocab":[{"w":"proposal","ipa":"/prəˈpoʊzəl/","vi":"bản đề xuất","ex":"We sent them a proposal last week."},{"w":"figure","ipa":"/ˈfɪɡjər/","vi":"con số","ex":"What figure did you have in mind?"},{"w":"scope","ipa":"/skoʊp/","vi":"phạm vi (công việc, dự án)","ex":"Let's reduce the scope of the project."},{"w":"forecasting","ipa":"/ˈfɔːrkæstɪŋ/","vi":"dự báo","ex":"We built a forecasting model."},{"w":"drop","ipa":"/drɑːp/","vi":"bỏ, loại bỏ","ex":"We can drop the training sessions."},{"w":"in return","ipa":"/ɪn rɪˈtɜːrn/","vi":"đổi lại","ex":"In return, we need the data early."},{"w":"meet halfway","ipa":"/miːt ˌhæfˈweɪ/","vi":"thỏa hiệp, mỗi bên nhường một nửa","ex":"Could we meet halfway?"},{"w":"That's a deal.","ipa":"/ðæts ə diːl/","vi":"Thỏa thuận vậy nhé, chốt.","ex":"OK, that's a deal."}],"grammar":{"t":"Từ chối, nhượng bộ và chốt thỏa thuận","d":"Đàm phán giá có ba bước: từ chối mềm (không nói thẳng 'No'), nhượng bộ có điều kiện (cho đi một thứ, đòi lại một thứ) và chốt. 'I'm afraid…' giúp lời từ chối bớt nặng nề. 'We'd be willing to…' cho thấy bạn sẵn lòng nhượng bộ, và 'In return…' nói ngay điều bạn cần đổi lại.","formula":["Từ chối mềm: I'm afraid + S + can't / won't + V…","Nhượng bộ: We'd be willing to + V… In return, we'd need + danh từ / to V…","Thỏa hiệp: Could we meet halfway? / What if we + V2/ed…?","Chốt: That's a deal. / We have a deal."],"ex":["I'm afraid we can't go that low.","We'd be willing to drop the training sessions.","In return, we'd need access to your data.","In return for a two-year contract, we could offer a lower price.","Could we meet halfway? – That's a deal."],"mistakes":[{"wrong":"We'd be willing to dropping the training.","right":"We'd be willing to drop the training.","why":"'Willing to' + động từ nguyên mẫu."},{"wrong":"I'm afraid of we can't accept that.","right":"I'm afraid we can't accept that.","why":"'Afraid of' là 'sợ cái gì'; ở đây 'I'm afraid' chỉ để làm mềm lời từ chối."},{"wrong":"In return of a longer contract…","right":"In return for a longer contract…","why":"Cụm đúng là 'in return for'."}]},"quiz":[{"q":"What price did Sofia first suggest?","o":["About $7,000","$8,500","$10,000"],"a":0},{"q":"What did Sofia offer in exchange for a lower price?","o":["Faster payment","A two-year contract","More data"],"a":1},{"q":"Which sentence makes a concession?","o":["I'm afraid not.","That's too expensive.","We'd be willing to drop the training."],"a":2}],"practice":[{"s":"I'm ___ we can't accept that price.","a":"afraid","alt":[],"hint":"Làm mềm lời từ chối."},{"s":"We'd be willing ___ offer a small discount.","a":"to","alt":[],"hint":"willing ___ + V."},{"s":"In ___, we'd need a two-year contract.","a":"return","alt":[],"hint":"Đổi lại."},{"s":"Could we meet ___ at eight thousand?","a":"halfway","alt":[],"hint":"Mỗi bên nhường một nửa."},{"s":"OK, eight and a half with a free review. That's a ___.","a":"deal","alt":[],"hint":"Chốt thỏa thuận."}],"speak":["What figure did you have in mind?","I'm afraid we can't go that low.","In return, we'd need access to your raw data from day one.","Could we meet halfway?"],"write":{"vi":"Khách hàng đề nghị giảm giá dự án 30%. Viết email phản hồi: từ chối mức giảm đó một cách lịch sự, đưa ra một mức nhượng bộ nhỏ hơn, nói rõ điều bạn cần đổi lại, và đề nghị một bước tiếp theo để chốt.","en":"Your client asks for a 30% discount on the project. Write a reply: politely refuse that discount, offer a smaller concession, say clearly what you need in return, and suggest a next step to close the deal.","min":100},"summary":["Từ chối mềm: I'm afraid we can't…","Nhượng bộ có điều kiện: We'd be willing to… In return, we'd need…","Thỏa hiệp: Could we meet halfway? Chốt: That's a deal.","Luôn đổi một nhượng bộ lấy một lợi ích, đừng cho không."]},{"id":"x10_2","ch":10,"level":"B2","after":"s_terms","title":"Just to confirm…","vi":"Xác nhận thỏa thuận bằng câu hỏi đuôi","goals":["Sau bài này bạn có thể xác nhận lại chi tiết của một thỏa thuận qua điện thoại.","Sau bài này bạn có thể đặt câu hỏi đuôi đúng với nhiều thì khác nhau.","Sau bài này bạn có thể dùng các cụm Just to confirm…, Let me make sure I've got this right…."],"story":[{"who":"Lan","en":"Hi Sofia. I'd just like to confirm a few details before we send the contract.","vi":"Chào chị Sofia. Tôi muốn xác nhận vài chi tiết trước khi gửi hợp đồng."},{"who":"Sofia","en":"Of course. Go ahead.","vi":"Tất nhiên. Chị cứ nói."},{"who":"Lan","en":"The price is eight and a half thousand a month, isn't it?","vi":"Giá là tám nghìn rưỡi một tháng, phải không ạ?"},{"who":"Sofia","en":"Yes, that's right. And it's a two-year contract.","vi":"Đúng vậy. Và là hợp đồng hai năm."},{"who":"Lan","en":"Great. And the quarterly reviews are free, aren't they?","vi":"Tốt quá. Và các buổi đánh giá hằng quý là miễn phí, đúng không?"},{"who":"Sofia","en":"Correct. You'll run them in person, won't you?","vi":"Chính xác. Các chị sẽ đến làm trực tiếp, phải không?"},{"who":"Lan","en":"We will. Let me make sure I've got this right: you'll give us access to the raw data from day one.","vi":"Vâng. Để tôi chắc là mình hiểu đúng: chị sẽ cho chúng tôi truy cập dữ liệu thô từ ngày đầu tiên."},{"who":"Sofia","en":"Yes, although our IT team needs a few days to create your accounts.","vi":"Đúng, dù nhóm IT của chúng tôi cần vài ngày để tạo tài khoản cho các chị."},{"who":"Lan","en":"That's fine. We can still start on the first of next month, can't we?","vi":"Không sao. Chúng ta vẫn có thể bắt đầu vào mùng một tháng sau, phải không?"},{"who":"Sofia","en":"Hmm, that's a little tight. Let's say the eighth, just to be safe.","vi":"Hừm, hơi gấp. Cứ để ngày mùng tám cho chắc."},{"who":"Lan","en":"The eighth works. So, just to confirm: we start on the eighth, and the first report is due two weeks later.","vi":"Mùng tám được ạ. Vậy xác nhận lại: chúng ta bắt đầu ngày mùng tám, và báo cáo đầu tiên đến hạn hai tuần sau đó."},{"who":"Sofia","en":"Exactly. The weekly training isn't included anymore, is it?","vi":"Chính xác. Các buổi đào tạo hằng tuần không còn trong gói nữa, phải không?"},{"who":"Lan","en":"No, it isn't. We dropped it to reduce the price. I'll put everything in writing today.","vi":"Không còn ạ. Chúng tôi đã bỏ nó để giảm giá. Hôm nay tôi sẽ ghi tất cả thành văn bản."}],"vocab":[{"w":"confirm","ipa":"/kənˈfɜːrm/","vi":"xác nhận","ex":"I'd like to confirm the date."},{"w":"Go ahead.","ipa":"/ɡoʊ əˈhɛd/","vi":"Cứ nói / làm đi.","ex":"Can I ask a question? – Sure, go ahead."},{"w":"in person","ipa":"/ɪn ˈpɜːrsən/","vi":"trực tiếp, gặp mặt","ex":"Let's discuss it in person."},{"w":"tight","ipa":"/taɪt/","vi":"gấp, sát (thời gian)","ex":"The schedule is very tight."},{"w":"just to be safe","ipa":"/dʒʌst tə bi seɪf/","vi":"cho chắc ăn","ex":"Let's add one day, just to be safe."},{"w":"due","ipa":"/duː/","vi":"đến hạn","ex":"The report is due on Friday."},{"w":"include","ipa":"/ɪnˈkluːd/","vi":"bao gồm","ex":"Training is not included in the price."},{"w":"put in writing","ipa":"/pʊt ɪn ˈraɪtɪŋ/","vi":"ghi thành văn bản","ex":"Please put the offer in writing."}],"grammar":{"t":"Câu hỏi đuôi để xác nhận thông tin","d":"Câu hỏi đuôi giống 'phải không?', 'đúng không?' trong tiếng Việt. Nhưng tiếng Anh không có một đuôi chung: đuôi phải dùng đúng trợ động từ của câu chính và đổi dấu (câu khẳng định → đuôi phủ định, câu phủ định → đuôi khẳng định). Xuống giọng ở đuôi khi bạn chỉ muốn xác nhận; lên giọng khi bạn thật sự không chắc.","formula":["Câu khẳng định, + trợ động từ phủ định + đại từ? (The price is fixed, isn't it?)","Câu phủ định, + trợ động từ khẳng định + đại từ? (Training isn't included, is it?)","Trợ động từ theo thì: is / are, do / does / did, have / has, will → won't, can → can't"],"ex":["The reviews are free, aren't they?","You signed the contract, didn't you?","You'll run them in person, won't you?","We can start next month, can't we?","Mở đầu xác nhận: Just to confirm… / Let me make sure I've got this right…"],"mistakes":[{"wrong":"The price is fixed, is it?","right":"The price is fixed, isn't it?","why":"Câu chính khẳng định thì đuôi phải phủ định."},{"wrong":"You sent the file, isn't it?","right":"You sent the file, didn't you?","why":"Không dùng 'isn't it' cho mọi câu như 'phải không'; đuôi theo trợ động từ (quá khứ → did) và theo chủ ngữ (you)."},{"wrong":"We can start Monday, don't we?","right":"We can start Monday, can't we?","why":"Câu có 'can' thì đuôi dùng 'can't'."}]},"quiz":[{"q":"How long is the contract?","o":["One year","Two years","Three years"],"a":1},{"q":"When will the project start?","o":["On the eighth","On the first","In two weeks"],"a":0},{"q":"You'll send the contract today, ___?","o":["isn't it","don't you","won't you"],"a":2}],"practice":[{"s":"The price is eight and a half thousand, ___ it?","a":"isn't","alt":[],"hint":"Câu khẳng định với is → đuôi phủ định."},{"s":"You signed the contract, ___ you?","a":"didn't","alt":[],"hint":"Quá khứ đơn → trợ động từ did, phủ định."},{"s":"The training isn't included, ___ it?","a":"is","alt":[],"hint":"Câu phủ định → đuôi khẳng định."},{"s":"We can start next month, ___ we?","a":"can't","alt":[],"hint":"Câu có can → đuôi ___."},{"s":"You'll run the reviews in person, ___ you?","a":"won't","alt":["will not"],"hint":"will → đuôi phủ định."}],"speak":["I'd just like to confirm a few details.","The price is eight and a half thousand a month, isn't it?","Let me make sure I've got this right.","So, just to confirm: we start on the eighth."],"write":{"vi":"Sau cuộc gọi chốt hợp đồng, viết email xác nhận cho khách hàng: liệt kê giá, thời hạn hợp đồng, ngày bắt đầu, những gì có và không có trong gói, và đề nghị họ phản hồi nếu có điểm nào chưa đúng.","en":"After the call to close the deal, write a confirmation email to the client: list the price, the contract length, the start date, what is and is not included, and ask them to reply if anything is not correct.","min":100},"summary":["Câu hỏi đuôi = 'phải không?', nhưng phải dùng đúng trợ động từ của câu chính.","Câu khẳng định → đuôi phủ định; câu phủ định → đuôi khẳng định.","Đừng dùng 'isn't it' cho mọi câu.","Mở đầu xác nhận: Just to confirm… / Let me make sure I've got this right…, rồi luôn ghi lại bằng văn bản."]},{"id":"s_persuade","ch":10,"level":"B2","title":"Persuading with data","vi":"Thuyết phục bằng số liệu","goals":["Sau bài này bạn có thể dùng số liệu để thuyết phục lãnh đạo đầu tư cho một đề xuất.","Sau bài này bạn có thể dùng The evidence suggests…, not only… but also… và do / did nhấn mạnh.","Sau bài này bạn có thể dùng câu hỏi tu từ để làm lập luận mạnh hơn."],"story":[{"who":"Lan","en":"Thank you for your time. I'd like to show you why data quality deserves real investment.","vi":"Cảm ơn anh chị đã dành thời gian. Tôi muốn trình bày vì sao chất lượng dữ liệu đáng được đầu tư thật sự."},{"who":"Hoa","en":"We do care about data quality, Lan. But our budget is limited this year.","vi":"Chúng tôi thật sự quan tâm đến chất lượng dữ liệu, Lan. Nhưng năm nay ngân sách có hạn."},{"who":"Lan","en":"I understand. But how much is bad data costing us right now? Last quarter, we found errors in eighteen percent of our client reports, and fixing them took about four hundred hours.","vi":"Tôi hiểu. Nhưng ngay lúc này dữ liệu kém đang làm chúng ta tốn bao nhiêu? Quý trước, chúng ta phát hiện lỗi trong mười tám phần trăm báo cáo gửi khách hàng, và sửa chúng mất khoảng bốn trăm giờ."},{"who":"Daniel","en":"That's more than two months of one analyst's time.","vi":"Như vậy là hơn hai th
