' dùng Whose.","formula":["Người + 's + vật: Minh's phone, Sofia's keys · Danh từ số nhiều có sẵn s: thêm ' (the clients' files)","Hỏi: Whose + danh từ + is this / are these? → It's Minh's. / They're Sofia's.","Đại từ sở hữu (đứng một mình, KHÔNG có danh từ sau): mine, yours, his, hers, ours, theirs","So sánh: This is my phone. = This phone is mine."],"ex":["Whose phone is this? – It's Minh's.","Whose keys are these? – They're Sofia's.","Is this umbrella yours? – No, it's ours.","my → mine, your → yours, his → his, her → hers, our → ours, their → theirs","Who's = Who is (Who's Sofia?) · Whose = của ai (Whose bag is this?)"],"mistakes":[{"wrong":"the phone of Minh","right":"Minh's phone","why":"Với người, tiếng Anh dùng 's, không dịch từng chữ 'điện thoại của Minh'."},{"wrong":"It's my. / This is mine phone.","right":"It's mine. / This is my phone.","why":"my đi với danh từ phía sau; mine đứng một mình."},{"wrong":"Who's phone is this?","right":"Whose phone is this?","why":"Who's là viết tắt của Who is; 'của ai' phải là Whose (hai từ đọc giống nhau)."}]},"quiz":[{"q":"Where is Mark's phone?","o":["In his bag","On the table","In the kitchen"],"a":0},{"q":"Whose keys are they?","o":["Minh's","Lan's","Sofia's"],"a":2},{"q":"Is this your pen? – Yes, it's ___.","o":["my","mine","me"],"a":1}],"practice":[{"s":"___ phone is this?","a":"Whose","alt":[],"hint":"Của ai"},{"s":"This is ___ laptop. (của Minh)","a":"Minh's","alt":[],"hint":"Tên người + 's"},{"s":"It isn't your bag. It's ___. (của tôi)","a":"mine","alt":[],"hint":"Đại từ sở hữu, đứng một mình"},{"s":"These keys are Sofia's. They're ___.","a":"hers","alt":[],"hint":"Của cô ấy, đứng một mình"},{"s":"This umbrella is for our team. It's ___.","a":"ours","alt":[],"hint":"Của chúng tôi, đứng một mình"}],"speak":["Whose phone is this?","Is it yours?","No, it isn't mine.","They're Sofia's keys."],"write":{"vi":"Sau cuộc họp, có vài món đồ bị bỏ quên trong phòng họp. Viết tin nhắn vào nhóm chat của đội: mô tả các món đồ và hỏi chúng là của ai.","en":"After a meeting, some things are left in the meeting room. Write a message to the team chat: describe the things and ask whose they are.","min":20},"summary":["Hỏi 'của ai': Whose + danh từ + is this / are these?","Người + 's + vật: Minh's phone, Sofia's keys.","my phone = mine; your → yours, her → hers, our → ours, their → theirs.","Whose (của ai) khác Who's (= Who is)."]},{"id":"x3_1","ch":3,"level":"A1","after":"u4","title":"Does Mark work on Saturdays?","vi":"Hiện tại đơn: câu phủ định và câu hỏi với DOES","goals":["Sau bài này bạn có thể nói một người KHÔNG làm gì bằng doesn't + động từ nguyên mẫu.","Sau bài này bạn có thể hỏi về thói quen của đồng nghiệp bằng Does he / Does she…?","Sau bài này bạn có thể trả lời ngắn gọn: Yes, he does. / No, she doesn't."],"story":[{"who":"Minh","en":"Lan, does Mark start work at eight?","vi":"Chị Lan ơi, anh Mark bắt đầu làm lúc tám giờ phải không?"},{"who":"Lan","en":"No, he doesn't. He starts at nine.","vi":"Không. Anh ấy bắt đầu lúc chín giờ."},{"who":"Minh","en":"Does he work from home on Fridays?","vi":"Thứ Sáu anh ấy có làm việc ở nhà không?"},{"who":"Lan","en":"Yes, he does. He doesn't come to the office.","vi":"Có. Anh ấy không lên văn phòng."},{"who":"Minh","en":"And you? Do you work on weekends?","vi":"Còn chị? Chị có làm vào cuối tuần không?"},{"who":"Lan","en":"No, I don't. Nobody here works on weekends.","vi":"Không. Ở đây không ai làm vào cuối tuần cả."},{"who":"Minh","en":"Does the team meet every day?","vi":"Cả nhóm có họp mỗi ngày không?"},{"who":"Lan","en":"No, it doesn't. We meet on Mondays and Thursdays.","vi":"Không. Nhóm họp vào thứ Hai và thứ Năm."},{"who":"Minh","en":"What time does the Monday meeting start?","vi":"Cuộc họp thứ Hai bắt đầu lúc mấy giờ?"},{"who":"Lan","en":"At nine thirty. Don't be late. Mark doesn't like that!","vi":"Lúc chín giờ rưỡi. Đừng đến muộn nhé. Anh Mark không thích vậy đâu!"}],"vocab":[{"w":"start work","ipa":"/stɑːrt wɝːk/","vi":"bắt đầu làm việc","ex":"He starts work at nine."},{"w":"work from home","ipa":"/wɝːk frəm hoʊm/","vi":"làm việc ở nhà","ex":"Mark works from home on Fridays."},{"w":"come to the office","ipa":"/kʌm tə ði ˈɔːfɪs/","vi":"lên văn phòng","ex":"She doesn't come to the office on Fridays."},{"w":"weekend","ipa":"/ˈwiːkend/","vi":"cuối tuần","ex":"I don't work on weekends."},{"w":"nobody","ipa":"/ˈnoʊbɑːdi/","vi":"không ai","ex":"Nobody works on Sundays."},{"w":"meet","ipa":"/miːt/","vi":"gặp, họp","ex":"We meet on Mondays."},{"w":"every day","ipa":"/ˈevri deɪ/","vi":"mỗi ngày","ex":"Does the team meet every day?"},{"w":"be late","ipa":"/bi leɪt/","vi":"đến muộn","ex":"Don't be late for the meeting."}],"grammar":{"t":"Hiện tại đơn: phủ định và câu hỏi với DOES / DOESN'T","d":"Với he, she, it (Mark, Lan, the team), câu phủ định dùng doesn't và câu hỏi dùng Does. Khi đã có does hay doesn't thì động từ chính quay về dạng nguyên mẫu, KHÔNG thêm -s nữa, vì chữ s đã nằm trong does. Với I, you, we, they thì dùng don't và Do như bình thường.","formula":["Phủ định: He / She / It + doesn't + V nguyên mẫu (He doesn't work on Saturdays.)","Câu hỏi: Does + he / she / it + V nguyên mẫu? (Does she work from home?)","Trả lời ngắn: Yes, he does. / No, he doesn't.","Với I / you / we / they: don't + V và Do + S + V? (I don't work. Do you work?)"],"ex":["Mark starts at nine. → Mark doesn't start at eight.","Lan works on Mondays. → Does Lan work on Mondays? → Yes, she does.","The team doesn't meet every day.","Có từ để hỏi: What time does the meeting start? / Where does Mark work on Fridays?","doesn't = does not (nói và viết thân mật dùng doesn't)"],"mistakes":[{"wrong":"He doesn't works on Saturdays.","right":"He doesn't work on Saturdays.","why":"Đã có doesn't (chứa -s) thì động từ chính để nguyên mẫu, không thêm -s."},{"wrong":"Does she works from home?","right":"Does she work from home?","why":"Câu hỏi có Does thì động từ chính cũng để nguyên mẫu."},{"wrong":"She don't work on weekends.","right":"She doesn't work on weekends.","why":"Với he / she / it phải dùng doesn't, không dùng don't."}]},"quiz":[{"q":"What time does Mark start work?","o":["At eight","At nine","At nine thirty"],"a":1},{"q":"When does the team meet?","o":["Every day","On Fridays","On Mondays and Thursdays"],"a":2},{"q":"Mark ___ work on Saturdays.","o":["doesn't","don't","not"],"a":0}],"practice":[{"s":"___ Lan use Python every day?","a":"Does","alt":[],"hint":"Chủ ngữ là Lan (she) → câu hỏi dùng Does."},{"s":"Mark ___ come to the office on Fridays.","a":"doesn't","alt":["does not"],"hint":"Phủ định với he → doesn't + động từ nguyên mẫu."},{"s":"Does she work late? — No, she ___.","a":"doesn't","alt":["does not"],"hint":"Trả lời ngắn phủ định: No, she …"},{"s":"What time ___ the meeting start?","a":"does","alt":[],"hint":"the meeting = it → What time does…?"},{"s":"I ___ work on weekends.","a":"don't","alt":["do not"],"hint":"Chủ ngữ là I → dùng don't, không dùng doesn't."}],"speak":["Does he work from home on Fridays?","Yes, he does. He doesn't come to the office.","Nobody here works on weekends.","What time does the Monday meeting start?"],"write":{"vi":"Một đồng nghiệp mới hỏi về thói quen làm việc của trưởng nhóm bạn. Viết 4–5 câu: anh/chị ấy làm gì và KHÔNG làm gì (dùng does / doesn't).","en":"A new colleague asks about your team leader's working habits. Write 4–5 sentences about what he or she does and doesn't do.","min":30},"summary":["He / she / it: phủ định dùng doesn't + động từ nguyên mẫu (He doesn't work).","Câu hỏi: Does + he / she / it + động từ nguyên mẫu? (Does she work…?)","Đã có does / doesn't thì KHÔNG thêm -s vào động từ chính.","Trả lời ngắn: Yes, he does. / No, she doesn't."]},{"id":"s_wh","ch":3,"level":"A1","title":"Asking the right questions","vi":"Câu hỏi Wh-","goals":["Sau bài này bạn có thể dùng đúng 8 từ để hỏi: who, what, where, when, why, how, how many, how much.","Sau bài này bạn có thể đặt câu hỏi đúng thứ tự: từ để hỏi + do/does/is/are + chủ ngữ.","Sau bài này bạn có thể hỏi khách hàng để hiểu quy trình làm việc và dữ liệu của họ."],"story":[{"who":"Lan","en":"Sofia, can I ask some questions about your sales?","vi":"Sofia, tôi hỏi vài câu về doanh số bên bà được không?"},{"who":"Sofia","en":"Of course. What do you want to know?","vi":"Tất nhiên. Chị muốn biết điều gì?"},{"who":"Lan","en":"Who enters the sales data, and how?","vi":"Ai nhập dữ liệu bán hàng, và nhập bằng cách nào?"},{"who":"Sofia","en":"Our store managers. They use an online form.","vi":"Các quản lý cửa hàng của chúng tôi. Họ dùng một biểu mẫu trực tuyến."},{"who":"Lan","en":"When do they send it? Where do you keep it?","vi":"Khi nào họ gửi? Bà lưu dữ liệu ở đâu?"},{"who":"Sofia","en":"Every evening. We keep it in one Excel file.","vi":"Mỗi tối. Chúng tôi lưu tất cả trong một file Excel."},{"who":"Lan","en":"How many stores do you have? How much data is there?","vi":"Bên bà có bao nhiêu cửa hàng? Có bao nhiêu dữ liệu?"},{"who":"Sofia","en":"Forty-two stores, and about two million rows.","vi":"Bốn mươi hai cửa hàng, và khoảng hai triệu dòng."},{"who":"Sofia","en":"The file is very slow. Why is that?","vi":"File chạy rất chậm. Tại sao vậy?"},{"who":"Lan","en":"Because Excel is slow with very big files.","vi":"Vì Excel chạy chậm với những file rất lớn."}],"vocab":[{"w":"process","ipa":"/ˈprɑːses/","vi":"quy trình","ex":"Can you explain your sales process?"},{"w":"enter","ipa":"/ˈentər/","vi":"nhập (dữ liệu)","ex":"Who enters the data?"},{"w":"store manager","ipa":"/stɔːr ˈmænɪdʒər/","vi":"quản lý cửa hàng","ex":"Our store managers send the numbers."},{"w":"online form","ipa":"/ˌɑːnˈlaɪn fɔːrm/","vi":"biểu mẫu trực tuyến","ex":"They use an online form."},{"w":"keep","ipa":"/kiːp/","vi":"giữ, lưu","ex":"Where do you keep the data?"},{"w":"million","ipa":"/ˈmɪljən/","vi":"triệu","ex":"two million rows"},{"w":"row","ipa":"/roʊ/","vi":"dòng (trong bảng)","ex":"The file has two million rows."},{"w":"because","ipa":"/bɪˈkɔːz/","vi":"bởi vì","ex":"It's slow because the file is big."}],"grammar":{"t":"Câu hỏi Wh- (câu hỏi có từ để hỏi)","d":"Câu hỏi Wh- dùng để hỏi thông tin, nên câu trả lời không phải Yes/No. Người Việt hay giữ nguyên thứ tự câu khẳng định (Where you keep…?), nhưng tiếng Anh phải đặt do/does hoặc am/is/are NGAY SAU từ để hỏi. Riêng khi hỏi Who làm việc gì (Who là chủ ngữ) thì không cần do/does.","formula":["Với động từ thường: Wh- + do/does + S + V nguyên mẫu? (When do they send it?)","Với TO BE: Wh- + am/is/are + S? (Where is the file? Why is it slow?)","Who làm chủ ngữ: Who + V(s)…? (Who enters the data?), không dùng do/does","How many + danh từ số nhiều? (How many stores?) · How much + danh từ không đếm được? (How much data?)"],"ex":["Who = ai · What = cái gì · Where = ở đâu · When = khi nào","Why = tại sao (trả lời bằng Because…) · How = như thế nào, bằng cách nào","How many = bao nhiêu (đếm được): How many reports do you write?","How much = bao nhiêu (không đếm được): How much data do you have?","What time does the meeting start? (What time = mấy giờ)"],"mistakes":[{"wrong":"Where you keep the data?","right":"Where do you keep the data?","why":"Thiếu trợ động từ: sau từ để hỏi phải có do/does (hoặc is/are)."},{"wrong":"Who does enter the data?","right":"Who enters the data?","why":"Khi Who là người làm hành động (chủ ngữ), không dùng does; động từ thêm -s."},{"wrong":"How many data do you have?","right":"How much data do you have?","why":"Data là danh từ không đếm được nên dùng How much."}]},"quiz":[{"q":"Who enters the sales data?","o":["Sofia","The store managers","Lan"],"a":1},{"q":"How many stores does BrightMart have?","o":["Twenty-four","Two million","Forty-two"],"a":2},{"q":"___ do they send the data? — Every evening.","o":["When","Who","How many"],"a":0}],"practice":[{"s":"___ do you live? — In Hanoi.","a":"Where","alt":[],"hint":"Hỏi nơi chốn."},{"s":"___ is your manager? — Mark is.","a":"Who","alt":[],"hint":"Hỏi người."},{"s":"How ___ reports do you write every week?","a":"many","alt":[],"hint":"reports là danh từ đếm được, số nhiều."},{"s":"___ do you use Excel? — Because it's easy.","a":"Why","alt":[],"hint":"Câu trả lời bắt đầu bằng Because → hỏi lý do."},{"s":"___ time does the meeting start?","a":"What","alt":[],"hint":"Hỏi giờ: … time?"}],"speak":["Who enters the sales data, and how?","When do they send it? Where do you keep it?","How many stores do you have?","How much data is there?"],"write":{"vi":"Bạn sắp làm dự án cho một khách hàng mới. Viết 6 câu hỏi Wh- để hỏi về dữ liệu của họ (ai nhập, lưu ở đâu, bao nhiêu dòng, khi nào cập nhật…).","en":"You are starting a project with a new client. Write six Wh- questions about their data: who enters it, where they keep it, how much there is, when they update it.","min":30},"summary":["8 từ để hỏi: who, what, where, when, why, how, how many, how much.","Thứ tự: Wh- + do/does (hoặc am/is/are) + chủ ngữ + động từ.","Who làm chủ ngữ thì không dùng do/does: Who enters the data?","How many + danh từ đếm được số nhiều; How much + danh từ không đếm được."]},{"id":"x3_2","ch":3,"level":"A1","after":"u5","title":"Send it to them","vi":"Đại từ tân ngữ: me, you, him, her, it, us, them","goals":["Sau bài này bạn có thể dùng đúng 7 đại từ tân ngữ: me, you, him, her, it, us, them.","Sau bài này bạn có thể phân biệt he / him và she / her khi nói về đồng nghiệp.","Sau bài này bạn có thể nói ai gửi gì cho ai: send it to them, call him, help me."],"story":[{"who":"Mark","en":"Lan, do you have the March report?","vi":"Lan, chị có báo cáo tháng Ba chưa?"},{"who":"Lan","en":"Yes. I can send it to you now.","vi":"Có rồi. Tôi có thể gửi nó cho anh ngay."},{"who":"Mark","en":"Thanks. Please send it to Sofia, too.","vi":"Cảm ơn. Gửi cho Sofia nữa nhé."},{"who":"Lan","en":"Sure. I can email her this morning.","vi":"Vâng. Sáng nay tôi sẽ email cho bà ấy."},{"who":"Mark","en":"Her two assistants need it, too. Send it to them.","vi":"Hai trợ lý của bà ấy cũng cần. Gửi cho họ luôn nhé."},{"who":"Lan","en":"OK. What about Tom? Does he need a copy?","vi":"Được. Còn Tom thì sao? Anh ấy có cần một bản không?"},{"who":"Mark","en":"Yes. Please call him and explain the charts.","vi":"Có. Chị gọi cho anh ấy và giải thích các biểu đồ nhé."},{"who":"Lan","en":"No problem. Can you check the charts for me first?","vi":"Không vấn đề gì. Anh kiểm tra các biểu đồ giúp tôi trước được không?"},{"who":"Mark","en":"Of course. Give them to me before lunch.","vi":"Tất nhiên. Đưa chúng cho tôi trước bữa trưa nhé."},{"who":"Lan","en":"Great. And if the client has questions, they can call us.","vi":"Tốt quá. Và nếu khách có câu hỏi, họ có thể gọi cho chúng ta."}],"vocab":[{"w":"copy","ipa":"/ˈkɑːpi/","vi":"bản (sao)","ex":"Does he need a copy?"},{"w":"assistant","ipa":"/əˈsɪstənt/","vi":"trợ lý","ex":"Her assistants need the file."},{"w":"email (verb)","ipa":"/ˈiːmeɪl/","vi":"gửi email cho ai","ex":"I can email her today."},{"w":"call","ipa":"/kɔːl/","vi":"gọi điện","ex":"Please call him after lunch."},{"w":"explain","ipa":"/ɪkˈspleɪn/","vi":"giải thích","ex":"Can you explain the charts?"},{"w":"chart","ipa":"/tʃɑːrt/","vi":"biểu đồ","ex":"The report has five charts."},{"w":"give","ipa":"/ɡɪv/","vi":"đưa, cho","ex":"Give them to me, please."},{"w":"first","ipa":"/fɝːst/","vi":"trước, trước tiên","ex":"Check the numbers first."}],"grammar":{"t":"Đại từ tân ngữ (object pronouns)","d":"Đại từ tân ngữ là từ chỉ người hoặc vật NHẬN hành động, đứng sau động từ hoặc sau giới từ (to, for, with). Tiếng Việt chỉ có một từ \"anh ấy\", nhưng tiếng Anh có hai dạng: he làm chủ ngữ (đứng đầu câu), him làm tân ngữ (đứng sau động từ). Người Việt cũng hay bỏ mất tân ngữ (I send you.), trong khi tiếng Anh phải nói rõ gửi CÁI GÌ.","formula":["Chủ ngữ → tân ngữ: I → me · you → you · he → him · she → her · it → it · we → us · they → them","Sau động từ: call him, help me, email her, check it","Sau giới từ: to them, for me, with us","Gửi / đưa: send + vật + to + người (send it to them) hoặc send + người + vật (send them the file)"],"ex":["He needs the report. → Please send it to him.","She is busy. → I can email her later.","The charts are ready. → Can you check them?","We have a question. → Can you call us?","Phân biệt: Her assistants (của bà ấy, tính từ sở hữu) và email her (cho bà ấy, tân ngữ)"],"mistakes":[{"wrong":"Please call he after lunch.","right":"Please call him after lunch.","why":"Sau động từ phải dùng dạng tân ngữ: him, không dùng he."},{"wrong":"Send the file to they.","right":"Send the file to them.","why":"Sau giới từ to dùng them."},{"wrong":"I can send you now.","right":"I can send it to you now.","why":"Phải nói rõ gửi cái gì (it); tiếng Anh không được bỏ tân ngữ như tiếng Việt."}]},"quiz":[{"q":"Who does Lan call about the charts?","o":["Sofia","Tom","The assistants"],"a":1},{"q":"What does Mark check for Lan?","o":["The charts","The emails","The sales file"],"a":0},{"q":"Please send the file to ___.","o":["their","they","them"],"a":2}],"practice":[{"s":"Mark needs the report. Please send it to ___.","a":"him","alt":[],"hint":"Mark = he → dạng tân ngữ?"},{"s":"Sofia is on the phone. Can you talk to ___?","a":"her","alt":[],"hint":"Sofia = she → dạng tân ngữ?"},{"s":"I don't understand this chart. Can you help ___?","a":"me","alt":[],"hint":"I → dạng tân ngữ?"},{"s":"The files are ready. I can email ___ now.","a":"them","alt":[],"hint":"the files = they → dạng tân ngữ?"},{"s":"We are in the office today. Can you call ___?","a":"us","alt":[],"hint":"we → dạng tân ngữ?"}],"speak":["I can send it to you now.","Her two assistants need it, too. Send it to them.","Please call him and explain the charts.","Can you check the charts for me first?"],"write":{"vi":"Viết tin nhắn ngắn cho đồng nghiệp: nói ai cần file nào, nhờ họ gửi cho ai và gọi cho ai. Dùng ít nhất 4 đại từ tân ngữ (me, him, her, them, us…).","en":"Write a short message to a colleague: say who needs which file, and ask them to send it to someone and call someone. Use at least four object pronouns.","min":30},"summary":["Tân ngữ đứng sau động từ hoặc sau giới từ: call him, send it to them.","I → me, he → him, she → her, we → us, they → them; you và it giữ nguyên.","Đừng bỏ tân ngữ: I can send IT to you, không nói I can send you.","Her có hai nghĩa: của cô ấy (her assistants) và cô ấy làm tân ngữ (email her)."]},{"id":"s_canteen","ch":3,"level":"A1","title":"In the canteen","vi":"Danh từ đếm được, không đếm được","goals":["Sau bài này bạn có thể phân biệt danh từ đếm được (egg, sandwich) và không đếm được (rice, water, data).","Sau bài này bạn có thể dùng some, any và a lot of đúng trong câu khẳng định, phủ định và câu hỏi.","Sau bài này bạn có thể hỏi số lượng bằng How many và How much."],"story":[{"who":"Mark","en":"What's for lunch today, Lan?","vi":"Hôm nay ăn trưa có gì vậy Lan?"},{"who":"Lan","en":"There's some chicken, rice and a lot of vegetables.","vi":"Có ít thịt gà, cơm và rất nhiều rau."},{"who":"Mark","en":"Are there any sandwiches?","vi":"Có bánh mì kẹp không?"},{"who":"Lan","en":"No, there aren't any. But there are some eggs.","vi":"Không, không có cái nào. Nhưng có trứng."},{"who":"Mark","en":"OK. Rice, chicken and two eggs, please.","vi":"Được. Cho tôi cơm, gà và hai quả trứng."},{"who":"Cashier","en":"Sure. Do you want any coffee?","vi":"Vâng. Anh có muốn lấy cà phê không?"},{"who":"Mark","en":"Yes, a cup of coffee, please. No sugar.","vi":"Có, cho tôi một tách cà phê. Không đường."},{"who":"Lan","en":"And a cup of tea for me, with some milk.","vi":"Còn tôi một tách trà, thêm chút sữa."},{"who":"Mark","en":"How many cups of coffee do you drink a day?","vi":"Mỗi ngày chị uống mấy tách cà phê?"},{"who":"Lan","en":"Only one. But I drink a lot of water.","vi":"Chỉ một thôi. Nhưng tôi uống rất nhiều nước."}],"vocab":[{"w":"rice","ipa":"/raɪs/","vi":"cơm, gạo (không đếm được)","ex":"I'd like some rice."},{"w":"vegetables","ipa":"/ˈvedʒtəbəlz/","vi":"rau (số nhiều)","ex":"There are a lot of vegetables."},{"w":"sandwich","ipa":"/ˈsænwɪtʃ/","vi":"bánh mì kẹp","ex":"Are there any sandwiches?"},{"w":"egg","ipa":"/eɡ/","vi":"quả trứng","ex":"Two eggs, please."},{"w":"a cup of","ipa":"/ə kʌp əv/","vi":"một tách, một cốc","ex":"a cup of coffee"},{"w":"sugar","ipa":"/ˈʃʊɡər/","vi":"đường","ex":"No sugar, please."},{"w":"milk","ipa":"/mɪlk/","vi":"sữa","ex":"Tea with some milk."},{"w":"a lot of","ipa":"/ə lɑːt əv/","vi":"nhiều","ex":"I drink a lot of water."}],"grammar":{"t":"Danh từ đếm được và không đếm được; SOME / ANY / A LOT OF; HOW MANY / HOW MUCH","d":"Danh từ đếm được là thứ đếm từng cái: an egg, two eggs. Danh từ không đếm được là thứ không đếm từng cái, như chất lỏng, chất bột hay khái niệm: water, rice, sugar, money, data, information. Danh từ không đếm được không có a/an và không thêm -s; muốn đếm thì dùng đơn vị: a cup of coffee, a bottle of water.","formula":["Đếm được: a/an + danh từ số ít · số + danh từ -s (an egg, two eggs)","Không đếm được: không a/an, không -s (rice, water, sugar, data)","Khẳng định: some / a lot of + danh từ · Phủ định và câu hỏi: any + danh từ","How many + danh từ đếm được số nhiều? · How much + danh từ không đếm được?"],"ex":["There are some eggs. / There's some rice.","There aren't any sandwiches. / Is there any milk?","I drink a lot of water. / She writes a lot of reports.","How many eggs do you want? / How much sugar do you want?","Mời lịch sự thì vẫn dùng some: Would you like some coffee?"],"mistakes":[{"wrong":"I'd like a rice, please.","right":"I'd like some rice, please.","why":"Rice không đếm được nên không đi với a/an."},{"wrong":"There aren't some sandwiches.","right":"There aren't any sandwiches.","why":"Câu phủ định dùng any, không dùng some."},{"wrong":"How many water do you drink?","right":"How much water do you drink?","why":"Water không đếm được nên hỏi How much."}]},"quiz":[{"q":"Are there any sandwiches today?","o":["Yes, a lot","No, there aren't","Only two"],"a":1},{"q":"What does Mark drink?","o":["Tea with milk","Water","Coffee with no sugar"],"a":2},{"q":"How ___ water do you drink a day?","o":["many","much","any"],"a":1}],"practice":[{"s":"Is there ___ milk for my tea?","a":"any","alt":[],"hint":"Câu hỏi → dùng any."},{"s":"There are ___ eggs on the counter.","a":"some","alt":["a lot of"],"hint":"Câu khẳng định, số nhiều."},{"s":"How ___ cups of coffee do you drink?","a":"many","alt":[],"hint":"cups đếm được, số nhiều."},{"s":"How ___ rice do you want?","a":"much","alt":[],"hint":"rice không đếm được."},{"s":"We don't have ___ sugar today.","a":"any","alt":[],"hint":"Câu phủ định → dùng any."}],"speak":["There's some chicken, rice and a lot of vegetables.","Are there any sandwiches?","A cup of coffee, please. No sugar.","How many cups of coffee do you drink a day?"],"write":{"vi":"Nhóm bạn đặt đồ ăn trưa cho buổi họp. Viết tin nhắn cho bộ phận hành chính: cần gì, bao nhiêu, và hỏi họ còn những gì. Dùng some, any, a lot of, How many hoặc How much.","en":"Your team is ordering lunch for a meeting. Write a message to the office manager: say what you need and how much, and ask what they have. Use some, any, a lot of, and How many or How much.","min":30},"summary":["Đếm được: an egg, two eggs. Không đếm được: rice, water, sugar, data (không a/an, không -s).","Some và a lot of dùng trong câu khẳng định; any dùng trong câu phủ định và câu hỏi.","How many + danh từ số nhiều; How much + danh từ không đếm được.","Muốn đếm thứ không đếm được, dùng đơn vị: a cup of coffee, a bottle of water."]},{"id":"x3_3","ch":3,"level":"A1","after":"u14","title":"My to-do list","vi":"NEED TO / WANT TO + động từ: nói việc cần làm","goals":["Sau bài này bạn có thể nói việc mình cần làm hôm nay bằng need to + động từ.","Sau bài này bạn có thể nói điều mình muốn làm bằng want to + động từ, và phân biệt want + danh từ.","Sau bài này bạn có thể hỏi đồng nghiệp: Do you need to…? / Does she want to…?"],"story":[{"who":"Mark","en":"Good morning, Lan. What's on your list today?","vi":"Chào buổi sáng, Lan. Hôm nay danh sách việc của chị có gì?"},{"who":"Lan","en":"I need to finish the sales dashboard.","vi":"Tôi cần làm xong bảng điều khiển doanh số."},{"who":"Lan","en":"I also need to update the customer data.","vi":"Tôi cũng cần cập nhật dữ liệu khách hàng."},{"who":"Mark","en":"Do you need to call Sofia today?","vi":"Hôm nay chị có cần gọi cho Sofia không?"},{"who":"Lan","en":"No, I don't. I can email her.","vi":"Không cần. Tôi có thể email cho bà ấy."},{"who":"Mark","en":"OK. I want to show the dashboard on Friday.","vi":"Được. Tôi muốn trình bày bảng điều khiển vào thứ Sáu."},{"who":"Lan","en":"No problem. Do you want to see it on Thursday?","vi":"Không vấn đề gì. Anh có muốn xem nó vào thứ Năm không?"},{"who":"Mark","en":"Yes, please. I want to check the numbers first.","vi":"Có. Tôi muốn kiểm tra số liệu trước."},{"who":"Lan","en":"Then I need to start now!","vi":"Vậy tôi phải bắt đầu ngay thôi!"},{"who":"Mark","en":"Good idea. But do you want a coffee first?","vi":"Ý hay đấy. Nhưng chị có muốn một ly cà phê trước không?"}],"vocab":[{"w":"to-do list","ipa":"/təˈduː lɪst/","vi":"danh sách việc cần làm","ex":"My to-do list is long today."},{"w":"need to","ipa":"/niːd tə/","vi":"cần (làm gì)","ex":"I need to finish the report."},{"w":"want to","ipa":"/wɑːnt tə/","vi":"muốn (làm gì)","ex":"I want to check the numbers."},{"w":"dashboard","ipa":"/ˈdæʃbɔːrd/","vi":"bảng điều khiển (báo cáo trực quan)","ex":"The sales dashboard is ready."},{"w":"update","ipa":"/ˌʌpˈdeɪt/","vi":"cập nhật","ex":"I need to update the data."},{"w":"customer","ipa":"/ˈkʌstəmər/","vi":"khách hàng (người mua)","ex":"customer data"},{"w":"show","ipa":"/ʃoʊ/","vi":"cho xem, trình bày","ex":"I want to show the chart to Sofia."},{"w":"also","ipa":"/ˈɔːlsoʊ/","vi":"cũng","ex":"I also need to call Mark."}],"grammar":{"t":"NEED TO / WANT TO + động từ nguyên mẫu","d":"Need to = cần làm gì; want to = muốn làm gì. Sau need và want, nếu là một hành động thì phải có TO rồi đến động từ nguyên mẫu. Nếu là một đồ vật thì không có to: I want a coffee. Với he / she nhớ thêm -s vào need và want, còn phủ định và câu hỏi dùng don't / doesn't / do / does như hiện tại đơn.","formula":["Khẳng định: S + need(s) to / want(s) to + V nguyên mẫu (She needs to update the data.)","Phủ định: S + don't / doesn't + need to / want to + V (I don't need to call her.)","Câu hỏi: Do / Does + S + need to / want to + V? (Do you want to see it?)","Want + danh từ (I want a coffee) ≠ want to + động từ (I want to check it)"],"ex":["I need to finish the dashboard today.","Mark wants to show it on Friday.","Lan doesn't need to call Sofia.","Does he want to see the numbers? → Yes, he does.","Với khách hàng, I'd like to (đã học) lịch sự hơn I want to: I'd like to show you the dashboard."],"mistakes":[{"wrong":"I need finish the report.","right":"I need to finish the report.","why":"Sau need (cần làm gì) phải có to trước động từ."},{"wrong":"She need to call him.","right":"She needs to call him.","why":"Chủ ngữ she → need thêm -s."},{"wrong":"I want to checking the data.","right":"I want to check the data.","why":"Sau to là động từ nguyên mẫu, không thêm -ing."}]},"quiz":[{"q":"What does Lan need to finish?","o":["An email","The sales dashboard","The meeting notes"],"a":1},{"q":"When does Mark want to see the dashboard?","o":["On Thursday","On Friday","On Monday"],"a":0},{"q":"She ___ to update the data today.","o":["needing","need","needs"],"a":2}],"practice":[{"s":"I need ___ finish the dashboard today.","a":"to","alt":[],"hint":"need + ___ + động từ."},{"s":"Lan ___ to update the customer data.","a":"needs","alt":[],"hint":"Chủ ngữ là Lan (she) → thêm -s."},{"s":"Do you ___ to see the numbers first?","a":"want","alt":["need"],"hint":"Hỏi ai đó có muốn làm gì không."},{"s":"Mark doesn't ___ to work late on Friday.","a":"want","alt":["need"],"hint":"Sau doesn't dùng động từ nguyên mẫu."},{"s":"___ she need to send the report today?","a":"Does","alt":[],"hint":"Câu hỏi với she."}],"speak":["I need to finish the sales dashboard.","I also need to update the customer data.","Do you want to see it on Thursday?","I want to check the numbers first."],"write":{"vi":"Viết danh sách việc của bạn hôm nay thành một tin nhắn gửi trưởng nhóm: 3 việc cần làm (need to), 1 việc không cần làm (don't need to), và 1 điều bạn muốn làm (want to).","en":"Write your to-do list for today as a message to your manager: three things you need to do, one thing you don't need to do, and one thing you want to do.","min":30},"summary":["Need to + động từ = cần làm gì; want to + động từ = muốn làm gì.","Want + đồ vật thì không có to: I want a coffee.","He / she: needs to, wants to · phủ định: doesn't need to · câu hỏi: Does she want to…?","Với khách hàng, dùng I'd like to cho lịch sự hơn I want to."]},{"id":"x4_1","ch":4,"level":"A1","after":"u6","title":"Can I take a message?","vi":"Nhận và để lại lời nhắn qua điện thoại","goals":["Sau bài này bạn có thể nghe máy, hỏi ai đang gọi và nói người kia đang vắng.","Sau bài này bạn có thể nhận lời nhắn (Can I take a message?) và để lại lời nhắn.","Sau bài này bạn có thể nhờ người khác gọi lại: Could you ask him to call me back?"],"story":[{"who":"Minh","en":"Good morning, DataPeak. Minh speaking.","vi":"Chào buổi sáng, DataPeak đây. Minh nghe."},{"who":"Sofia","en":"Hi. Can I speak to Lan, please?","vi":"Chào anh. Cho tôi nói chuyện với Lan được không?"},{"who":"Minh","en":"Sure. Who's calling, please?","vi":"Vâng. Xin hỏi ai đang gọi ạ?"},{"who":"Sofia","en":"This is Sofia Ortiz from BrightMart.","vi":"Tôi là Sofia Ortiz từ BrightMart."},{"who":"Minh","en":"Sorry, Lan is in a meeting. Can I take a message?","vi":"Xin lỗi, chị Lan đang họp. Tôi nhận lời nhắn giúp được không ạ?"},{"who":"Sofia","en":"Yes, please. Could you ask her to call me back?","vi":"Vâng, phiền anh. Anh nhắn cô ấy gọi lại cho tôi được không?"},{"who":"Minh","en":"Of course. Does she have your number?","vi":"Dạ được. Chị ấy có số của bà chưa ạ?"},{"who":"Sofia","en":"Yes, she does. It's about the March report. It's urgent.","vi":"Có rồi. Chuyện về báo cáo tháng Ba. Việc gấp."},{"who":"Minh","en":"Her meeting ends at eleven. I can tell her then.","vi":"Cuộc họp của chị ấy kết thúc lúc mười một giờ. Lúc đó tôi sẽ báo chị ấy."},{"who":"Sofia","en":"Thank you, Minh. Goodbye.","vi":"Cảm ơn anh Minh. Chào anh."}],"vocab":[{"w":"speak to","ipa":"/spiːk tuː/","vi":"nói chuyện với (qua điện thoại)","ex":"Can I speak to Lan, please?"},{"w":"Who's calling?","ipa":"/huːz ˈkɔːlɪŋ/","vi":"Ai đang gọi vậy?","ex":"Who's calling, please?"},{"w":"in a meeting","ipa":"/ɪn ə ˈmiːtɪŋ/","vi":"đang họp","ex":"Sorry, she's in a meeting."},{"w":"take a message","ipa":"/teɪk ə ˈmesɪdʒ/","vi":"nhận lời nhắn","ex":"Can I take a message?"},{"w":"leave a message","ipa":"/liːv ə ˈmesɪdʒ/","vi":"để lại lời nhắn","ex":"Can I leave a message?"},{"w":"call back","ipa":"/kɔːl bæk/","vi":"gọi lại","ex":"Could you ask him to call me back?"},{"w":"urgent","ipa":"/ˈɝːdʒənt/","vi":"gấp, khẩn","ex":"It's urgent."},{"w":"end","ipa":"/end/","vi":"kết thúc","ex":"The meeting ends at eleven."}],"grammar":{"t":"Nhận và để lại lời nhắn: ASK + người + TO + động từ","d":"Khi người được gọi vắng mặt, người nghe máy sẽ hỏi Can I take a message? (nhận lời nhắn), còn người gọi có thể nói Can I leave a message? (để lại lời nhắn). Để nhờ chuyển lời, dùng mẫu ask + người + to + động từ: Could you ask her to call me back? Người cần nhắn ở dạng tân ngữ (him, her, them).","formula":["Hỏi gặp ai: Can I speak to + tên, please? · Hỏi người gọi: Who's calling, please?","Người vắng: Sorry, he/she is in a meeting / isn't here / is out of the office.","Nhận lời nhắn: Can I take a message? · Để lại lời nhắn: Can I leave a message?","Nhờ chuyển lời: Could you ask + him/her + to + V? (Could you ask him to call me back?)"],"ex":["Can I speak to Mark, please? — Sorry, he isn't here.","Could you ask her to call me back?","Could you ask him to send me the file?","Could you tell her that it's urgent?","Người gọi lại sau: That's OK. I can call back later."],"mistakes":[{"wrong":"Can I meet Lan?","right":"Can I speak to Lan, please?","why":"Trên điện thoại không \"gặp\" (meet) mà \"nói chuyện\" (speak to)."},{"wrong":"Could you tell her call me?","right":"Could you ask her to call me back?","why":"Mẫu đúng là ask + người + to + động từ; thiếu to là sai."},{"wrong":"Who are you?","right":"Who's calling, please?","why":"Who are you? nghe rất cộc; khi nghe máy hãy hỏi Who's calling, please?"}]},"quiz":[{"q":"Why can't Lan answer the phone?","o":["She's at lunch","She's in a meeting","She's at home"],"a":1},{"q":"What does Sofia want?","o":["Lan to call her back","A new report","Lan's email address"],"a":0},{"q":"Could you ask him ___ me back?","o":["calling","call","to call"],"a":2}],"practice":[{"s":"Can I ___ to Mr. Lee, please?","a":"speak","alt":["talk"],"hint":"Hỏi được nói chuyện với ai."},{"s":"Who's ___, please?","a":"calling","alt":[],"hint":"Hỏi ai đang gọi."},{"s":"Sorry, he isn't here. Can I take a ___?","a":"message","alt":[],"hint":"Nhận lời nhắn."},{"s":"Could you ask her to call me ___?","a":"back","alt":[],"hint":"Gọi lại = call …"},{"s":"Could you ask him ___ send me the file?","a":"to","alt":[],"hint":"ask + người + ___ + động từ."}],"speak":["Can I speak to Lan, please?","Who's calling, please?","Sorry, she's in a meeting. Can I take a message?","Could you ask her to call me back?"],"write":{"vi":"Bạn nhận cuộc gọi cho đồng nghiệp đang họp. Viết lời nhắn ngắn để lại cho người đó: ai gọi, gọi về việc gì, có gấp không, và họ muốn được gọi lại hay không.","en":"You took a call for a colleague who is in a meeting. Write a short message for them: who called, what it is about, if it is urgent, and what the caller wants.","min":30},"summary":["Hỏi gặp ai qua điện thoại: Can I speak to…, please? · Hỏi người gọi: Who's calling, please?","Người nghe máy: Can I take a message? · Người gọi: Can I leave a message?","Nhờ gọi lại: Could you ask him / her to call me back?","Mẫu ask + người (him, her, them) + to + động từ nguyên mẫu."]},{"id":"s_busy","ch":4,"level":"A1","title":"Busy right now","vi":"Hiện tại tiếp diễn: việc đang làm","goals":["Sau bài này bạn có thể nói việc mình đang làm ngay lúc này bằng am / is / are + V-ing.","Sau bài này bạn có thể phân biệt việc đang xảy ra (I'm checking) với thói quen (I check every month).","Sau bài này bạn có thể trả lời khi đồng nghiệp gọi lúc bạn đang bận nhiều việc."],"story":[{"who":"Mark","en":"Hi Lan. Are you busy right now?","vi":"Chào Lan. Giờ chị có bận không?"},{"who":"Lan","en":"A little. I'm writing a SQL query for Sofia.","vi":"Hơi bận. Tôi đang viết một truy vấn SQL cho Sofia."},{"who":"Mark","en":"Where are you working today?","vi":"Hôm nay chị làm việc ở đâu?"},{"who":"Lan","en":"I'm at the office. I usually work here on Tuesdays.","vi":"Tôi ở văn phòng. Thứ Ba tôi thường làm ở đây."},{"who":"Mark","en":"What's Minh doing? I can't find him.","vi":"Minh đang làm gì vậy? Tôi không tìm thấy cậu ấy."},{"who":"Lan","en":"He's having lunch. He always eats at eleven thirty.","vi":"Cậu ấy đang ăn trưa. Cậu ấy luôn ăn lúc mười một rưỡi."},{"who":"Mark","en":"OK. Are you checking the March numbers today?","vi":"Được. Hôm nay chị có kiểm tra số liệu tháng Ba không?"},{"who":"Lan","en":"Yes, I'm checking them now. I check them every month.","vi":"Có, tôi đang kiểm tra đây. Tháng nào tôi cũng kiểm tra."},{"who":"Mark","en":"Great. Please call me after that.","vi":"Tốt. Xong việc đó thì gọi cho tôi nhé."},{"who":"Lan","en":"Sure. Oh no, my laptop is restarting. Talk soon!","vi":"Vâng. Ôi không, máy tính của tôi đang khởi động lại. Nói chuyện sau nhé!"}],"vocab":[{"w":"right now","ipa":"/raɪt naʊ/","vi":"ngay bây giờ","ex":"I'm busy right now."},{"w":"a little","ipa":"/ə ˈlɪtl/","vi":"một chút, hơi","ex":"Are you busy? — A little."},{"w":"query","ipa":"/ˈkwɪri/","vi":"truy vấn (dữ liệu)","ex":"I'm writing a SQL query."},{"w":"always","ipa":"/ˈɔːlweɪz/","vi":"luôn luôn","ex":"He always eats at eleven thirty."},{"w":"laptop","ipa":"/ˈlæptɑːp/","vi":"máy tính xách tay","ex":"My laptop is slow."},{"w":"restart","ipa":"/ˌriːˈstɑːrt/","vi":"khởi động lại","ex":"My laptop is restarting."},{"w":"at the moment","ipa":"/æt ðə ˈmoʊmənt/","vi":"lúc này","ex":"She's on the phone at the moment."},{"w":"Talk soon!","ipa":"/tɔːk suːn/","vi":"Nói chuyện sau nhé!","ex":"I have to go. Talk soon!"}],"grammar":{"t":"Hiện tại tiếp diễn (việc đang làm) và hiện tại đơn (thói quen)","d":"Hiện tại tiếp diễn (am / is / are + V-ing) nói việc ĐANG xảy ra ngay lúc nói. Hiện tại đơn nói việc lặp đi lặp lại, thói quen, lịch cố định. Tiếng Việt chỉ cần thêm chữ \"đang\", còn tiếng Anh phải đổi cả dạng động từ, nên hãy nhìn từ chỉ thời gian: now, right now → tiếp diễn; every day, usually, always → hiện tại đơn.","formula":["Đang làm: S + am / is / are + V-ing (I'm writing a query now.)","Phủ định: S + am / is / are + not + V-ing · Câu hỏi: Am / Is / Are + S + V-ing?","Thói quen: S + V(s) (I write queries every day. He always eats at 11:30.)","Dấu hiệu: now, right now, at the moment ↔ every day, usually, always, on Tuesdays"],"ex":["Cách thêm -ing: work → working · write → writing (bỏ e) · have → having · sit → sitting (gấp đôi phụ âm cuối)","He's having lunch now. / He always has lunch at 11:30.","I'm checking the numbers now. / I check them every month.","Is she working from home today? → Yes, she is. / No, she isn't.","Động từ chỉ trạng thái thường không dùng -ing: I need it now (không nói I'm needing)."],"mistakes":[{"wrong":"I writing a query now.","right":"I'm writing a query now.","why":"Thiếu am / is / are; V-ing không đứng một mình."},{"wrong":"I'm checking them every month.","right":"I check them every month.","why":"Việc lặp lại hằng tháng là thói quen → dùng hiện tại đơn."},{"wrong":"She is have lunch.","right":"She is having lunch.","why":"Sau is phải là V-ing, không dùng động từ nguyên mẫu."}]},"quiz":[{"q":"What is Lan doing when Mark calls?","o":["Having lunch","Calling Sofia","Writing a SQL query"],"a":2},{"q":"What is Minh doing?","o":["He's having lunch","He's in a meeting","He's working from home"],"a":0},{"q":"Look! Mark ___ to the client now.","o":["talks","is talking","talk"],"a":1}],"practice":[{"s":"I ___ (talk) on the phone right now.","a":"am talking","alt":["'m talking"],"hint":"Đang xảy ra lúc nói: am + V-ing."},{"s":"Lan usually ___ (take) the bus to work.","a":"takes","alt":[],"hint":"Thói quen (usually), chủ ngữ she."},{"s":"Mark ___ (have) lunch at the moment.","a":"is having","alt":["'s having"],"hint":"at the moment → tiếp diễn; have → having."},{"s":"We ___ (meet) every Monday.","a":"meet","alt":[],"hint":"every Monday → thói quen, hiện tại đơn."},{"s":"___ you working from home today?","a":"Are","alt":[],"hint":"Câu hỏi tiếp diễn với you."}],"speak":["Are you busy right now?","I'm writing a SQL query for Sofia.","He's having lunch. He always eats at eleven thirty.","I'm checking them now. I check them every month."],"write":{"vi":"Trưởng nhóm nhắn hỏi bạn đang làm gì. Trả lời: bạn đang làm 2 việc gì ngay lúc này, và bình thường vào ngày này trong tuần bạn làm gì.","en":"Your manager sends a message: \"What are you doing right now?\" Reply with two things you are doing now and what you usually do on this day of the week.","min":30},"summary":["Đang làm ngay lúc nói: am / is / are + V-ing (I'm writing a query).","Thói quen, việc lặp lại: hiện tại đơn (I check the numbers every month).","now, right now, at the moment → tiếp diễn; every day, usually, always → hiện tại đơn.","Thêm -ing: write → writing, have → having, sit → sitting."]},{"id":"s_directions","ch":4,"level":"A1","title":"Getting to the client's office","vi":"Hỏi và chỉ đường","goals":["Sau bài này bạn có thể chỉ đường bằng câu mệnh lệnh: Turn left. Go straight. Don't take a taxi.","Sau bài này bạn có thể mô tả vị trí: on the corner, opposite, next to.","Sau bài này bạn có thể hỏi đường đến văn phòng khách hàng: How do I get to…?"],"story":[{"who":"Mark","en":"Lan, I'm at the station. How do I get to BrightMart?","vi":"Lan ơi, tôi đang ở nhà ga. Đi đến BrightMart thế nào?"},{"who":"Lan","en":"It's close, so don't take a taxi. Walk!","vi":"Gần lắm, đừng đi taxi. Đi bộ thôi!"},{"who":"Lan","en":"Go out of the main exit and turn right.","vi":"Ra cửa chính rồi rẽ phải."},{"who":"Lan","en":"Go straight for two blocks. Then turn left at the bank.","vi":"Đi thẳng qua hai dãy nhà. Rồi rẽ trái ở ngân hàng."},{"who":"Mark","en":"OK. Is the office next to the bank?","vi":"Được. Văn phòng ở cạnh ngân hàng à?"},{"who":"Lan","en":"No. It's on the corner, opposite a small park.","vi":"Không. Nó ở góc đường, đối diện một công viên nhỏ."},{"who":"Mark","en":"Which building is it?","vi":"Là tòa nhà nào?"},{"who":"Lan","en":"The tall glass building. Take the elevator to the tenth floor.","vi":"Tòa nhà kính cao. Đi thang máy lên tầng mười."},{"who":"Mark","en":"Turn right, go straight, turn left at the bank. Got it.","vi":"Rẽ phải, đi thẳng, rẽ trái ở ngân hàng. Hiểu rồi."},{"who":"Lan","en":"Great. See you in ten minutes!","vi":"Tốt. Mười phút nữa gặp anh nhé!"}],"vocab":[{"w":"close","ipa":"/kloʊs/","vi":"gần","ex":"The office is close to the station."},{"w":"exit","ipa":"/ˈeɡzɪt/","vi":"lối ra","ex":"Go out of the main exit."},{"w":"turn left / turn right","ipa":"/tɝːn left/ /tɝːn raɪt/","vi":"rẽ trái / rẽ phải","ex":"Turn left at the bank."},{"w":"go straight","ipa":"/ɡoʊ streɪt/","vi":"đi thẳng","ex":"Go straight for two blocks."},{"w":"block","ipa":"/blɑːk/","vi":"dãy nhà (khoảng giữa hai ngã tư)","ex":"It's two blocks from here."},{"w":"on the corner","ipa":"/ɑːn ðə ˈkɔːrnər/","vi":"ở góc đường","ex":"The café is on the corner."},{"w":"opposite","ipa":"/ˈɑːpəzɪt/","vi":"đối diện","ex":"It's opposite a small park."},{"w":"elevator","ipa":"/ˈelɪveɪtər/","vi":"thang máy","ex":"Take the elevator to the tenth floor."}],"grammar":{"t":"Câu mệnh lệnh (imperatives) để chỉ đường","d":"Câu mệnh lệnh bắt đầu thẳng bằng động từ nguyên mẫu, không có chủ ngữ You: Turn left. Muốn nói \"đừng\", thêm Don't ở đầu câu. Khi chỉ đường, câu mệnh lệnh không hề bất lịch sự; muốn mềm hơn thì thêm please hoặc dùng Could you…? đã học.","formula":["Khẳng định: V nguyên mẫu + … (Turn right. Go straight for two blocks.)","Phủ định: Don't + V nguyên mẫu (Don't take a taxi.)","Hỏi đường: How do I get to + nơi? / Where is + nơi?","Vị trí: on the corner · opposite + nơi · next to + nơi · at + mốc (turn left at the bank)"],"ex":["Go out of the exit and turn left.","Go straight for two blocks.","Turn right at the bank. / Take the elevator to the tenth floor.","It's on the corner, opposite the park, next to a café.","Don't turn left here. Go straight."],"mistakes":[{"wrong":"Not take a taxi.","right":"Don't take a taxi.","why":"Câu mệnh lệnh phủ định dùng Don't + động từ, không dùng Not."},{"wrong":"Turn on the left.","right":"Turn left.","why":"Rẽ trái chỉ cần Turn left; turn on nghĩa là bật (máy, đèn)."},{"wrong":"It's opposite with the park.","right":"It's opposite the park.","why":"Opposite đi thẳng với danh từ, không cần with."}]},"quiz":[{"q":"How does Mark go to BrightMart?","o":["He takes a taxi","He walks","He takes a bus"],"a":1},{"q":"Where is BrightMart's office?","o":["Next to the bank","Opposite the station","On the corner, opposite a park"],"a":2},{"q":"___ take a taxi. It's very close.","o":["Not","Don't","No"],"a":1}],"practice":[{"s":"Go out of the exit and ___ right.","a":"turn","alt":[],"hint":"Rẽ phải = ___ right."},{"s":"___ straight for two blocks.","a":"Go","alt":[],"hint":"Đi thẳng."},{"s":"The office is ___ the park.","a":"opposite","alt":[],"hint":"Đối diện."},{"s":"___ take a taxi. It's only five minutes on foot.","a":"Don't","alt":["Do not"],"hint":"Mệnh lệnh phủ định."},{"s":"The café is on the ___ of the street.","a":"corner","alt":[],"hint":"Ở góc đường."}],"speak":["How do I get to BrightMart?","Go out of the main exit and turn right.","Go straight for two blocks. Then turn left at the bank.","It's on the corner, opposite a small park."],"write":{"vi":"Một đối tác nước ngoài sắp đến công ty bạn. Viết email ngắn chỉ đường từ ga tàu hoặc bến xe gần nhất đến văn phòng. Dùng ít nhất 4 câu mệnh lệnh và 2 từ chỉ vị trí.","en":"A foreign partner is visiting your company. Write a short email with directions from the nearest station to your office. Use at least four imperatives and two location words.","min":30},"summary":["Câu mệnh lệnh bắt đầu bằng động từ nguyên mẫu: Turn left. Go straight.","Phủ định: Don't + động từ (Don't take a taxi).","Hỏi đường: How do I get to…? / Where is…?","Vị trí: on the corner, opposite, next to; mốc rẽ dùng at (turn left at the bank)."]},{"id":"x4_2","ch":4,"level":"A1","after":"s_directions","title":"How do you get to work?","vi":"Phương tiện đi lại và thời gian di chuyển","goals":["Sau bài này bạn có thể nói mình đi lại bằng gì: by bus, by taxi, on foot, take the train.","Sau bài này bạn có thể hỏi và trả lời thời gian đi đường: How long does it take? It takes…","Sau bài này bạn có thể giúp đồng nghiệp nước ngoài đi lại trong thành phố."],"story":[{"who":"Mark","en":"How do you get to work every day, Lan?","vi":"Hằng ngày chị đi làm bằng gì vậy Lan?"},{"who":"Lan","en":"I usually go by bus. Sometimes I take a motorbike taxi.","vi":"Tôi thường đi xe buýt. Thỉnh thoảng tôi đi xe ôm."},{"who":"Mark","en":"How long does it take?","vi":"Mất bao lâu?"},{"who":"Lan","en":"It takes about thirty minutes by bus.","vi":"Đi xe buýt mất khoảng ba mươi phút."},{"who":"Mark","en":"And how do I get to the airport?","vi":"Còn tôi đi ra sân bay thế nào?"},{"who":"Lan","en":"Book a car with an app. It's cheap and easy.","vi":"Đặt xe qua ứng dụng. Rẻ và tiện lắm."},{"who":"Mark","en":"How long does it take to get there?","vi":"Đi đến đó mất bao lâu?"},{"who":"Lan","en":"It depends on the traffic. Rush hour is very slow.","vi":"Còn tùy giao thông. Giờ cao điểm thì rất chậm."},{"who":"Lan","en":"At five p.m., it can take an hour.","vi":"Lúc năm giờ chiều, có thể mất cả tiếng."},{"who":"Mark","en":"An hour? OK, I can leave early.","vi":"Một tiếng à? Được, vậy tôi sẽ đi sớm."}],"vocab":[{"w":"get to","ipa":"/ɡet tuː/","vi":"đi đến, tới","ex":"How do you get to work?"},{"w":"motorbike taxi","ipa":"/ˈmoʊtərbaɪk ˈtæksi/","vi":"xe ôm","ex":"I sometimes take a motorbike taxi."},{"w":"airport","ipa":"/ˈerpɔːrt/","vi":"sân bay","ex":"How do I get to the airport?"},{"w":"book","ipa":"/bʊk/","vi":"đặt (xe, phòng, vé)","ex":"Book a car with an app."},{"w":"app","ipa":"/æp/","vi":"ứng dụng","ex":"I use an app to book a car."},{"w":"traffic","ipa":"/ˈtræfɪk/","vi":"giao thông, xe cộ","ex":"The traffic is very slow."},{"w":"rush hour","ipa":"/ˈrʌʃ aʊər/","vi":"giờ cao điểm","ex":"Don't travel at rush hour."},{"w":"It depends","ipa":"/ɪt dɪˈpendz/","vi":"còn tùy","ex":"It depends on the traffic."}],"grammar":{"t":"Phương tiện đi lại (BY / ON FOOT / TAKE) và HOW LONG DOES IT TAKE?","d":"Để nói đi bằng phương tiện gì, dùng by + phương tiện (không có a hay the), hoặc take + a/the + phương tiện. Đi bộ là on foot hoặc walk, không nói by foot. Để hỏi mất bao lâu, dùng How long does it take? và trả lời It takes + thời gian; chủ ngữ it ở đây là \"chuyến đi\", nên takes luôn có -s.","formula":["by + phương tiện: by bus, by car, by train, by taxi (không a / the)","take + a/the + phương tiện: take the bus, take a taxi · đi bộ: on foot / walk","Hỏi cách đi: How do you get to + nơi? (get home, không có to)","Hỏi thời gian: How long does it take (to get there)? → It takes + thời gian."],"ex":["I go to work by bus. = I take the bus to work.","Mark goes to the office on foot. = He walks to the office.","How long does it take? → It takes about thirty minutes.","It takes an hour by car at rush hour.","How do you get home? (home không đi với to)"],"mistakes":[{"wrong":"I go to work by the bus.","right":"I go to work by bus.","why":"Sau by không dùng the hoặc a."},{"wrong":"I go to work by foot.","right":"I go to work on foot.","why":"Đi bộ là on foot, không phải by foot."},{"wrong":"How long it takes?","right":"How long does it take?","why":"Câu hỏi cần does; động từ take để nguyên mẫu."}]},"quiz":[{"q":"How does Lan usually get to work?","o":["By motorbike taxi","By bus","On foot"],"a":1},{"q":"Why is the trip to the airport slow at five p.m.?","o":["Because of the traffic","Because of the app","Because of the rain"],"a":0},{"q":"It ___ about twenty minutes by taxi.","o":["taking","take","takes"],"a":2}],"practice":[{"s":"I go to work ___ bus.","a":"by","alt":[],"hint":"Phương tiện: ___ bus (không có the)."},{"s":"Mark goes to the office ___ foot.","a":"on","alt":[],"hint":"Đi bộ."},{"s":"How long does it ___ to get there?","a":"take","alt":[],"hint":"Sau does dùng động từ nguyên mẫu."},{"s":"It ___ about an hour at rush hour.","a":"takes","alt":[],"hint":"Chủ ngữ it → thêm -s."},{"s":"How do you ___ to the airport?","a":"get","alt":[],"hint":"Hỏi cách đi đến đâu: How do you … to…?"}],"speak":["How do you get to work every day?","I usually go by bus.","How long does it take?","It depends on the traffic."],"write":{"vi":"Một đồng nghiệp nước ngoài mới chuyển đến thành phố của bạn. Viết tin nhắn kể bạn đi làm bằng gì, mất bao lâu, và khuyên họ nên đi đâu bằng phương tiện nào.","en":"A foreign colleague has just moved to your city. Write a message: how you get to work, how long it takes, and how they can get around.","min":30},"summary":["by + phương tiện (không a / the): by bus, by taxi; hoặc take the bus, take a taxi.","Đi bộ: on foot hoặc walk, không nói by foot.","How long does it take? → It takes + thời gian (takes luôn có -s).","How do you get to + nơi? (nhưng get home, không có to)."]},{"id":"s_prices","ch":4,"level":"A1","title":"Buying new equipment","vi":"Giá cả, too và enough","goals":["Sau bài này bạn có thể hỏi giá đúng: How much is…? / How much are…? và đọc giá tiền.","Sau bài này bạn có thể nói một thứ không phù hợp bằng too + tính từ (too expensive).","Sau bài này bạn có thể nói một thứ đạt yêu cầu bằng tính từ + enough (big enough)."],"story":[{"who":"Mark","en":"We need a new monitor and two chairs.","vi":"Chúng ta cần một màn hình mới và hai cái ghế."},{"who":"Lan","en":"OK. How much money do we have?","vi":"Được. Mình có bao nhiêu tiền?"},{"who":"Mark","en":"Five hundred dollars. That's our budget.","vi":"Năm trăm đô la. Đó là ngân sách của mình."},{"who":"Lan","en":"How much is this big monitor?","vi":"Cái màn hình lớn này giá bao nhiêu?"},{"who":"Mark","en":"Four hundred and twenty dollars. It's too expensive.","vi":"Bốn trăm hai mươi đô. Đắt quá."},{"who":"Lan","en":"This one is cheap. Is it too small?","vi":"Cái này rẻ. Nó có nhỏ quá không?"},{"who":"Mark","en":"No, it's twenty-seven inches. That's big enough.","vi":"Không, nó 27 inch. Vậy là đủ lớn rồi."},{"who":"Lan","en":"Good. It's two hundred. How much are these chairs?","vi":"Tốt. Nó giá hai trăm. Mấy cái ghế này giá bao nhiêu?"},{"who":"Mark","en":"A hundred and twenty dollars each. They're comfortable.","vi":"Một trăm hai mươi đô mỗi cái. Ngồi rất êm."},{"who":"Lan","en":"So that's four hundred and forty. We have enough money!","vi":"Vậy tổng là bốn trăm bốn mươi. Mình đủ tiền!"}],"vocab":[{"w":"monitor","ipa":"/ˈmɑːnɪtər/","vi":"màn hình máy tính","ex":"We need a new monitor."},{"w":"expensive","ipa":"/ɪkˈspensɪv/","vi":"đắt","ex":"This laptop is expensive."},{"w":"cheap","ipa":"/tʃiːp/","vi":"rẻ","ex":"This monitor is cheap."},{"w":"too","ipa":"/tuː/","vi":"quá (mức không chấp nhận được)","ex":"It's too expensive."},{"w":"enough","ipa":"/ɪˈnʌf/","vi":"đủ","ex":"It's big enough."},{"w":"inch","ipa":"/ɪntʃ/","vi":"inch (đơn vị đo màn hình)","ex":"a twenty-seven-inch monitor"},{"w":"each","ipa":"/iːtʃ/","vi":"mỗi cái","ex":"They're $120 each."},{"w":"comfortable","ipa":"/ˈkʌmftərbəl/","vi":"thoải mái, êm","ex":"These chairs are comfortable."}],"grammar":{"t":"Hỏi giá; TOO + tính từ; tính từ + ENOUGH","d":"Hỏi giá một món dùng How much is…?, nhiều món dùng How much are…?. Too + tính từ nghĩa là \"quá…\" theo hướng có vấn đề, không chấp nhận được (too expensive = đắt quá, không mua được). Enough đứng SAU tính từ và nghĩa là \"đủ…\" để đạt yêu cầu (big enough = đủ lớn).","formula":["Hỏi giá: How much is + vật số ít? / How much are + vật số nhiều? → It's / They're + giá.","TOO + tính từ = quá (có vấn đề): It's too expensive. It's too small.","Tính từ + ENOUGH = đủ (đạt): It's big enough. It's cheap enough.","Phủ định: not + tính từ + enough: It isn't big enough."],"ex":["How much is this monitor? — It's $200.","How much are these chairs? — They're $120 each.","Đọc giá: $420 = four hundred and twenty dollars · $1,500 = one thousand five hundred dollars","This room is too small for ten people. / This room isn't big enough.","Enough + danh từ thì đứng TRƯỚC: We have enough money."],"mistakes":[{"wrong":"It's enough big.","right":"It's big enough.","why":"Với tính từ, enough đứng SAU: big enough."},{"wrong":"It's too cheap, so we buy it.","right":"It's very cheap, so we buy it.","why":"Too mang nghĩa \"quá mức, có vấn đề\"; khen rẻ thì dùng very."},{"wrong":"four hundreds dollars","right":"four hundred dollars","why":"Hundred, thousand sau một con số không thêm -s."}]},"quiz":[{"q":"What is the team's budget?","o":["$420","$500","$200"],"a":1},{"q":"Why don't they buy the big monitor?","o":["It's too small","It isn't comfortable","It's too expensive"],"a":2},{"q":"The room isn't ___ for ten people.","o":["big enough","enough big","too big"],"a":0}],"practice":[{"s":"How much ___ these chairs?","a":"are","alt":[],"hint":"chairs số nhiều."},{"s":"How much ___ this monitor?","a":"is","alt":[],"hint":"monitor số ít."},{"s":"This laptop is $3,000. It's ___ expensive for us.","a":"too","alt":[],"hint":"Quá đắt, không mua được."},{"s":"The screen is 27 inches. It's big ___.","a":"enough","alt":[],"hint":"Đủ lớn: tính từ + ___."},{"s":"This chair is $120. How much is it? — ___ $120.","a":"It's","alt":["It is"],"hint":"Trả lời giá một món."}],"speak":["How much is this big monitor?","It's too expensive.","That's big enough.","How much are these chairs?"],"write":{"vi":"Nhóm bạn có 1.000 đô để mua thiết bị. Viết email cho trưởng nhóm: bạn muốn mua gì, giá bao nhiêu, món nào quá đắt và món nào đủ tốt. Dùng too và enough.","en":"Your team has $1,000 for new equipment. Write an email to your manager: what you want to buy, the prices, what is too expensive and what is good enough. Use too and enough.","min":30},"summary":["How much is + một món? / How much are + nhiều món?","Too + tính từ = quá, có vấn đề: too expensive, too small.","Tính từ + enough = đủ: big enough, cheap enough (enough đứng sau tính từ).","Đọc giá: four hundred dollars (không thêm -s vào hundred)."]},{"id":"s_weather","ch":4,"level":"A1","title":"Weather and seasons","vi":"Thời tiết và các mùa","goals":["Sau bài này bạn có thể hỏi về thời tiết: What's the weather like (in…)?","Sau bài này bạn có thể mô tả thời tiết bằng It's + tính từ và nói về các mùa.","Sau bài này bạn có thể nói chuyện xã giao về thời tiết trước cuộc gọi với đối tác nước ngoài."],"story":[{"who":"Lan","en":"Good morning, Sofia! What's the weather like in Chicago?","vi":"Chào buổi sáng, Sofia! Thời tiết ở Chicago thế nào?"},{"who":"Sofia","en":"It's very cold and windy. And it's snowing!","vi":"Rất lạnh và nhiều gió. Mà tuyết đang rơi nữa!"},{"who":"Lan","en":"Snow! We never have snow in Ho Chi Minh City.","vi":"Tuyết! Ở TP. Hồ Chí Minh chẳng bao giờ có tuyết."},{"who":"Sofia","en":"Really? What's the weather like there today?","vi":"Vậy à? Hôm nay ở đó thời tiết thế nào?"},{"who":"Lan","en":"It's hot and sunny. It's about thirty-two degrees Celsius.","vi":"Nóng và nắng. Khoảng ba mươi hai độ C."},{"who":"Sofia","en":"Wow. Do you have four seasons?","vi":"Chà. Ở đó có bốn mùa không?"},{"who":"Lan","en":"No. We have two: the dry season and the rainy season.","vi":"Không. Chúng tôi có hai mùa: mùa khô và mùa mưa."},{"who":"Lan","en":"In the rainy season, it often rains in the afternoon.","vi":"Vào mùa mưa, trời thường mưa vào buổi chiều."},{"who":"Sofia","en":"Here, winter is long. My favorite season is summer.","vi":"Ở đây mùa đông dài lắm. Mùa tôi thích nhất là mùa hè."},{"who":"Lan","en":"Summer sounds lovely. OK, shall we start?","vi":"Mùa hè nghe thật dễ chịu. Thôi, mình bắt đầu nhé?"}],"vocab":[{"w":"weather","ipa":"/ˈweðər/","vi":"thời tiết","ex":"What's the weather like?"},{"w":"cold","ipa":"/koʊld/","vi":"lạnh","ex":"It's cold in winter."},{"w":"windy","ipa":"/ˈwɪndi/","vi":"nhiều gió","ex":"It's cold and windy."},{"w":"snow","ipa":"/snoʊ/","vi":"tuyết; có tuyết rơi","ex":"It's snowing in Chicago."},{"w":"sunny","ipa":"/ˈsʌni/","vi":"nắng","ex":"It's hot and sunny."},{"w":"degree","ipa":"/dɪˈɡriː/","vi":"độ","ex":"thirty-two degrees Celsius"},{"w":"season","ipa":"/ˈsiːzən/","vi":"mùa","ex":"We have two seasons."},{"w":"rainy","ipa":"/ˈreɪni/","vi":"có mưa","ex":"the rainy season"}],"grammar":{"t":"Nói về thời tiết với IT; các mùa","d":"Tiếng Việt nói \"Trời nóng\" hoặc chỉ \"Nóng quá\", nhưng tiếng Anh luôn cần chủ ngữ, nên dùng It: It's hot. It's raining. Để hỏi thời tiết, dùng What's the weather like? (like ở đây nghĩa là \"như thế nào\", không phải \"thích\"). Mưa và tuyết có thể là tính từ (rainy) hoặc động từ (it rains, it's raining).","formula":["Hỏi: What's the weather like (in + nơi)? / How's the weather?","Trả lời: It's + tính từ: It's hot / cold / sunny / windy / rainy.","Động từ: It rains / It snows (thường xuyên) · It's raining / It's snowing (ngay bây giờ)","Mùa: in (the) spring / summer / fall / winter · the dry season, the rainy season"],"ex":["What's the weather like in Hanoi? — It's cool and cloudy.","Danh từ → tính từ: sun → sunny · rain → rainy · wind → windy · cloud → cloudy","In Chicago, it often snows in winter. Today it's snowing.","Bốn mùa: spring (xuân), summer (hạ), fall / autumn (thu), winter (đông). Người Mỹ thường nói fall, người Anh và Úc nói autumn.","Nhiệt độ: Việt Nam dùng độ C (Celsius); nước Mỹ thường dùng độ F (Fahrenheit)."],"mistakes":[{"wrong":"Is very hot today.","right":"It's very hot today.","why":"Câu tiếng Anh phải có chủ ngữ; với thời tiết dùng It."},{"wrong":"It's rain.","right":"It's raining. / It's rainy.","why":"Rain là động từ hoặc danh từ; nói đang mưa dùng raining, trời có mưa dùng rainy."},{"wrong":"How is the weather like?","right":"What's the weather like?","why":"Đi với like là What, không phải How (hoặc nói How's the weather? không có like)."}]},"quiz":[{"q":"What's the weather like in Chicago?","o":["Hot and sunny","Cold and windy","Rainy"],"a":1},{"q":"How many seasons does Ho Chi Minh City have?","o":["Two","Four","One"],"a":0},{"q":"What's the weather ___ in Hanoi today?","o":["is","like","likes"],"a":1}],"practice":[{"s":"What's the weather ___ today?","a":"like","alt":[],"hint":"Hỏi thời tiết: What's the weather …?"},{"s":"___ sunny and hot today.","a":"It's","alt":["It is"],"hint":"Thời tiết luôn cần chủ ngữ It."},{"s":"Look outside! It's ___ (rain) now.","a":"raining","alt":[],"hint":"Đang xảy ra → V-ing."},{"s":"In Chicago, it often ___ (snow) in winter.","a":"snows","alt":[],"hint":"Thường xuyên → hiện tại đơn, chủ ngữ it."},{"s":"Take an umbrella. It's very ___ today.","a":"rainy","alt":["wet"],"hint":"Tính từ của rain."}],"speak":["What's the weather like in Chicago?","It's hot and sunny today.","We have two seasons: the dry season and the rainy season.","In the rainy season, it often rains in the afternoon."],"write":{"vi":"Một đối tác nước ngoài hỏi về thời tiết ở thành phố bạn. Viết trả lời: hôm nay thời tiết thế nào, có mấy mùa, mỗi mùa ra sao, và hỏi lại thời tiết chỗ họ.","en":"A foreign partner asks about the weather in your city. Reply: what the weather is like today, the seasons, what each season is like, and ask about the weather where they live.","min":30},"summary":["Hỏi: What's the weather like? (like = như thế nào).","Trả lời luôn có It: It's hot. It's windy. It's raining.","It rains / snows = thường xuyên; It's raining / snowing = đang diễn ra.","Mùa: spring, summer, fall (autumn), winter; Việt Nam phía Nam có mùa khô và mùa mưa."]},{"id":"x4_3","ch":4,"level":"A1","after":"s_weather","title":"Checking in at the hotel","vi":"Nhận phòng khách sạn khi đi công tác","goals":["Sau bài này bạn có thể nhận phòng khách sạn: I have a reservation under the name…","Sau bài này bạn có thể hỏi về dịch vụ: Is breakfast included? Is there Wi-Fi?","Sau bài này bạn có thể hỏi giờ giấc: What time is breakfast / check-out?"],"story":[{"who":"Receptionist","en":"Good evening. Welcome to the Riverside Hotel.","vi":"Chào buổi tối. Chào mừng quý khách đến khách sạn Riverside."},{"who":"Lan","en":"Hi. I have a reservation. My name is Lan Tran.","vi":"Chào anh. Tôi có đặt phòng. Tên tôi là Trần Lan."},{"who":"Receptionist","en":"Let me check. Yes, a single room for three nights.","vi":"Để tôi kiểm tra. Vâng, một phòng đơn trong ba đêm."},{"who":"Receptionist","en":"Can I see your passport, please?","vi":"Cho tôi xem hộ chiếu của chị được không?"},{"who":"Lan","en":"Here you are. Is breakfast included?","vi":"Đây ạ. Có bao gồm bữa sáng không?"},{"who":"Receptionist","en":"Yes, it is. Breakfast is from six to ten.","vi":"Có ạ. Bữa sáng từ sáu đến mười giờ."},{"who":"Lan","en":"Great. Is there Wi-Fi in the room?","vi":"Tốt quá. Trong phòng có Wi-Fi không?"},{"who":"Receptionist","en":"Yes. The password is on your key card.","vi":"Có ạ. Mật khẩu ghi trên thẻ phòng của chị."},{"who":"Lan","en":"And what time is check-out?","vi":"Còn trả phòng lúc mấy giờ?"},{"who":"Receptionist","en":"At noon. Your room is 815. Enjoy your stay!","vi":"Mười hai giờ trưa. Phòng của chị là 815. Chúc chị nghỉ ngơi vui vẻ!"}],"vocab":[{"w":"reservation","ipa":"/ˌrezərˈveɪʃən/","vi":"sự đặt chỗ, đặt phòng","ex":"I have a reservation."},{"w":"single room","ipa":"/ˈsɪŋɡəl ruːm/","vi":"phòng đơn","ex":"a single room for three nights"},{"w":"passport","ipa":"/ˈpæspɔːrt/","vi":"hộ chiếu","ex":"Can I see your passport?"},{"w":"Here you are.","ipa":"/hɪr juː ɑːr/","vi":"Đây ạ (khi đưa vật gì)","ex":"Your passport? Here you are."},{"w":"included","ipa":"/ɪnˈkluːdɪd/","vi":"được bao gồm","ex":"Is breakfast included?"},{"w":"password","ipa":"/ˈpæswɝːd/","vi":"mật khẩu","ex":"What's the Wi-Fi password?"},{"w":"key card","ipa":"/ˈkiː kɑːrd/","vi":"thẻ phòng","ex":"Here is your key card."},{"w":"check-out","ipa":"/ˈtʃek aʊt/","vi":"giờ trả phòng","ex":"What time is check-out?"}],"grammar":{"t":"Hỏi về dịch vụ khách sạn: IS THERE…? / IS … INCLUDED? / WHAT TIME IS…?","d":"Khi hỏi \"có … không\", người Việt hay dịch thẳng là Have…?, nhưng hỏi một nơi có gì thì tiếng Anh dùng Is there / Are there (đã học ở bài văn phòng). Hỏi giá phòng có gồm thứ gì không thì dùng Is + thứ đó + included?. Hỏi giờ thì dùng What time is + bữa ăn / check-out?","formula":["Báo đặt phòng: I have a reservation (under the name + tên).","Hỏi có không: Is there + danh từ số ít? / Are there + danh từ số nhiều?","Hỏi bao gồm: Is + danh từ + included? → Yes, it is. / No, it isn't.","Hỏi giờ: What time is + breakfast / check-out?"],"ex":["I have a reservation under the name Tran.","Is there a gym in the hotel? / Are there any restaurants near here?","Is breakfast included? — Yes, it is.","What time is check-out? — At noon.","Nhờ vả: Can I have a late check-out, please? / Could you call a taxi for me?"],"mistakes":[{"wrong":"Have Wi-Fi in the room?","right":"Is there Wi-Fi in the room?","why":"Hỏi một nơi có gì → Is there, không dùng Have đứng đầu câu."},{"wrong":"Breakfast include?","right":"Is breakfast included?","why":"Cần Is ở đầu và dạng included (được bao gồm)."},{"wrong":"What time check-out?","right":"What time is check-out?","why":"Thiếu động từ to be is."}]},"quiz":[{"q":"How many nights does Lan stay?","o":["Two","Three","Four"],"a":1},{"q":"Where is the Wi-Fi password?","o":["On the key card","On the wall","In her email"],"a":0},{"q":"___ there a gym in the hotel?","o":["Have","Are","Is"],"a":2}],"practice":[{"s":"I have a ___ under the name Tran.","a":"reservation","alt":[],"hint":"Đã đặt phòng."},{"s":"___ breakfast included?","a":"Is","alt":[],"hint":"Hỏi bữa sáng có được bao gồm không."},{"s":"___ there any towels in the room?","a":"Are","alt":[],"hint":"towels số nhiều."},{"s":"What time ___ check-out?","a":"is","alt":[],"hint":"Thiếu to be."},{"s":"Can I see your passport? — Here you ___.","a":"are","alt":[],"hint":"Câu nói khi đưa vật gì cho ai."}],"speak":["I have a reservation. My name is Lan Tran.","Is breakfast included?","Is there Wi-Fi in the room?","What time is check-out?"],"write":{"vi":"Bạn sắp đi công tác. Viết email ngắn cho khách sạn: xác nhận đặt phòng (tên, số đêm), và hỏi 3 câu về bữa sáng, Wi-Fi và giờ trả phòng.","en":"You are going on a business trip. Write a short email to the hotel: confirm your reservation (name, number of nights) and ask three questions about breakfast, Wi-Fi and check-out time.","min":30},"summary":["Nhận phòng: I have a reservation under the name…","Hỏi một nơi có gì: Is there…? / Are there…? (không dùng Have…?).","Hỏi có bao gồm không: Is breakfast included?","Hỏi giờ: What time is breakfast / check-out?"]},{"id":"s_trip","ch":5,"level":"A2","title":"A business trip","vi":"Quá khứ đơn: động từ bất quy tắc","goals":["Sau bài này bạn có thể dùng các động từ bất quy tắc thường gặp ở thì quá khứ (went, took, met, gave, brought).","Sau bài này bạn có thể hỏi và trả lời về một chuyến đi bằng câu hỏi với DID.","Sau bài này bạn có thể nói việc xảy ra cách đây bao lâu bằng AGO (two days ago)."],"story":[{"who":"Lan","en":"Welcome back, Mark! When did you get back from Singapore?","vi":"Chào mừng anh về, Mark! Anh về từ Singapore khi nào vậy?"},{"who":"Mark","en":"I came back two days ago. I took a night flight.","vi":"Tôi về hai ngày trước. Tôi đi chuyến bay đêm."},{"who":"Lan","en":"Did you meet the new partners there?","vi":"Anh có gặp các đối tác mới ở đó không?"},{"who":"Mark","en":"Yes, I did. I met their CEO and two analysts.","vi":"Có. Tôi đã gặp giám đốc điều hành và hai chuyên viên phân tích của họ."},{"who":"Lan","en":"What did you talk about?","vi":"Mọi người đã nói về chuyện gì?"},{"who":"Mark","en":"We spoke about the data project. They gave us some good ideas.","vi":"Chúng tôi nói về dự án dữ liệu. Họ đã cho chúng ta vài ý tưởng hay."},{"who":"Lan","en":"Did you have time to see the city?","vi":"Anh có thời gian đi xem thành phố không?"},{"who":"Mark","en":"Not much. But I went to Marina Bay one evening and ate chilli crab.","vi":"Không nhiều. Nhưng có một buổi tối tôi đến Marina Bay và ăn cua sốt ớt."},{"who":"Lan","en":"Lucky you! Did you buy anything?","vi":"Sướng thế! Anh có mua gì không?"},{"who":"Mark","en":"I didn't buy much, but I brought you some kaya jam.","vi":"Tôi không mua nhiều, nhưng tôi có mang về cho chị ít mứt kaya."},{"who":"Lan","en":"Thank you! I'm glad the trip went well.","vi":"Cảm ơn anh! Tôi mừng là chuyến đi suôn sẻ."}],"vocab":[{"w":"business trip","ipa":"/ˈbɪznəs trɪp/","vi":"chuyến công tác","ex":"Mark went on a business trip to Singapore."},{"w":"flight","ipa":"/flaɪt/","vi":"chuyến bay","ex":"I took a night flight."},{"w":"ago","ipa":"/əˈɡoʊ/","vi":"cách đây, trước (đây)","ex":"I came back two days ago."},{"w":"get back","ipa":"/ɡet bæk/","vi":"trở về","ex":"When did you get back?"},{"w":"meet (met)","ipa":"/miːt/ (/met/)","vi":"gặp","ex":"I met their CEO."},{"w":"give (gave)","ipa":"/ɡɪv/ (/ɡeɪv/)","vi":"đưa, cho","ex":"They gave us some good ideas."},{"w":"bring (brought)","ipa":"/brɪŋ/ (/brɔːt/)","vi":"mang đến, mang về","ex":"I brought you some kaya jam."},{"w":"go well","ipa":"/ɡoʊ wel/","vi":"diễn ra tốt đẹp, suôn sẻ","ex":"The trip went well."}],"grammar":{"t":"Quá khứ đơn: động từ bất quy tắc, câu hỏi với DID và AGO","d":"Nhiều động từ thường dùng không thêm -ed ở quá khứ mà đổi hẳn hình dạng (go → went), nên bạn phải học thuộc. Khi hỏi và phủ định, ta dùng did / didn't và đưa động từ về nguyên mẫu. Muốn nói việc xảy ra cách đây bao lâu, đặt AGO sau khoảng thời gian.","formula":["Khẳng định: S + V2 (went, took, met, gave...)","Phủ định: S + didn't + V nguyên mẫu (I didn't buy much.)","Câu hỏi: (Wh-) + did + S + V nguyên mẫu? (When did you get back?)","Thời điểm: khoảng thời gian + ago (two days ago, three weeks ago)"],"ex":["go → went, take → took, meet → met, come → came, speak → spoke","give → gave, bring → brought, buy → bought, eat → ate, have → had","I took a night flight. · They gave us some good ideas.","Did you meet the partners? – Yes, I did. / No, I didn't.","I came back two days ago. (= hai ngày trước, tính từ hôm nay)"],"mistakes":[{"wrong":"Did you went to Singapore?","right":"Did you go to Singapore?","why":"Đã có did thì động từ phía sau luôn ở nguyên mẫu."},{"wrong":"I met them before two days.","right":"I met them two days ago.","why":"\"Cách đây hai ngày\" là two days ago; AGO đứng sau khoảng thời gian, không dùng before."},{"wrong":"I goed to the office early.","right":"I went to the office early.","why":"go là động từ bất quy tắc, quá khứ là went, không thêm -ed."}]},"quiz":[{"q":"When did Mark come back from Singapore?","o":["Yesterday","Two days ago","Last month"],"a":1},{"q":"What did Mark bring for Lan?","o":["Some chilli crab","A book","Some kaya jam"],"a":2},{"q":"Did you ___ the new partners?","o":["meet","met","meeting"],"a":0}],"practice":[{"s":"I ___ a taxi to the airport yesterday. (take)","a":"took","alt":[],"hint":"take là động từ bất quy tắc: take → ?"},{"s":"We ___ the client three weeks ago. (meet)","a":"met","alt":[],"hint":"Quá khứ của meet."},{"s":"Did you ___ to the conference last month? (go)","a":"go","alt":[],"hint":"Sau did dùng động từ nguyên mẫu."},{"s":"She didn't ___ her laptop to the meeting. (bring)","a":"bring","alt":[],"hint":"Sau didn't dùng động từ nguyên mẫu."},{"s":"I sent the report two hours ___.","a":"ago","alt":[],"hint":"\"Cách đây hai tiếng\" – từ đứng sau khoảng thời gian."}],"speak":["I came back two days ago. I took a night flight.","Did you meet the new partners there?","They gave us some good ideas.","I'm glad the trip went well."],"write":{"vi":"Viết một email ngắn kể cho đồng nghiệp về một chuyến công tác hoặc chuyến đi gần đây: bạn đi đâu, khi nào (dùng ago), gặp ai và đã làm gì. Dùng ít nhất 4 động từ bất quy tắc.","en":"Write a short email to a colleague about a recent business trip: where you went, when (use 'ago'), who you met and what you did. Use at least four irregular verbs.","min":40},"summary":["Động từ bất quy tắc phải học thuộc: go → went, take → took, meet → met, give → gave, bring → brought.","Câu hỏi và phủ định dùng did / didn't + động từ nguyên mẫu: Did you go? I didn't go.","AGO đứng sau khoảng thời gian: two days ago, a week ago.","Trả lời ngắn: Yes, I did. / No, I didn't."]},{"id":"x5_1","ch":5,"level":"A2","after":"s_trip","title":"First, then, after that","vi":"Kể chuyện theo trình tự","goals":["Sau bài này bạn có thể kể lại một ngày làm việc theo đúng thứ tự bằng first, then, next, after that, finally.","Sau bài này bạn có thể dùng before / after + danh từ để nói mốc thời gian (after lunch, before the meeting).","Sau bài này bạn có thể giữ đúng thì quá khứ đơn suốt cả câu chuyện."],"story":[{"who":"Minh","en":"How was your visit to BrightMart yesterday?","vi":"Chuyến làm việc ở BrightMart hôm qua của chị thế nào?"},{"who":"Lan","en":"It was long but good. First, I met Sofia at nine o'clock.","vi":"Dài nhưng tốt. Đầu tiên, tôi gặp Sofia lúc chín giờ."},{"who":"Minh","en":"What did you do then?","vi":"Rồi chị làm gì?"},{"who":"Lan","en":"Then we went to the sales team's office. They showed me their old reports.","vi":"Sau đó chúng tôi đến văn phòng nhóm bán hàng. Họ cho tôi xem các báo cáo cũ."},{"who":"Minh","en":"And after that?","vi":"Còn sau đó?"},{"who":"Lan","en":"After that, we had lunch together in their canteen.","vi":"Sau đó, chúng tôi ăn trưa cùng nhau ở căng-tin của họ."},{"who":"Lan","en":"After lunch, I presented our dashboard to six managers.","vi":"Sau bữa trưa, tôi trình bày dashboard của chúng ta cho sáu quản lý."},{"who":"Minh","en":"Were you nervous?","vi":"Chị có hồi hộp không?"},{"who":"Lan","en":"A little. Next, they asked a lot of questions, and I answered all of them.","vi":"Một chút. Tiếp theo, họ hỏi rất nhiều câu, và tôi trả lời hết."},{"who":"Lan","en":"Finally, Sofia thanked me, and we planned the next meeting.","vi":"Cuối cùng, Sofia cảm ơn tôi, và chúng tôi lên kế hoạch cho buổi họp tới."},{"who":"Minh","en":"What a busy day! I'm sure they liked it.","vi":"Một ngày bận rộn quá! Tôi chắc là họ thích lắm."}],"vocab":[{"w":"visit","ipa":"/ˈvɪzɪt/","vi":"chuyến thăm, chuyến làm việc","ex":"How was your visit to BrightMart?"},{"w":"then","ipa":"/ðen/","vi":"rồi, sau đó","ex":"Then we went to the sales office."},{"w":"after that","ipa":"/ˈæftər ðæt/","vi":"sau đó, sau việc đó","ex":"After that, we had lunch."},{"w":"next","ipa":"/nekst/","vi":"tiếp theo","ex":"Next, they asked a lot of questions."},{"w":"afterwards","ipa":"/ˈæftərwərdz/","vi":"sau đó, về sau","ex":"We had a meeting. Afterwards, I wrote the notes."},{"w":"finally","ipa":"/ˈfaɪnəli/","vi":"cuối cùng","ex":"Finally, Sofia thanked me."},{"w":"present (v)","ipa":"/prɪˈzent/","vi":"trình bày","ex":"I presented our dashboard."},{"w":"nervous","ipa":"/ˈnɜːrvəs/","vi":"hồi hộp, lo lắng","ex":"Were you nervous?"}],"grammar":{"t":"Từ nối trình tự khi kể chuyện","d":"Khi kể một chuỗi việc, người nghe cần biết việc nào trước, việc nào sau. Bạn đặt first, then, next, after that, finally ở đầu mỗi câu như những biển chỉ đường. Cả câu chuyện xảy ra trong quá khứ nên mọi động từ đều chia quá khứ đơn.","formula":["Mở đầu: First, + câu (First, I met Sofia.)","Ở giữa: Then / Next / After that, + câu","Kết thúc: Finally, + câu (Finally, Sofia thanked me.)","Mốc thời gian: before / after + danh từ (after lunch, before the meeting)"],"ex":["First, I opened the file. Then I checked the columns.","After that, I removed the empty rows.","Next, I made two charts.","Finally, I sent the report to Mark.","Lưu ý: sau First, After that, Next, Finally thường có dấu phẩy; sau Then có thể bỏ."],"mistakes":[{"wrong":"After that, I go to the client's office.","right":"After that, I went to the client's office.","why":"Kể chuyện đã xảy ra thì mọi động từ đều chia quá khứ, kể cả sau từ nối."},{"wrong":"At the end, Sofia thanked me.","right":"Finally, Sofia thanked me.","why":"Khi liệt kê bước cuối cùng, dùng Finally. At the end thường cần \"of + danh từ\" (at the end of the day)."},{"wrong":"After finish lunch, I presented the dashboard.","right":"After lunch, I presented the dashboard.","why":"Sau after dùng danh từ (after lunch) hoặc cả mệnh đề (after I finished lunch), không dùng động từ nguyên mẫu."}]},"quiz":[{"q":"Who did Lan meet first?","o":["Sofia","Minh","The sales team"],"a":0},{"q":"What did Lan do after lunch?","o":["She went home","She presented the dashboard","She wrote an email"],"a":1},{"q":"Which word introduces the LAST step of a story?","o":["First","Then","Finally"],"a":2}],"practice":[{"s":"___, I opened the file and checked the columns.","a":"First","alt":["First of all"],"hint":"Bước đầu tiên."},{"s":"I checked the columns. ___ I removed the empty rows.","a":"Then","alt":["Next","After that"],"hint":"Bước tiếp theo (rồi, sau đó)."},{"s":"___ lunch, we presented the dashboard.","a":"After","alt":[],"hint":"\"Sau bữa trưa\"."},{"s":"We had a short break. After ___, we continued the meeting.","a":"that","alt":[],"hint":"\"Sau đó\" = After ..."},{"s":"___, Sofia thanked us and we went home.","a":"Finally","alt":[],"hint":"Bước cuối cùng của câu chuyện."}],"speak":["First, I met Sofia at nine o'clock.","After that, we had lunch together.","After lunch, I presented our dashboard.","Finally, Sofia thanked me, and we planned the next meeting."],"write":{"vi":"Viết tin nhắn cho quản lý kể lại các bước bạn đã làm hôm qua để hoàn thành một báo cáo. Dùng First, Then, After that, Finally và thì quá khứ.","en":"Write a message to your manager about the steps you took yesterday to finish a report. Use First, Then, After that and Finally.","min":40},"summary":["Từ nối trình tự giúp câu chuyện dễ theo dõi: First → Then / Next / After that → Finally.","Before / after + danh từ: after lunch, before the meeting.","Kể chuyện quá khứ thì giữ động từ ở quá khứ đơn từ đầu đến cuối.","Bước cuối dùng Finally, không dùng At the end."]},{"id":"s_wasdoing","ch":5,"level":"A2","title":"What were you doing?","vi":"Quá khứ tiếp diễn","goals":["Sau bài này bạn có thể nói một việc đang diễn ra tại một thời điểm trong quá khứ (was/were + V-ing).","Sau bài này bạn có thể kể một việc đang làm thì bị một việc khác cắt ngang, dùng when và while.","Sau bài này bạn có thể kể lại một sự cố kỹ thuật ở chỗ làm cho đồng nghiệp hoặc khách hàng."],"story":[{"who":"Mark","en":"Lan, I heard the server went down yesterday. What happened?","vi":"Lan, tôi nghe nói hôm qua máy chủ bị sập. Chuyện gì vậy?"},{"who":"Lan","en":"It stopped at three o'clock. We were preparing the monthly report for BrightMart.","vi":"Nó ngừng lúc ba giờ. Lúc đó chúng tôi đang chuẩn bị báo cáo tháng cho BrightMart."},{"who":"Mark","en":"Oh no. What were you doing when it stopped?","vi":"Ôi trời. Lúc nó ngừng thì chị đang làm gì?"},{"who":"Lan","en":"I was writing the summary, and Minh was cleaning the sales data.","vi":"Tôi đang viết phần tóm tắt, còn Minh đang làm sạch dữ liệu bán hàng."},{"who":"Mark","en":"Were you saving your work?","vi":"Mọi người có đang lưu bài không?"},{"who":"Lan","en":"No, we weren't. While we were working, the screen suddenly froze.","vi":"Không. Trong lúc chúng tôi đang làm thì màn hình đột nhiên bị đơ."},{"who":"Mark","en":"Did you lose everything?","vi":"Mọi người có mất hết không?"},{"who":"Lan","en":"Not everything. Minh called IT while I was checking the backup.","vi":"Không mất hết. Minh gọi bộ phận IT trong lúc tôi đang kiểm tra bản sao lưu."},{"who":"Lan","en":"Luckily, we found a copy from two o'clock.","vi":"May mà chúng tôi tìm được một bản lưu lúc hai giờ."},{"who":"Mark","en":"So you only lost one hour of work. That's not bad.","vi":"Vậy là chỉ mất một tiếng làm việc. Thế cũng không tệ."},{"who":"Lan","en":"Yes. But we were still working at eight in the evening!","vi":"Đúng vậy. Nhưng tám giờ tối chúng tôi vẫn còn đang làm!"}],"vocab":[{"w":"server","ipa":"/ˈsɜːrvər/","vi":"máy chủ","ex":"The server stopped at three."},{"w":"go down (went down)","ipa":"/ɡoʊ daʊn/ (/went daʊn/)","vi":"(hệ thống) bị sập, ngừng hoạt động","ex":"The server went down yesterday."},{"w":"monthly","ipa":"/ˈmʌnθli/","vi":"hằng tháng","ex":"We were preparing the monthly report."},{"w":"suddenly","ipa":"/ˈsʌdənli/","vi":"đột nhiên","ex":"The screen suddenly froze."},{"w":"freeze (froze)","ipa":"/friːz/ (/froʊz/)","vi":"(máy tính) bị đơ, treo","ex":"My laptop froze again."},{"w":"lose (lost)","ipa":"/luːz/ (/lɔːst/)","vi":"mất, làm mất","ex":"Did you lose everything?"},{"w":"backup","ipa":"/ˈbækʌp/","vi":"bản sao lưu","ex":"I was checking the backup."},{"w":"luckily","ipa":"/ˈlʌkɪli/","vi":"may mắn là, may mà","ex":"Luckily, we found a copy."}],"grammar":{"t":"Thì quá khứ tiếp diễn với WHEN và WHILE","d":"Quá khứ tiếp diễn (was/were + V-ing) nói một việc ĐANG diễn ra tại một lúc trong quá khứ, giống \"lúc đó đang...\" trong tiếng Việt. Ta hay dùng nó cùng quá khứ đơn: việc dài đang diễn ra (tiếp diễn) thì bị một việc ngắn chen vào (quá khứ đơn). WHILE đi với việc dài, WHEN thường đi với việc ngắn.","formula":["Khẳng định: S + was/were + V-ing (I was writing. We were working.)","Phủ định: S + wasn't/weren't + V-ing","Câu hỏi: (Wh-) + was/were + S + V-ing? (What were you doing?)","Bị cắt ngang: S + was/were + V-ing + when + S + V2 · While + S + was/were + V-ing, S + V2"],"ex":["I/he/she/it → was; you/we/they → were","At three o'clock, we were preparing the report. (lúc ba giờ đang làm)","I was writing the summary when the server went down.","While we were working, the screen suddenly froze.","Minh called IT while I was checking the backup."],"mistakes":[{"wrong":"When the server went down, I preparing the re
