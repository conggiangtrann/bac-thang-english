n âm: an hour, an 8% rise, nhưng a user, a European client)","the + danh từ xác định: đã nhắc trước đó, cả hai bên đều biết, duy nhất, hoặc so sánh nhất (the highest)","Không mạo từ + danh từ số nhiều / không đếm được khi nói chung: Customers prefer…, Data is…"],"ex":["We launched a new app. The app reached 50,000 users.","Customers prefer fast delivery. (khách hàng nói chung)","The customers in our survey were aged 25–40. (nhóm cụ thể)","The North had the highest growth.","There was an 8% rise in sales. (8 đọc là /eɪt/, bắt đầu bằng âm nguyên âm)"],"mistakes":[{"wrong":"We launched new app in March.","right":"We launched a new app in March.","why":"Danh từ đếm được số ít không được đứng một mình; nhắc lần đầu thì dùng a/an."},{"wrong":"The customers prefer online shopping. (ý nói chung)","right":"Customers prefer online shopping.","why":"Nói chung chung về cả nhóm thì không dùng the."},{"wrong":"The North had highest growth.","right":"The North had the highest growth.","why":"So sánh nhất luôn đi với the."}]},"quiz":[{"q":"What are most of Mark's notes about?","o":["Numbers","Articles","Charts"],"a":1},{"q":"Why does Lan write 'the customers' for the survey group?","o":["Because they are a specific group","Because it is a general statement","Because 'customers' starts with a vowel"],"a":0},{"q":"Choose the correct sentence.","o":["There was a 8% rise in sales.","There was the 8% rise in a sales.","There was an 8% rise in sales."],"a":2}],"practice":[{"s":"We launched ___ new app in March.","a":"a","alt":[],"hint":"Nhắc lần đầu, danh từ số ít"},{"s":"___ app reached 50,000 users in its first month.","a":"The","alt":[],"hint":"Người đọc đã biết là ứng dụng nào"},{"s":"There was ___ 8% rise in online sales.","a":"an","alt":[],"hint":"8 đọc là /eɪt/ – âm nguyên âm"},{"s":"The North had ___ highest growth of all regions.","a":"the","alt":[],"hint":"So sánh nhất"},{"s":"___ data in this report comes from our 2025 survey.","a":"The","alt":[],"hint":"Dữ liệu cụ thể (của báo cáo này)"}],"speak":["We launched a new app in March.","For general statements, use no article: 'Customers prefer online shopping.'","Superlatives take 'the'.","I use 'an' before a vowel sound, like 'an hour' and 'an 8% rise'."],"write":{"vi":"Viết một đoạn báo cáo ngắn (ít nhất 100 từ) giới thiệu một sản phẩm hoặc dự án mới của công ty bạn và kết quả của nó. Sau đó tự soát lỗi: gạch chân mọi danh từ và kiểm tra xem đã dùng đúng a/an, the hay không mạo từ chưa.","en":"Write a short report paragraph (at least 100 words) introducing a new product or project at your company and its results. Then proofread it: underline every noun and check that you used a/an, the or no article correctly.","min":100},"summary":["Danh từ đếm được số ít không đứng một mình: cần a/an, the, my, this….","Nhắc lần đầu → a/an; nhắc lại / đã xác định / duy nhất / so sánh nhất → the.","Nói chung chung với số nhiều hoặc không đếm được → không mạo từ.","a/an theo ÂM: an hour, an 8% rise, a user, a European client."]},{"id":"s_idioms","ch":12,"level":"IELTS","title":"Business idioms","vi":"Thành ngữ nơi công sở","goals":["Sau bài này bạn có thể hiểu năm thành ngữ công sở phổ biến khi người bản xứ nói nhanh.","Sau bài này bạn có thể dùng đúng hình thức cố định của từng thành ngữ (on the same page, touch base with…).","Sau bài này bạn có thể biết khi nào nên dùng thành ngữ (nói, chat, email thân mật) và khi nào nên tránh (báo cáo trang trọng, IELTS Writing)."],"story":[{"who":"Mark","en":"Before Sofia joins the call, let's make sure we're on the same page.","vi":"Trước khi Sofia vào cuộc gọi, hãy chắc chắn là chúng ta hiểu giống nhau đã."},{"who":"Lan","en":"On the same page? You mean we all understand and agree on the plan?","vi":"Hiểu giống nhau? Ý anh là tất cả chúng ta đều hiểu và đồng ý với kế hoạch?"},{"who":"Mark","en":"Exactly. She'll probably ask for a ballpark figure for phase two.","vi":"Chính xác. Có lẽ chị ấy sẽ hỏi con số ước lượng cho giai đoạn hai."},{"who":"Lan","en":"A ballpark figure… so a rough estimate, not the exact cost?","vi":"Ballpark figure… vậy là con số ước chừng, không phải chi phí chính xác?"},{"who":"Mark","en":"Right. Let's say forty to fifty thousand dollars.","vi":"Đúng. Cứ nói khoảng bốn mươi đến năm mươi nghìn đô."},{"who":"Sofia","en":"Hi, both. Bad news: our data vendor cancelled, so we're back to square one.","vi":"Chào hai bạn. Tin xấu: nhà cung cấp dữ liệu của chúng tôi hủy hợp đồng, nên chúng ta lại quay về vạch xuất phát."},{"who":"Lan","en":"So we have to start again from the beginning? That's frustrating.","vi":"Vậy là chúng ta phải bắt đầu lại từ đầu? Thật bực mình."},{"who":"Sofia","en":"It is. We need to think outside the box here. Any creative ideas?","vi":"Đúng vậy. Ở đây chúng ta cần nghĩ khác lối mòn. Có ý tưởng sáng tạo nào không?"},{"who":"Lan","en":"What about combining free government data with your own sales records?","vi":"Hay là kết hợp dữ liệu miễn phí của nhà nước với dữ liệu bán hàng của chính chị?"},{"who":"Sofia","en":"Now that's thinking outside the box! Can you check if it's possible?","vi":"Đó mới đúng là nghĩ khác lối mòn! Bạn kiểm tra xem có khả thi không nhé?"},{"who":"Lan","en":"Sure. I'll touch base with you on Thursday with an update.","vi":"Chắc chắn rồi. Tôi sẽ liên lạc lại với chị vào thứ Năm để cập nhật."},{"who":"Mark","en":"Listen to you, Lan! You sound like a native speaker.","vi":"Nghe em nói kìa, Lan! Em nói như người bản xứ vậy."}],"vocab":[{"w":"on the same page","ipa":"/ɑːn ðə seɪm peɪdʒ/","vi":"hiểu giống nhau, đồng thuận","ex":"Are we all on the same page about the budget?"},{"w":"ballpark figure","ipa":"/ˈbɔːlpɑːrk ˈfɪɡjər/","vi":"con số ước lượng","ex":"Can you give me a ballpark figure?"},{"w":"back to square one","ipa":"/bæk tə skwɛr wʌn/","vi":"quay lại từ đầu","ex":"The test failed, so we're back to square one."},{"w":"think outside the box","ipa":"/θɪŋk ˌaʊtˈsaɪd ðə bɑːks/","vi":"nghĩ khác lối mòn, sáng tạo","ex":"We need to think outside the box."},{"w":"touch base (with)","ipa":"/tʌtʃ beɪs/","vi":"liên lạc ngắn để cập nhật","ex":"Let's touch base next week."},{"w":"rough estimate","ipa":"/rʌf ˈɛstəmət/","vi":"ước tính sơ bộ","ex":"This is only a rough estimate."},{"w":"vendor","ipa":"/ˈvɛndər/","vi":"nhà cung cấp","ex":"We are changing our software vendor."},{"w":"frustrating","ipa":"/ˈfrʌstreɪtɪŋ/","vi":"gây bực bội, nản","ex":"The slow server is so frustrating."}],"grammar":{"t":"Thành ngữ công sở: nghĩa, hình thức cố định và mức độ trang trọng","d":"Thành ngữ (idiom) là cụm từ có nghĩa khác với nghĩa từng chữ, nên không thể dịch từng từ. Hình thức của chúng gần như cố định: không bỏ 'the', không đổi giới từ. Thành ngữ làm lời nói tự nhiên trong họp, chat, email thân mật, nhưng nên tránh trong báo cáo trang trọng và bài viết IELTS.","formula":["Đồng thuận / ước lượng: be on the same page (about sth); give a ballpark figure (for sth)","Gặp trở ngại: be back to square one = phải làm lại từ đầu","Liên lạc: touch base with + người (on/about + việc) = liên hệ ngắn để cập nhật","Sáng tạo: think outside the box = nghĩ khác lối mòn"],"ex":["Let's get on the same page before the client meeting.","A ballpark figure is fine. We'll confirm the exact price later.","The vendor pulled out, so we're back to square one.","I'll touch base with you on Friday about the timeline.","Nói / chat: We're back to square one. → Báo cáo trang trọng: The project had to restart from the beginning."],"mistakes":[{"wrong":"We are on same page.","right":"We are on the same page.","why":"Thành ngữ có hình thức cố định, không được bỏ 'the'."},{"wrong":"I will touch base you tomorrow.","right":"I'll touch base with you tomorrow.","why":"touch base luôn cần 'with' trước người."},{"wrong":"Let's back to square one.","right":"We're back to square one. / Let's go back to square one.","why":"'back' không phải động từ; cần be hoặc go."}]},"quiz":[{"q":"What does Mark think Sofia will ask for?","o":["A new contract","A ballpark figure for phase two","A list of vendors"],"a":1},{"q":"Why are they back to square one?","o":["The data vendor cancelled","Lan made a mistake","The budget was cut"],"a":0},{"q":"'Let's touch base on Thursday' means:","o":["Let's start the project again on Thursday","Let's play a game on Thursday","Let's contact each other briefly on Thursday"],"a":2}],"practice":[{"s":"Let's make sure we're all on the same ___.","a":"page","alt":[],"hint":"đồng thuận = on the same …"},{"s":"Can you give me a ___ figure? It doesn't need to be exact.","a":"ballpark","alt":[],"hint":"con số ước lượng"},{"s":"The vendor cancelled, so we're back to square ___.","a":"one","alt":[],"hint":"quay về vạch xuất phát"},{"s":"I'll touch ___ with you on Thursday.","a":"base","alt":[],"hint":"liên lạc ngắn để cập nhật"},{"s":"We need to think outside the ___.","a":"box","alt":[],"hint":"nghĩ khác lối mòn"}],"speak":["Before Sofia joins the call, let's make sure we're on the same page.","Bad news: our data vendor cancelled, so we're back to square one.","We need to think outside the box here.","I'll touch base with you on Thursday with an update."],"write":{"vi":"Viết một tin nhắn Slack/Teams thân mật (ít nhất 120 từ) gửi nhóm của bạn sau một cuộc họp với khách hàng: tóm tắt điều mọi người đã thống nhất, nêu một vấn đề làm dự án phải làm lại, xin một con số ước lượng và hẹn liên lạc lại. Dùng cả năm thành ngữ trong bài.","en":"Write an informal Slack/Teams message (at least 120 words) to your team after a client meeting: summarise what everyone agreed, mention a problem that means part of the project must restart, ask for a rough estimate and arrange to follow up. Use all five idioms from the lesson.","min":120},"summary":["on the same page = hiểu giống nhau; ballpark figure = con số ước lượng.","back to square one = làm lại từ đầu; think outside the box = nghĩ sáng tạo.","touch base with + người = liên lạc ngắn để cập nhật.","Giữ nguyên hình thức thành ngữ; dùng khi nói/chat, tránh trong văn bản trang trọng và IELTS Writing."]},{"id":"s_phrasal","ch":12,"level":"IELTS","title":"Phrasal verbs at work","vi":"Cụm động từ","goals":["Sau bài này bạn có thể dùng bảy cụm động từ thông dụng nơi công sở: set up, follow up, figure out, carry out, run into, put off, come up with.","Sau bài này bạn có thể đặt đúng vị trí tân ngữ, đặc biệt với đại từ (put it off, không phải put off it).","Sau bài này bạn có thể kể về một tuần làm việc bận rộn một cách tự nhiên như người bản xứ."],"story":[{"who":"Lan","en":"You look tired, Mark. Busy week?","vi":"Trông anh mệt quá, Mark. Tuần này bận lắm à?"},{"who":"Mark","en":"Very! On Monday I set up the new reporting server for BrightMart.","vi":"Cực kỳ! Thứ Hai anh cài đặt máy chủ báo cáo mới cho BrightMart."},{"who":"Lan","en":"Did everything go smoothly?","vi":"Mọi thứ có suôn sẻ không?"},{"who":"Mark","en":"Not at all. We ran into a problem with user permissions almost immediately.","vi":"Không hề. Bọn anh gặp ngay vấn đề với quyền truy cập của người dùng."},{"who":"Lan","en":"Did you figure out what caused it?","vi":"Anh có tìm ra nguyên nhân không?"},{"who":"Mark","en":"Eventually, but it took a whole day to figure it out.","vi":"Cuối cùng thì có, nhưng mất cả một ngày mới tìm ra."},{"who":"Lan","en":"So the training session happened as planned?","vi":"Vậy buổi đào tạo vẫn diễn ra theo kế hoạch chứ?"},{"who":"Mark","en":"No, we had to put it off until next week.","vi":"Không, bọn anh phải hoãn nó sang tuần sau."},{"who":"Lan","en":"What about the staff survey for the marketing team?","vi":"Còn khảo sát nhân viên cho nhóm marketing thì sao?"},{"who":"Mark","en":"We carried it out on Wednesday. The results were mixed, so Sofia asked us to come up with three ideas to improve engagement.","vi":"Bọn anh thực hiện nó vào thứ Tư. Kết quả không mấy khả quan, nên Sofia nhờ bọn anh nghĩ ra ba ý tưởng để tăng mức độ gắn kết."},{"who":"Lan","en":"I can help with that. Have you followed up with her yet?","vi":"Em giúp được việc đó. Anh đã liên lạc lại với chị ấy chưa?"},{"who":"Mark","en":"Not yet. I'll follow up first thing tomorrow, after a good night's sleep!","vi":"Chưa. Anh sẽ liên lạc lại ngay sáng mai, sau khi ngủ một giấc thật ngon!"}],"vocab":[{"w":"set up","ipa":"/sɛt ʌp/","vi":"thiết lập, cài đặt, sắp xếp","ex":"IT will set up your laptop."},{"w":"run into","ipa":"/rʌn ˈɪntuː/","vi":"gặp phải (vấn đề)","ex":"We ran into some delays."},{"w":"figure out","ipa":"/ˈfɪɡjər aʊt/","vi":"tìm ra, hiểu ra","ex":"I can't figure out this formula."},{"w":"put off","ipa":"/pʊt ɔːf/","vi":"hoãn lại","ex":"Let's put off the meeting until Friday."},{"w":"carry out","ipa":"/ˈkæri aʊt/","vi":"thực hiện, tiến hành","ex":"We carried out a customer survey."},{"w":"come up with","ipa":"/kʌm ʌp wɪð/","vi":"nghĩ ra (ý tưởng, giải pháp)","ex":"She came up with a great idea."},{"w":"follow up (with/on)","ipa":"/ˈfɑːloʊ ʌp/","vi":"liên lạc lại, theo dõi tiếp","ex":"I'll follow up with the client."},{"w":"permission","ipa":"/pərˈmɪʃən/","vi":"quyền (truy cập), sự cho phép","ex":"You need permission to edit this file."}],"grammar":{"t":"Cụm động từ tách được và không tách được","d":"Cụm động từ (phrasal verb) = động từ + một hoặc hai tiểu từ (up, out, off, into…), và nghĩa thường khác hẳn động từ gốc. Có cụm tách được (tân ngữ đứng giữa hoặc sau), có cụm không tách được. Quy tắc vàng: với cụm tách được, nếu tân ngữ là đại từ (it, them, him) thì BẮT BUỘC đứng giữa.","formula":["Tách được: set up / figure out / carry out / put off + tân ngữ → put off the meeting = put the meeting off","Tân ngữ là đại từ: put it off, figure it out (KHÔNG: put off it, figure out it)","Không tách được: run into + N; follow up with + người / follow up on + việc","Ba từ (không tách): come up with + N"],"ex":["We set up the server. / We set it up.","We had to put off the training. / We had to put it off.","It took a day to figure out the cause. / It took a day to figure it out.","We ran into a problem. (KHÔNG: ran a problem into)","Can you come up with three ideas by Friday?"],"mistakes":[{"wrong":"We had to put off it.","right":"We had to put it off.","why":"Với cụm tách được, đại từ (it, them) phải đứng giữa động từ và tiểu từ."},{"wrong":"We ran a problem into.","right":"We ran into a problem.","why":"run into là cụm không tách được."},{"wrong":"She came up a new idea.","right":"She came up with a new idea.","why":"come up with cần đủ cả ba từ khi nghĩa là 'nghĩ ra'."}]},"quiz":[{"q":"What problem did Mark run into on Monday?","o":["The server was too expensive","A problem with user permissions","Nobody came to the training"],"a":1},{"q":"What did Sofia ask the team to do?","o":["Come up with three ideas","Put off the survey","Set up a new office"],"a":0},{"q":"Choose the correct sentence.","o":["We put off it until Friday.","We put until Friday it off.","We put it off until Friday."],"a":2}],"practice":[{"s":"Mark ___ up the new reporting server on Monday.","a":"set","alt":[],"hint":"thiết lập (quá khứ)"},{"s":"We ___ into a problem with permissions.","a":"ran","alt":[],"hint":"gặp phải (quá khứ của run)"},{"s":"We had to put the training ___ until next week.","a":"off","alt":[],"hint":"hoãn lại"},{"s":"It took a whole day to figure it ___.","a":"out","alt":[],"hint":"tìm ra"},{"s":"Sofia asked us to come up ___ three ideas.","a":"with","alt":[],"hint":"nghĩ ra"}],"speak":["On Monday I set up the new reporting server for BrightMart.","We ran into a problem with user permissions almost immediately.","No, we had to put it off until next week.","Sofia asked us to come up with three ideas to improve engagement."],"write":{"vi":"Viết một email ngắn cho quản lý (ít nhất 120 từ) cập nhật tuần làm việc vừa qua của bạn: việc gì đã thiết lập, vấn đề gì gặp phải, đã tìm ra cách giải quyết thế nào, việc gì phải hoãn, và bạn sẽ liên lạc lại với ai. Dùng ít nhất năm cụm động từ trong bài.","en":"Write a short email to your manager (at least 120 words) updating them on your past week: what you set up, what problems you ran into, how you figured them out, what you had to put off and who you will follow up with. Use at least five phrasal verbs from the lesson.","min":120},"summary":["Cụm động từ = động từ + tiểu từ; nghĩa thường khác động từ gốc, nên học theo cụm.","Tách được: set up, figure out, carry out, put off; đại từ phải đứng giữa: put it off.","Không tách được: run into, follow up with/on, come up with.","Cụm động từ rất phổ biến khi nói; trong văn bản trang trọng có thể thay bằng từ đơn: put off → postpone, carry out → conduct."]},{"id":"x12_1","ch":12,"level":"IELTS","after":"s_phrasal","title":"IELTS Reading: True, False or Not Given","vi":"Đọc hiểu IELTS: True/False/Not Given và paraphrase","goals":["Sau bài này bạn có thể phân biệt rõ TRUE, FALSE và NOT GIVEN trong IELTS Reading.","Sau bài này bạn có thể nhận ra paraphrase (cùng ý, khác từ) giữa câu hỏi và bài đọc.","Sau bài này bạn có thể dùng kỹ thuật skim và scan để tìm thông tin nhanh trong 60 phút."],"story":[{"who":"Narrator","en":"The IELTS Reading test lasts 60 minutes. You read three passages and answer 40 questions.","vi":"Bài thi IELTS Reading kéo dài 60 phút. Bạn đọc ba bài đọc và trả lời 40 câu hỏi."},{"who":"Narrator","en":"One question type confuses many learners: True, False or Not Given.","vi":"Có một dạng câu hỏi làm nhiều người học bối rối: True, False hay Not Given."},{"who":"Narrator","en":"TRUE means the passage says the same thing. FALSE means the passage says the opposite.","vi":"TRUE nghĩa là bài đọc nói cùng một ý. FALSE nghĩa là bài đọc nói điều ngược lại."},{"who":"Narrator","en":"NOT GIVEN means the passage gives no information about it at all.","vi":"NOT GIVEN nghĩa là bài đọc hoàn toàn không có thông tin về điều đó."},{"who":"Narrator","en":"Let's practise. The passage says: 'Most remote workers reported higher productivity, although few were offered training by their employers.'","vi":"Hãy luyện tập. Bài đọc viết: 'Phần lớn người làm việc từ xa cho biết năng suất cao hơn, mặc dù rất ít người được công ty cho đi đào tạo.'"},{"who":"Lan","en":"Statement one: 'The majority of people working from home felt more productive.' I think that's TRUE.","vi":"Câu một: 'Đa số người làm việc tại nhà cảm thấy năng suất hơn.' Em nghĩ là TRUE."},{"who":"Narrator","en":"Correct. 'Most' is paraphrased as 'the majority', and 'remote workers' as 'people working from home'.","vi":"Đúng. 'Most' được diễn đạt lại thành 'the majority', và 'remote workers' thành 'people working from home'."},{"who":"Lan","en":"Statement two: 'Employers provided training to almost all remote staff.' That's FALSE, because the passage says 'few'.","vi":"Câu hai: 'Công ty đã đào tạo gần như toàn bộ nhân viên làm từ xa.' Câu này FALSE, vì bài đọc nói 'few' (rất ít)."},{"who":"Narrator","en":"Well done. The statement contradicts the passage.","vi":"Giỏi lắm. Câu này mâu thuẫn với bài đọc."},{"who":"Lan","en":"Statement three: 'Remote workers earned higher salaries.' Hmm, the passage doesn't mention salaries.","vi":"Câu ba: 'Người làm từ xa có lương cao hơn.' Hừm, bài đọc không nhắc gì đến lương."},{"who":"Narrator","en":"So the answer is NOT GIVEN. Never use your own knowledge to fill the gap.","vi":"Vậy đáp án là NOT GIVEN. Đừng bao giờ dùng hiểu biết riêng để lấp chỗ trống."},{"who":"Narrator","en":"Final tip: skim the passage first for the main idea, then scan for key words and their synonyms.","vi":"Mẹo cuối: đọc lướt bài để nắm ý chính trước, rồi dò tìm từ khóa và các từ đồng nghĩa của chúng."}],"vocab":[{"w":"passage","ipa":"/ˈpæsɪdʒ/","vi":"bài đọc, đoạn văn","ex":"Read the passage and answer the questions."},{"w":"paraphrase","ipa":"/ˈpærəfreɪz/","vi":"diễn đạt lại bằng từ khác","ex":"The question paraphrases the passage."},{"w":"the majority (of)","ipa":"/ðə məˈdʒɔːrəti/","vi":"đa số","ex":"The majority of staff work from home."},{"w":"contradict","ipa":"/ˌkɑːntrəˈdɪkt/","vi":"mâu thuẫn, nói ngược lại","ex":"The new data contradicts our report."},{"w":"skim","ipa":"/skɪm/","vi":"đọc lướt (lấy ý chính)","ex":"Skim the article in two minutes."},{"w":"scan","ipa":"/skæn/","vi":"dò tìm (thông tin cụ thể)","ex":"Scan the table for the year 2020."},{"w":"synonym","ipa":"/ˈsɪnənɪm/","vi":"từ đồng nghĩa","ex":"'Purchase' is a synonym of 'buy'."},{"w":"productivity","ipa":"/ˌproʊdʌkˈtɪvəti/","vi":"năng suất","ex":"Productivity rose by 10%."}],"grammar":{"t":"Logic True / False / Not Given và nhận diện paraphrase","d":"Câu hỏi IELTS gần như không bao giờ lặp lại y nguyên từ trong bài đọc; chúng dùng từ đồng nghĩa và cấu trúc khác (paraphrase). Nhiệm vụ của bạn là so sánh Ý, không so sánh TỪ. Phần khó nhất là phân biệt FALSE (bài đọc nói ngược lại) với NOT GIVEN (bài đọc không nói gì).","formula":["TRUE = bài đọc nói cùng ý (thường bằng từ khác)","FALSE = bài đọc nói ngược lại: most ↔ few, always ↔ rarely, rose ↔ fell","NOT GIVEN = bài đọc không có đủ thông tin để nói đúng hay sai","Paraphrase hay gặp: most → the majority; buy → purchase; help → assist; remote workers → people working from home"],"ex":["Bài đọc: Sales doubled in 2020. / Câu hỏi: Sales rose by 100% in 2020. → TRUE","Bài đọc: Few employees were trained. / Câu hỏi: Most employees received training. → FALSE","Bài đọc: The company opened 10 stores. / Câu hỏi: The stores were profitable. → NOT GIVEN","Skim: đọc tiêu đề, câu đầu mỗi đoạn để biết đoạn nào nói gì.","Scan: tìm tên riêng, con số, năm và từ đồng nghĩa của từ khóa trong câu hỏi."],"mistakes":[{"wrong":"Bài đọc không nói về lương → chọn FALSE.","right":"Bài đọc không nói về lương → chọn NOT GIVEN.","why":"FALSE chỉ khi bài đọc nói ngược lại; không có thông tin là NOT GIVEN."},{"wrong":"Chọn TRUE vì ngoài đời thực điều đó đúng.","right":"Chỉ dựa vào thông tin trong bài đọc.","why":"IELTS chấm theo bài đọc, không theo kiến thức riêng của bạn."},{"wrong":"Chỉ tìm đúng từ giống hệt câu hỏi.","right":"Tìm cả từ đồng nghĩa và cách diễn đạt khác.","why":"Câu hỏi thường paraphrase; tìm từ giống hệt dễ bị lạc hoặc mắc bẫy."}]},"quiz":[{"q":"How many questions are there in the IELTS Reading test?","o":["30","40","60"],"a":1},{"q":"Why is statement three NOT GIVEN?","o":["The passage says the opposite","The passage says the same thing","The passage doesn't mention salaries"],"a":2},{"q":"Passage: 'Few staff were trained.' Statement: 'Most staff were trained.' The answer is:","o":["FALSE","TRUE","NOT GIVEN"],"a":0}],"practice":[{"s":"'Most' is often paraphrased as 'the ___'.","a":"majority","alt":[],"hint":"đa số"},{"s":"If the passage says the opposite, the answer is ___.","a":"FALSE","alt":["false","False"],"hint":"ngược lại với bài đọc"},{"s":"If the passage has no information, the answer is NOT ___.","a":"GIVEN","alt":["given","Given"],"hint":"không có thông tin"},{"s":"To find a name or a number quickly, you ___ the passage.","a":"scan","alt":[],"hint":"dò tìm thông tin cụ thể"},{"s":"To get the main idea quickly, you ___ the passage first.","a":"skim","alt":[],"hint":"đọc lướt lấy ý chính"}],"speak":["TRUE means the passage says the same thing.","FALSE means the passage says the opposite.","NOT GIVEN means the passage gives no information about it at all.","Never use your own knowledge to fill the gap."],"write":{"vi":"Chọn một đoạn tin tức tiếng Anh ngắn (khoảng 100 từ) về công nghệ hoặc kinh doanh. Viết lại đoạn đó bằng cách paraphrase (dùng từ đồng nghĩa và cấu trúc khác, giữ nguyên ý), rồi tự viết ba câu True/False/Not Given kèm đáp án và giải thích ngắn.","en":"Choose a short English news paragraph (about 100 words) about technology or business. Paraphrase it (use synonyms and different structures, keep the meaning), then write three True/False/Not Given statements about it with answers and short explanations.","min":120},"summary":["IELTS Reading: 60 phút, 3 bài đọc, 40 câu hỏi.","TRUE = cùng ý; FALSE = ngược ý; NOT GIVEN = không có thông tin.","So sánh Ý chứ không so sánh TỪ: câu hỏi luôn paraphrase bài đọc.","Skim để nắm ý chính, scan để tìm từ khóa, con số và từ đồng nghĩa."]},{"id":"s_task1","ch":12,"level":"IELTS","title":"IELTS Task 1: describing trends","vi":"Mô tả biểu đồ chuẩn IELTS","goals":["Sau bài này bạn có thể viết câu mở bài paraphrase đề và câu overview nêu xu hướng chính.","Sau bài này bạn có thể mô tả xu hướng bằng động từ, danh từ và trạng từ chính xác (rose sharply, a steady increase).","Sau bài này bạn có thể ước lượng số liệu (roughly, just over, just under) và so sánh các đường trên biểu đồ."],"story":[{"who":"Narrator","en":"In IELTS Academic Writing Task 1, you describe a graph, chart, table, map or process in at least 150 words.","vi":"Trong IELTS Academic Writing Task 1, bạn mô tả một biểu đồ đường, biểu đồ cột, bảng, bản đồ hoặc quy trình với ít nhất 150 từ."},{"who":"Narrator","en":"You should spend about 20 minutes on it, because Task 2 needs the other 40 minutes.","vi":"Bạn nên dành khoảng 20 phút cho phần này, vì Task 2 cần 40 phút còn lại."},{"who":"Narrator","en":"Our practice graph shows the percentage of adults using the internet in Countries A, B and C from 2000 to 2020.","vi":"Biểu đồ luyện tập của chúng ta cho thấy tỷ lệ phần trăm người trưởng thành dùng internet ở các nước A, B và C từ năm 2000 đến 2020."},{"who":"Narrator","en":"Step one: paraphrase the question. 'The line graph illustrates the proportion of adults who used the internet in three countries over a twenty-year period.'","vi":"Bước một: diễn đạt lại đề bài. 'Biểu đồ đường minh họa tỷ lệ người trưởng thành sử dụng internet ở ba quốc gia trong khoảng thời gian hai mươi năm.'"},{"who":"Narrator","en":"Step two: write an overview. Examiners look for it, and many candidates forget it.","vi":"Bước hai: viết phần tổng quan. Giám khảo luôn tìm phần này, và nhiều thí sinh lại quên nó."},{"who":"Narrator","en":"'Overall, internet use rose sharply in all three countries, and Country A had the highest rate throughout the period.'","vi":"'Nhìn chung, việc sử dụng internet tăng mạnh ở cả ba nước, và nước A có tỷ lệ cao nhất trong suốt giai đoạn.'"},{"who":"Narrator","en":"Notice: there are no detailed numbers in the overview, only the main trends.","vi":"Lưu ý: phần tổng quan không có số liệu chi tiết, chỉ có các xu hướng chính."},{"who":"Narrator","en":"Step three: describe the details with accurate trend vocabulary.","vi":"Bước ba: mô tả chi tiết bằng từ vựng xu hướng chính xác."},{"who":"Narrator","en":"'In Country A, the figure climbed steadily from roughly 40% in 2000 to just over 90% in 2020.'","vi":"'Ở nước A, con số tăng đều đặn từ khoảng 40% năm 2000 lên hơn 90% một chút vào năm 2020.'"},{"who":"Narrator","en":"'By contrast, Country C started at just under 10%, but there was a dramatic increase after 2010.'","vi":"'Ngược lại, nước C bắt đầu ở mức dưới 10% một chút, nhưng có một sự tăng vọt sau năm 2010.'"},{"who":"Narrator","en":"Step four: compare. 'In 2000, Country B's rate was about half that of Country A, but the gap was much smaller by 2020.'","vi":"Bước bốn: so sánh. 'Năm 2000, tỷ lệ của nước B bằng khoảng một nửa nước A, nhưng đến năm 2020 khoảng cách đã nhỏ hơn nhiều.'"},{"who":"Narrator","en":"Finally, never give your opinion in Task 1. Just report what the graph shows.","vi":"Cuối cùng, đừng bao giờ nêu ý kiến cá nhân trong Task 1. Chỉ báo cáo những gì biểu đồ thể hiện."}],"vocab":[{"w":"overview","ipa":"/ˈoʊvərvjuː/","vi":"phần tổng quan (xu hướng chính)","ex":"Write the overview after the introduction."},{"w":"illustrate","ipa":"/ˈɪləstreɪt/","vi":"minh họa, thể hiện","ex":"The chart illustrates sales by region."},{"w":"proportion","ipa":"/prəˈpɔːrʃən/","vi":"tỷ lệ","ex":"The proportion of young users is growing."},{"w":"sharply","ipa":"/ˈʃɑːrpli/","vi":"mạnh, đột ngột","ex":"Prices rose sharply in May."},{"w":"steadily","ipa":"/ˈstɛdəli/","vi":"đều đặn","ex":"The number grew steadily."},{"w":"roughly","ipa":"/ˈrʌfli/","vi":"khoảng, xấp xỉ","ex":"Roughly 30% of users are students."},{"w":"throughout","ipa":"/θruːˈaʊt/","vi":"suốt, trong suốt","ex":"Sales were stable throughout the year."},{"w":"plateau","ipa":"/plæˈtoʊ/","vi":"chững lại, đi ngang (sau khi tăng)","ex":"Growth plateaued at around 60%."}],"grammar":{"t":"Bố cục Task 1, từ vựng xu hướng và cách ước lượng","d":"Task 1 (Academic) là bài báo cáo khách quan: mô tả và so sánh, không giải thích nguyên nhân, không nêu ý kiến. Bài tốt có 4 đoạn: mở bài (paraphrase đề), overview (2 xu hướng chính, không số liệu), 2 đoạn chi tiết (số liệu chọn lọc + so sánh). Lưu ý: bản General Training thì Task 1 là viết thư, không phải tả biểu đồ.","formula":["Bố cục: Mở bài (paraphrase đề) → Overview (Overall, …) → 2 đoạn chi tiết có số liệu và so sánh","Xu hướng: S + rose / fell / climbed / dropped + sharply / steadily / slightly + from X to Y  |  There was a + sharp / steady / slight + rise / fall + in + N","Ước lượng: roughly / about / approximately 40%; just over / just under 10%; nearly half","So sánh: the highest / the lowest; about half that of…; whereas / by contrast"],"ex":["Động từ + trạng từ: Internet use rose sharply.","Tính từ + danh từ: There was a sharp rise in internet use.","Ước lượng: 41% → roughly 40%; 91% → just over 90%; 9% → just under 10%.","Overview: Overall, all three countries saw a rise, with Country A leading throughout.","Không viết: In my opinion, Country C is developing well."],"mistakes":[{"wrong":"Internet use increased sharp.","right":"Internet use increased sharply. / There was a sharp increase in internet use.","why":"Bổ nghĩa cho động từ dùng trạng từ (sharply); đi với danh từ dùng tính từ (sharp)."},{"wrong":"The number of internet use rose.","right":"The proportion of adults using the internet rose.","why":"'number of' đi với danh từ đếm được số nhiều (users); 'use' không đếm được, hơn nữa biểu đồ đang nói về phần trăm."},{"wrong":"In my opinion, Country A is the best.","right":"Country A had the highest rate throughout the period.","why":"Task 1 chỉ mô tả số liệu, không đưa ý kiến hay đánh giá."}]},"quiz":[{"q":"How many words must you write in Task 1?","o":["At least 250","At least 150","Exactly 100"],"a":1},{"q":"What should the overview include?","o":["Main trends, without detailed numbers","Your opinion","Every number in the graph"],"a":0},{"q":"Choose the correct sentence.","o":["Sales rose sharp in 2010.","There was a sharply rise in sales in 2010.","There was a sharp rise in sales in 2010."],"a":2}],"practice":[{"s":"___, internet use rose in all three countries.","a":"Overall","alt":["In general"],"hint":"Câu mở đầu overview"},{"s":"The figure climbed ___ from 40% to 90%.","a":"steadily","alt":[],"hint":"đều đặn (trạng từ)"},{"s":"Country C started at just ___ 10% (it was 9%).","a":"under","alt":["below"],"hint":"thấp hơn một chút"},{"s":"There was a ___ rise in Country C after 2010.","a":"sharp","alt":["dramatic","steep"],"hint":"mạnh, đột ngột (tính từ)"},{"s":"The line graph ___ the proportion of adults who used the internet.","a":"illustrates","alt":["shows"],"hint":"minh họa (động từ, số ít)"}],"speak":["The line graph illustrates the proportion of adults who used the internet in three countries over a twenty-year period.","Overall, internet use rose sharply in all three countries, and Country A had the highest rate throughout the period.","In Country A, the figure climbed steadily from roughly 40% in 2000 to just over 90% in 2020.","By contrast, Country C started at just under 10%, but there was a dramatic increase after 2010."],"write":{"vi":"Dữ liệu: Tỷ lệ khách hàng của một chuỗi bán lẻ mua hàng online: 2019: 15%, 2021: 35%, 2023: 50%, 2025: 52%. Tỷ lệ mua tại cửa hàng: 2019: 85%, 2021: 65%, 2023: 50%, 2025: 48%. Viết một bài Task 1 hoàn chỉnh: mở bài, overview, hai đoạn chi tiết có ước lượng và so sánh. Luyện ít nhất 120 từ (bài thi thật cần ít nhất 150 từ).","en":"Data: share of a retail chain's customers who shop online: 2019: 15%, 2021: 35%, 2023: 50%, 2025: 52%. Share who shop in stores: 2019: 85%, 2021: 65%, 2023: 50%, 2025: 48%. Write a complete Task 1 report: introduction, overview and two detail paragraphs with approximations and comparisons. Practise with at least 120 words (the real test needs at least 150).","min":120},"summary":["Task 1 Academic: ít nhất 150 từ, khoảng 20 phút; chỉ mô tả, không nêu ý kiến.","Bố cục 4 đoạn: paraphrase đề → overview (Overall, …, không số liệu) → 2 đoạn chi tiết.","Xu hướng: rose sharply (động từ + trạng từ) = a sharp rise (tính từ + danh từ).","Ước lượng và so sánh: roughly, just over/under, about half, the highest, by contrast."]},{"id":"s_task2","ch":12,"level":"IELTS","title":"IELTS Task 2: opinion essays","vi":"Viết bài luận nêu quan điểm","goals":["Sau bài này bạn có thể lập dàn ý trong 5 phút và viết câu luận điểm (thesis statement) rõ ràng.","Sau bài này bạn có thể viết đoạn thân bài theo trình tự: câu chủ đề → giải thích → ví dụ.","Sau bài này bạn có thể viết kết bài nhắc lại quan điểm mà không thêm ý mới."],"story":[{"who":"Narrator","en":"IELTS Writing Task 2 asks for an essay of at least 250 words, and you should spend about 40 minutes on it.","vi":"IELTS Writing Task 2 yêu cầu một bài luận ít nhất 250 từ, và bạn nên dành khoảng 40 phút cho nó."},{"who":"Narrator","en":"It is worth twice as many marks as Task 1, so never leave it until the last few minutes.","vi":"Phần này có trọng số gấp đôi Task 1, nên đừng bao giờ để đến mấy phút cuối mới làm."},{"who":"Narrator","en":"Today's question: 'Some people believe that working from home benefits both employees and companies. To what extent do you agree or disagree?'","vi":"Đề hôm nay: 'Một số người cho rằng làm việc tại nhà có lợi cho cả nhân viên lẫn công ty. Bạn đồng ý hay không đồng ý đến mức nào?'"},{"who":"Narrator","en":"First, spend about five minutes planning. Decide your position before you write a single word.","vi":"Đầu tiên, dành khoảng năm phút lập dàn ý. Quyết định quan điểm của bạn trước khi viết bất kỳ chữ nào."},{"who":"Narrator","en":"Let's say you partly agree. Your thesis statement must make that position clear.","vi":"Giả sử bạn đồng ý một phần. Câu luận điểm phải thể hiện rõ quan điểm đó."},{"who":"Narrator","en":"'While working from home offers employees greater flexibility, I believe it can harm teamwork and company culture.'","vi":"'Mặc dù làm việc tại nhà mang lại cho nhân viên sự linh hoạt hơn, tôi cho rằng nó có thể gây hại cho tinh thần đồng đội và văn hóa công ty.'"},{"who":"Narrator","en":"Each body paragraph starts with a topic sentence that supports the thesis.","vi":"Mỗi đoạn thân bài bắt đầu bằng một câu chủ đề ủng hộ luận điểm."},{"who":"Narrator","en":"Body one: 'The main advantage of remote work is that employees save time and money on commuting.'","vi":"Thân bài một: 'Lợi ích chính của làm việc từ xa là nhân viên tiết kiệm được thời gian và tiền bạc cho việc đi lại.'"},{"who":"Narrator","en":"Then explain the idea and give a specific example, such as an analyst who gains two extra hours a day.","vi":"Sau đó giải thích ý và đưa ví dụ cụ thể, chẳng hạn một chuyên viên phân tích có thêm hai giờ mỗi ngày."},{"who":"Narrator","en":"Body two: 'On the other hand, remote teams often find it harder to share ideas and train new staff.'","vi":"Thân bài hai: 'Mặt khác, các nhóm làm từ xa thường khó chia sẻ ý tưởng và đào tạo nhân viên mới hơn.'"},{"who":"Narrator","en":"The conclusion restates your opinion in new words. Never add a new idea here.","vi":"Kết bài nhắc lại quan điểm của bạn bằng từ ngữ mới. Đừng bao giờ thêm ý mới ở đây."},{"who":"Narrator","en":"'In conclusion, although remote work has clear benefits for individuals, companies should keep some office days to protect teamwork.'","vi":"'Tóm lại, mặc dù làm việc từ xa có lợi ích rõ ràng cho từng cá nhân, các công ty nên giữ một số ngày làm tại văn phòng để bảo vệ tinh thần đồng đội.'"},{"who":"Narrator","en":"Remember: four or five paragraphs, one clear opinion, and a few minutes at the end to check your grammar.","vi":"Hãy nhớ: bốn hoặc năm đoạn, một quan điểm rõ ràng, và vài phút cuối để soát ngữ pháp."}],"vocab":[{"w":"thesis statement","ipa":"/ˈθiːsɪs ˈsteɪtmənt/","vi":"câu luận điểm (nêu quan điểm chính)","ex":"Put your thesis statement in the introduction."},{"w":"to what extent","ipa":"/tə wʌt ɪkˈstɛnt/","vi":"đến mức nào","ex":"To what extent do you agree?"},{"w":"position","ipa":"/pəˈzɪʃən/","vi":"quan điểm, lập trường","ex":"Make your position clear."},{"w":"flexibility","ipa":"/ˌflɛksəˈbɪləti/","vi":"sự linh hoạt","ex":"Remote work gives employees more flexibility."},{"w":"commute","ipa":"/kəˈmjuːt/","vi":"đi lại (từ nhà đến nơi làm)","ex":"My commute takes an hour."},{"w":"remote work","ipa":"/rɪˈmoʊt wɜːrk/","vi":"làm việc từ xa","ex":"Remote work became common after 2020."},{"w":"harm","ipa":"/hɑːrm/","vi":"gây hại","ex":"Long hours can harm your health."},{"w":"restate","ipa":"/riːˈsteɪt/","vi":"nhắc lại (bằng cách nói khác)","ex":"Restate your opinion in the conclusion."}],"grammar":{"t":"Bố cục bài luận nêu quan điểm (opinion essay)","d":"Bài Task 2 dạng 'To what extent do you agree or disagree?' cần MỘT quan điểm rõ ràng, giữ nhất quán từ mở bài đến kết bài. Mỗi đoạn thân bài phát triển một ý chính: câu chủ đề nêu ý, câu sau giải thích vì sao, rồi ví dụ cụ thể chứng minh. Giám khảo chấm cả việc trả lời đúng đề, bố cục mạch lạc, từ vựng và ngữ pháp.","formula":["Mở bài: Paraphrase đề + Thesis: I (strongly) believe that… / While…, I believe…","Thân bài (2 đoạn): Topic sentence → Giải thích (This is because…) → Ví dụ (For example, … / For instance, …)","Kết bài: In conclusion, + nhắc lại quan điểm bằng từ khác, không thêm ý mới"],"ex":["Thesis (đồng ý hoàn toàn): I strongly believe that remote work benefits both sides.","Thesis (đồng ý một phần): While remote work offers flexibility, I believe it can harm teamwork.","Topic sentence: The main advantage of remote work is that employees save time on commuting.","Giải thích + ví dụ: This is because… For example, an analyst in Hanoi can save two hours a day.","Kết bài: In conclusion, although…, companies should…"],"mistakes":[{"wrong":"In my opinion, I think that remote work is good.","right":"In my opinion, remote work is beneficial. / I believe remote work is beneficial.","why":"In my opinion và I think cùng nghĩa; dùng cả hai là lặp ý."},{"wrong":"For example, my friend.","right":"For example, my friend saves two hours a day by working from home.","why":"Ví dụ phải là một câu hoàn chỉnh có chủ ngữ và động từ."},{"wrong":"Nowadays, technology is developing very fast and has many advantages and disadvantages.","right":"Some people argue that working from home benefits both employees and employers.","why":"Câu mở bài học thuộc lòng, chung chung không ăn điểm; hãy paraphrase đúng đề bài."}]},"quiz":[{"q":"How long should you spend on Task 2?","o":["About 20 minutes","About 60 minutes","About 40 minutes"],"a":2},{"q":"What should you never do in the conclusion?","o":["Add a new idea","Restate your opinion","Use 'In conclusion'"],"a":0},{"q":"Which is the best thesis statement?","o":["Remote work has many good and bad sides.","While remote work offers flexibility, I believe it can harm teamwork.","In my opinion, I think remote work is good and bad."],"a":1}],"practice":[{"s":"I strongly ___ that companies should offer flexible hours.","a":"believe","alt":[],"hint":"Tôi tin chắc rằng…"},{"s":"The main advantage of remote work ___ that employees save time.","a":"is","alt":[],"hint":"Động từ to be (số ít)"},{"s":"For ___, an analyst can save two hours a day.","a":"example","alt":["instance"],"hint":"Ví dụ…"},{"s":"On the other ___, remote teams find it harder to share ideas.","a":"hand","alt":[],"hint":"Mặt khác…"},{"s":"In ___, companies should keep some office days.","a":"conclusion","alt":[],"hint":"Tóm lại (mở đầu kết bài)"}],"speak":["Decide your position before you write a single word.","While working from home offers employees greater flexibility, I believe it can harm teamwork and company culture.","The main advantage of remote work is that employees save time and money on commuting.","The conclusion restates your opinion in new words."],"write":{"vi":"Đề: 'Some people think that companies should allow employees to choose their own working hours. To what extent do you agree or disagree?' Viết mở bài có câu luận điểm và một đoạn thân bài hoàn chỉnh (câu chủ đề, giải thích, ví dụ). Luyện ít nhất 120 từ (bài thi thật cần ít nhất 250 từ cho cả bài).","en":"Question: 'Some people think that companies should allow employees to choose their own working hours. To what extent do you agree or disagree?' Write an introduction with a thesis statement and one full body paragraph (topic sentence, explanation, example). Practise with at least 120 words (the full essay in the real test needs at least 250).","min":120},"summary":["Task 2: ít nhất 250 từ, khoảng 40 phút, trọng số gấp đôi Task 1.","Dành ~5 phút lập dàn ý, chọn MỘT quan điểm và viết thesis statement rõ ràng.","Thân bài: topic sentence → giải thích → ví dụ cụ thể (câu hoàn chỉnh).","Kết bài: In conclusion, nhắc lại quan điểm bằng từ khác, không thêm ý mới."]},{"id":"x12_2","ch":12,"level":"IELTS","after":"s_task2","title":"IELTS Listening: avoiding the traps","vi":"Nghe IELTS: bẫy đáp án và đánh vần","goals":["Sau bài này bạn có thể nhận ra tín hiệu sửa lời (Sorry, I mean… / Actually…) để tránh bẫy đáp án.","Sau bài này bạn có thể tuân thủ giới hạn từ như NO MORE THAN TWO WORDS AND/OR A NUMBER.","Sau bài này bạn có thể nghe và viết đúng chính tả tên, số và ngày tháng trong Part 1."],"story":[{"who":"Narrator","en":"The IELTS Listening test has four parts and 40 questions, and you hear each recording only once.","vi":"Bài thi IELTS Listening có bốn phần và 40 câu hỏi, và bạn chỉ được nghe mỗi đoạn ghi âm một lần."},{"who":"Narrator","en":"Part 1 is a conversation about an everyday situation, often with a form to complete.","vi":"Part 1 là một cuộc hội thoại về tình huống thường ngày, thường kèm một mẫu đơn cần điền."},{"who":"Narrator","en":"Listen to this sample. The instructions say: write NO MORE THAN TWO WORDS AND/OR A NUMBER.","vi":"Hãy nghe ví dụ này. Đề yêu cầu: viết KHÔNG QUÁ HAI TỪ VÀ/HOẶC MỘT CON SỐ."},{"who":"Receptionist","en":"Good morning, Riverside Conference Centre. How can I help you?","vi":"Chào buổi sáng, Trung tâm Hội nghị Riverside xin nghe. Tôi có thể giúp gì cho anh?"},{"who":"Minh","en":"Hi, I'd like to book a room for a workshop on the 14th. Sorry, I mean the 15th.","vi":"Chào chị, tôi muốn đặt một phòng cho buổi hội thảo vào ngày 14. Xin lỗi, ý tôi là ngày 15."},{"who":"Receptionist","en":"No problem. How many people are you expecting?","vi":"Không sao ạ. Anh dự kiến bao nhiêu người?"},{"who":"Minh","en":"About thirty. Actually, make that forty. Two more teams are joining us.","vi":"Khoảng ba mươi. À không, cho tôi sửa là bốn mươi. Có thêm hai nhóm tham gia."},{"who":"Receptionist","en":"And could I have your surname, please?","vi":"Cho tôi xin họ của anh được không ạ?"},{"who":"Minh","en":"Sure. It's Nguyen. That's N-G-U-Y-E-N.","vi":"Vâng. Là Nguyen. Đánh vần là N-G-U-Y-E-N."},{"who":"Narrator","en":"Did you notice the traps? The speaker changed both the date and the number of people.","vi":"Bạn có nhận ra các cái bẫy không? Người nói đã đổi cả ngày lẫn số người."},{"who":"Narrator","en":"These are called distractors. The first answer you hear is often not the final one.","vi":"Chúng được gọi là đáp án gây nhiễu. Đáp án đầu tiên bạn nghe thường không phải đáp án cuối cùng."},{"who":"Narrator","en":"So the answers are 15th, 40 and Nguyen. The spelling must be correct, or you lose the mark.","vi":"Vậy đáp án là 15th, 40 và Nguyen. Chính tả phải đúng, nếu không bạn sẽ mất điểm câu đó."}],"vocab":[{"w":"recording","ipa":"/rɪˈkɔːrdɪŋ/","vi":"đoạn ghi âm","ex":"You hear the recording only once."},{"w":"instructions","ipa":"/ɪnˈstrʌkʃənz/","vi":"lời hướng dẫn, yêu cầu đề","ex":"Read the instructions carefully."},{"w":"form completion","ipa":"/fɔːrm kəmˈpliːʃən/","vi":"dạng bài điền vào mẫu đơn","ex":"Part 1 often has form completion."},{"w":"word limit","ipa":"/wɜːrd ˈlɪmɪt/","vi":"giới hạn số từ","ex":"Check the word limit before you write."},{"w":"distractor","ipa":"/dɪˈstræktər/","vi":"đáp án gây nhiễu","ex":"The first number was a distractor."},{"w":"trap","ipa":"/træp/","vi":"cái bẫy","ex":"Don't fall into the trap."},{"w":"workshop","ipa":"/ˈwɜːrkʃɑːp/","vi":"buổi hội thảo thực hành","ex":"The workshop starts at nine."},{"w":"surname","ipa":"/ˈsɜːrneɪm/","vi":"họ","ex":"Could you spell your surname?"}],"grammar":{"t":"Nhận diện bẫy (distractor) và tín hiệu sửa lời","d":"Trong IELTS Listening, người nói thường đưa ra một thông tin rồi tự sửa lại. Thông tin đầu là bẫy; đáp án đúng nằm SAU tín hiệu sửa lời. Ngoài ra, bạn phải viết đúng chính tả và không vượt quá giới hạn từ của đề, nếu không câu đó bị tính sai dù bạn nghe đúng.","formula":["Tín hiệu sửa lời: Sorry, I mean… / Actually, … / No, wait… / Make that… / It's been changed to… → đáp án nằm SAU tín hiệu","Giới hạn từ: NO MORE THAN TWO WORDS AND/OR A NUMBER → tối đa 2 từ, có thể kèm 1 con số","Trước khi nghe: đọc câu hỏi, gạch chân từ khóa, đoán loại thông tin cần điền (tên, ngày, số, địa chỉ)"],"ex":["'The 14th. Sorry, I mean the 15th.' → đáp án: 15th","'About thirty. Actually, make that forty.' → đáp án: 40","Đề 'ONE WORD ONLY', bạn nghe 'a large room' → viết: large (không viết 'large room')","Đánh vần dễ nhầm: A /eɪ/ và E /iː/; G /dʒiː/ và J /dʒeɪ/","Số dễ nhầm: fifteen /fɪfˈtiːn/ (nhấn cuối) và fifty /ˈfɪfti/ (nhấn đầu)"],"mistakes":[{"wrong":"Viết ngay con số đầu tiên nghe được: 14th.","right":"Nghe tiếp đến hết câu: 'Sorry, I mean the 15th' → 15th.","why":"Người nói hay tự sửa; đáp án nằm sau tín hiệu sửa lời."},{"wrong":"fourty","right":"forty","why":"Lỗi chính tả rất phổ biến: four có 'u' nhưng forty thì không. Sai chính tả là mất điểm."},{"wrong":"Đề cho tối đa hai từ, viết: 'a big conference room'.","right":"Viết: 'conference room'.","why":"Vượt quá giới hạn từ thì câu trả lời bị tính sai."}]},"quiz":[{"q":"How many people will come to the workshop?","o":["Forty","Thirty","Fourteen"],"a":0},{"q":"What is the date of the workshop?","o":["The 14th","The 13th","The 15th"],"a":2},{"q":"What should you do when a speaker says 'Actually, …'?","o":["Stop listening","Expect the answer to change","Write the first answer you heard"],"a":1}],"practice":[{"s":"The 14th. Sorry, I ___ the 15th.","a":"mean","alt":[],"hint":"tín hiệu tự sửa lời"},{"s":"About thirty. Actually, make ___ forty.","a":"that","alt":[],"hint":"Make ___ + số mới"},{"s":"The number 40 is spelled ___.","a":"forty","alt":[],"hint":"Không có chữ 'u'"},{"s":"In IELTS Listening, you hear each recording only ___.","a":"once","alt":[],"hint":"một lần"},{"s":"Wrong answers that you hear first are called ___.","a":"distractors","alt":["distracters"],"hint":"đáp án gây nhiễu (số nhiều)"}],"speak":["Part 1 is a conversation about an everyday situation, often with a form to complete.","Sorry, I mean the 15th.","About thirty. Actually, make that forty.","The first answer you hear is often not the final one."],"write":{"vi":"Viết một đoạn hội thoại Part 1 (ít nhất 120 từ) giữa nhân viên lễ tân khách sạn và một khách đặt phòng cho chuyến công tác. Cài vào ít nhất ba cái bẫy (người nói tự sửa ngày, số người, giá…) và một chỗ đánh vần tên. Cuối bài, viết đáp án đúng cho ba câu hỏi điền mẫu đơn.","en":"Write a Part 1 conversation (at least 120 words) between a hotel receptionist and a guest booking a room for a business trip. Include at least three traps (the speaker corrects the date, the number of people, the price…) and one spelled name. At the end, write the correct answers to three form-completion questions.","min":120},"summary":["IELTS Listening: 4 phần, 40 câu, mỗi đoạn ghi âm chỉ nghe một lần.","Đáp án thường nằm SAU tín hiệu sửa lời: Sorry, I mean… / Actually… / Make that….","Tuân thủ giới hạn từ và viết đúng chính tả (forty, không phải fourty).","Đọc trước câu hỏi, đoán loại thông tin cần nghe (tên, ngày, số)."]},{"id":"s_part2","ch":12,"level":"IELTS","title":"IELTS Speaking Part 2","vi":"Nói 2 phút theo cue card","goals":["Sau bài này bạn có thể dùng 1 phút chuẩn bị để ghi ý theo các gợi ý trên cue card.","Sau bài này bạn có thể kể chuyện bằng quá khứ đơn và quá khứ tiếp diễn một cách tự nhiên.","Sau bài này bạn có thể nói liên tục 1–2 phút với bố cục rõ ràng và từ đệm tự nhiên."],"story":[{"who":"Examiner","en":"Now I'm going to give you a topic, and I'd like you to talk about it for one to two minutes. You have one minute to prepare, and you can make some notes.","vi":"Bây giờ tôi sẽ đưa bạn một chủ đề, và tôi muốn bạn nói về nó trong một đến hai phút. Bạn có một phút để chuẩn bị và có thể ghi chú."},{"who":"Examiner","en":"Describe a challenge you faced at work. You should say what it was, when it happened, how you dealt with it, and explain how you felt about it.","vi":"Hãy mô tả một thử thách bạn gặp trong công việc. Bạn nên nói đó là gì, xảy ra khi nào, bạn đã xử lý ra sao, và giải thích bạn cảm thấy thế nào về nó."},{"who":"Lan","en":"Okay. Well, I'd like to talk about a time when our main database crashed, about two years ago.","vi":"Vâng. À, tôi muốn kể về lần cơ sở dữ liệu chính của chúng tôi bị sập, khoảng hai năm trước."},{"who":"Lan","en":"I was working at DataPeak, and we were preparing a quarterly report for an important client.","vi":"Khi đó tôi đang làm ở DataPeak, và chúng tôi đang chuẩn bị báo cáo quý cho một khách hàng quan trọng."},{"who":"Lan","en":"The deadline was the next morning, and suddenly the database stopped responding.","vi":"Hạn chót là sáng hôm sau, và đột nhiên cơ sở dữ liệu ngừng phản hồi."},{"who":"Lan","en":"To be honest, at first I didn't know what to do. Everyone was panicking.","vi":"Thành thật mà nói, lúc đầu tôi không biết phải làm gì. Mọi người đều hoảng loạn."},{"who":"Lan","en":"So what I did was break the problem into small steps.","vi":"Vậy nên điều tôi làm là chia vấn đề thành từng bước nhỏ."},{"who":"Lan","en":"I contacted the IT team, and while they were fixing the server, I rebuilt the key tables from our backups.","vi":"Tôi liên hệ nhóm IT, và trong khi họ sửa máy chủ, tôi dựng lại các bảng quan trọng từ bản sao lưu."},{"who":"Lan","en":"We finally sent the report at about six in the morning, just in time.","vi":"Cuối cùng chúng tôi gửi báo cáo lúc khoảng sáu giờ sáng, vừa kịp lúc."},{"who":"Lan","en":"As for how I felt, I was exhausted, but also really proud of the team.","vi":"Còn về cảm xúc, tôi kiệt sức, nhưng cũng thực sự tự hào về cả nhóm."},{"who":"Lan","en":"Looking back, it taught me to stay calm under pressure. So, that's my story.","vi":"Nhìn lại, việc đó dạy tôi giữ bình tĩnh dưới áp lực. Vâng, câu chuyện của tôi là vậy."},{"who":"Examiner","en":"Thank you. Do you think you would handle it differently now?","vi":"Cảm ơn bạn. Bạn có nghĩ bây giờ bạn sẽ xử lý khác đi không?"},{"who":"Lan","en":"Yes, I think I'd test our backups more often, so we could recover even faster.","vi":"Có, tôi nghĩ tôi sẽ kiểm tra các bản sao lưu thường xuyên hơn, để có thể khôi phục nhanh hơn nữa."}],"vocab":[{"w":"cue card","ipa":"/kjuː kɑːrd/","vi":"thẻ đề bài (Speaking Part 2)","ex":"Read the cue card carefully."},{"w":"deal with","ipa":"/diːl wɪð/","vi":"xử lý, giải quyết","ex":"How did you deal with the problem?"},{"w":"crash","ipa":"/kræʃ/","vi":"(hệ thống) bị sập","ex":"The website crashed during the sale."},{"w":"panic","ipa":"/ˈpænɪk/","vi":"hoảng loạn","ex":"Don't panic. We have a backup."},{"w":"backup","ipa":"/ˈbækʌp/","vi":"bản sao lưu","ex":"We restored the data from a backup."},{"w":"exhausted","ipa":"/ɪɡˈzɔːstɪd/","vi":"kiệt sức","ex":"I was exhausted after the long night."},{"w":"under pressure","ipa":"/ˈʌndər ˈprɛʃər/","vi":"dưới áp lực","ex":"She works well under pressure."},{"w":"looking back","ipa":"/ˈlʊkɪŋ bæk/","vi":"nhìn lại (quá khứ)","ex":"Looking back, it was a good decision."}],"grammar":{"t":"Thì kể chuyện và cách tổ chức một lượt nói dài","d":"Trong Part 2, giám khảo đưa bạn một cue card; bạn có đúng 1 phút chuẩn bị (được ghi chú) rồi nói 1–2 phút, sau đó giám khảo có thể hỏi thêm một hai câu ngắn. Khi kể chuyện quá khứ: dùng quá khứ tiếp diễn cho bối cảnh (việc đang diễn ra), quá khứ đơn cho các sự việc chính nối tiếp nhau. Đi theo đúng thứ tự gợi ý trên thẻ để không bị bí ý.","formula":["Bối cảnh: quá khứ tiếp diễn — I was working at…, we were preparing…","Sự việc chính: quá khứ đơn — suddenly the database stopped…, I contacted…","Bố cục: I'd like to talk about… → bối cảnh → diễn biến → As for how I felt, … → Looking back, …","Từ đệm tự nhiên khi cần thời gian nghĩ: Well, … / To be honest, … / Let me think… / What I mean is…"],"ex":["While we were preparing the report, the database suddenly stopped.","I was working late when my manager called.","Mở bài: I'd like to talk about a time when…","Cảm xúc: As for how I felt, I was nervous but excited.","Kết: Looking back, it taught me to… / So, that's my story."],"mistakes":[{"wrong":"Two years ago, our database crash.","right":"Two years ago, our database crashed.","why":"Chuyện đã xảy ra phải chia quá khứ; người Việt hay quên đuôi -ed vì tiếng Việt không chia thì."},{"wrong":"I was work at DataPeak.","right":"I was working at DataPeak.","why":"Quá khứ tiếp diễn = was/were + V-ing."},{"wrong":"While we prepared the report, the database was stopping.","right":"While we were preparing the report, the database stopped.","why":"Hành động dài (bối cảnh) dùng tiếp diễn; hành động ngắn xen vào dùng quá khứ đơn."}]},"quiz":[{"q":"How long does Lan have to prepare?","o":["Two minutes","One minute","Five minutes"],"a":1},{"q":"How did Lan solve the problem?","o":["She rebuilt the key tables from backups","She cancelled the report","She bought a new server"],"a":0},{"q":"Which tense describes the background of a story?","o":["Present simple: we prepare…","Future: we will prepare…","Past continuous: we were preparing…"],"a":2}],"practice":[{"s":"I ___ working at DataPeak at the time.","a":"was","alt":[],"hint":"quá khứ tiếp diễn (I)"},{"s":"While we were preparing the report, the database suddenly ___ responding.","a":"stopped","alt":[],"hint":"hành động ngắn xen vào – quá khứ đơn"},{"s":"I'd like to ___ about a time when our database crashed.","a":"talk","alt":[],"hint":"Câu mở đầu Part 2"},{"s":"As ___ how I felt, I was exhausted but proud.","a":"for","alt":[],"hint":"Còn về… (chuyển sang phần cảm xúc)"},{"s":"___ back, it taught me to stay calm under pressure.","a":"Looking","alt":[],"hint":"Nhìn lại…"}],"speak":["I'd like to talk about a time when our main database crashed, about two years ago.","I was working at DataPeak, and we were preparing a quarterly report for an important client.","As for how I felt, I was exhausted, but also really proud of the team.","Looking back, it taught me to stay calm under pressure."],"write":{"vi":"Cue card: 'Describe a project you are proud of. You should say: what the project was, who you worked with, what you did, and explain why you are proud of it.' Viết bài nói của bạn (ít nhất 120 từ) theo bố cục trong bài, dùng quá khứ đơn, quá khứ tiếp diễn và ít nhất hai từ đệm. Sau đó đọc to và bấm giờ: mục tiêu 1,5–2 phút.","en":"Cue card: 'Describe a project you are proud of. You should say: what the project was, who you worked with, what you did, and explain why you are proud of it.' Write your talk (at least 120 words) using the structure from the lesson, the past simple, the past continuous and at least two fillers. Then read it aloud and time yourself: aim for 1.5–2 minutes.","min":120},"summary":["Part 2: 1 phút chuẩn bị (được ghi chú), nói 1–2 phút, sau đó có thể có 1–2 câu hỏi ngắn.","Bối cảnh: was/were + V-ing; sự việc chính: quá khứ đơn.","Bố cục: I'd like to talk about… → bối cảnh → diễn biến → As for how I felt… → Looking back….","Dùng từ đệm (Well, To be honest, Let me think) thay cho im lặng hoặc 'ừm… à…'."]},{"id":"x12_3","ch":12,"level":"IELTS","after":"s_part2","title":"IELTS Speaking Part 3: discussing ideas","vi":"Nói Part 3: thảo luận và mở rộng ý","goals":["Sau bài này bạn có thể mở rộng câu trả lời Part 3 bằng lý do và ví dụ, thay vì trả lời một câu.","Sau bài này bạn có thể so sánh quá khứ và hiện tại bằng used to và whereas now.","Sau bài này bạn có thể dự đoán tương lai một cách thận trọng bằng be likely to, will probably."],"story":[{"who":"Examiner","en":"We've been talking about a challenge at work. Now I'd like to ask you some more general questions.","vi":"Chúng ta vừa nói về một thử thách trong công việc. Bây giờ tôi muốn hỏi bạn một số câu hỏi khái quát hơn."},{"who":"Examiner","en":"Why do some people find it hard to work under pressure?","vi":"Tại sao một số người thấy khó làm việc dưới áp lực?"},{"who":"Lan","en":"That's an interesting question. I'd say it's mainly because pressure affects our ability to think clearly.","vi":"Đó là một câu hỏi thú vị. Tôi cho rằng chủ yếu là vì áp lực ảnh hưởng đến khả năng suy nghĩ rõ ràng của chúng ta."},{"who":"Lan","en":"For example, when a deadline is close, people tend to rush and make careless mistakes.","vi":"Ví dụ, khi hạn chót đến gần, người ta có xu hướng vội vàng và mắc lỗi cẩu thả."},{"who":"Examiner","en":"How has the workplace changed compared with the past?","vi":"Nơi làm việc đã thay đổi thế nào so với trước đây?"},{"who":"Lan","en":"Well, people used to work fixed hours in an office, whereas now many of us work remotely.","vi":"À, trước đây mọi người thường làm theo giờ cố định ở văn phòng, trong khi giờ đây nhiều người trong chúng ta làm từ xa."},{"who":"Lan","en":"Communication used to be mostly face-to-face, but these days it happens through chat and video calls.","vi":"Giao tiếp trước đây chủ yếu là gặp mặt trực tiếp, nhưng ngày nay nó diễn ra qua tin nhắn và gọi video."},{"who":"Examiner","en":"Do you think this trend will continue in the future?","vi":"Bạn có nghĩ xu hướng này sẽ tiếp tục trong tương lai không?"},{"who":"Lan","en":"It's hard to say for sure, but I think hybrid work is likely to become the norm.","vi":"Khó nói chắc chắn, nhưng tôi nghĩ làm việc kết hợp nhiều khả năng sẽ trở thành điều bình thường."},{"who":"Lan","en":"On the other hand, some companies will probably bring people back to the office for teamwork.","vi":"Mặt khác, một số công ty có lẽ sẽ đưa mọi người trở lại văn phòng để làm việc nhóm."},{"who":"Examiner","en":"Is that a good thing?","vi":"Đó có phải là điều tốt không?"},{"who":"Lan","en":"It depends. It's great for flexibility, but it can make new employees feel isolated.","vi":"Còn tùy. Nó rất tốt cho sự linh hoạt, nhưng có thể khiến nhân viên mới cảm thấy bị cô lập."}],"vocab":[{"w":"affect","ipa":"/əˈfɛkt/","vi":"ảnh hưởng đến","ex":"Stress can affect your sleep."},{"w":"rush","ipa":"/rʌʃ/","vi":"vội vàng","ex":"Don't rush. Check the numbers first."},{"w":"fixed hours","ipa":"/fɪkst ˈaʊərz/","vi":"giờ làm cố định","ex":"I don't work fixed hours."},{"w":"face-to-face","ipa":"/ˌfeɪs tə ˈfeɪs/","vi":"trực tiếp, mặt đối mặt","ex":"We prefer face-to-face meetings."},{"w":"hybrid work","ipa":"/ˈhaɪbrɪd wɜːrk/","vi":"làm việc kết hợp (nhà và văn phòng)","ex":"Our company uses hybrid work."},{"w":"the norm","ipa":"/ðə nɔːrm/","vi":"điều bình thường, chuẩn mực","ex":"Video calls are now the norm."},{"w":"likely","ipa":"/ˈlaɪkli/","vi":"có khả năng","ex":"Prices are likely to rise."},{"w":"isolated","ipa":"/ˈaɪsəleɪtɪd/","vi":"bị cô lập, lẻ loi","ex":"Working alone can feel isolated."}],"grammar":{"t":"Mở rộng câu trả lời Part 3: lý do – ví dụ – so sánh – dự đoán","d":"Part 3 kéo dài khoảng 4–5 phút, giám khảo hỏi các câu khái quát, trừu tượng liên quan đến chủ đề Part 2. Câu trả lời một dòng sẽ bị điểm thấp; hãy mở rộng theo công thức: trả lời → lý do → ví dụ. Các câu hỏi thường yêu cầu so sánh quá khứ với hiện tại (used to) và dự đoán tương lai (be likely to, will probably).","formula":["Mở rộng: Trả lời (I'd say…) → Lý do (mainly because…) → Ví dụ (For example, …)","Quá khứ vs hiện tại: S + used to + V (trước đây thường), whereas now / but these days + S + V","Dự đoán thận trọng: S + is/are likely to + V; S + will probably + V; It's hard to say for sure, but…"],"ex":["I'd say it's mainly because pressure affects our thinking.","People used to work fixed hours, whereas now many work remotely.","Communication used to be face-to-face, but these days it's mostly online.","Hybrid work is likely to become the norm.","Some companies will probably bring people back to the office."],"mistakes":[{"wrong":"People use to work in offices.","right":"People used to work in offices.","why":"Nói về thói quen trong quá khứ luôn viết/nói 'used to', có -d."},{"wrong":"Hybrid work is likely become the norm.","right":"Hybrid work is likely to become the norm.","why":"be likely + to + V; không được bỏ 'to'."},{"wrong":"Examiner: Is that a good thing? – Yes.","right":"It depends. It's great for flexibility, but it can make new employees feel isolated.","why":"Part 3 cần câu trả lời mở rộng có lý do và ví dụ, không trả lời cụt."}]},"quiz":[{"q":"According to Lan, why do people make mistakes under pressure?","o":["They work at home","They rush","They sleep too much"],"a":1},{"q":"What does Lan predict?","o":["Everyone will return to the office","Video calls will disappear","Hybrid work is likely to become the norm"],"a":2},{"q":"Choose the correct sentence.","o":["People used to work fixed hours.","People use to work fixed hours.","People are used to work fixed hours."],"a":0}],"practice":[{"s":"People ___ to work fixed hours in an office.","a":"used","alt":[],"hint":"thói quen trước đây (không còn nữa)"},{"s":"Hybrid work is likely ___ become the norm.","a":"to","alt":[],"hint":"be likely ___ + V"},{"s":"Some companies will ___ bring people back to the office.","a":"probably","alt":[],"hint":"có lẽ (trạng từ)"},{"s":"It's hard to say for ___, but I think it will continue.","a":"sure","alt":["certain"],"hint":"Khó nói chắc chắn…"},{"s":"I'd say it's mainly ___ pressure affects our thinking.","a":"because","alt":[],"hint":"nêu lý do"}],"speak":["I'd say it's mainly because pressure affects our ability to think clearly.","Well, people used to work fixed hours in an office, whereas now many of us work remotely.","It's hard to say for sure, but I think hybrid work is likely to become the norm.","It depends. It's great for flexibility, but it can make new employees feel isolated."],"write":{"vi":"Trả lời ba câu hỏi Part 3 sau, mỗi câu 40–60 từ, theo công thức trả lời → lý do → ví dụ: (1) How has technology changed the way people work? (2) Will robots or AI replace office workers in the future? (3) Is it better to work for a large company or a small one? Dùng used to, be likely to và It depends ít nhất một lần.","en":"Answer these three Part 3 questions in 40–60 words each, using answer → reason → example: (1) How has technology changed the way people work? (2) Will robots or AI replace office workers in the future? (3) Is it better to work for a large company or a small one? Use used to, be likely to and It depends at least once.","min":120},"summary":["Part 3: khoảng 4–5 phút, câu hỏi khái quát liên quan chủ đề Part 2.","Mở rộng: trả lời → lý do (mainly because…) → ví dụ (For example…).","So sánh: used to + V (trước đây), whereas now / these days (bây giờ).","Dự đoán thận trọng: be likely to + V, will probably + V, It's hard to say for sure, but…."]},{"id":"s_culture","ch":12,"level":"IELTS","title":"Working across cultures","vi":"Làm việc đa văn hóa","goals":["Sau bài này bạn có thể dùng danh từ trừu tượng (directness, harmony, awareness) để nói về văn hóa và hành vi.","Sau bài này bạn có thể khái quát hóa một cách thận trọng bằng tend to, generally, it depends.","Sau bài này bạn có thể thảo luận về khác biệt văn hóa mà không rơi vào định kiến."],"story":[{"who":"Sofia","en":"Lan, can I ask you something? In meetings, your team rarely says no directly. Why is that?","vi":"Lan, tôi hỏi bạn chuyện này được không? Trong các cuộc họp, nhóm bạn hiếm khi nói 'không' trực tiếp. Tại sao vậy?"},{"who":"Lan","en":"Good question. In Vietnam, people tend to avoid open disagreement, especially with clients.","vi":"Câu hỏi hay. Ở Việt Nam, mọi người có xu hướng tránh bất đồng công khai, nhất là với khách hàng."},{"who":"Mark","en":"Australians, on the other hand, generally value directness. We usually say what we think.","vi":"Còn người Úc thì nhìn chung coi trọng sự thẳng thắn. Chúng tôi thường nói thẳng điều mình nghĩ."},{"who":"Lan","en":"Yes, at first Mark's honesty felt a bit rude to me!","vi":"Đúng vậy, lúc đầu sự thẳng thắn của Mark làm tôi thấy hơi bất lịch sự!"},{"who":"Mark","en":"And I sometimes missed Lan's hints. 'That might be difficult' actually meant 'no'.","vi":"Còn tôi thì đôi khi không hiểu ý ngầm của Lan. 'Việc đó có thể khó đấy' thực ra nghĩa là 'không'."},{"who":"Sofia","en":"So silence or a vague answer doesn't always mean agreement.","vi":"Vậy sự im lặng hay một câu trả lời mơ hồ không phải lúc nào cũng là đồng ý."},{"who":"Lan","en":"Exactly. Harmony and respect for seniority play a big role in many Vietnamese workplaces.","vi":"Chính xác. Sự hòa hợp và tôn trọng người có thâm niên đóng vai trò lớn ở nhiều nơi làm việc tại Việt Nam."},{"who":"Sofia","en":"But surely not everyone in Vietnam is the same?","vi":"Nhưng chắc chắn không phải ai ở Việt Nam cũng giống nhau chứ?"},{"who":"Lan","en":"Of course not. It depends on the person, the company and even the age group.","vi":"Tất nhiên là không. Điều đó còn tùy vào từng người, từng công ty và cả nhóm tuổi."},{"who":"Mark","en":"That's the danger of stereotypes. These are tendencies, not rules.","vi":"Đó là mối nguy của định kiến. Đây chỉ là xu hướng, không phải quy luật."},{"who":"Sofia","en":"So what works best for a mixed team like ours?","vi":"Vậy điều gì hiệu quả nhất cho một nhóm đa dạng như chúng ta?"},{"who":"Lan","en":"Awareness, mostly. We agreed to say clearly when something is a real problem.","vi":"Chủ yếu là sự nhận thức. Chúng tôi đã thống nhất sẽ nói rõ khi có vấn đề thật sự."},{"who":"Mark","en":"And to ask open questions instead of making assumptions. Our communication has improved a lot.","vi":"Và đặt câu hỏi mở thay vì tự suy đoán. Việc giao tiếp của chúng tôi đã cải thiện rất nhiều."}],"vocab":[{"w":"directness","ipa":"/dəˈrɛktnəs/","vi":"sự thẳng thắn","ex":"Some cultures value directness."},{"w":"disagreement","ipa":"/ˌdɪsəˈɡriːmənt/","vi":"sự bất đồng","ex":"There was some disagreement about the price."},{"w":"harmony","ipa":"/ˈhɑːrməni/","vi":"sự hòa hợp","ex":"Harmony in the team is important to her."},{"w":"seniority","ipa":"/ˌsiːnˈjɔːrəti/","vi":"thâm niên, vị trí cấp trên","ex":"Promotion is often based on seniority."},{"w":"tendency","ipa":"/ˈtɛndənsi/","vi":"xu hướng","ex":"There is a tendency to avoid conflict."},{"w":"stereotype","ipa":"/ˈstɛriətaɪp/","vi":"định kiến, khuôn mẫu","ex":"Try not to rely on stereotypes."},{"w":"awareness","ipa":"/əˈwɛrnəs/","vi":"sự nhận thức","ex":"Cultural awareness helps global teams."},{"w":"vague","ipa":"/veɪɡ/","vi":"mơ hồ, không rõ ràng","ex":"His answer was vague."}],"grammar":{"t":"Danh từ trừu tượng và khái quát hóa thận trọng","d":"Khi nói về văn hóa, con người hay xã hội (rất hay gặp trong IELTS Speaking Part 3 và Writing Task 2), bạn cần danh từ trừu tượng để diễn đạt ý chung, và cần cách khái quát thận trọng để không nghe như đang áp đặt định kiến. Tránh 'always', 'all', 'never' khi nói về một nhóm người; dùng 'tend to', 'generally', 'many' và thêm 'it depends'.","formula":["Danh từ trừu tượng: direct → directness; aware → awareness; agree → disagreement; tend → tendency; senior → seniority","Khái quát thận trọng: S + tend to + V  /  S + generally / often / usually + V  /  Many (not all) + N…","Giới hạn: It depends on + N  /  Not everyone… / These are tendencies, not rules."],"ex":["Tuyệt đối: Vietnamese people always avoid conflict. → Thận trọng: Many Vietnamese people tend to avoid open conflict.","Australians generally value directness.","It depends on the person and the company.","Awareness is the first step to better communication. (danh từ trừu tượng nói chung, không dùng 'the')","Hậu tố tạo danh từ trừu tượng hay gặp: -ness, -ity, -ment, -ence/-ance, -ency."],"mistakes":[{"wrong":"Vietnamese people are always shy.","right":"Many Vietnamese people tend to be more reserved with clients.","why":"Khái quát tuyệt đối (always, all) nghe như định kiến; dùng tend to và many."},{"wrong":"It depends the person.","right":"It depends on the person.","why":"depend luôn đi với giới từ on."},{"wrong":"They tend avoid disagreement.","right":"They tend to avoid disagreement.","why":"tend + to + V; không được bỏ 'to'."}]},"quiz":[{"q":"Why does Lan's team rarely say no directly?","o":["They don't understand English well","People tend to avoid open disagreement","Their manager doesn't allow it"],"a":1},{"q":"What did 'That might be difficult' really mean?","o":["No","Yes","Maybe later"],"a":0},{"q":"Which sentence is a careful generalisation?","o":["All Australians are rude.","Australians never avoid conflict.","Australians generally value directness."],"a":2}],"practice":[{"s":"In Vietnam, people ___ to avoid open disagreement.","a":"tend","alt":[],"hint":"có xu hướng"},{"s":"It depends ___ the person and the company.","a":"on","alt":[],"hint":"giới từ sau depend"},{"s":"Australians ___ value directness.","a":"generally","alt":["often","usually"],"hint":"nhìn chung (trạng từ)"},{"s":"At first, Mark's ___ felt a bit rude to Lan. (direct → noun)","a":"directness","alt":["honesty"],"hint":"danh từ của direct"},{"s":"The solution for a mixed team is mostly ___. (aware → noun)","a":"awareness","alt":[],"hint":"danh từ của aware"}],"speak":["In Vietnam, people tend to avoid open disagreement, especially with clients.","Australians, on the other hand, generally value directness.","It depends on the person, the company and even the age group.","These are tendencies, not rules."],"write":{"vi":"Một đồng nghiệp nước ngoài sắp sang Việt Nam làm việc. Viết email (ít nhất 120 từ) giải thích một vài khác biệt trong cách giao tiếp ở nơi làm việc của bạn và đưa ra lời khuyên. Dùng ít nhất bốn danh từ trừu tượng và các cách khái quát thận trọng (tend to, generally, it depends).","en":"A foreign colleague is coming to work in Vietnam. Write an email (at least 120 words) explaining some differences in workplace communication at your company and giving advice. Use at least four abstract nouns and careful generalisations (tend to, generally, it depends).","min":120},"summary":["Danh từ trừu tượng: directness, harmony, awareness, tendency, seniority, disagreement.","Khái quát thận trọng: tend to + V, generally, many; tránh always/all/never khi nói về một nhóm người.","Thêm giới hạn: It depends on…, Not everyone…, These are tendencies, not rules.","Cách nói này rất hữu ích cho IELTS Speaking Part 3 và Writing Task 2."]}],"enrich":{"u1":{"goals":["Sau bài này bạn có thể chào hỏi và giới thiệu tên, quê quán, nghề nghiệp của mình.","Sau bài này bạn có thể dùng đúng am / is / are với từng chủ ngữ.","Sau bài này bạn có thể hỏi Are you…? và trả lời ngắn Yes, I am. / No, I'm not."],"formula":["Khẳng định: I am (I'm) · You / We / They are (you're, we're, they're) · He / She / It is (he's, she's, it's)","Phủ định: S + am / is / are + not (I'm not, he isn't, they aren't)","Câu hỏi: Am / Is / Are + S + …? → Yes, I am. / No, I'm not."],"mistakes":[{"wrong":"I from Vietnam.","right":"I'm from Vietnam.","why":"Tiếng Việt không cần 'là/thì', nhưng câu tiếng Anh này bắt buộc có động từ to be."},{"wrong":"She are a data analyst.","right":"She is a data analyst.","why":"He / she / it đi với is; you / we / they đi với are."},{"wrong":"Are you a data analyst? – Yes, I'm.","right":"Yes, I am.","why":"Câu trả lời ngắn khẳng định không được viết tắt."}],"practice":[{"s":"I ___ from Vietnam.","a":"am","alt":["'m"],"hint":"To be với I"},{"s":"Mark ___ a project manager.","a":"is","alt":["'s"],"hint":"To be với he (Mark)"},{"s":"___ you a data analyst?","a":"Are","alt":[],"hint":"Câu hỏi với you"},{"s":"We ___ a team.","a":"are","alt":["'re"],"hint":"To be với we"},{"s":"Are you from Australia? – No, I'm ___.","a":"not","alt":[],"hint":"Trả lời ngắn phủ định"}],"summary":["Giới thiệu: Hello, my name is… / I'm… / I'm from… / I'm a…","I am · he / she / it is · you / we / they are.","Hỏi: Are you…? → Yes, I am. / No, I'm not.","Nice to meet you. → Nice to meet you, too."]},"u2":{"goals":["Sau bài này bạn có thể hỏi What do you do? và trả lời về công việc của mình.","Sau bài này bạn có thể dùng thì hiện tại đơn với I / you / we / they để nói về việc làm hằng ngày.","Sau bài này bạn có thể hỏi Do you…? và trả lời Yes, I do. / No, I don't."],"formula":["Khẳng định: I / You / We / They + động từ nguyên mẫu (I make reports.)","Phủ định: I / You / We / They + don't + động từ (We don't use R.)","Câu hỏi: Do + you / we / they + động từ…? → Yes, I do. / No, I don't.","Hỏi nghề nghiệp: What do you do? → I'm a data analyst. / I make reports."],"mistakes":[{"wrong":"I am work with data.","right":"I work with data.","why":"Không ghép am với động từ thường ở thì hiện tại đơn."},{"wrong":"You use Excel?","right":"Do you use Excel?","why":"Câu hỏi cần trợ động từ 'do' ở đầu câu."},{"wrong":"I no use Python.","right":"I don't use Python.","why":"Phủ định dùng don't + động từ, không dùng 'no'."}],"practice":[{"s":"I ___ reports every week. (làm)","a":"make","alt":[],"hint":"Làm ra (báo cáo)"},{"s":"___ you use SQL?","a":"Do","alt":[],"hint":"Trợ động từ cho câu hỏi"},{"s":"We ___ use R. (không)","a":"don't","alt":["do not"],"hint":"Phủ định"},{"s":"What do you ___? – I'm a project manager.","a":"do","alt":[],"hint":"Hỏi nghề nghiệp"},{"s":"Do you talk to clients? – Yes, I ___.","a":"do","alt":[],"hint":"Trả lời ngắn"}],"summary":["Hiện tại đơn dùng cho công việc, thói quen: I make reports. We use Python.","Phủ định: don't + động từ. Câu hỏi: Do you + động từ…?","What do you do? = Bạn làm nghề gì?","Trả lời ngắn: Yes, I do. / No, I don't."]},"u3":{"goals":["Sau bài này bạn có thể hỏi và nói một cuộc họp vào thứ mấy, lúc mấy giờ, kéo dài bao lâu.","Sau bài này bạn có thể dùng đúng at, on, in với giờ, thứ, buổi và tháng.","Sau bài này bạn có thể dùng What time…?, Which day…? và How long…?"],"formula":["AT + giờ: at three o'clock, at noon","ON + thứ / ngày: on Thursday, on May 5th","IN + buổi / tháng / năm: in the afternoon, in May, in 2026","Hỏi: What time…? (mấy giờ) · Which day…? (thứ mấy) · How long…? (bao lâu)"],"mistakes":[{"wrong":"The meeting is in Thursday.","right":"The meeting is on Thursday.","why":"Thứ trong tuần luôn đi với ON."},{"wrong":"at the afternoon","right":"in the afternoon","why":"Buổi trong ngày (morning, afternoon, evening) đi với IN."},{"wrong":"The meeting is 3 o'clock.","right":"The meeting is at 3 o'clock.","why":"Trước giờ cụ thể cần giới từ AT."}],"practice":[{"s":"The meeting is ___ Thursday.","a":"on","alt":[],"hint":"Giới từ đi với thứ"},{"s":"It starts ___ three o'clock.","a":"at","alt":[],"hint":"Giới từ đi với giờ"},{"s":"See you ___ the afternoon.","a":"in","alt":[],"hint":"Giới từ đi với buổi"},{"s":"The project ends ___ May.","a":"in","alt":[],"hint":"Giới từ đi với tháng"},{"s":"How ___ is the meeting? – About forty-five minutes.","a":"long","alt":[],"hint":"Hỏi bao lâu"}],"summary":["AT + giờ; ON + thứ, ngày; IN + buổi, tháng, năm.","What time is the meeting? → At three o'clock.","Which day is it? → On Thursday. How long is it? → About forty-five minutes.","See you on Thursday! = Hẹn gặp thứ Năm."]},"u13":{"goals":["Sau bài này bạn có thể hỏi và chỉ chỗ các phòng, đồ vật trong văn phòng.","Sau bài này bạn có thể dùng đúng there is với một vật và there are với nhiều vật.","Sau bài này bạn có thể dùng giới từ vị trí: next to, behind, in front of, between, on the second floor."],"formula":["Một vật: There is (There's) + a / an + danh từ số ít","Nhiều vật: There are + danh từ số nhiều (There are two whiteboards.)","Phủ định: There isn't a… / There aren't… · Câu hỏi: Is there…? → Yes, there is. / No, there isn't. · Are there…? → Yes, there are. / No, there aren't.","Vị trí: next to · behind · in front of · between A and B · on the + số thứ tự + floor"],"mistakes":[{"wrong":"There have a projector in the room.","right":"There is a projector in the room.","why":"'Có' (tồn tại ở đâu đó) là there is / there are, không dùng have."},{"wrong":"There is two whiteboards.","right":"There are two whiteboards.","why":"Nhiều vật thì dùng there are."},{"wrong":"It's next the kitchen.","right":"It's next to the kitchen.","why":"'Bên cạnh' là cụm next to, không bỏ 'to'."}],"practice":[{"s":"___ is a printer near the window.","a":"There","alt":[],"hint":"Cấu trúc 'có'"},{"s":"There ___ two whiteboards in the meeting room.","a":"are","alt":[],"hint":"Nhiều vật"},{"s":"Is there a projector? – Yes, there ___.","a":"is","alt":[],"hint":"Trả lời ngắn"},{"s":"The stairs are ___ the reception desk. (phía sau)","a":"behind","alt":[],"hint":"Phía sau"},{"s":"The printer is ___ my desk and the window.","a":"between","alt":[],"hint":"Ở giữa hai vật"}],"summary":["There is + một vật; there are + nhiều vật. Không dùng 'have' để nói 'có' ở đâu đó.","Hỏi: Is there…? / Are there…? → Yes, there is. / No, there aren't.","Vị trí: next to, behind, in front of, between A and B.","Tầng: on the second floor."]},"u4":{"goals":["Sau bài này bạn có thể kể một ngày làm việc của người khác bằng thì hiện tại đơn với he / she.","Sau bài này bạn có thể thêm đúng -s / -es vào động từ (works, checks, has).","Sau bài này bạn có thể dùng trạng từ tần suất always, usually, often, sometimes, never đúng vị trí."],"formula":["He / She / It + V-s / V-es (She works. She checks her email.)","Thêm -es khi động từ tận cùng -ch, -sh, -s, -x, -o: watches, finishes, goes · phụ âm + y → -ies: study → studies","Đặc biệt: have → has (She has lunch at noon.)","Trạng từ tần suất: S + always / usually / often / sometimes / never + V (nhưng đứng SAU to be: She is always busy.)"],"mistakes":[{"wrong":"She work at DataPeak.","right":"She works at DataPeak.","why":"Chủ ngữ she → động từ phải thêm -s."},{"wrong":"She haves lunch at noon.","right":"She has lunch at noon.","why":"Have với he / she đổi thành has, không thêm -s."},{"wrong":"She checks often her email.","right":"She often checks her email.","why":"Trạng từ tần suất đứng TRƯỚC động từ thường."}],"practice":[{"s":"Lan usually ___ (get) up at six thirty.","a":"gets","alt":[],"hint":"Chủ ngữ Lan (she) → thêm -s."},{"s":"She ___ (have) lunch with her colleagues.","a":"has","alt":[],"hint":"have đổi thành dạng đặc biệt với she."},{"s":"Mark ___ (watch) the news in the morning.","a":"watches","alt":[],"hint":"Tận cùng -ch → thêm -es."},{"s":"She ___ (take) the bus to work.","a":"takes","alt":[],"hint":"Chủ ngữ she → thêm -s."},{"s":"She ___ works late on Fridays. She goes home at five.","a":"never","alt":[],"hint":"Không bao giờ."}],"summary":["He / she / it: động từ thêm -s (works) hoặc -es (watches, goes, finishes).","Have → has với he / she / it.","Trạng từ tần suất đứng trước động từ thường: She often writes SQL.","Thứ tự: always > usually > often > sometimes > never."]},"u5":{"goals":["Sau bài này bạn có thể mở lời nhờ vả lịch sự: Excuse me, do you have a minute?","Sau bài này bạn có thể nhờ đồng nghiệp và đối tác bằng Could you / Can you + động từ.","Sau bài này bạn có thể đồng ý hoặc từ chối một lời nhờ một cách lịch sự."],"formula":["Nhờ lịch sự: Could you + V nguyên mẫu (+ please)? (Could you send me the file?)","Thân mật hơn (với đồng nghiệp): Can you + V nguyên mẫu?","Mở lời: Excuse me, do you have a minute?","Đồng ý: Sure. / Of course. / No problem. · Từ chối: Sorry, I can't. + lý do"],"mistakes":[{"wrong":"Could you to send me the file?","right":"Could you send me the file?","why":"Sau could / can là động từ nguyên mẫu, không có to."},{"wrong":"You can send me the file?","right":"Could you send me the file?","why":"Câu hỏi phải đảo Could / Can lên trước chủ ngữ you."},{"wrong":"Could you sending me the file?","right":"Could you send me the file?","why":"Không dùng V-ing sau could."}],"p
