<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F6E63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bậc Thang">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Bậc Thang English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Gentium+Book+Plus&display=swap">
<style>
/* Layout: one column "radio log" — a level dial on top, then the station's program of lessons; each lesson opens into four skill tracks. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#E3E9E7; --line:#CCD6D3;
  --ink:#13211F; --muted:#56655F; --accent:#0F6E63; --accent-ink:#FFFFFF;
  --amber:#C7861A; --amber-soft:#F6E7C8; --good:#2E7D4F; --good-soft:#DDF0E3; --bad:#B23A2E; --bad-soft:#F7DFDB;
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ipa:"Gentium Book Plus","Charis SIL","Doulos SIL","Lucida Sans Unicode",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1716; --surface:#172220; --sunk:#1E2B29; --line:#2C3D3A;
  --ink:#E4EEEB; --muted:#93A6A0; --accent:#4CC2B0; --accent-ink:#06201C;
  --amber:#E7AE4C; --amber-soft:#3A2E17; --good:#6CCB91; --good-soft:#173526; --bad:#F08A7E; --bad-soft:#3C1C18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1716; --surface:#172220; --sunk:#1E2B29; --line:#2C3D3A;
  --ink:#E4EEEB; --muted:#93A6A0; --accent:#4CC2B0; --accent-ink:#06201C;
  --amber:#E7AE4C; --amber-soft:#3A2E17; --good:#6CCB91; --good-soft:#173526; --bad:#F08A7E; --bad-soft:#3C1C18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
.en-title{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
a{color:var(--accent)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:24px}
.top-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand-mark span{display:block;width:5px;background:var(--accent-ink);border-radius:2px;margin:0 1px}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs a{text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px}
nav.tabs a.on{background:var(--ink);color:var(--bg)}
.stat{display:flex;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.amber{background:var(--amber);color:#1d1404;border-color:var(--amber)}
.btn.small{padding:5px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* dial */
.dial{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:28px}
.dial-scale{position:relative;display:grid;grid-template-columns:repeat(6,1fr);margin-top:14px}
.dial-scale::before{content:"";position:absolute;left:0;right:0;top:14px;height:2px;background:var(--line)}
.tick{position:relative;text-align:center;font-size:13px}
.tick i{display:block;width:2px;height:14px;background:var(--line);margin:7px auto 6px}
.tick b{display:block;font-family:var(--f-display);font-size:18px}
.tick small{color:var(--muted);display:block;line-height:1.3}
.tick.on i{background:var(--amber);height:20px;width:4px;margin-top:4px}
.tick.on b{color:var(--amber)}
.tick.done b{color:var(--accent)}
.hello{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.hello h1{font-size:clamp(24px,4vw,32px)}

.journey{margin-top:10px;overflow-x:auto}
.journey svg{width:100%;min-width:520px;height:auto;display:block}
.road{fill:none;stroke:var(--line);stroke-width:10;stroke-linecap:round}
.road-done{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round}
.st circle{fill:var(--surface);stroke:var(--line);stroke-width:3}
.st.done circle{fill:var(--accent);stroke:var(--accent)}
.st.now circle{fill:var(--amber);stroke:var(--amber)}
.st.now .halo{fill:none;stroke:var(--amber);stroke-width:2;opacity:.45}
.st text{text-anchor:middle;font-family:var(--f-display);font-weight:800}
.st .in{font-size:12px;fill:var(--muted)}
.st.done .in{fill:var(--accent-ink)}.st.now .in{fill:#1d1404;font-size:13px}
.st .lb{font-size:13px;fill:var(--muted);font-family:var(--f-body);font-weight:600}
.st.now .lb{fill:var(--ink)}
@media (prefers-reduced-motion: no-preference){.st.now .halo{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}}
@keyframes pulse{50%{transform:scale(1.25);opacity:0}}
.tip{background:var(--amber-soft);border-radius:14px;padding:16px 20px;margin-bottom:28px}
.tip b{font-size:18px;display:block;margin-top:2px}.tip p{margin:4px 0 0;max-width:65ch}
.quest{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.qi{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:12px;text-decoration:none;color:var(--ink);background:var(--bg)}
.qi .ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--accent-ink)}
.qi.ok .ck{background:var(--good);border-color:var(--good)}
.qi b{display:block;font-size:15px}.qi span{font-size:13px;color:var(--muted)}
.qbar{height:8px;border-radius:8px;background:var(--sunk);overflow:hidden;margin-top:12px}.qbar i{display:block;height:100%;background:var(--good);transition:width .4s}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;margin-top:12px}
.badge{text-align:center;font-size:12px;line-height:1.35}
.badge svg{width:62px;height:62px;display:block;margin:0 auto 4px}
.badge .hex{fill:var(--sunk);stroke:var(--line);stroke-width:2}
.badge.got .hex{fill:var(--amber-soft);stroke:var(--amber)}
.badge text{text-anchor:middle;font-family:var(--f-display);font-weight:800;font-size:20px;fill:var(--muted)}
.badge.got text{fill:var(--amber)}
.badge b{display:block;font-size:13px}.badge:not(.got){opacity:.6}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pair button{font-size:22px;font-weight:700;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg)}
.pair button.right{background:var(--good-soft);border-color:var(--good)}.pair button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.drills{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
.drills a{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink);background:var(--bg)}
.drills a.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.drills a b{display:block}.drills a span{font-size:14px;color:var(--muted)}
@media (max-width:560px){.quest{grid-template-columns:1fr}}
.chart-wrap{position:relative}
.chart-wrap svg{width:100%;height:auto;display:block}
.bar{fill:var(--accent)}.bar.today{fill:var(--amber)}
.hit{fill:transparent;cursor:default}
.gridl{stroke:var(--line);stroke-width:1}
.axis{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.ctip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%)}
.kpis{display:flex;gap:28px;flex-wrap:wrap;margin:8px 0 4px}
.kpis div{font-size:13px;color:var(--muted)}.kpis b{display:block;font-family:var(--f-display);font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}
.story p.para{font-size:19px;line-height:1.75;margin:0}
.story .pwrap{padding:10px 8px;border-radius:8px}
.story .pwrap.playing{background:var(--amber-soft)}
.story .w{border-bottom:none;border-radius:3px}.story .w:hover{background:var(--sunk)}
.wordbox{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--ink);border-radius:12px;padding:12px 14px;margin-top:12px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.slist a{border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);background:var(--bg)}
.slist a.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.slist b{display:block;font-family:var(--f-display);font-size:18px}.slist span{font-size:14px;color:var(--muted)}
.guide-banner{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:16px 20px;margin-bottom:20px}
.guide-banner b{font-size:18px}.guide-banner p{margin:2px 0 0;color:var(--muted)}
.tabhelp{font-size:14px;color:var(--muted);margin:-6px 0 14px}
.g-hero h1{font-size:clamp(26px,5vw,36px)}
.g-hero p{max-width:62ch;color:var(--muted);margin:8px 0 0}
.session{display:flex;height:46px;border-radius:10px;overflow:hidden;margin-top:14px;gap:2px}
.session div{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;padding:0 6px;text-align:center;line-height:1.2;min-width:0}
.session .a{background:var(--amber-soft);color:var(--ink)}.session .b{background:var(--accent);color:var(--accent-ink)}.session .c{background:var(--sunk);color:var(--ink)}
.slegend{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;font-size:14px}
.slegend b{display:block;font-size:15px}
.steps{display:flex;flex-direction:column;gap:0;margin-top:8px}
.step{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step .n{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.step b{font-size:17px}.step p{margin:2px 0 0;color:var(--muted);max-width:65ch}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:10px}
.tools a{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink);background:var(--bg)}
.tools a b{display:block}.tools a span{font-size:14px;color:var(--muted)}
.tline{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tline:last-child{border-bottom:none}
.tline b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.rules{margin:8px 0 0;padding-left:20px}.rules li{margin:6px 0}
@media (max-width:560px){.slegend{grid-template-columns:1fr}.tline{grid-template-columns:1fr;gap:2px}.session div{font-size:11px}}
.ch-head{display:flex;justify-content:space-between;gap:12px;padding:14px 0 6px;font-weight:700;font-size:15px;border-bottom:2px solid var(--ink)}
.aimark{color:var(--amber);font-size:14px}
.test-row{background:var(--sunk);border-radius:8px;padding-inline:10px;margin-top:4px}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.pass{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.goals{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:14px}
.goals ul,.summary ul{margin:6px 0 0;padding-left:20px}.goals li,.summary li{margin:3px 0}
.formula{margin-top:14px;background:var(--sunk);border-radius:var(--r);padding:12px 14px;font-weight:600}
.formula div{margin-top:4px;overflow-wrap:anywhere}
.prow{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.pline{font-size:17px;line-height:2}
.pn{font-weight:700;color:var(--muted)}
input.gap{width:9em;max-width:60vw;margin:0 4px;padding:4px 8px;border:none;border-bottom:2px solid var(--accent);border-radius:4px 4px 0 0;background:var(--sunk);font-size:16px}
input.gap.ok{border-color:var(--good);background:var(--good-soft)}input.gap.no{border-color:var(--bad);background:var(--bad-soft)}
.pfb{font-size:14px;min-height:0}
.summary{border-left:4px solid var(--accent)}
.today{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:22px;margin-bottom:16px;display:flex;flex-direction:column;gap:16px}
.today .label{color:inherit;opacity:.8}
.today h1{font-size:clamp(24px,5vw,32px);font-family:var(--f-display)}
.t-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.t-badges{display:flex;gap:10px}
.tb{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px;text-align:center;min-width:72px}
.tb b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.1}.tb span{font-size:12px;opacity:.85}
.t-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t-steps li{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px}
.t-steps .ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-weight:800;font-size:13px;opacity:.9}
.t-steps li.ok .ck{background:var(--amber);border-color:var(--amber);color:#1d1404}
.t-steps b{display:block;font-size:15px}.t-steps span{font-size:13px;opacity:.85}
.btn.big{font-size:17px;padding:13px 22px;justify-content:center}
.today .btn.big{align-self:flex-start}
.place-strip{display:flex;flex-direction:column;border:1px dashed var(--accent);border-radius:12px;padding:12px 16px;text-decoration:none;color:var(--ink);margin-bottom:16px}
.place-strip span{color:var(--accent);font-size:14px}
.chsw{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.chsw::-webkit-scrollbar{display:none}
.chip{flex:none;position:relative;width:46px;height:46px;border:none;background:transparent;padding:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--muted)}
.chip svg{position:absolute;inset:0;width:100%;height:100%}
.chip .rg{fill:var(--surface);stroke:var(--line);stroke-width:3}.chip .rf{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.chip span{position:relative}
.chip.on .rg{fill:var(--ink)}.chip.on span{color:var(--bg)}
.chip.pass span{color:var(--good)}.chip.pass.on span{color:var(--bg)}
.ch-banner{margin:6px 0 8px}.ch-banner h2{font-family:var(--f-display);font-size:26px}
.stairs{position:relative;max-width:420px;margin:10px auto 0}
.trail{position:absolute;left:50%;top:0;transform:translateX(-50%);overflow:visible}
.trail path{fill:none;stroke:var(--line);stroke-width:6;stroke-dasharray:2 14;stroke-linecap:round}
.node{position:absolute;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;border:3px solid var(--line);background:var(--surface);color:var(--muted);font-family:var(--f-display);font-weight:800;font-size:20px;display:grid;place-items:center;box-shadow:0 5px 0 var(--line);transition:transform .15s}
.node:hover{transform:translateY(-2px)}
.node:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.node.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.node.now{background:var(--amber);border-color:var(--amber);color:#1d1404;width:80px;height:80px;margin:-40px 0 0 -40px;font-size:24px;box-shadow:0 6px 0 color-mix(in srgb,var(--amber) 60%,#000)}
.node.part{border-color:var(--accent);color:var(--accent)}
.node .ring{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px)}
.node .ring circle{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.node.test{border-radius:18px;transform:rotate(45deg);width:62px;height:62px;margin:-31px 0 0 -31px}
.node.test svg{transform:rotate(-45deg)}
.node.test:hover{transform:rotate(45deg) translateY(-2px)}
.node.test.done{background:var(--good);border-color:var(--good);color:#fff}
.nlabel{position:absolute;font-size:13px;font-weight:600;line-height:1.25;width:130px;color:var(--ink);pointer-events:none}
.nlabel.left{margin-left:-180px;margin-top:-10px;text-align:right}
.nlabel.right{margin-left:50px;margin-top:-10px}
.nlabel.below{margin-left:-65px;margin-top:46px;text-align:center}
.stairs-sec{overflow-x:clip}
.bubble{position:absolute;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;font-size:13px;padding:5px 12px;border-radius:10px;white-space:nowrap;pointer-events:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.bubble{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translate(-50%,-4px)}}}
.sheet-wrap{position:fixed;inset:0;z-index:30}
.sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:22px max(20px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;max-height:85vh;overflow:auto}
.sheet h2{font-size:24px;padding-right:40px}
.sheet .btn.big{margin-top:12px}
.sheet-x{position:absolute;right:16px;top:16px;font-size:20px}
.sgoals{margin:0 0 6px;padding-left:20px;font-size:15px}
.sskills{display:flex;gap:6px;flex-wrap:wrap}
.sskills span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted)}
.sskills span.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}

const BAKED={"lessons":[{"id":"x1_1","ch":1,"level":"A0","after":"u1","title":"Good morning! How are you?","vi":"Chào hỏi theo buổi và hỏi thăm","goals":["Sau bài này bạn có thể chào đúng theo buổi: Good morning, Good afternoon, Good evening.","Sau bài này bạn có thể hỏi và trả lời câu How are you? một cách tự nhiên.","Sau bài này bạn có thể chào tạm biệt đồng nghiệp và đáp lại lời cảm ơn, lời chúc."],"story":[{"who":"Lan","en":"Good morning, Mark!","vi":"Chào buổi sáng, Mark!"},{"who":"Mark","en":"Morning, Lan! How are you today?","vi":"Chào Lan! Hôm nay chị thế nào?"},{"who":"Lan","en":"I'm fine, thanks. And you?","vi":"Tôi khỏe, cảm ơn anh. Còn anh?"},{"who":"Mark","en":"Not bad, thanks. But I'm a bit tired.","vi":"Cũng ổn, cảm ơn. Nhưng tôi hơi mệt."},{"who":"Lan","en":"Oh. Here is a coffee for you.","vi":"Ồ. Cà phê của anh đây."},{"who":"Mark","en":"Thank you so much, Lan!","vi":"Cảm ơn chị nhiều lắm, Lan!"},{"who":"Lan","en":"You're welcome.","vi":"Không có gì."},{"who":"Mark","en":"Goodbye, Lan. See you tomorrow!","vi":"Tạm biệt Lan. Mai gặp lại nhé!"},{"who":"Lan","en":"Bye, Mark. Have a nice evening!","vi":"Tạm biệt Mark. Chúc anh buổi tối vui vẻ!"},{"who":"Mark","en":"Thanks, you too!","vi":"Cảm ơn, chị cũng vậy nhé!"}],"vocab":[{"w":"good morning","ipa":"/ɡʊd ˈmɔːrnɪŋ/","vi":"chào buổi sáng","ex":"Good morning, Mark!"},{"w":"How are you?","ipa":"/haʊ ɑːr juː/","vi":"Bạn có khỏe không? / Bạn thế nào?","ex":"Hi, Lan. How are you?"},{"w":"fine","ipa":"/faɪn/","vi":"khỏe, ổn","ex":"I'm fine, thanks."},{"w":"not bad","ipa":"/nɑːt bæd/","vi":"cũng ổn, không tệ","ex":"Not bad, thanks."},{"w":"tired","ipa":"/ˈtaɪərd/","vi":"mệt","ex":"I'm a bit tired today."},{"w":"you're welcome","ipa":"/jʊr ˈwelkəm/","vi":"không có gì (đáp lời cảm ơn)","ex":"Thank you! – You're welcome."},{"w":"see you tomorrow","ipa":"/ˈsiː jə təˈmɑːroʊ/","vi":"mai gặp lại","ex":"Bye! See you tomorrow."},{"w":"you too","ipa":"/juː tuː/","vi":"bạn cũng vậy nhé","ex":"Have a nice weekend! – You too!"}],"grammar":{"t":"Chào hỏi theo buổi, hỏi thăm và chào tạm biệt","d":"Người nói tiếng Anh chào theo buổi trong ngày. Sau lời chào, họ gần như luôn hỏi How are you? – đây là câu xã giao, chỉ cần trả lời ngắn rồi hỏi lại. Khi chia tay, họ thường chúc nhau một câu và người kia đáp Thanks, you too.","formula":["Gặp nhau: Good morning (trước 12 giờ trưa) / Good afternoon (12 giờ – 6 giờ chiều) / Good evening (sau 6 giờ chiều). Thân mật: Hi / Hello / Morning!","Hỏi thăm: How are you? → I'm fine / great / OK, thanks. And you? (hoặc: Not bad, thanks.)","Chia tay: Goodbye / Bye. See you tomorrow / See you later. Have a nice evening / weekend! → Thanks, you too!","Cảm ơn: Thank you / Thanks. → You're welcome."],"ex":["Good afternoon, Sofia. How are you?","I'm great, thanks. And you?","Good night! = chỉ dùng khi chia tay buổi tối hoặc đi ngủ, KHÔNG dùng để chào khi gặp.","Have a nice weekend! – Thanks, you too!","Thanks a lot! – You're welcome."],"mistakes":[{"wrong":"Good night, Mark! (khi vừa gặp lúc 7 giờ tối)","right":"Good evening, Mark!","why":"Good night là lời chào tạm biệt hoặc chúc ngủ ngon, không dùng khi mới gặp."},{"wrong":"Have a nice evening! – Me too!","right":"Have a nice evening! – You too!","why":"Bạn chúc lại người kia, nên nói 'you too' (bạn cũng vậy), không phải 'me too' (tôi cũng vậy)."},{"wrong":"Thank. / Thanks you.","right":"Thanks. / Thank you.","why":"Chỉ có hai dạng đúng: 'Thanks' hoặc 'Thank you'."}]},"quiz":[{"q":"How is Mark today?","o":["Very happy","Sick","A bit tired"],"a":2},{"q":"What does Lan give Mark?","o":["A coffee","A report","A phone"],"a":0},{"q":"Have a nice weekend! – Thanks, ___","o":["me too!","you too!","good night!"],"a":1}],"practice":[{"s":"Good ___, Mark! (9 giờ sáng)","a":"morning","alt":[],"hint":"Buổi sáng"},{"s":"Hi, Lan. How ___ you?","a":"are","alt":[],"hint":"Động từ to be đi với 'you'"},{"s":"Thank you! – You're ___.","a":"welcome","alt":[],"hint":"Không có gì"},{"s":"Bye! See you ___!","a":"tomorrow","alt":[],"hint":"Ngày mai"},{"s":"Have a nice evening! – Thanks, you ___!","a":"too","alt":[],"hint":"Bạn cũng vậy"}],"speak":["Good morning, Mark!","How are you today?","I'm fine, thanks. And you?","Have a nice evening!"],"write":{"vi":"Viết một đoạn hội thoại ngắn: bạn chào một đồng nghiệp nước ngoài buổi sáng, hỏi thăm, và chào tạm biệt lúc cuối ngày.","en":"Write a short dialogue: you greet a foreign colleague in the morning, ask how they are, and say goodbye at the end of the day.","min":20},"summary":["Chào theo buổi: Good morning / Good afternoon / Good evening. Good night chỉ dùng khi chia tay.","How are you? → I'm fine, thanks. And you? Trả lời ngắn rồi hỏi lại.","Chia tay: Bye. See you tomorrow. Have a nice evening! → Thanks, you too!","Thank you → You're welcome."]},{"id":"s_alpha","ch":1,"level":"A0","title":"The alphabet and spelling","vi":"Bảng chữ cái, đánh vần tên và email","goals":["Sau bài này bạn có thể đọc đúng 26 chữ cái tiếng Anh, nhất là các chữ hay nhầm như E, G, I, J, Y.","Sau bài này bạn có thể hỏi How do you spell that? và đánh vần tên của mình.","Sau bài này bạn có thể đọc một địa chỉ email với at (@) và dot (.)."],"story":[{"who":"Sofia","en":"Hello, this is Sofia Ortiz from BrightMart.","vi":"Xin chào, tôi là Sofia Ortiz bên BrightMart."},{"who":"Lan","en":"Hi, Sofia. I'm Lan Nguyen from DataPeak.","vi":"Chào chị Sofia. Tôi là Lan Nguyễn bên DataPeak."},{"who":"Sofia","en":"Sorry, how do you spell your name?","vi":"Xin lỗi, tên chị đánh vần thế nào?"},{"who":"Lan","en":"Lan is L-A-N. Nguyen is N-G-U-Y-E-N.","vi":"Lan là L-A-N. Nguyen là N-G-U-Y-E-N."},{"who":"Sofia","en":"Thank you. Is that a capital L?","vi":"Cảm ơn chị. Chữ L viết hoa phải không?"},{"who":"Lan","en":"Yes, a capital L and a capital N.","vi":"Vâng, L viết hoa và N viết hoa."},{"who":"Sofia","en":"And what is your email address?","vi":"Còn địa chỉ email của chị là gì?"},{"who":"Lan","en":"It's lan dot nguyen at datapeak dot com.","vi":"Là lan chấm nguyen a còng datapeak chấm com."},{"who":"Sofia","en":"Is that D-A-T-A-P-E-A-K?","vi":"Có phải D-A-T-A-P-E-A-K không?"},{"who":"Lan","en":"Yes, that's right. It's all lowercase.","vi":"Vâng, đúng rồi. Viết thường hết ạ."}],"vocab":[{"w":"alphabet","ipa":"/ˈælfəbet/","vi":"bảng chữ cái","ex":"The English alphabet has 26 letters."},{"w":"letter","ipa":"/ˈletər/","vi":"chữ cái","ex":"My name has three letters."},{"w":"spell","ipa":"/spel/","vi":"đánh vần","ex":"How do you spell your name?"},{"w":"capital letter","ipa":"/ˈkæpɪtl ˈletər/","vi":"chữ viết hoa","ex":"Names start with a capital letter."},{"w":"lowercase","ipa":"/ˈloʊərkeɪs/","vi":"chữ viết thường","ex":"My email is all lowercase."},{"w":"email address","ipa":"/ˈiːmeɪl ˈædres/","vi":"địa chỉ email","ex":"What is your email address?"},{"w":"at (@)","ipa":"/æt/","vi":"a còng (@)","ex":"lan at datapeak dot com"},{"w":"dot (.)","ipa":"/dɑːt/","vi":"dấu chấm (trong email, web)","ex":"datapeak dot com"}],"grammar":{"t":"Bảng chữ cái và cách đánh vần","d":"Tiếng Anh có 26 chữ cái, nhưng tên chữ cái đọc khác tiếng Việt. Nhiều người nhầm E, G, I, J, Y nên đánh vần tên sai. Mẹo: học chữ cái theo nhóm có cùng âm, rồi luyện đánh vần tên và email của chính mình.","formula":["Hỏi: How do you spell + tên / từ? (How do you spell that?)","Trả lời: đọc từng chữ cái, ngắt nhẹ: L-A-N. Hai chữ giống nhau liền nhau: double + chữ (Anna = A, double N, A).","Email: tên + at (@) + công ty + dot (.) + com. Dấu gạch dưới _ = underscore, gạch ngang - = dash."],"ex":["Nhóm âm /eɪ/: A, H, J, K","Nhóm âm /iː/: B, C, D, E, G, P, T, V, Z (Mỹ đọc Z = /ziː/)","Nhóm âm /e/: F, L, M, N, S, X · Nhóm /aɪ/: I, Y · Nhóm /uː/: Q, U, W · O = /oʊ/ · R = /ɑːr/","Chữ hoa (capital letter) dùng cho tên người, tên công ty, tên nước và đầu câu: Lan, BrightMart, Vietnam.","Is that B for 'banana' or P for 'pen'? = cách hỏi lại khi nghe không rõ chữ cái."],"mistakes":[{"wrong":"Đọc E như chữ 'e' tiếng Việt, I như chữ 'i'","right":"E = /iː/ (giống 'i' kéo dài), I = /aɪ/ (giống 'ai')","why":"Tên chữ cái tiếng Anh khác tiếng Việt; đọc sai sẽ làm người nghe ghi sai tên."},{"wrong":"Nhầm G và J","right":"G = /dʒiː/ (gi), J = /dʒeɪ/ (dzây)","why":"Hai chữ này dễ đảo cho nhau, nhất là khi đánh vần tên Nguyen."},{"wrong":"How to spell your name?","right":"How do you spell your name?","why":"Câu hỏi cần trợ động từ 'do you'."}]},"quiz":[{"q":"Which company is Sofia from?","o":["DataPeak","BrightMart","Google"],"a":1},{"q":"What word does Lan say for @ in her email?","o":["dot","and","at"],"a":2},{"q":"How do you ___ your name?","o":["spell","letter","capital"],"a":0}],"practice":[{"s":"Sorry, how do you ___ your name?","a":"spell","alt":[],"hint":"Đánh vần"},{"s":"My email is lan.nguyen@datapeak.com: lan dot nguyen ___ datapeak dot com.","a":"at","alt":[],"hint":"Cách đọc dấu @"},{"s":"datapeak.com is 'datapeak ___ com'.","a":"dot","alt":[],"hint":"Cách đọc dấu chấm trong email"},{"s":"Names start with a ___ letter.","a":"capital","alt":[],"hint":"Chữ viết hoa"},{"s":"Anna is A, ___ N, A.","a":"double","alt":[],"hint":"Hai chữ N liền nhau"}],"speak":["How do you spell your name?","Lan is L-A-N.","What is your email address?","It's lan dot nguyen at datapeak dot com."],"write":{"vi":"Viết tin nhắn cho một đối tác mới: đánh vần họ tên của bạn và ghi rõ địa chỉ email (nói rõ chữ hoa hay chữ thường).","en":"Write a message to a new partner: spell your full name and give your email address.","min":20},"summary":["26 chữ cái có tên riêng; nhớ các chữ hay nhầm: E /iː/, I /aɪ/, G /dʒiː/, J /dʒeɪ/, Y /waɪ/.","Hỏi đánh vần: How do you spell that? Trả lời từng chữ: L-A-N; hai chữ giống nhau: double N.","Email: @ đọc là at, dấu chấm đọc là dot.","capital letter = chữ hoa, lowercase = chữ thường."]},{"id":"s_numbers","ch":1,"level":"A0","title":"Numbers and phone numbers","vi":"Số đếm 0–100 và số điện thoại","goals":["Sau bài này bạn có thể đếm và đọc đúng các số từ 0 đến 100.","Sau bài này bạn có thể phân biệt số -teen và -ty (fifteen / fifty) khi nghe và nói.","Sau bài này bạn có thể đọc số điện thoại từng chữ số, dùng 'oh' và 'double'."],"story":[{"who":"Mark","en":"Lan, what is the phone number for Sofia?","vi":"Lan, số điện thoại của Sofia là gì?"},{"who":"Lan","en":"It's oh-nine-one-two, three-four-five, six-seven-eight.","vi":"Là 0912 345 678."},{"who":"Mark","en":"Sorry, is that three-four-five or three-five-five?","vi":"Xin lỗi, là 345 hay 355?"},{"who":"Lan","en":"Three-four-five. And six-seven-eight at the end.","vi":"345. Và 678 ở cuối."},{"who":"Mark","en":"Thanks. And the number for Tom, the IT manager?","vi":"Cảm ơn. Còn số của Tom, quản lý IT?"},{"who":"Lan","en":"It's oh-nine-double-eight, double-two-one, four-five-oh.","vi":"Là 0988 221 450."},{"who":"Mark","en":"Great. How many people are on the client team?","vi":"Tốt. Đội bên khách hàng có bao nhiêu người?"},{"who":"Lan","en":"Fifteen people.","vi":"Mười lăm người."},{"who":"Mark","en":"Fifteen or fifty?","vi":"Mười lăm hay năm mươi?"},{"who":"Lan","en":"Fifteen. One, five. It's a small team.","vi":"Mười lăm. Một, năm. Đội nhỏ thôi."}],"vocab":[{"w":"phone number","ipa":"/ˈfoʊn ˌnʌmbər/","vi":"số điện thoại","ex":"What is your phone number?"},{"w":"zero","ipa":"/ˈzɪroʊ/","vi":"số không","ex":"Zero, one, two, three."},{"w":"oh (0)","ipa":"/oʊ/","vi":"số 0 (cách đọc trong số điện thoại)","ex":"oh-nine-one-two"},{"w":"double","ipa":"/ˈdʌbəl/","vi":"đôi, hai số giống nhau","ex":"88 is 'double eight'."},{"w":"fifteen","ipa":"/ˌfɪfˈtiːn/","vi":"mười lăm","ex":"Fifteen people are on the team."},{"w":"fifty","ipa":"/ˈfɪfti/","vi":"năm mươi","ex":"Fifty plus fifty is one hundred."},{"w":"hundred","ipa":"/ˈhʌndrəd/","vi":"trăm","ex":"one hundred reports"},{"w":"how many","ipa":"/haʊ ˈmeni/","vi":"bao nhiêu (đếm được)","ex":"How many people are on the team?"}],"grammar":{"t":"Số đếm 0–100 và cách đọc số điện thoại","d":"Số 13–19 có đuôi -teen và nhấn ở âm cuối; số 20, 30… 90 có đuôi -ty và nhấn ở âm đầu. Nhấn sai là người nghe hiểu nhầm 15 thành 50. Số điện thoại thì không đọc thành số lớn, mà đọc từng chữ số một, chia thành nhóm nhỏ.","formula":["13–19: gốc + teen, nhấn âm cuối: thir-TEEN, four-TEEN, fif-TEEN","20–90: gốc + ty, nhấn âm đầu: TWEN-ty, THIR-ty, FOR-ty, FIF-ty; 100 = one hundred","21–99: hàng chục + gạch nối + hàng đơn vị: twenty-one, forty-five, ninety-nine","Số điện thoại: đọc từng chữ số theo nhóm; 0 = oh (hoặc zero); hai số giống nhau = double (88 = double eight)"],"ex":["0 zero, 1 one, 2 two, 3 three, 4 four, 5 five, 6 six, 7 seven, 8 eight, 9 nine, 10 ten","11 eleven, 12 twelve (đặc biệt, không có -teen), 13 thirteen, 15 fifteen, 18 eighteen","20 twenty, 30 thirty, 40 forty (không có chữ u), 50 fifty, 80 eighty","0912 345 678 → oh-nine-one-two, three-four-five, six-seven-eight","Người Mỹ thường nói 'eight eight' thay cho 'double eight'; cả hai đều đúng."],"mistakes":[{"wrong":"fourty","right":"forty","why":"Four có chữ u, nhưng forty thì không."},{"wrong":"Nói 15 và 50 cùng một kiểu: 'fifty'","right":"fif-TEEN (15) / FIF-ty (50)","why":"Đuôi -teen kéo dài và nhấn mạnh; -ty ngắn và nhấn ở âm đầu."},{"wrong":"Đọc 0912345678 là 'nine hundred twelve million…'","right":"oh-nine-one-two, three-four-five, six-seven-eight","why":"Số điện thoại luôn đọc từng chữ số, chia nhóm 3–4 số."}]},"quiz":[{"q":"What are the last three numbers for Sofia?","o":["345","678","355"],"a":1},{"q":"How many people are on the client team?","o":["Fifteen","Fifty","Five"],"a":0},{"q":"In a phone number, 0 is often said as ___.","o":["'ten'","'double'","'oh'"],"a":2}],"practice":[{"s":"Forty plus ten is ___.","a":"fifty","alt":[],"hint":"40 + 10"},{"s":"Ten times four is ___.","a":"forty","alt":[],"hint":"Viết đúng chính tả số 40"},{"s":"Twenty plus one is ___.","a":"twenty-one","alt":["twenty one"],"hint":"Hàng chục + gạch nối + hàng đơn vị"},{"s":"In a phone number, we often say 0 as ___.","a":"oh","alt":["zero"],"hint":"Giống chữ O"},{"s":"77 in a phone number is '___ seven'.","a":"double","alt":[],"hint":"Hai số giống nhau"}],"speak":["What is the phone number for Sofia?","It's oh-nine-one-two, three-four-five, six-seven-eight.","How many people are on the client team?","Fifteen. One, five."],"write":{"vi":"Viết tin nhắn gửi sếp: ghi tên và số điện thoại (bằng chữ) của hai người bên khách hàng, và đội khách hàng có bao nhiêu người.","en":"Write a message to your manager with the names and phone numbers (in words) of two client contacts, and how many people are on the client team.","min":20},"summary":["13–19 đuôi -teen nhấn cuối; 20–90 đuôi -ty nhấn đầu. Chú ý fifteen ≠ fifty.","21–99: twenty-one, forty-five (có gạch nối). 40 là forty, không có u.","Số điện thoại: đọc từng chữ số theo nhóm, 0 = oh, 88 = double eight.","Hỏi số lượng: How many + danh từ số nhiều?"]},{"id":"x1_2","ch":1,"level":"A0","after":"s_numbers","title":"Where are you from?","vi":"Quốc gia và quốc tịch","goals":["Sau bài này bạn có thể phân biệt tên nước (Vietnam) và quốc tịch (Vietnamese).","Sau bài này bạn có thể nói về quốc tịch của mình và của người khác với he / she / they.","Sau bài này bạn có thể hỏi và trả lời Is he…? / Are they…? với câu trả lời ngắn."],"story":[{"who":"Mark","en":"Hi, everyone. This is Ji-woo. She's from Seoul.","vi":"Chào mọi người. Đây là Ji-woo. Cô ấy đến từ Seoul."},{"who":"Lan","en":"Hello, Ji-woo. So you're Korean?","vi":"Chào Ji-woo. Vậy bạn là người Hàn Quốc à?"},{"who":"Ji-woo","en":"Yes, I'm Korean. Are you Thai?","vi":"Vâng, tôi là người Hàn. Chị là người Thái à?"},{"who":"Lan","en":"No, I'm not. I'm Vietnamese, from Da Nang.","vi":"Không. Tôi là người Việt, ở Đà Nẵng."},{"who":"Ji-woo","en":"Oh, nice! Is Mark British?","vi":"Ồ, hay quá! Mark là người Anh à?"},{"who":"Lan","en":"No, he isn't. He's Australian.","vi":"Không phải. Anh ấy là người Úc."},{"who":"Mark","en":"That's right. I'm from Melbourne.","vi":"Đúng vậy. Tôi đến từ Melbourne."},{"who":"Ji-woo","en":"And Tom and Anna? Are they Australian too?","vi":"Còn Tom và Anna? Họ cũng là người Úc à?"},{"who":"Mark","en":"No, they aren't. They're American clients.","vi":"Không. Họ là khách hàng người Mỹ."},{"who":"Ji-woo","en":"Wow, four countries in one meeting!","vi":"Ồ, bốn quốc gia trong một cuộc họp!"}],"vocab":[{"w":"country","ipa":"/ˈkʌntri/","vi":"đất nước, quốc gia","ex":"Vietnam is a beautiful country."},{"w":"nationality","ipa":"/ˌnæʃəˈnæləti/","vi":"quốc tịch","ex":"What is your nationality?"},{"w":"Vietnamese","ipa":"/viˌetnəˈmiːz/","vi":"(người / tiếng) Việt Nam","ex":"I'm Vietnamese."},{"w":"Korean","ipa":"/kəˈriːən/","vi":"(người / tiếng) Hàn Quốc","ex":"Ji-woo is Korean."},{"w":"Australian","ipa":"/ɔːˈstreɪliən/","vi":"(người) Úc","ex":"Mark is Australian."},{"w":"American","ipa":"/əˈmerɪkən/","vi":"(người) Mỹ","ex":"Tom and Anna are American."},{"w":"British","ipa":"/ˈbrɪtɪʃ/","vi":"(người) Anh","ex":"Is Mark British?"},{"w":"Thai","ipa":"/taɪ/","vi":"(người / tiếng) Thái Lan","ex":"Are you Thai?"}],"grammar":{"t":"Quốc gia, quốc tịch và TO BE với he / she / they","d":"Tên nước là danh từ chỉ nơi chốn, dùng sau 'from': I'm from Vietnam. Quốc tịch là tính từ, đứng ngay sau to be: I'm Vietnamese. Cả hai luôn viết hoa chữ cái đầu.","formula":["Nơi đến: S + am/is/are + from + tên nước (He is from Australia.)","Quốc tịch: S + am/is/are + quốc tịch (He is Australian.)","Phủ định: He isn't British. / They aren't Australian.","Câu hỏi: Is she Korean? → Yes, she is. / No, she isn't. · Are they American? → Yes, they are. / No, they aren't."],"ex":["Đuôi -ese: Vietnam → Vietnamese, China → Chinese, Japan → Japanese","Đuôi -an / -ian: Korea → Korean, America → American, Australia → Australian","Đuôi -ish: Britain (the UK) → British, England → English","Khác: Thailand → Thai, France → French","Hỏi quốc tịch: Where are you from? → I'm from Vietnam. I'm Vietnamese."],"mistakes":[{"wrong":"I'm from Vietnamese.","right":"I'm from Vietnam. / I'm Vietnamese.","why":"Sau 'from' là tên nước; quốc tịch đứng ngay sau to be."},{"wrong":"He is come from Australia.","right":"He is from Australia.","why":"Không ghép 'is' với 'come'. Dùng 'is from' (hoặc 'comes from')."},{"wrong":"She is korean.","right":"She is Korean.","why":"Quốc tịch và ngôn ngữ luôn viết hoa chữ cái đầu."}]},"quiz":[{"q":"Where is Ji-woo from?","o":["Seoul","Bangkok","Melbourne"],"a":0},{"q":"What nationality are Tom and Anna?","o":["British","Australian","American"],"a":2},{"q":"Lan is ___.","o":["Vietnam","Vietnamese","from Vietnamese"],"a":1}],"practice":[{"s":"I'm from Japan. I'm ___.","a":"Japanese","alt":[],"hint":"Quốc tịch của người Nhật (đuôi -ese)"},{"s":"Mark is from Australia. He's ___.","a":"Australian","alt":[],"hint":"Quốc tịch của người Úc"},{"s":"Lan is from ___. She's Vietnamese.","a":"Vietnam","alt":["Viet Nam"],"hint":"Tên nước, sau 'from'"},{"s":"___ she Korean? – Yes, she is.","a":"Is","alt":[],"hint":"To be với 'she', đảo lên đầu câu"},{"s":"Tom and Anna ___ American.","a":"are","alt":[],"hint":"To be với 'they'"}],"speak":["Where are you from?","I'm Vietnamese, from Da Nang.","No, he isn't. He's Australian.","They're American clients."],"write":{"vi":"Giới thiệu ba người trong đội dự án của bạn: tên, họ đến từ nước nào, quốc tịch gì.","en":"Introduce three people on your project team: their names, their countries and their nationalities.","min":20},"summary":["from + tên nước (from Vietnam); to be + quốc tịch (I'm Vietnamese).","Các đuôi quốc tịch thường gặp: -ese, -an/-ian, -ish.","He/She is…, They are…; phủ định isn't / aren't; trả lời ngắn Yes, she is. / No, they aren't.","Tên nước và quốc tịch luôn viết hoa."]},{"id":"s_family","ch":1,"level":"A0","title":"My family and me","vi":"Gia đình, tính từ sở hữu","goals":["Sau bài này bạn có thể giới thiệu các thành viên trong gia đình mình.","Sau bài này bạn có thể dùng đúng my, your, his, her, its, our, their.","Sau bài này bạn có thể dùng have với I/you/we/they và has với he/she/it."],"story":[{"who":"Mark","en":"Look, Lan. Here is a photo of my family.","vi":"Lan xem này. Đây là ảnh gia đình tôi."},{"who":"Lan","en":"Oh, nice! Is she your wife?","vi":"Ồ, đẹp quá! Đây là vợ anh à?"},{"who":"Mark","en":"Yes, her name is Kate. She has a busy job.","vi":"Ừ, cô ấy tên Kate. Cô ấy làm công việc rất bận."},{"who":"Lan","en":"Do you have children?","vi":"Anh có con không?"},{"who":"Mark","en":"Yes, we have two, a son and a daughter.","vi":"Có, chúng tôi có hai đứa, một trai một gái."},{"who":"Lan","en":"What are their names?","vi":"Các cháu tên là gì?"},{"who":"Mark","en":"Our son is Jack, and our daughter is Mia.","vi":"Con trai tôi tên Jack, còn con gái tên Mia."},{"who":"Lan","en":"Lovely! Here is my brother, Nam. He has a baby girl.","vi":"Dễ thương quá! Đây là anh trai tôi, Nam. Anh ấy có một bé gái."},{"who":"Mark","en":"Cute! What's her name?","vi":"Đáng yêu quá! Bé tên gì?"},{"who":"Lan","en":"Her name is Mai. She's his first child.","vi":"Bé tên Mai. Bé là con đầu lòng của anh ấy."}],"vocab":[{"w":"family","ipa":"/ˈfæməli/","vi":"gia đình","ex":"I have a big family."},{"w":"photo","ipa":"/ˈfoʊtoʊ/","vi":"bức ảnh","ex":"Here is a photo of my team."},{"w":"wife","ipa":"/waɪf/","vi":"vợ","ex":"His wife is a nurse."},{"w":"children","ipa":"/ˈtʃɪldrən/","vi":"con cái, trẻ em (số nhiều của child)","ex":"Do you have children?"},{"w":"son","ipa":"/sʌn/","vi":"con trai","ex":"Their son is ten."},{"w":"daughter","ipa":"/ˈdɔːtər/","vi":"con gái","ex":"Our daughter is Mia."},{"w":"brother","ipa":"/ˈbrʌðər/","vi":"anh trai / em trai","ex":"My brother is a teacher."},{"w":"baby","ipa":"/ˈbeɪbi/","vi":"em bé","ex":"He has a baby girl."}],"grammar":{"t":"Tính từ sở hữu (my, your, his…) và HAVE / HAS","d":"Tính từ sở hữu cho biết vật hay người đó là 'của ai'. Nó luôn đứng TRƯỚC danh từ: my family = gia đình tôi. Động từ 'có' là have, nhưng với he / she / it thì đổi thành has.","formula":["I → my · you → your · he → his · she → her · it → its · we → our · they → their","Tính từ sở hữu + danh từ: my brother, her name, their children","I / You / We / They + have · He / She / It + has","Câu hỏi: Do you have…? → Yes, I do. / No, I don't."],"ex":["My name is Lan. Your office is big.","Mark has a wife. Her name is Kate. (her = của cô ấy, chỉ Kate)","Nam has a daughter. His daughter is Mai. (his = của anh ấy, chỉ Nam)","We have a dog. Its name is Max. (its = của nó)","Jack and Mia are kids. Their mother is Kate."],"mistakes":[{"wrong":"He name is Nam.","right":"His name is Nam.","why":"Trước danh từ phải dùng tính từ sở hữu (his), không dùng đại từ (he)."},{"wrong":"Mark and her wife","right":"Mark and his wife","why":"his/her chọn theo NGƯỜI SỞ HỮU (Mark là nam → his), không theo người được nói tới."},{"wrong":"She have a son.","right":"She has a son.","why":"Với he / she / it, have đổi thành has."}]},"quiz":[{"q":"What is the name of Mark's wife?","o":["Mia","Kate","Mai"],"a":1},{"q":"How many children does Mark have?","o":["One","Three","Two"],"a":2},{"q":"This is Nam. ___ daughter is Mai.","o":["His","Her","He"],"a":0}],"practice":[{"s":"Mark has a wife. ___ name is Kate.","a":"Her","alt":[],"hint":"Của cô ấy"},{"s":"Lan ___ a brother.","a":"has","alt":[],"hint":"Động từ 'có' với một người (she)"},{"s":"I ___ two sisters.","a":"have","alt":[],"hint":"Động từ 'có' với I"},{"s":"We have a son. ___ son is Jack.","a":"Our","alt":[],"hint":"Của chúng tôi"},{"s":"Jack and Mia have a dog. ___ dog is Max.","a":"Their","alt":[],"hint":"Của họ"}],"speak":["Here is a photo of my family.","Do you have children?","Our son is Jack, and our daughter is Mia.","He has a baby girl. Her name is Mai."],"write":{"vi":"Giới thiệu gia đình bạn cho một đồng nghiệp nước ngoài: gia đình có những ai, tên gì, làm nghề gì. Dùng my, his, her, have, has.","en":"Tell a foreign colleague about your family: who is in it, their names and their jobs.","min":20},"summary":["my, your, his, her, its, our, their luôn đứng trước danh từ: my family, her name.","his/her chọn theo người sở hữu: Mark → his wife; Kate → her husband.","I/you/we/they have; he/she/it has.","Hỏi: Do you have children? → Yes, I do. / No, I don't."]},{"id":"x1_3","ch":1,"level":"A0","after":"s_family","title":"Sorry, I don't understand","vi":"Khi không nghe rõ, không hiểu","goals":["Sau bài này bạn có thể lịch sự xin người khác nói lại hoặc nói chậm hơn.","Sau bài này bạn có thể hỏi nghĩa của một từ lạ: What does … mean?","Sau bài này bạn có thể báo cho người nói biết là bạn đã hiểu: I see. / Got it."],"story":[{"who":"Mark","en":"Lan, the client meeting is this arvo, OK?","vi":"Lan, buổi họp với khách là chiều nay, được chứ?"},{"who":"Lan","en":"Sorry? What does 'arvo' mean?","vi":"Xin lỗi? 'Arvo' nghĩa là gì vậy?"},{"who":"Mark","en":"Oh, sorry! 'Arvo' means afternoon. It's Australian English.","vi":"Ồ, xin lỗi! 'Arvo' nghĩa là buổi chiều. Đó là tiếng Anh kiểu Úc."},{"who":"Lan","en":"I see. Slowly, please. What time is the meeting?","vi":"À, tôi hiểu rồi. Anh nói chậm thôi nhé. Mấy giờ họp?"},{"who":"Mark","en":"At two-thirty. We need the KPI report.","vi":"Lúc hai rưỡi. Chúng ta cần báo cáo KPI."},{"who":"Lan","en":"Sorry, I don't understand. Which report?","vi":"Xin lỗi, tôi chưa hiểu. Báo cáo nào?"},{"who":"Mark","en":"The KPI report. K-P-I.","vi":"Báo cáo KPI. K-P-I."},{"who":"Lan","en":"Ah, OK. Sorry, one more time, please. What time?","vi":"À, được rồi. Xin lỗi, anh nói lại lần nữa nhé. Mấy giờ?"},{"who":"Mark","en":"Two-thirty in the afternoon.","vi":"Hai giờ ba mươi chiều."},{"who":"Lan","en":"Got it. Thank you, Mark.","vi":"Tôi rõ rồi. Cảm ơn anh, Mark."}],"vocab":[{"w":"Sorry?","ipa":"/ˈsɑːri/","vi":"Xin lỗi, bạn nói gì cơ? (lên giọng cuối câu)","ex":"Sorry? I can't hear you."},{"w":"mean","ipa":"/miːn/","vi":"có nghĩa là","ex":"What does 'KPI' mean?"},{"w":"understand","ipa":"/ˌʌndərˈstænd/","vi":"hiểu","ex":"Sorry, I don't understand."},{"w":"I see","ipa":"/aɪ ˈsiː/","vi":"à, tôi hiểu rồi","ex":"I see. Thank you."},{"w":"slowly","ipa":"/ˈsloʊli/","vi":"chậm, một cách chậm rãi","ex":"Slowly, please."},{"w":"one more time","ipa":"/wʌn ˈmɔːr taɪm/","vi":"thêm một lần nữa","ex":"One more time, please."},{"w":"got it","ipa":"/ˈɡɑːt ɪt/","vi":"rõ rồi, hiểu rồi (thân mật)","ex":"Two-thirty. Got it."},{"w":"KPI","ipa":"/ˌkeɪ piː ˈaɪ/","vi":"chỉ số đo hiệu quả công việc (key performance indicator)","ex":"We need the KPI report."}],"grammar":{"t":"Mẫu câu khi không nghe rõ hoặc không hiểu","d":"Không hiểu là chuyện bình thường, kể cả với người bản xứ. Điều quan trọng là hỏi lại ngay, lịch sự, thay vì im lặng hoặc gật đầu cho qua. Các câu dưới đây là mẫu cố định, chỉ cần học thuộc và dùng.","formula":["Xin nhắc lại: Sorry? / Pardon? / Sorry, one more time, please. / Slowly, please.","Hỏi nghĩa: What does + từ + mean? → It means…","Hỏi cách nói: How do you say + từ tiếng Việt + in English?","Báo đã hiểu: I see. / Got it. / OK, thanks."],"ex":["Sorry, I don't understand. Which report?","What does 'deadline' mean? – It means the last day for a task.","How do you say 'báo cáo' in English? – Report.","Sorry? (nói lên giọng ở cuối) = Bạn nói gì cơ?","Kết hợp với đánh vần: Sorry, how do you spell that?"],"mistakes":[{"wrong":"What? (nói cụt lủn khi không nghe rõ)","right":"Sorry? / Pardon? / Sorry, one more time, please.","why":"'What?' một mình nghe khá cộc, thậm chí bất lịch sự với khách hàng."},{"wrong":"What is mean 'arvo'?","right":"What does 'arvo' mean?","why":"Câu hỏi nghĩa dùng 'does', và 'mean' đứng cuối câu."},{"wrong":"I not understand.","right":"I don't understand.","why":"Phủ định của động từ thường cần 'don't'."}]},"quiz":[{"q":"What does 'arvo' mean?","o":["Morning","Evening","Afternoon"],"a":2},{"q":"What time is the meeting?","o":["2:30","3:00","12:30"],"a":0},{"q":"You don't hear the client. What do you say?","o":["What?","Sorry? One more time, please.","Got it."],"a":1}],"practice":[{"s":"What does 'KPI' ___?","a":"mean","alt":[],"hint":"Có nghĩa là"},{"s":"Sorry, I don't ___.","a":"understand","alt":[],"hint":"Hiểu"},{"s":"Sorry, one more ___, please.","a":"time","alt":[],"hint":"Thêm một lần nữa"},{"s":"___, please. You speak very fast.","a":"Slowly","alt":["More slowly"],"hint":"Chậm thôi"},{"s":"How do you ___ 'báo cáo' in English?","a":"say","alt":[],"hint":"Nói"}],"speak":["Sorry? What does 'arvo' mean?","Sorry, I don't understand.","Sorry, one more time, please.","Got it. Thank you."],"write":{"vi":"Đồng nghiệp gửi tin nhắn có một từ bạn không hiểu ('ASAP'). Viết trả lời: xin lỗi, hỏi nghĩa của từ đó và hỏi lại giờ hẹn.","en":"A colleague sends a message with a word you don't understand ('ASAP'). Reply: say sorry, ask what the word means, and check the meeting time again.","min":20},"summary":["Không nghe rõ: Sorry? / Pardon? / One more time, please. / Slowly, please.","Hỏi nghĩa: What does … mean? → It means…","Hỏi cách nói: How do you say … in English?","Đã hiểu: I see. / Got it. Tránh nói 'What?' cụt lủn."]},{"id":"s_things","ch":2,"level":"A0","title":"This, that, these, those","vi":"Đồ vật văn phòng và số nhiều","goals":["Sau bài này bạn có thể chỉ đồ vật gần hay xa bằng this, that, these, those.","Sau bài này bạn có thể đổi danh từ sang số nhiều với -s, -es, -ies.","Sau bài này bạn có thể dùng đúng các số nhiều bất quy tắc: people, men, women."],"story":[{"who":"Lan","en":"Welcome to my desk, Mark. This is my laptop.","vi":"Mời anh xem bàn làm việc của tôi, Mark. Đây là máy tính xách tay của tôi."},{"who":"Mark","en":"Nice. And what's that on the wall?","vi":"Hay đấy. Còn cái kia trên tường là gì?"},{"who":"Lan","en":"That's our team calendar.","vi":"Đó là lịch chung của đội."},{"who":"Mark","en":"Are these your notebooks?","vi":"Mấy quyển này là sổ tay của chị à?"},{"who":"Lan","en":"Yes, these are my notebooks. Those boxes are for paper.","vi":"Vâng, mấy quyển này là sổ của tôi. Mấy cái hộp đằng kia để đựng giấy."},{"who":"Mark","en":"Where are the pens and sticky notes?","vi":"Bút và giấy nhớ để đâu?"},{"who":"Lan","en":"They're in that drawer, with the batteries.","vi":"Ở trong ngăn kéo kia, cùng với pin."},{"who":"Mark","en":"How many people sit in this area?","vi":"Khu này có bao nhiêu người ngồi?"},{"who":"Lan","en":"Twelve people: six men and six women.","vi":"Mười hai người: sáu nam và sáu nữ."},{"who":"Mark","en":"And those chairs over there are new!","vi":"Mấy cái ghế đằng kia mới tinh nhỉ!"}],"vocab":[{"w":"laptop","ipa":"/ˈlæptɑːp/","vi":"máy tính xách tay","ex":"This is my laptop."},{"w":"calendar","ipa":"/ˈkæləndər/","vi":"lịch","ex":"That's our team calendar."},{"w":"notebook","ipa":"/ˈnoʊtbʊk/","vi":"sổ tay","ex":"These are my notebooks."},{"w":"box","ipa":"/bɑːks/","vi":"cái hộp (số nhiều: boxes)","ex":"Those boxes are for paper."},{"w":"sticky note","ipa":"/ˈstɪki noʊt/","vi":"giấy nhớ (giấy dán)","ex":"I need some sticky notes."},{"w":"drawer","ipa":"/drɔːr/","vi":"ngăn kéo","ex":"The pens are in that drawer."},{"w":"battery","ipa":"/ˈbætəri/","vi":"pin (số nhiều: batteries)","ex":"The batteries are in the drawer."},{"w":"person / people","ipa":"/ˈpɝːsən/ /ˈpiːpəl/","vi":"người (một người / nhiều người)","ex":"one person, twelve people"}],"grammar":{"t":"THIS / THAT / THESE / THOSE và danh từ số nhiều","d":"Bốn từ này dùng để chỉ đồ vật. Hãy hỏi hai câu: vật ở GẦN hay XA? Một vật hay NHIỀU vật? Danh từ đi sau these/those phải ở dạng số nhiều, và động từ to be cũng đổi theo (is → are).","formula":["Gần: this + danh từ số ít (this laptop) · these + danh từ số nhiều (these notebooks)","Xa: that + danh từ số ít (that drawer) · those + danh từ số nhiều (those chairs)","This/That + is… · These/Those + are…","Số nhiều: thêm -s (pens); thêm -es sau s, x, ch, sh (boxes); phụ âm + y → -ies (batteries); bất quy tắc: person → people, man → men, woman → women, child → children"],"ex":["This is my laptop. (ở ngay đây, trong tay tôi)","That's our team calendar. (ở xa, trên tường)","These are my notebooks. / Those boxes are for paper.","Hỏi: What's this? / What are those?","Không thêm -s cho people: twelve people (không nói 'peoples')."],"mistakes":[{"wrong":"These is my pens.","right":"These are my pens.","why":"These / those đi với are, không đi với is."},{"wrong":"two box / this pens","right":"two boxes / these pens","why":"Nhiều vật thì danh từ phải ở số nhiều, và dùng these thay cho this."},{"wrong":"There are twelve persons / peoples.","right":"There are twelve people.","why":"Số nhiều của person là people; people đã là số nhiều rồi."}]},"quiz":[{"q":"What is on the wall?","o":["A clock","The team calendar","A map"],"a":1},{"q":"How many women sit in this area?","o":["Six","Twelve","Two"],"a":0},{"q":"___ boxes over there are for paper.","o":["That","This","Those"],"a":2}],"practice":[{"s":"___ is my laptop. (ngay đây, trong tay tôi)","a":"This","alt":[],"hint":"Gần, một vật"},{"s":"___ are my notebooks. (ngay trên bàn tôi)","a":"These","alt":[],"hint":"Gần, nhiều vật"},{"s":"Look at ___ chairs over there.","a":"those","alt":[],"hint":"Xa, nhiều vật"},{"s":"I have three ___. (box)","a":"boxes","alt":[],"hint":"Sau x thêm -es"},{"s":"There are ten ___ in the room. (person)","a":"people","alt":[],"hint":"Số nhiều bất quy tắc"}],"speak":["This is my laptop.","What's that on the wall?","These are my notebooks.","Those boxes are for paper."],"write":{"vi":"Một đồng nghiệp mới sắp đến. Viết tin nhắn mô tả bàn làm việc và đồ dùng cho bạn ấy, dùng this, that, these, those và danh từ số nhiều.","en":"A new colleague is coming. Write a message describing their desk and the office supplies, using this, that, these and those.","min":20},"summary":["Gần: this (1 vật) / these (nhiều vật). Xa: that (1 vật) / those (nhiều vật).","This/That is… · These/Those are…","Số nhiều: -s, -es (boxes), -ies (batteries).","Bất quy tắc: person → people, man → men, woman → women, child → children."]},{"id":"x2_1","ch":2,"level":"A0","after":"s_things","title":"A big brown table","vi":"Tính từ: màu sắc và đặc điểm","goals":["Sau bài này bạn có thể gọi tên màu sắc và mô tả đồ vật bằng tính từ đơn giản.","Sau bài này bạn có thể đặt tính từ đúng chỗ: trước danh từ hoặc sau to be.","Sau bài này bạn có thể hỏi What color is it? và trả lời."],"story":[{"who":"Mark","en":"Lan, the meeting room needs new chairs.","vi":"Lan, phòng họp cần ghế mới."},{"who":"Lan","en":"I have a catalog here. These are nice.","vi":"Tôi có cuốn danh mục đây. Mấy cái này đẹp đấy."},{"who":"Mark","en":"What color are they?","vi":"Chúng màu gì?"},{"who":"Lan","en":"They're dark blue. They're very comfortable.","vi":"Màu xanh đậm. Ngồi rất thoải mái."},{"who":"Mark","en":"Good. And we need a big table.","vi":"Tốt. Và chúng ta cần một cái bàn lớn."},{"who":"Lan","en":"This table is long and white.","vi":"Cái bàn này dài và màu trắng."},{"who":"Mark","en":"Hmm. White tables get dirty fast.","vi":"Hừm. Bàn trắng nhanh bẩn lắm."},{"who":"Lan","en":"OK. What about this brown table? It's wooden.","vi":"Được. Thế cái bàn nâu này thì sao? Nó bằng gỗ."},{"who":"Mark","en":"A big brown wooden table? Perfect.","vi":"Một cái bàn gỗ màu nâu, to? Hoàn hảo."},{"who":"Lan","en":"Great. Brown table, blue chairs. Easy!","vi":"Tuyệt. Bàn nâu, ghế xanh. Dễ thôi!"}],"vocab":[{"w":"catalog","ipa":"/ˈkætəlɔːɡ/","vi":"cuốn danh mục sản phẩm","ex":"The chairs are in the catalog."},{"w":"color","ipa":"/ˈkʌlər/","vi":"màu sắc (Anh – Úc viết: colour)","ex":"What color is your bag?"},{"w":"dark","ipa":"/dɑːrk/","vi":"đậm, tối","ex":"The chairs are dark blue."},{"w":"comfortable","ipa":"/ˈkʌmftərbəl/","vi":"thoải mái, êm","ex":"This chair is very comfortable."},{"w":"long","ipa":"/lɔːŋ/","vi":"dài","ex":"a long white table"},{"w":"brown","ipa":"/braʊn/","vi":"màu nâu","ex":"a brown table"},{"w":"wooden","ipa":"/ˈwʊdn/","vi":"bằng gỗ","ex":"It's a wooden table."},{"w":"dirty","ipa":"/ˈdɝːti/","vi":"bẩn","ex":"White tables get dirty fast."}],"grammar":{"t":"Tính từ: vị trí và cách dùng","d":"Tiếng Việt nói 'bàn trắng' (danh từ trước, tính từ sau), nhưng tiếng Anh ngược lại: white table (tính từ trước, danh từ sau). Tính từ cũng có thể đứng sau to be: The table is white. Tính từ tiếng Anh không bao giờ thêm -s, kể cả khi danh từ số nhiều.","formula":["Tính từ + danh từ: a white table, blue chairs","Danh từ + am/is/are + tính từ: The table is white. The chairs are blue.","Hỏi màu: What color is it? / What color are they? → It's brown. / They're dark blue.","Nhiều tính từ: kích thước → màu sắc → chất liệu + danh từ: a big brown wooden table"],"ex":["Màu: black, white, red, blue, green, yellow, brown, gray; dark blue (xanh đậm), light blue (xanh nhạt)","Kích thước: big / small, long / short","Đặc điểm: new / old, comfortable, clean / dirty","My laptop is new. I have a new laptop.","Two black bags (không nói 'two blacks bags')."],"mistakes":[{"wrong":"a table white","right":"a white table","why":"Tính từ đứng trước danh từ, ngược với tiếng Việt."},{"wrong":"The table very big.","right":"The table is very big.","why":"Câu mô tả cần động từ to be (is/are) trước tính từ."},{"wrong":"blues chairs","right":"blue chairs","why":"Tính từ không có dạng số nhiều; chỉ danh từ thêm -s."}]},"quiz":[{"q":"What color are the new chairs?","o":["White","Red","Dark blue"],"a":2},{"q":"Why doesn't Mark want the white table?","o":["It gets dirty fast.","It is small.","It is old."],"a":0},{"q":"Choose the correct phrase.","o":["a table brown","a brown table","a browns table"],"a":1}],"practice":[{"s":"I have a ___ laptop. (đen)","a":"black","alt":[],"hint":"Màu đen"},{"s":"The new chairs ___ comfortable.","a":"are","alt":[],"hint":"To be với danh từ số nhiều"},{"s":"What ___ is your bag? – It's red.","a":"color","alt":["colour"],"hint":"Hỏi màu sắc"},{"s":"We have two ___ tables. (to, lớn)","a":"big","alt":["large"],"hint":"Tính từ không thêm -s"},{"s":"The table is ___. (bằng gỗ)","a":"wooden","alt":[],"hint":"Làm bằng gỗ"}],"speak":["What color are they?","They're dark blue.","This table is long and white.","A big brown wooden table? Perfect."],"write":{"vi":"Viết tin nhắn cho bộ phận hành chính: mô tả hai món đồ bạn cần cho văn phòng (màu sắc, kích thước, chất liệu).","en":"Write a message to the office manager describing two things you need for the office (color, size, material).","min":20},"summary":["Tính từ đứng TRƯỚC danh từ: a white table (không nói 'a table white').","Hoặc đứng sau to be: The table is white. Đừng quên is/are.","Tính từ không thêm -s: blue chairs.","Hỏi màu: What color is it? / What color are they?"]},{"id":"s_dates","ch":2,"level":"A0","title":"Days, months and dates","vi":"Thứ, tháng, ngày và số thứ tự","goals":["Sau bài này bạn có thể nói các thứ trong tuần, các tháng và số thứ tự (first, second, third…).","Sau bài này bạn có thể đọc ngày tháng đúng: the fifth of May / May fifth.","Sau bài này bạn có thể dùng đúng on với ngày cụ thể và in với tháng."],"story":[{"who":"Mark","en":"OK, team. Our deadlines go on the shared calendar.","vi":"Nào cả đội. Các hạn chót của chúng ta sẽ ghi lên lịch chung."},{"who":"Lan","en":"The first report is due on May fifth.","vi":"Báo cáo đầu tiên phải nộp vào ngày 5 tháng 5."},{"who":"Mark","en":"The fifth of May? That's a Tuesday.","vi":"Mùng 5 tháng 5? Hôm đó là thứ Ba."},{"who":"Lan","en":"Yes. And the dashboard is due in June.","vi":"Vâng. Còn dashboard thì hạn trong tháng Sáu."},{"who":"Mark","en":"Which date in June?","vi":"Ngày nào trong tháng Sáu?"},{"who":"Lan","en":"On the twenty-second. It's a Monday.","vi":"Ngày 22. Hôm đó là thứ Hai."},{"who":"Mark","en":"And the final report?","vi":"Còn báo cáo cuối cùng?"},{"who":"Lan","en":"It's due on the thirty-first of July.","vi":"Hạn là ngày 31 tháng 7."},{"who":"Mark","en":"July thirty-first. Is that a Friday?","vi":"Ngày 31 tháng 7. Hôm đó là thứ Sáu à?"},{"who":"Lan","en":"Yes, it's the last Friday in July.","vi":"Vâng, là thứ Sáu cuối cùng của tháng Bảy."}],"vocab":[{"w":"deadline","ipa":"/ˈdedlaɪn/","vi":"hạn chót","ex":"The deadline is on Friday."},{"w":"due","ipa":"/duː/","vi":"đến hạn (phải nộp, phải xong)","ex":"The report is due on May 5th."},{"w":"date","ipa":"/deɪt/","vi":"ngày (trong tháng)","ex":"What's the date today?"},{"w":"first","ipa":"/fɝːst/","vi":"thứ nhất, đầu tiên","ex":"the first of June"},{"w":"fifth","ipa":"/fɪfθ/","vi":"thứ năm (số thứ tự)","ex":"the fifth of May"},{"w":"final","ipa":"/ˈfaɪnəl/","vi":"cuối cùng (bản chốt)","ex":"the final report"},{"w":"last","ipa":"/læst/","vi":"cuối cùng (trong một chuỗi)","ex":"the last Friday in July"},{"w":"shared","ipa":"/ʃerd/","vi":"dùng chung","ex":"a shared calendar"}],"grammar":{"t":"Số thứ tự và cách nói ngày tháng","d":"Khi nói ngày trong tháng, tiếng Anh dùng số thứ tự (fifth), không dùng số đếm (five). Hầu hết số thứ tự chỉ cần thêm -th, nhưng có vài số đặc biệt phải học thuộc. Ngày cụ thể đi với ON, còn tháng hoặc năm đi với IN.","formula":["Số thứ tự: số đếm + th (fourth, sixth, tenth). Đặc biệt: 1st first, 2nd second, 3rd third, 5th fifth, 8th eighth, 9th ninth, 12th twelfth, 20th twentieth; 21st twenty-first, 22nd twenty-second, 31st thirty-first","Đọc ngày: the + số thứ tự + of + tháng (the fifth of May) hoặc tháng + số thứ tự (May fifth)","ON + ngày cụ thể / thứ: on May 5th, on the twenty-second, on Monday","IN + tháng / năm: in June, in 2026"],"ex":["Thứ: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday","Tháng: January, February, March, April, May, June, July, August, September, October, November, December","Viết 'May 5' hay '5 May' đều đọc là 'fifth'.","Chú ý: 05/06 ở Mỹ là May 6th, ở Anh, Úc và Việt Nam là 5th June. Với khách nước ngoài, nên viết rõ tên tháng.","Hỏi: What's the date today? → It's the twelfth of March."],"mistakes":[{"wrong":"The report is due on May five.","right":"The report is due on May fifth.","why":"Ngày trong tháng dùng số thứ tự (fifth), không dùng số đếm (five)."},{"wrong":"on June / in Monday","right":"in June / on Monday","why":"Tháng đi với IN; thứ và ngày cụ thể đi với ON."},{"wrong":"the twenty-oneth","right":"the twenty-first","why":"Số tận cùng là 1, 2, 3 dùng first, second, third (trừ 11th, 12th, 13th)."}]},"quiz":[{"q":"When is the first report due?","o":["On May fifth","On June twenty-second","On July thirty-first"],"a":0},{"q":"What is due in June?","o":["The final report","The dashboard","The first report"],"a":1},{"q":"The final report is due ___ July 31st.","o":["in","at","on"],"a":2}],"practice":[{"s":"The deadline is ___ Monday.","a":"on","alt":[],"hint":"Giới từ đi với thứ"},{"s":"My holiday is ___ August.","a":"in","alt":[],"hint":"Giới từ đi với tháng"},{"s":"May 3rd = May ___","a":"third","alt":[],"hint":"Số thứ tự của 3 (đặc biệt)"},{"s":"The 12th of June = the ___ of June","a":"twelfth","alt":[],"hint":"Số thứ tự của 12, chú ý chữ f"},{"s":"July 21st = July twenty-___","a":"first","alt":[],"hint":"Số tận cùng là 1"}],"speak":["The first report is due on May fifth.","Which date in June?","It's due on the thirty-first of July.","Is that a Friday?"],"write":{"vi":"Viết email ngắn cho đội: liệt kê ba hạn chót của dự án, mỗi hạn có thứ và ngày tháng (viết bằng chữ).","en":"Write a short email to your team listing three project deadlines, with the day and the date for each one.","min":20},"summary":["Ngày trong tháng dùng số thứ tự: first, second, third, fifth, twelfth, twenty-first…","Hai cách đọc: the fifth of May / May fifth.","ON + ngày, thứ (on May 5th, on Monday); IN + tháng, năm (in June, in 2026).","Viết rõ tên tháng khi làm việc với khách nước ngoài để tránh nhầm ngày/tháng."]},{"id":"x2_2","ch":2,"level":"A0","after":"s_dates","title":"What time is it?","vi":"Nói giờ: half past, a quarter to","goals":["Sau bài này bạn có thể hỏi giờ và nói giờ theo kiểu số: nine thirty, five forty-five.","Sau bài này bạn có thể hiểu và dùng half past, a quarter past, a quarter to.","Sau bài này bạn có thể dùng a.m. và p.m. thay cho giờ kiểu 24 tiếng."],"story":[{"who":"Minh","en":"Excuse me, Lan. What time is it?","vi":"Chị Lan ơi, cho em hỏi mấy giờ rồi ạ?"},{"who":"Lan","en":"It's half past nine.","vi":"Chín rưỡi rồi."},{"who":"Minh","en":"Thanks. What time is the team meeting?","vi":"Cảm ơn chị. Họp đội lúc mấy giờ ạ?"},{"who":"Lan","en":"It's at a quarter to eleven.","vi":"Lúc mười một giờ kém mười lăm."},{"who":"Minh","en":"And what time is lunch here?","vi":"Còn ở đây ăn trưa lúc mấy giờ ạ?"},{"who":"Lan","en":"Lunch is from twelve to a quarter past one.","vi":"Nghỉ trưa từ mười hai giờ đến một giờ mười lăm."},{"who":"Minh","en":"OK. My bus is at five forty-five p.m.","vi":"Vâng. Xe buýt của em lúc năm giờ bốn lăm chiều."},{"who":"Lan","en":"Five forty-five? That's a quarter to six.","vi":"Năm giờ bốn lăm? Tức là sáu giờ kém mười lăm."},{"who":"Minh","en":"Yes. The office closes at five thirty, right?","vi":"Vâng. Văn phòng đóng cửa lúc năm rưỡi phải không chị?"},{"who":"Lan","en":"Yes. So your bus time is perfect.","vi":"Ừ. Vậy giờ xe buýt của em là vừa khéo."}],"vocab":[{"w":"half past","ipa":"/hæf pæst/","vi":"rưỡi (giờ + 30 phút)","ex":"It's half past nine. (9:30)"},{"w":"a quarter past","ipa":"/ə ˈkwɔːrtər pæst/","vi":"giờ + 15 phút","ex":"a quarter past one (1:15)"},{"w":"a quarter to","ipa":"/ə ˈkwɔːrtər tuː/","vi":"kém 15 phút","ex":"a quarter to eleven (10:45)"},{"w":"a.m.","ipa":"/ˌeɪ ˈem/","vi":"giờ buổi sáng (từ nửa đêm đến trưa)","ex":"The office opens at 8 a.m."},{"w":"p.m.","ipa":"/ˌpiː ˈem/","vi":"giờ buổi chiều, tối (từ trưa đến nửa đêm)","ex":"My bus is at 5:45 p.m."},{"w":"lunch","ipa":"/lʌntʃ/","vi":"bữa trưa","ex":"Lunch is at twelve."},{"w":"bus","ipa":"/bʌs/","vi":"xe buýt","ex":"My bus is at six."},{"w":"close","ipa":"/kloʊz/","vi":"đóng cửa","ex":"The office closes at 5:30."}],"grammar":{"t":"Cách nói giờ trong tiếng Anh","d":"Có hai cách nói giờ. Cách 1 rất dễ: đọc giờ rồi đọc phút, giống đồng hồ điện tử. Cách 2 dùng past (hơn) và to (kém), người bản xứ dùng nhiều trong giao tiếp. Người nói tiếng Anh ít dùng giờ 24 tiếng khi nói chuyện; họ dùng a.m. và p.m.","formula":["Cách 1: giờ + phút: 9:30 = nine thirty; 5:45 = five forty-five; 7:05 = seven oh five","Cách 2 (phút 1–30): phút + past + giờ: 9:15 = a quarter past nine; 9:30 = half past nine; 9:10 = ten past nine","Cách 2 (phút 31–59): số phút còn thiếu + to + giờ sau: 10:45 = a quarter to eleven; 8:50 = ten to nine","a.m. = từ 0 giờ đến trước 12 giờ trưa · p.m. = từ 12 giờ trưa đến trước nửa đêm"],"ex":["Hỏi: What time is it? → It's ten past two.","Hỏi giờ của sự việc: What time is the meeting? → It's at a quarter to eleven.","17:00 = five p.m. (nói chuyện, không nói 'seventeen o'clock')","12:00 trưa = noon / twelve p.m.; 12:00 đêm = midnight","Giờ đúng: at three o'clock (o'clock chỉ dùng cho giờ chẵn)."],"mistakes":[{"wrong":"It's nine o'clock thirty.","right":"It's nine thirty. / It's half past nine.","why":"O'clock chỉ dùng cho giờ chẵn, không ghép với phút."},{"wrong":"a quarter to eleven = 11:15","right":"a quarter to eleven = 10:45","why":"'to' nghĩa là 'kém', tức là còn 15 phút nữa mới đến 11 giờ."},{"wrong":"The meeting is at 15 o'clock.","right":"The meeting is at 3 p.m.","why":"Khi nói, người bản xứ dùng giờ 12 tiếng với a.m./p.m."}]},"quiz":[{"q":"What time is the team meeting?","o":["9:30","10:45","11:15"],"a":1},{"q":"What time does the office close?","o":["5:30","5:45","6:00"],"a":0},{"q":"8:15 is ___.","o":["a quarter to eight","half past eight","a quarter past eight"],"a":2}],"practice":[{"s":"9:30 = half ___ nine","a":"past","alt":[],"hint":"Hơn"},{"s":"10:45 = a quarter ___ eleven","a":"to","alt":[],"hint":"Kém"},{"s":"7:15 = a ___ past seven","a":"quarter","alt":[],"hint":"Mười lăm phút = một phần tư giờ"},{"s":"17:00 = five ___","a":"p.m.","alt":["pm","p.m","PM"],"hint":"Buổi chiều"},{"s":"6:05 = six ___ five","a":"oh","alt":[],"hint":"Cách đọc số 0 trước phút"}],"speak":["Excuse me. What time is it?","It's half past nine.","The meeting is at a quarter to eleven.","The office closes at five thirty."],"write":{"vi":"Viết tin nhắn cho đồng nghiệp mới về giờ giấc ở công ty bạn: giờ bắt đầu làm việc, giờ họp, giờ nghỉ trưa và giờ tan làm. Dùng ít nhất một câu có past hoặc to.","en":"Write a message to a new colleague about the times at your company: start time, meeting time, lunch and finish time.","min":20},"summary":["Cách dễ: giờ + phút (nine thirty, five forty-five, seven oh five).","past = hơn (a quarter past nine = 9:15); to = kém (a quarter to eleven = 10:45); half past = rưỡi.","Dùng a.m. (sáng) và p.m. (chiều, tối) thay cho giờ 24 tiếng.","O'clock chỉ dùng cho giờ chẵn."]},{"id":"s_likes","ch":2,"level":"A0","title":"Likes and dislikes","vi":"Nói điều mình thích và không thích","goals":["Sau bài này bạn có thể nói mức độ thích của mình: love, like, don't like, hate.","Sau bài này bạn có thể hỏi Do you like…? và Does he / she like…? và trả lời ngắn.","Sau bài này bạn có thể nói về sở thích của người khác với likes / doesn't like."],"story":[{"who":"Mark","en":"Lan, do you like Vietnamese food?","vi":"Lan, chị có thích món ăn Việt không?"},{"who":"Lan","en":"Yes, I love it. I love pho.","vi":"Có, tôi rất thích. Tôi mê phở lắm."},{"who":"Mark","en":"Me too. But I don't like durian.","vi":"Tôi cũng vậy. Nhưng tôi không thích sầu riêng."},{"who":"Lan","en":"Many people hate durian! Do you like sports?","vi":"Nhiều người ghét sầu riêng lắm! Anh có thích thể thao không?"},{"who":"Mark","en":"Yes, I love cricket and tennis.","vi":"Có, tôi rất mê cricket và quần vợt."},{"who":"Mark","en":"What about Minh? Does he like sports?","vi":"Còn Minh thì sao? Cậu ấy có thích thể thao không?"},{"who":"Lan","en":"Yes, he does. He loves football.","vi":"Có. Cậu ấy mê bóng đá."},{"who":"Mark","en":"And does he like music?","vi":"Thế cậu ấy có thích âm nhạc không?"},{"who":"Lan","en":"He likes K-pop, but he doesn't like jazz.","vi":"Cậu ấy thích K-pop, nhưng không thích nhạc jazz."},{"who":"Mark","en":"OK. No jazz in the office, then!","vi":"Được rồi. Vậy là không mở nhạc jazz trong văn phòng nhé!"}],"vocab":[{"w":"love","ipa":"/lʌv/","vi":"rất thích, yêu","ex":"I love pho."},{"w":"hate","ipa":"/heɪt/","vi":"ghét","ex":"Many people hate durian."},{"w":"food","ipa":"/fuːd/","vi":"đồ ăn, món ăn","ex":"Do you like Vietnamese food?"},{"w":"durian","ipa":"/ˈdʊriən/","vi":"quả sầu riêng","ex":"I don't like durian."},{"w":"sports","ipa":"/spɔːrts/","vi":"thể thao","ex":"Do you like sports?"},{"w":"football","ipa":"/ˈfʊtbɔːl/","vi":"bóng đá (người Mỹ gọi là soccer)","ex":"He loves football."},{"w":"music","ipa":"/ˈmjuːzɪk/","vi":"âm nhạc","ex":"Does he like music?"},{"w":"me too","ipa":"/ˌmiː ˈtuː/","vi":"tôi cũng vậy","ex":"I love pho. – Me too!"}],"grammar":{"t":"LIKE / LOVE / DON'T LIKE / HATE + danh từ","d":"Bốn động từ này cho biết bạn thích một thứ đến mức nào: love (rất thích) > like (thích) > don't like (không thích) > hate (ghét). Với he / she, động từ thêm -s (likes, loves, hates), và câu hỏi, câu phủ định dùng does / doesn't.","formula":["Khẳng định: I / You / We / They + love / like / hate + danh từ · He / She + loves / likes / hates + danh từ","Phủ định: I / You / We / They + don't like… · He / She + doesn't like…","Hỏi: Do you like + danh từ? → Yes, I do. / No, I don't.","Hỏi: Does he / she like + danh từ? → Yes, he does. / No, she doesn't."],"ex":["I love pho. Mark loves cricket.","Minh likes K-pop, but he doesn't like jazz.","Do you like spicy food? – No, I don't.","Does Sofia like coffee? – Yes, she does.","Muốn nói 'rất thích': I really like coffee. / I like coffee very much."],"mistakes":[{"wrong":"He like football.","right":"He likes football.","why":"Với he / she, động từ ở câu khẳng định phải thêm -s."},{"wrong":"Does he likes jazz?","right":"Does he like jazz?","why":"Đã có 'does' thì động từ trở về dạng nguyên mẫu, không thêm -s."},{"wrong":"I very like pho.","right":"I really like pho. / I like pho very much.","why":"'Very' không đứng trước động từ; dùng 'really' hoặc đặt 'very much' ở cuối."}]},"quiz":[{"q":"What food does Mark not like?","o":["Pho","Durian","Spring rolls"],"a":1},{"q":"What sport does Minh love?","o":["Tennis","Cricket","Football"],"a":2},{"q":"___ Minh like jazz?","o":["Does","Do","Is"],"a":0}],"practice":[{"s":"Minh ___ football. It's his favorite sport.","a":"loves","alt":["likes"],"hint":"Rất thích, chủ ngữ là he"},{"s":"___ he like music?","a":"Does","alt":[],"hint":"Câu hỏi với he"},{"s":"She ___ like jazz.","a":"doesn't","alt":["does not"],"hint":"Phủ định với she"},{"s":"Do you like tennis? – Yes, I ___.","a":"do","alt":[],"hint":"Trả lời ngắn với I"},{"s":"I don't like durian. I ___ it!","a":"hate","alt":[],"hint":"Ghét"}],"speak":["Do you like Vietnamese food?","Yes, I love it.","Does he like sports?","He likes K-pop, but he doesn't like jazz."],"write":{"vi":"Một đồng nghiệp nước ngoài mới vào công ty. Viết tin nhắn kể về điều bạn thích và không thích (đồ ăn, âm nhạc, thể thao), rồi hỏi lại bạn ấy hai câu.","en":"A new foreign colleague has joined. Write a message about what you like and don't like (food, music, sports), then ask them two questions.","min":20},"summary":["Mức độ: love > like > don't like > hate.","He / She + likes / loves / hates; phủ định: doesn't like.","Hỏi: Do you like…? / Does he like…? (sau does, động từ không có -s).","Không nói 'I very like'; nói 'I really like' hoặc 'I like … very much'."]},{"id":"s_can","ch":2,"level":"A0","title":"What can you do?","vi":"Nói về khả năng với CAN","goals":["Sau bài này bạn có thể nói mình biết làm gì và không biết làm gì với can / can't.","Sau bài này bạn có thể hỏi Can you…? và Who can…? rồi trả lời ngắn.","Sau bài này bạn có thể nói về công cụ và ngôn ngữ mà bạn sử dụng được."],"story":[{"who":"Mark","en":"OK, team. Who can use Power BI?","vi":"Nào cả đội. Ai dùng được Power BI?"},{"who":"Lan","en":"I can. I can use Tableau too.","vi":"Tôi dùng được. Tôi cũng dùng được Tableau."},{"who":"Mark","en":"Great. Minh, can you write Python?","vi":"Tuyệt. Minh, em có viết được Python không?"},{"who":"Minh","en":"Yes, I can. But I can't use R.","vi":"Dạ được. Nhưng em không dùng được R."},{"who":"Mark","en":"No problem. Now, languages. Who can speak Japanese?","vi":"Không sao. Giờ đến ngoại ngữ. Ai nói được tiếng Nhật?"},{"who":"Minh","en":"I can speak a little Japanese.","vi":"Em nói được một chút tiếng Nhật."},{"who":"Lan","en":"I can't speak Japanese, but I can speak French.","vi":"Tôi không nói được tiếng Nhật, nhưng nói được tiếng Pháp."},{"who":"Mark","en":"Can you read French reports?","vi":"Chị đọc được báo cáo tiếng Pháp chứ?"},{"who":"Lan","en":"Yes, I can. I can read French well.","vi":"Được. Tôi đọc tiếng Pháp khá tốt."},{"who":"Mark","en":"Perfect. I can only speak English!","vi":"Hoàn hảo. Tôi thì chỉ nói được tiếng Anh thôi!"}],"vocab":[{"w":"can't","ipa":"/kænt/","vi":"không thể, không biết (làm gì)","ex":"I can't use R."},{"w":"speak","ipa":"/spiːk/","vi":"nói (một ngôn ngữ)","ex":"I can speak French."},{"w":"write","ipa":"/raɪt/","vi":"viết","ex":"Can you write Python?"},{"w":"read","ipa":"/riːd/","vi":"đọc","ex":"I can read French reports."},{"w":"language","ipa":"/ˈlæŋɡwɪdʒ/","vi":"ngôn ngữ","ex":"How many languages can you speak?"},{"w":"a little","ipa":"/ə ˈlɪtl/","vi":"một chút, một ít","ex":"I can speak a little Japanese."},{"w":"well","ipa":"/wel/","vi":"giỏi, tốt (trạng từ)","ex":"She can read French well."},{"w":"only","ipa":"/ˈoʊnli/","vi":"chỉ","ex":"I can only speak English."}],"grammar":{"t":"CAN / CAN'T: nói về khả năng","d":"Can nghĩa là 'có thể, biết làm gì'. Sau can luôn là động từ nguyên mẫu, và can không bao giờ thêm -s, kể cả với he / she. Khi nói, 'can' thường đọc nhẹ /kən/, còn 'can't' đọc rõ và mạnh /kænt/, nhờ vậy người nghe phân biệt được.","formula":["Khẳng định: S + can + động từ nguyên mẫu (I can speak French. She can use Tableau.)","Phủ định: S + can't (cannot) + động từ nguyên mẫu (I can't use R.)","Câu hỏi: Can + S + động từ…? → Yes, I can. / No, I can't.","Hỏi ai: Who can + động từ…? → I can. / Lan can."],"ex":["Lan can use Power BI and Tableau.","Minh can't use R.","Can you write Python? – Yes, I can.","Who can speak Japanese? – Minh can.","Mức độ: I can speak English well. / I can speak a little Japanese."],"mistakes":[{"wrong":"She cans speak English.","right":"She can speak English.","why":"Can không bao giờ thêm -s."},{"wrong":"I can to use Excel.","right":"I can use Excel.","why":"Sau can là động từ nguyên mẫu, không có 'to'."},{"wrong":"Do you can speak French?","right":"Can you speak French?","why":"Câu hỏi với can chỉ cần đảo can lên đầu, không dùng 'do'."}]},"quiz":[{"q":"Who can use Power BI?","o":["Minh","Lan","Mark"],"a":1},{"q":"What language can Minh speak a little?","o":["Japanese","French","Korean"],"a":0},{"q":"___ you write Python?","o":["Do","Are","Can"],"a":2}],"practice":[{"s":"Minh ___ write Python. (có thể)","a":"can","alt":[],"hint":"Khả năng, không thêm -s"},{"s":"I ___ use R. (không thể)","a":"can't","alt":["cannot","can not"],"hint":"Phủ định của can"},{"s":"___ you speak French?","a":"Can","alt":[],"hint":"Đảo can lên đầu câu hỏi"},{"s":"Can you use Tableau? – Yes, I ___.","a":"can","alt":[],"hint":"Trả lời ngắn khẳng định"},{"s":"She can ___ Japanese. (nói)","a":"speak","alt":[],"hint":"Sau can là động từ nguyên mẫu"}],"speak":["Who can use Power BI?","Can you write Python?","Yes, I can. But I can't use R.","I can speak a little Japanese."],"write":{"vi":"Sếp hỏi về kỹ năng của bạn cho một dự án mới. Viết trả lời: bạn dùng được công cụ nào, không dùng được công cụ nào, và nói được những ngôn ngữ nào.","en":"Your manager asks about your skills for a new project. Reply: which tools you can and can't use, and which languages you can speak.","min":20},"summary":["S + can / can't + động từ nguyên mẫu; can không thêm -s, không có 'to'.","Hỏi: Can you…? → Yes, I can. / No, I can't. Hỏi ai: Who can…?","Khi nói, can đọc nhẹ /kən/, can't đọc mạnh /kænt/.","Mức độ: well (giỏi), a little (một chút)."]},{"id":"x2_3","ch":2,"level":"A0","after":"s_can","title":"Whose phone is this?","vi":"Sở hữu cách 's và mine, yours","goals":["Sau bài này bạn có thể hỏi đồ vật là của ai với Whose…?","Sau bài này bạn có thể dùng sở hữu cách 's: Minh's phone, Sofia's keys.","Sau bài này bạn có thể dùng mine, yours, his, hers, ours, theirs để khỏi lặp danh từ."],"story":[{"who":"Lan","en":"Whose phone is this? Is it yours, Mark?","vi":"Điện thoại này của ai? Của anh à, Mark?"},{"who":"Mark","en":"No, it isn't mine. Mine is in my bag.","vi":"Không, không phải của tôi. Của tôi ở trong túi."},{"who":"Lan","en":"Maybe it's Minh's phone.","vi":"Có lẽ là điện thoại của Minh."},{"who":"Mark","en":"Yes, I think it's his.","vi":"Ừ, tôi nghĩ là của cậu ấy."},{"who":"Lan","en":"And whose keys are these?","vi":"Còn chùm chìa khóa này của ai?"},{"who":"Mark","en":"They're Sofia's keys. She's in the kitchen.","vi":"Là chìa khóa của Sofia. Chị ấy đang ở trong bếp."},{"who":"Lan","en":"And this black umbrella? Is it hers too?","vi":"Còn cái ô đen này? Cũng của chị ấy à?"},{"who":"Mark","en":"No, that's ours. It's the team umbrella.","vi":"Không, cái đó của chúng ta. Ô chung của cả đội."},{"who":"Lan","en":"And the blue notebook? Oh, wait, it's mine!","vi":"Còn quyển sổ xanh? Ơ, khoan đã, của tôi mà!"},{"who":"Mark","en":"Ha! Now everything has an owner.","vi":"Ha! Giờ thì món nào cũng có chủ rồi."}],"vocab":[{"w":"whose","ipa":"/huːz/","vi":"của ai","ex":"Whose phone is this?"},{"w":"mine","ipa":"/maɪn/","vi":"của tôi (đứng một mình)","ex":"This notebook is mine."},{"w":"yours","ipa":"/jʊrz/","vi":"của bạn (đứng một mình)","ex":"Is this pen yours?"},{"w":"hers","ipa":"/hɝːz/","vi":"của cô ấy (đứng một mình)","ex":"The keys are hers."},{"w":"ours","ipa":"/ˈaʊərz/","vi":"của chúng tôi (đứng một mình)","ex":"That umbrella is ours."},{"w":"key","ipa":"/kiː/","vi":"chìa khóa","ex":"Whose keys are these?"},{"w":"umbrella","ipa":"/ʌmˈbrelə/","vi":"cái ô, cái dù","ex":"a black umbrella"},{"w":"owner","ipa":"/ˈoʊnər/","vi":"chủ sở hữu, người chủ","ex":"Who is the owner of this bag?"}],"grammar":{"t":"WHOSE, sở hữu cách 's và đại từ sở hữu (mine, yours…)","d":"Muốn nói 'cái gì của ai', tiếng Anh đặt người sở hữu lên trước rồi thêm 's: Minh's phone = điện thoại của Minh. Khi không muốn lặp lại danh từ, dùng đại từ sở hữu đứng một mình: my phone → mine. Hỏi 'của ai
