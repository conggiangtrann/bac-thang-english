à lỗi được sửa trước 8 giờ sáng."},{"who":"Sofia","en":"Are customers' names stored too?","vi":"Tên khách hàng có được lưu không?"},{"who":"Lan","en":"No, they aren't. Names are removed, so the data is anonymous.","vi":"Không ạ. Tên được xóa đi, nên dữ liệu là ẩn danh."},{"who":"Lan","en":"Finally, the dashboard is updated every morning at eight.","vi":"Cuối cùng, dashboard được cập nhật mỗi sáng lúc tám giờ."},{"who":"Sofia","en":"That's very clear. Now I can explain it to the directors.","vi":"Rất rõ ràng. Giờ tôi có thể giải thích cho các giám đốc rồi."}],"vocab":[{"w":"collect","ipa":"/kəˈlekt/","vi":"thu thập","ex":"The data is collected every day."},{"w":"record","ipa":"/rɪˈkɔːrd/","vi":"ghi lại","ex":"Each sale is recorded."},{"w":"cash register","ipa":"/kæʃ ˈredʒɪstər/","vi":"máy tính tiền","ex":"the cash register in the store"},{"w":"store (verb)","ipa":"/stɔːr/","vi":"lưu trữ","ex":"Orders are stored in a database."},{"w":"separate","ipa":"/ˈsepərət/","vi":"riêng, tách biệt","ex":"a separate system"},{"w":"automatically","ipa":"/ˌɔːtəˈmætɪkli/","vi":"một cách tự động","ex":"The data is checked automatically."},{"w":"notify","ipa":"/ˈnoʊtɪfaɪ/","vi":"thông báo","ex":"The team is notified by email."},{"w":"anonymous","ipa":"/əˈnɑːnɪməs/","vi":"ẩn danh","ex":"The data is anonymous."}],"grammar":{"t":"Câu bị động thì hiện tại đơn","d":"Dùng câu bị động khi việc được làm quan trọng hơn người làm, hoặc ta không cần biết ai làm. Vì vậy câu bị động rất hay dùng để mô tả quy trình, hệ thống và báo cáo. Nó giống chữ \"được\" trong tiếng Việt, nhưng tiếng Anh bắt buộc phải có am/is/are + V3.","formula":["Khẳng định: S + am/is/are + V3 (+ by + người/vật thực hiện)","Phủ định: S + isn't/aren't + V3","Câu hỏi: Is/Are + S + V3? · How/When/Where + is/are + S + V3?","Chủ động → bị động: The cash register records the sale. → The sale is recorded by the cash register."],"ex":["The data is collected every day. (số ít → is)","Online orders are stored in a separate system. (số nhiều → are)","Customer names aren't stored.","How is the data sent to DataPeak?","Chỉ dùng by khi người/vật thực hiện là thông tin quan trọng: …by the cash register."],"mistakes":[{"wrong":"The data collected every night.","right":"The data is collected every night.","why":"Tiếng Việt chỉ nói \"được thu thập\", nhưng tiếng Anh phải có is/are trước V3."},{"wrong":"The data is collect every night.","right":"The data is collected every night.","why":"Sau is/are phải là V3 (collected), không phải động từ nguyên mẫu."},{"wrong":"This error is happened often.","right":"This error happens often.","why":"happen không có thể bị động, vì không ai \"làm\" nó xảy ra."}]},"quiz":[{"q":"When are the files copied to the cloud?","o":["Every morning at eight","Every night at midnight","Every hour"],"a":1},{"q":"What happens to customers' names?","o":["They are removed","They are sent to Sofia","They are shown on the dashboard"],"a":0},{"q":"The dashboard ___ every morning.","o":["is update","updated","is updated"],"a":2}],"practice":[{"s":"The sales data ___ collected every night.","a":"is","alt":[],"hint":"data ở đây là số ít: ___ + V3."},{"s":"Online orders are ___ in a separate system. (store)","a":"stored","alt":[],"hint":"Sau are dùng V3."},{"s":"Each sale is recorded ___ the cash register.","a":"by","alt":[],"hint":"Giới từ chỉ người/vật thực hiện hành động."},{"s":"All the files are ___ to the cloud at midnight. (send)","a":"sent","alt":[],"hint":"V3 bất quy tắc của send."},{"s":"How often ___ the dashboard updated?","a":"is","alt":[],"hint":"Câu hỏi bị động: How often + is/are + S + V3?"}],"speak":["Let me explain how the data is collected.","Online orders are stored in a separate system.","Then the data is checked automatically for errors.","The dashboard is updated every morning at eight."],"write":{"vi":"Một khách hàng hỏi số liệu trong báo cáo của bạn đến từ đâu. Viết email giải thích quy trình dữ liệu ở công ty bạn (thu thập, lưu trữ, kiểm tra, cập nhật). Dùng ít nhất năm câu bị động.","en":"A client asks where the numbers in your report come from. Write an email to explain the data process at your company (how the data is collected, stored, checked and updated). Use at least five passive sentences.","min":60},"summary":["Bị động hiện tại: S + am/is/are + V3.","Dùng khi hành động quan trọng hơn người làm, rất hợp để mô tả quy trình.","Thêm by + người/vật khi cần nói ai hoặc cái gì thực hiện.","Đừng quên is/are, và các động từ như happen không có thể bị động."]},{"id":"x7_2","ch":7,"level":"B1","after":"s_passive","title":"We used to do it by hand","vi":"USED TO: thói quen trong quá khứ","goals":["Sau bài này bạn có thể kể về cách làm việc trước đây bằng used to.","Sau bài này bạn có thể so sánh quá khứ và hiện tại: used to…, but now…","Sau bài này bạn có thể dùng đúng dạng phủ định và câu hỏi: didn't use to, Did you use to…?"],"story":[{"who":"Minh","en":"Lan, has the weekly report always been automatic?","vi":"Chị Lan, báo cáo hằng tuần lúc nào cũng tự động như vậy à?"},{"who":"Lan","en":"No, not at all. Three years ago, we used to do everything by hand.","vi":"Không, hoàn toàn không. Ba năm trước, bọn chị làm mọi thứ bằng tay."},{"who":"Lan","en":"Every Monday, I used to download twenty spreadsheets from different stores.","vi":"Mỗi thứ Hai, chị thường phải tải về hai mươi bảng tính từ các cửa hàng khác nhau."},{"who":"Minh","en":"Twenty? Manually? That sounds like a lot of work.","vi":"Hai mươi á? Làm thủ công? Nghe nhiều việc quá."},{"who":"Lan","en":"It was. I used to spend the whole day copying and pasting numbers.","vi":"Đúng thế. Chị thường mất cả ngày để sao chép và dán số liệu."},{"who":"Lan","en":"And we didn't use to check the data carefully, so there were a lot of mistakes.","vi":"Và hồi đó bọn chị không hay kiểm tra dữ liệu kỹ, nên có rất nhiều lỗi."},{"who":"Minh","en":"Did you use to work late?","vi":"Hồi đó chị có hay phải làm muộn không?"},{"who":"Lan","en":"Yes, I did. I used to leave the office after nine on Mondays.","vi":"Có chứ. Thứ Hai nào chị cũng rời văn phòng sau chín giờ tối."},{"who":"Lan","en":"Then Mark suggested a new system, and everything changed.","vi":"Rồi anh Mark đề xuất một hệ thống mới, và mọi thứ thay đổi."},{"who":"Minh","en":"So what do you do on Mondays now?","vi":"Vậy bây giờ thứ Hai chị làm gì?"},{"who":"Lan","en":"Now I just check the dashboard and write a short summary.","vi":"Bây giờ chị chỉ cần kiểm tra dashboard và viết một bản tóm tắt ngắn."},{"who":"Lan","en":"I used to hate Mondays, but now they're my favorite day.","vi":"Chị từng ghét thứ Hai, nhưng bây giờ đó là ngày chị thích nhất."},{"who":"Minh","en":"I'm glad I didn't join the team three years ago!","vi":"Em mừng là em không vào nhóm từ ba năm trước!"}],"vocab":[{"w":"by hand","ipa":"/baɪ hænd/","vi":"bằng tay, làm thủ công","ex":"We used to do everything by hand."},{"w":"manually","ipa":"/ˈmænjuəli/","vi":"một cách thủ công","ex":"We did everything manually."},{"w":"spreadsheet","ipa":"/ˈspredʃiːt/","vi":"bảng tính","ex":"twenty spreadsheets"},{"w":"download","ipa":"/ˈdaʊnloʊd/","vi":"tải về","ex":"I download the files every Monday."},{"w":"copy and paste","ipa":"/ˈkɑːpi ən peɪst/","vi":"sao chép và dán","ex":"copying and pasting numbers"},{"w":"the whole day","ipa":"/ðə hoʊl deɪ/","vi":"cả ngày","ex":"I spent the whole day on it."},{"w":"work late","ipa":"/wɝːk leɪt/","vi":"làm việc muộn, làm thêm giờ","ex":"Did you use to work late?"},{"w":"not at all","ipa":"/nɑːt ət ɔːl/","vi":"hoàn toàn không","ex":"No, not at all."}],"grammar":{"t":"USED TO + V: thói quen hoặc trạng thái trong quá khứ, nay không còn","d":"Dùng used to + động từ nguyên mẫu để nói về điều thường xảy ra hoặc đúng trong quá khứ, nhưng BÂY GIỜ KHÔNG CÒN nữa. Nó giống \"hồi trước thường…\" hoặc \"từng…\" trong tiếng Việt. Rất hữu ích khi so sánh cách làm cũ và cách làm mới ở công ty.","formula":["Khẳng định: S + used to + V (nguyên mẫu)","Phủ định: S + didn't use to + V","Câu hỏi: Did + S + use to + V? — Yes, I did. / No, I didn't.","So sánh: S + used to + V…, but now + S + V (hiện tại đơn)"],"ex":["We used to do everything by hand. (trước đây làm tay, giờ không còn)","I used to leave the office after nine on Mondays.","We didn't use to check the data carefully.","Did you use to work late? — Yes, I did.","I used to hate Mondays, but now they're my favorite day.","Thói quen hiện tại thì KHÔNG dùng used to: I usually check the dashboard at 8."],"mistakes":[{"wrong":"I used to working late.","right":"I used to work late.","why":"Sau used to là động từ nguyên mẫu, không thêm -ing."},{"wrong":"We didn't used to check the data.","right":"We didn't use to check the data.","why":"Đã có did/didn't thì bỏ -d: use to."},{"wrong":"I use to go to the gym every day. (ý nói bây giờ)","right":"I usually go to the gym every day.","why":"used to chỉ dành cho quá khứ; thói quen hiện tại dùng usually + hiện tại đơn."}]},"quiz":[{"q":"How many spreadsheets did Lan use to download every Monday?","o":["Ten","Twenty","Thirty"],"a":1},{"q":"What does Lan do on Mondays now?","o":["She checks the dashboard and writes a short summary","She downloads spreadsheets all day","She works until nine"],"a":0},{"q":"Which sentence is correct?","o":["I didn't used to work late.","I don't used to work late.","I didn't use to work late."],"a":2}],"practice":[{"s":"Three years ago, we ___ to do everything by hand.","a":"used","alt":[],"hint":"Câu khẳng định: S + ___ to + V."},{"s":"I used to ___ the whole day copying numbers. (spend)","a":"spend","alt":[],"hint":"Sau used to là động từ nguyên mẫu."},{"s":"We didn't ___ to check the data carefully.","a":"use","alt":[],"hint":"Sau didn't thì bỏ -d."},{"s":"___ you use to work late on Mondays?","a":"Did","alt":[],"hint":"Câu hỏi bắt đầu bằng trợ động từ quá khứ."},{"s":"I used to hate Mondays, but now I ___ them.","a":"love","alt":["like","enjoy"],"hint":"Bây giờ dùng hiện tại đơn, nghĩa ngược với hate."}],"speak":["Three years ago, we used to do everything by hand.","I used to spend the whole day copying and pasting numbers.","We didn't use to check the data carefully.","I used to hate Mondays, but now they're my favorite day."],"write":{"vi":"Viết một đoạn văn so sánh cách bạn hoặc công ty bạn làm việc trước đây và bây giờ (ví dụ: làm báo cáo, họp, lưu trữ dữ liệu). Dùng ít nhất bốn câu với used to / didn't use to và cấu trúc \"…, but now…\".","en":"Write a paragraph comparing how you or your company used to work and how you work now (for example: making reports, holding meetings, storing data). Use used to / didn't use to at least four times and the pattern \"…, but now…\".","min":60},"summary":["used to + V: điều thường xảy ra trong quá khứ nhưng nay không còn.","Phủ định: didn't use to + V; câu hỏi: Did + S + use to + V? (không có -d).","So sánh xưa và nay: I used to…, but now I…","Thói quen hiện tại dùng usually + hiện tại đơn, không dùng used to."]},{"id":"s_options","ch":7,"level":"B1","title":"Comparing options","vi":"So sánh nâng cao","goals":["Sau bài này bạn có thể so sánh hai lựa chọn bằng as…as và not as…as.","Sau bài này bạn có thể nhấn mạnh mức chênh lệch bằng much, far, a bit.","Sau bài này bạn có thể dùng the most và the least để chỉ ra lựa chọn nổi bật nhất."],"story":[{"who":"Mark","en":"We need to choose a new dashboard tool by Friday. It's between ChartPro and VizBox.","vi":"Chúng ta cần chọn công cụ dashboard mới trước thứ Sáu. Chọn giữa ChartPro và VizBox."},{"who":"Lan","en":"I've tested both. ChartPro is much faster than VizBox with large data sets.","vi":"Tôi đã thử cả hai. ChartPro nhanh hơn VizBox nhiều khi xử lý bộ dữ liệu lớn."},{"who":"Minh","en":"But VizBox is far cheaper. It costs ten dollars per user, and ChartPro costs forty.","vi":"Nhưng VizBox rẻ hơn rất nhiều. Nó có giá mười đô mỗi người dùng, còn ChartPro là bốn mươi."},{"who":"Mark","en":"Hmm. Is VizBox as easy to use as ChartPro?","vi":"Hừm. VizBox có dễ dùng như ChartPro không?"},{"who":"Lan","en":"Almost. It isn't as flexible as ChartPro, but it's easy enough for our clients.","vi":"Gần như vậy. Nó không linh hoạt bằng ChartPro, nhưng đủ dễ cho khách hàng của chúng ta."},{"who":"Minh","en":"Our clients care about speed more than anything, don't they?","vi":"Khách hàng của chúng ta quan tâm đến tốc độ hơn mọi thứ, đúng không?"},{"who":"Lan","en":"Yes. For BrightMart, speed is the most important thing.","vi":"Đúng. Với BrightMart, tốc độ là điều quan trọng nhất."},{"who":"Mark","en":"And which one is the least expensive to maintain?","vi":"Còn cái nào tốn ít chi phí bảo trì nhất?"},{"who":"Minh","en":"VizBox. It needs much less help from our IT team.","vi":"VizBox. Nó cần ít sự hỗ trợ từ nhóm IT hơn nhiều."},{"who":"Lan","en":"True, but ChartPro has the most useful features for analysts.","vi":"Đúng, nhưng ChartPro có những tính năng hữu ích nhất cho người phân tích."},{"who":"Mark","en":"So ChartPro is much more expensive, but far more powerful.","vi":"Vậy ChartPro đắt hơn nhiều, nhưng mạnh hơn rất nhiều."},{"who":"Lan","en":"Exactly. In my opinion, it's worth the extra cost.","vi":"Chính xác. Theo tôi, nó đáng với khoản chi phí thêm."},{"who":"Mark","en":"OK. Let's try ChartPro for three months and then compare the results.","vi":"Được. Hãy dùng thử ChartPro ba tháng rồi so sánh kết quả."}],"vocab":[{"w":"data set","ipa":"/ˈdeɪtə set/","vi":"bộ dữ liệu","ex":"large data sets"},{"w":"per user","ipa":"/pɚ ˈjuːzɚ/","vi":"mỗi người dùng","ex":"ten dollars per user"},{"w":"flexible","ipa":"/ˈfleksəbl/","vi":"linh hoạt","ex":"It isn't as flexible as ChartPro."},{"w":"care about","ipa":"/ker əˈbaʊt/","vi":"quan tâm đến","ex":"Clients care about speed."},{"w":"maintain","ipa":"/meɪnˈteɪn/","vi":"bảo trì, duy trì","ex":"It's cheap to maintain."},{"w":"feature","ipa":"/ˈfiːtʃɚ/","vi":"tính năng","ex":"the most useful features"},{"w":"powerful","ipa":"/ˈpaʊɚfl/","vi":"mạnh mẽ","ex":"a powerful tool"},{"w":"worth","ipa":"/wɝːθ/","vi":"đáng (giá, công sức)","ex":"It's worth the extra cost."}],"grammar":{"t":"So sánh nâng cao: as…as, not as…as, much/far + so sánh hơn, the least","d":"Ở bài u16 bạn đã học so sánh hơn (faster, more useful) và so sánh nhất (the most). Bài này thêm bốn công cụ để so sánh chính xác hơn: so sánh bằng, so sánh kém, nói chênh lệch \"nhiều\" hay \"một chút\", và \"ít … nhất\". Người làm data rất cần những cấu trúc này khi so sánh hai lựa chọn.","formula":["So sánh bằng: A + be + as + tính từ + as + B (VizBox is almost as easy as ChartPro.)","So sánh kém: A + isn't + as + tính từ + as + B (VizBox isn't as flexible as ChartPro.)","Chênh lệch: much / far (nhiều) · a bit / slightly (một chút) + so sánh hơn","Nhất / ít nhất: the most + tính từ · the least + tính từ"],"ex":["ChartPro is much faster than VizBox.","VizBox is far cheaper. (rẻ hơn rất nhiều)","ChartPro is a bit more expensive. (nếu chênh ít)","Speed is the most important thing for BrightMart.","Which one is the least expensive to maintain? (ít tốn kém nhất = rẻ nhất)"],"mistakes":[{"wrong":"ChartPro is very faster than VizBox.","right":"ChartPro is much faster than VizBox.","why":"very không đi với so sánh hơn; dùng much, far hoặc a bit."},{"wrong":"VizBox is as easy than ChartPro.","right":"VizBox is as easy as ChartPro.","why":"So sánh bằng luôn là as … as, không dùng than."},{"wrong":"It's the most cheap option.","right":"It's the cheapest option.","why":"Tính từ ngắn (một âm tiết) dùng -est, không dùng the most."}]},"quiz":[{"q":"Which tool is faster with large data sets?","o":["ChartPro","VizBox","They are the same"],"a":0},{"q":"How much does VizBox cost per user?","o":["Forty dollars","Four dollars","Ten dollars"],"a":2},{"q":"VizBox is ___ cheaper than ChartPro.","o":["very","far","more"],"a":1}],"practice":[{"s":"ChartPro is ___ faster than VizBox with large data sets.","a":"much","alt":["far"],"hint":"Từ nhấn mạnh chênh lệch lớn (không dùng very)."},{"s":"Is VizBox as easy to use ___ ChartPro?","a":"as","alt":[],"hint":"So sánh bằng: as … ___."},{"s":"VizBox isn't as ___ as ChartPro. (flexible)","a":"flexible","alt":[],"hint":"Giữa as … as là tính từ nguyên dạng."},{"s":"For BrightMart, speed is the ___ important thing.","a":"most","alt":[],"hint":"So sánh nhất với tính từ dài."},{"s":"Which tool is the ___ expensive to maintain? (ít … nhất)","a":"least","alt":[],"hint":"Ngược nghĩa với the most."}],"speak":["ChartPro is much faster than VizBox with large data sets.","It isn't as flexible as ChartPro, but it's easy enough for our clients.","Which one is the least expensive to maintain?","So ChartPro is much more expensive, but far more powerful."],"write":{"vi":"Nhóm bạn phải chọn giữa hai công cụ (hoặc hai nhà cung cấp). Viết email cho quản lý so sánh hai lựa chọn về giá, tốc độ, độ dễ dùng, và đưa ra lựa chọn của bạn. Dùng as…as, not as…as, much/far và the most/the least.","en":"Your team must choose between two tools (or two suppliers). Write an email to your manager comparing them on price, speed and ease of use, and give your choice. Use as…as, not as…as, much/far and the most/the least.","min":60},"summary":["as + tính từ + as: bằng nhau; not as + tính từ + as: kém hơn.","much / far + so sánh hơn: hơn nhiều; a bit + so sánh hơn: hơn một chút. Không dùng very.","the most: nhất; the least: ít … nhất.","Tính từ ngắn dùng -er/-est, tính từ dài dùng more/the most."]},{"id":"x7_3","ch":7,"level":"B1","after":"s_options","title":"Why did sales go up?","vi":"Nói về nguyên nhân và kết quả","goals":["Sau bài này bạn có thể giải thích nguyên nhân của một thay đổi trong số liệu.","Sau bài này bạn có thể phân biệt because (+ mệnh đề) và because of / due to (+ danh từ).","Sau bài này bạn có thể nói về kết quả bằng lead to, result in và cause."],"story":[{"who":"Sofia","en":"Lan, sales in our Da Nang stores went up by twelve percent last month. Why?","vi":"Lan, doanh số ở các cửa hàng Đà Nẵng tăng mười hai phần trăm tháng trước. Tại sao vậy?"},{"who":"Lan","en":"There are two main reasons. The first is the new loyalty program.","vi":"Có hai lý do chính. Lý do thứ nhất là chương trình khách hàng thân thiết mới."},{"who":"Lan","en":"Because of the program, customers came back more often.","vi":"Nhờ chương trình đó, khách hàng quay lại thường xuyên hơn."},{"who":"Sofia","en":"And the second reason?","vi":"Còn lý do thứ hai?"},{"who":"Lan","en":"The weather. Sales of cold drinks rose because it was very hot.","vi":"Thời tiết. Doanh số đồ uống lạnh tăng vì trời rất nóng."},{"who":"Sofia","en":"I see. But online sales fell in the same month. What caused that?","vi":"Tôi hiểu. Nhưng doanh số trực tuyến lại giảm trong cùng tháng. Điều gì gây ra việc đó?"},{"who":"Lan","en":"The drop was due to a problem with the payment page.","vi":"Mức giảm là do một sự cố ở trang thanh toán."},{"who":"Lan","en":"The page was very slow for a week, and that led to many lost orders.","vi":"Trang đó rất chậm trong một tuần, và điều đó dẫn đến mất nhiều đơn hàng."},{"who":"Sofia","en":"How many orders did we lose?","vi":"Chúng ta mất bao nhiêu đơn hàng?"},{"who":"Lan","en":"About three hundred. A slow website often results in fewer sales.","vi":"Khoảng ba trăm. Một trang web chậm thường dẫn đến doanh số thấp hơn."},{"who":"Sofia","en":"So we should fix the payment page first.","vi":"Vậy chúng ta nên sửa trang thanh toán trước tiên."},{"who":"Lan","en":"Yes. A faster page will lead to more online orders.","vi":"Đúng vậy. Trang nhanh hơn sẽ dẫn đến nhiều đơn hàng trực tuyến hơn."},{"who":"Sofia","en":"Great. Please send me a short report on these causes.","vi":"Tuyệt. Chị gửi tôi một báo cáo ngắn về các nguyên nhân này nhé."}],"vocab":[{"w":"main reason","ipa":"/meɪn ˈriːzn/","vi":"lý do chính","ex":"There are two main reasons."},{"w":"loyalty program","ipa":"/ˈlɔɪəlti ˈproʊɡræm/","vi":"chương trình khách hàng thân thiết","ex":"the new loyalty program"},{"w":"come back","ipa":"/kʌm bæk/","vi":"quay lại","ex":"Customers came back more often."},{"w":"cause","ipa":"/kɔːz/","vi":"gây ra; nguyên nhân","ex":"What caused the drop?"},{"w":"due to","ipa":"/ˈduː tə/","vi":"do, bởi vì (+ danh từ)","ex":"due to a problem"},{"w":"payment page","ipa":"/ˈpeɪmənt peɪdʒ/","vi":"trang thanh toán","ex":"The payment page was slow."},{"w":"lost order","ipa":"/lɔːst ˈɔːrdɚ/","vi":"đơn hàng bị mất","ex":"many lost orders"},{"w":"result in","ipa":"/rɪˈzʌlt ɪn/","vi":"dẫn đến, gây ra (kết quả)","ex":"It results in fewer sales."}],"grammar":{"t":"Nói nguyên nhân và kết quả","d":"Khi trình bày số liệu, người nghe luôn hỏi \"Tại sao?\". Tiếng Anh có hai nhóm: nhóm chỉ NGUYÊN NHÂN (because, because of, due to) và nhóm chỉ KẾT QUẢ (lead to, result in, cause). Điều quan trọng nhất: because đi với cả một mệnh đề có chủ ngữ và động từ, còn because of / due to chỉ đi với danh từ.","formula":["Kết quả + because + S + V: Sales rose because it was very hot.","Kết quả + because of / due to + danh từ: The drop was due to a slow payment page.","Nguyên nhân + lead to / result in + kết quả: A slow page leads to lost orders.","Hỏi nguyên nhân: Why did…? / What caused…?"],"ex":["Customers came back more often because of the loyalty program.","The drop was due to a problem with the payment page.","The slow page led to many lost orders. (lead → led)","A slow website often results in fewer sales.","What caused the drop in online sales?"],"mistakes":[{"wrong":"Sales rose because of it was hot.","right":"Sales rose because it was hot.","why":"Sau because of chỉ là danh từ; có cả chủ ngữ + động từ (it was) thì dùng because."},{"wrong":"The problem resulted to fewer sales.","right":"The problem resulted in fewer sales.","why":"Cụm cố định là result in, còn lead đi với to."},{"wrong":"The program leaded to more visits.","right":"The program led to more visits.","why":"lead là động từ bất quy tắc: lead – led – led."}]},"quiz":[{"q":"By how much did sales in Da Nang go up?","o":["Twenty percent","Twelve percent","Two percent"],"a":1},{"q":"What caused the drop in online sales?","o":["Hot weather","The loyalty program","A slow payment page"],"a":2},{"q":"Online sales fell ___ the slow website.","o":["because","due to","result in"],"a":1}],"practice":[{"s":"Sales of cold drinks rose ___ it was very hot.","a":"because","alt":[],"hint":"Phía sau có cả chủ ngữ và động từ (it was)."},{"s":"Customers came back more often because ___ the loyalty program.","a":"of","alt":[],"hint":"Sau chỗ trống là danh từ: because ___ + danh từ."},{"s":"The drop was ___ to a problem with the payment page.","a":"due","alt":[],"hint":"___ to + danh từ = do, bởi."},{"s":"A slow website often results ___ fewer sales.","a":"in","alt":[],"hint":"result + giới từ nào?"},{"s":"Last week, the slow page ___ to many lost orders. (lead)","a":"led","alt":[],"hint":"Quá khứ bất quy tắc của lead."}],"speak":["There are two main reasons.","Because of the program, customers came back more often.","The drop was due to a problem with the payment page.","A slow website often results in fewer sales."],"write":{"vi":"Một chỉ số trong công việc của bạn vừa tăng hoặc giảm (doanh số, số khách, tỷ lệ lỗi…). Viết email ngắn cho khách hàng giải thích hai nguyên nhân và kết quả của nó. Dùng because, because of / due to, và lead to hoặc result in.","en":"A number in your work has just gone up or down (sales, customers, error rate…). Write a short email to a client explaining two causes and the results. Use because, because of / due to, and lead to or result in.","min":60},"summary":["because + S + V; because of / due to + danh từ.","Nói kết quả: lead to (led), result in, cause.","Hỏi nguyên nhân: Why did…? / What caused…?","Nhớ: result in (không phải result to), lead – led – led."]},{"id":"s_qa","ch":7,"level":"B1","title":"Handling questions","vi":"Trả lời câu hỏi sau thuyết trình","goals":["Sau bài này bạn có thể đón nhận câu hỏi một cách bình tĩnh và lịch sự.","Sau bài này bạn có thể hỏi lại để làm rõ câu hỏi: Do you mean…?","Sau bài này bạn có thể hẹn trả lời sau một cách chuyên nghiệp khi chưa có câu trả lời."],"story":[{"who":"Sofia","en":"Thank you, Lan. Does anyone have any questions?","vi":"Cảm ơn chị Lan. Có ai có câu hỏi không?"},{"who":"Peter","en":"Yes. You said online orders in the South doubled. Is that true for all products?","vi":"Có. Chị nói đơn hàng trực tuyến ở miền Nam tăng gấp đôi. Điều đó có đúng với mọi sản phẩm không?"},{"who":"Lan","en":"That's a good question. Do you mean all product categories, or just food?","vi":"Câu hỏi hay. Ý anh là tất cả các nhóm sản phẩm, hay chỉ thực phẩm?"},{"who":"Peter","en":"All categories.","vi":"Tất cả các nhóm."},{"who":"Lan","en":"Mostly, yes. Clothing and electronics doubled, but furniture grew only slightly.","vi":"Phần lớn là đúng. Quần áo và đồ điện tử tăng gấp đôi, nhưng đồ nội thất chỉ tăng nhẹ."},{"who":"Anna","en":"Could you explain why the South was weaker overall?","vi":"Chị có thể giải thích tại sao nhìn chung miền Nam yếu hơn không?"},{"who":"Lan","en":"Sure. If I understand you correctly, you're asking about the physical stores, not online sales?","vi":"Vâng. Nếu tôi hiểu đúng, chị đang hỏi về các cửa hàng truyền thống, không phải bán hàng trực tuyến?"},{"who":"Anna","en":"Yes, exactly. The physical stores.","vi":"Vâng, chính xác. Các cửa hàng truyền thống."},{"who":"Lan","en":"Three stores in the South closed for two months for renovation. Does that answer your question?","vi":"Ba cửa hàng ở miền Nam đóng cửa hai tháng để sửa sang. Như vậy đã trả lời câu hỏi của chị chưa ạ?"},{"who":"Anna","en":"Yes, it does. Thank you.","vi":"Rồi. Cảm ơn chị."},{"who":"Peter","en":"One more question. What's the sales forecast for next quarter?","vi":"Thêm một câu hỏi. Dự báo doanh số quý sau là bao nhiêu?"},{"who":"Lan","en":"I don't have the forecast with me right now. Let me get back to you on that by Friday.","vi":"Hiện tôi không mang theo số liệu dự báo. Tôi xin phép gửi câu trả lời cho anh trước thứ Sáu."},{"who":"Peter","en":"That's fine. Thanks, Lan. That was very helpful.","vi":"Không sao. Cảm ơn chị Lan. Rất hữu ích."}],"vocab":[{"w":"category","ipa":"/ˈkætəɡɔːri/","vi":"nhóm, danh mục","ex":"all product categories"},{"w":"mostly","ipa":"/ˈmoʊstli/","vi":"phần lớn, chủ yếu","ex":"Mostly, yes."},{"w":"clothing","ipa":"/ˈkloʊðɪŋ/","vi":"quần áo (nói chung)","ex":"Clothing sales doubled."},{"w":"furniture","ipa":"/ˈfɝːnɪtʃɚ/","vi":"đồ nội thất","ex":"Furniture grew only slightly."},{"w":"physical store","ipa":"/ˈfɪzɪkl stɔːr/","vi":"cửa hàng truyền thống (không phải online)","ex":"our physical stores"},{"w":"renovation","ipa":"/ˌrenəˈveɪʃn/","vi":"việc sửa sang, cải tạo","ex":"closed for renovation"},{"w":"forecast","ipa":"/ˈfɔːrkæst/","vi":"dự báo","ex":"the sales forecast"},{"w":"get back to (someone)","ipa":"/ɡet bæk tə/","vi":"trả lời/liên lạc lại với ai sau","ex":"Let me get back to you on that."}],"grammar":{"t":"Xử lý câu hỏi: tranh thủ thời gian, làm rõ, hẹn trả lời sau","d":"Phần hỏi đáp làm nhiều người sợ hơn cả bài trình bày. Bí quyết là có sẵn vài câu \"cứu nguy\": một câu để có thêm vài giây suy nghĩ, một câu để hỏi lại khi chưa hiểu rõ, và một câu để hẹn trả lời sau khi chưa có số liệu. Nói \"I don't know\" rồi im lặng nghe rất thiếu chuyên nghiệp.","formula":["Có thêm thời gian: That's a good question. / Thanks for asking that.","Làm rõ: Do you mean + danh từ…? · If I understand you correctly, you're asking about + danh từ?","Hẹn trả lời sau: Let me get back to you on that (by + thời hạn).","Kiểm tra: Does that answer your question?"],"ex":["That's a good question. Do you mean all categories, or just food?","If I understand you correctly, you're asking about the physical stores?","I don't have the numbers with me right now. Let me get back to you on that by Friday.","Does that answer your question? — Yes, it does.","Khi không nghe rõ: Sorry, could you repeat the question?"],"mistakes":[{"wrong":"You mean what?","right":"What do you mean? / Do you mean…?","why":"Câu hỏi tiếng Anh cần trợ động từ do đứng trước chủ ngữ."},{"wrong":"Let me get back you on that.","right":"Let me get back to you on that.","why":"Cụm cố định là get back TO + người."},{"wrong":"I don't know. (rồi im lặng)","right":"I'm not sure. Let me check and get back to you.","why":"Trả lời cụt nghe thiếu chuyên nghiệp; hãy hứa kiểm tra và trả lời sau."}]},"quiz":[{"q":"Which category grew only slightly?","o":["Clothing","Electronics","Furniture"],"a":2},{"q":"Why was the South weaker?","o":["Three stores closed for renovation","Online sales fell","Prices went up"],"a":0},{"q":"You don't have the answer right now. What do you say?","o":["I don't know.","Let me get back to you on that.","That's not my job."],"a":1}],"practice":[{"s":"That's a good ___. Let me explain.","a":"question","alt":[],"hint":"Câu khen câu hỏi để có thêm thời gian suy nghĩ."},{"s":"Do you ___ all product categories, or just food?","a":"mean","alt":[],"hint":"Do you ___…? = Ý anh/chị là…?"},{"s":"Let me get back ___ you on that by Friday.","a":"to","alt":[],"hint":"get back ___ + người."},{"s":"If I understand you ___, you're asking about the stores.","a":"correctly","alt":[],"hint":"Trạng từ nghĩa là \"đúng\"."},{"s":"Does that ___ your question?","a":"answer","alt":[],"hint":"Động từ nghĩa là \"trả lời\"."}],"speak":["That's a good question. Do you mean all product categories?","If I understand you correctly, you're asking about the physical stores.","Does that answer your question?","Let me get back to you on that by Friday."],"write":{"vi":"Sau buổi trình bày, một khách hàng hỏi một câu bạn chưa trả lời được. Viết email gửi họ: cảm ơn câu hỏi, nhắc lại câu hỏi để chắc là bạn hiểu đúng, trả lời hoặc hẹn thời hạn cụ thể sẽ gửi số liệu.","en":"After your presentation, a client asked a question you could not answer. Write an email to them: thank them for the question, repeat it to check you understood it correctly, then answer it or give a clear date when you will send the numbers.","min":60},"summary":["That's a good question giúp bạn có thêm vài giây suy nghĩ.","Chưa rõ câu hỏi thì hỏi lại: Do you mean…? / If I understand you correctly, …","Chưa có câu trả lời: Let me get back to you on that by + thời hạn.","Trả lời xong thì kiểm tra: Does that answer your question?"]},{"id":"x8_1","ch":8,"level":"B1","after":"u10","title":"Running a meeting","vi":"Chủ trì một cuộc họp","goals":["Sau bài này bạn có thể mở đầu cuộc họp và nêu rõ mục đích, chương trình họp.","Sau bài này bạn có thể điều phối: mời người nói, chuyển mục, giữ cuộc họp đúng giờ.","Sau bài này bạn có thể kết thúc cuộc họp gọn gàng và tóm tắt các việc cần làm."],"story":[{"who":"Lan","en":"OK, it's nine o'clock. Let's get started.","vi":"Được rồi, chín giờ rồi. Chúng ta bắt đầu nhé."},{"who":"Lan","en":"Thanks for coming, everyone. The purpose of this meeting is to discuss the BrightMart project for next month.","vi":"Cảm ơn mọi người đã đến. Mục đích của cuộc họp này là bàn về dự án BrightMart cho tháng tới."},{"who":"Lan","en":"There are three items on the agenda: the timeline, the budget and the team.","vi":"Có ba mục trong chương trình họp: tiến độ, ngân sách và nhân sự."},{"who":"Lan","en":"Minh, could you take notes today?","vi":"Minh, hôm nay em ghi chép giúp chị được không?"},{"who":"Minh","en":"Sure, no problem.","vi":"Vâng, không vấn đề gì ạ."},{"who":"Lan","en":"Great. So, the first item is the timeline. Mark, would you like to start?","vi":"Tốt. Vậy, mục đầu tiên là tiến độ. Anh Mark, anh muốn bắt đầu không?"},{"who":"Mark","en":"Thanks. The client wants the first report by the fifteenth.","vi":"Cảm ơn. Khách hàng muốn có báo cáo đầu tiên trước ngày mười lăm."},{"who":"Lan","en":"OK, that's clear. Let's move on to item two, the budget.","vi":"Được, rõ rồi. Chúng ta chuyển sang mục hai, ngân sách."},{"who":"Mark","en":"I have a lot of numbers here. It could take twenty minutes.","vi":"Tôi có rất nhiều số liệu ở đây. Có thể mất hai mươi phút."},{"who":"Lan","en":"We only have half an hour, so let's focus on the main points. You can email the details later.","vi":"Chúng ta chỉ có nửa tiếng, nên hãy tập trung vào các ý chính. Anh có thể gửi email chi tiết sau."},{"who":"Lan","en":"Now, the last item is the team. Does anyone have any comments?","vi":"Giờ đến mục cuối là nhân sự. Có ai có ý kiến gì không?"},{"who":"Lan","en":"No? Is there any other business? Then let's wrap up.","vi":"Không ai à? Còn vấn đề nào khác không? Vậy chúng ta kết thúc nhé."},{"who":"Lan","en":"So, to sum up: the first report is due on the fifteenth, and Mark will email the budget details. Thanks, everyone.","vi":"Vậy tóm lại: báo cáo đầu tiên phải nộp vào ngày mười lăm, và anh Mark sẽ gửi email chi tiết ngân sách. Cảm ơn mọi người."}],"vocab":[{"w":"purpose","ipa":"/ˈpɝːpəs/","vi":"mục đích","ex":"The purpose of this meeting is to…"},{"w":"agenda","ipa":"/əˈdʒendə/","vi":"chương trình họp","ex":"three items on the agenda"},{"w":"item","ipa":"/ˈaɪtəm/","vi":"mục, đề mục","ex":"Let's move on to item two."},{"w":"timeline","ipa":"/ˈtaɪmlaɪn/","vi":"tiến độ, mốc thời gian","ex":"the project timeline"},{"w":"take notes","ipa":"/teɪk noʊts/","vi":"ghi chép","ex":"Could you take notes today?"},{"w":"focus on","ipa":"/ˈfoʊkəs ɑːn/","vi":"tập trung vào","ex":"Let's focus on the main points."},{"w":"any other business","ipa":"/ˈeni ˈʌðɚ ˈbɪznəs/","vi":"các vấn đề khác (mục cuối cuộc họp)","ex":"Is there any other business?"},{"w":"wrap up","ipa":"/ræp ʌp/","vi":"kết thúc, khép lại","ex":"Let's wrap up."}],"grammar":{"t":"Ngôn ngữ chủ trì cuộc họp: 4 bước","d":"Người chủ trì (chair) giữ cho cuộc họp đúng chủ đề và đúng giờ. Chỉ cần đi theo 4 bước: mở đầu, giới thiệu chương trình, điều phối từng mục, và kết thúc. Mỗi bước có vài câu cố định, bạn chỉ cần thay nội dung vào. Nhiều câu dùng Let's + V nguyên mẫu để rủ cả nhóm cùng làm.","formula":["Mở đầu: Let's get started. · The purpose of this meeting is to + V.","Chương trình: There are + số + items on the agenda. · The first item is + danh từ.","Điều phối: X, would you like to start? · Let's move on to item two. · Let's focus on the main points.","Kết thúc: Is there any other business? · Let's wrap up. · So, to sum up, …"],"ex":["The purpose of this meeting is to discuss the BrightMart project.","There are three items on the agenda.","Mark, would you like to start?","We only have half an hour, so let's focus on the main points.","Is there any other business? Then let's wrap up."],"mistakes":[{"wrong":"Let's discuss about the budget.","right":"Let's discuss the budget.","why":"discuss đã có nghĩa \"thảo luận về\", không thêm about (nhưng talk about thì có)."},{"wrong":"The purpose of this meeting is discuss the project.","right":"The purpose of this meeting is to discuss the project.","why":"Sau The purpose … is cần to + V."},{"wrong":"There are three items in the agenda.","right":"There are three items on the agenda.","why":"Cụm cố định là on the agenda."}]},"quiz":[{"q":"Who takes notes in the meeting?","o":["Mark","Minh","Lan"],"a":1},{"q":"When does the client want the first report?","o":["By the fifteenth","By Friday","Next month"],"a":0},{"q":"Which sentence is correct?","o":["Let's discuss about the budget.","Let's discuss for the budget.","Let's discuss the budget."],"a":2}],"practice":[{"s":"OK, it's nine o'clock. Let's get ___.","a":"started","alt":[],"hint":"Let's get ___ = Chúng ta bắt đầu nhé."},{"s":"The purpose of this meeting is ___ discuss the project.","a":"to","alt":[],"hint":"is + ___ + V."},{"s":"There are three items ___ the agenda.","a":"on","alt":[],"hint":"Giới từ đi với agenda."},{"s":"Let's move on ___ item two, the budget.","a":"to","alt":[],"hint":"move on ___ + danh từ."},{"s":"Is there any other ___? Then let's wrap up.","a":"business","alt":[],"hint":"Câu hỏi cố định trước khi kết thúc họp."}],"speak":["Let's get started. The purpose of this meeting is to discuss the project.","There are three items on the agenda.","Let's move on to item two, the budget.","Is there any other business? Then let's wrap up."],"write":{"vi":"Bạn sẽ chủ trì cuộc họp nhóm tuần tới. Viết email mời họp: nêu mục đích cuộc họp, liệt kê 3 mục trong chương trình, nhờ một người ghi chép và nói cuộc họp kéo dài bao lâu.","en":"You will chair next week's team meeting. Write an email to invite the team: say the purpose of the meeting, list three items on the agenda, ask someone to take notes and say how long the meeting will be.","min":60},"summary":["Mở đầu: Let's get started. The purpose of this meeting is to + V.","Chương trình: There are … items on the agenda. The first item is…","Điều phối: Let's move on to… / Let's focus on the main points.","Kết thúc: Is there any other business? Let's wrap up. Nhớ: discuss + danh từ, không có about."]},{"id":"s_if1","ch":8,"level":"B1","title":"If we launch next month…","vi":"Câu điều kiện loại 1","goals":["Sau bài này bạn có thể nói về khả năng trong tương lai và kết quả của nó bằng câu điều kiện loại 1.","Sau bài này bạn có thể dùng unless và as soon as đúng cách.","Sau bài này bạn có thể bàn về rủi ro của một kế hoạch trong cuộc họp."],"story":[{"who":"Mark","en":"So, are we ready to launch PeakView next month? What are the risks?","vi":"Vậy, chúng ta đã sẵn sàng ra mắt PeakView tháng sau chưa? Rủi ro là gì?"},{"who":"Lan","en":"If we launch next month, we'll have only two weeks for testing.","vi":"Nếu ra mắt tháng sau, chúng ta sẽ chỉ có hai tuần để kiểm thử."},{"who":"Minh","en":"Is that enough? If we find serious bugs, we won't have time to fix them.","vi":"Thế có đủ không? Nếu tìm thấy lỗi nghiêm trọng, chúng ta sẽ không có thời gian sửa."},{"who":"Mark","en":"Good point. What happens if we wait until July?","vi":"Ý hay. Điều gì xảy ra nếu chúng ta đợi đến tháng Bảy?"},{"who":"Lan","en":"If we wait until July, BrightMart will need to use the old system for another month.","vi":"Nếu đợi đến tháng Bảy, BrightMart sẽ phải dùng hệ thống cũ thêm một tháng nữa."},{"who":"Mark","en":"Sofia won't be happy if that happens.","vi":"Sofia sẽ không vui nếu chuyện đó xảy ra."},{"who":"Lan","en":"True. But she'll be even less happy if the app crashes on the first day.","vi":"Đúng. Nhưng bà ấy sẽ còn không vui hơn nếu ứng dụng bị sập ngay ngày đầu."},{"who":"Minh","en":"What if we launch with a small test group first?","vi":"Hay là chúng ta ra mắt với một nhóm thử nghiệm nhỏ trước?"},{"who":"Lan","en":"Great idea. Unless the test group finds big problems, we'll open it to everyone in July.","vi":"Ý tưởng tuyệt vời. Trừ khi nhóm thử nghiệm phát hiện vấn đề lớn, chúng ta sẽ mở cho tất cả mọi người vào tháng Bảy."},{"who":"Mark","en":"I like it. I'll call Sofia as soon as we finish this meeting.","vi":"Tôi thích ý này. Tôi sẽ gọi cho Sofia ngay khi chúng ta họp xong."},{"who":"Minh","en":"And I'll send the test plan as soon as it's ready.","vi":"Còn em sẽ gửi kế hoạch kiểm thử ngay khi nó xong."},{"who":"Lan","en":"Remember, we won't launch unless every number in the app matches the old reports.","vi":"Nhớ nhé, chúng ta sẽ không ra mắt trừ khi mọi con số trong ứng dụng khớp với các báo cáo cũ."},{"who":"Mark","en":"Agreed. Quality comes first.","vi":"Đồng ý. Chất lượng là trên hết."}],"vocab":[{"w":"launch","ipa":"/lɔːntʃ/","vi":"ra mắt (sản phẩm)","ex":"We'll launch the app in July."},{"w":"risk","ipa":"/rɪsk/","vi":"rủi ro","ex":"What are the risks?"},{"w":"serious","ipa":"/ˈsɪriəs/","vi":"nghiêm trọng","ex":"a serious problem"},{"w":"bug","ipa":"/bʌɡ/","vi":"lỗi phần mềm","ex":"We need to fix the bugs."},{"w":"crash","ipa":"/kræʃ/","vi":"(phần mềm) bị sập, treo","ex":"The app crashed on the first day."},{"w":"What if…?","ipa":"/wʌt ɪf/","vi":"hay là…? / nếu… thì sao?","ex":"What if we start with a small group?"},{"w":"match","ipa":"/mætʃ/","vi":"khớp với","ex":"The numbers match the old reports."},{"w":"quality","ipa":"/ˈkwɑːləti/","vi":"chất lượng","ex":"Quality comes first."}],"grammar":{"t":"Câu điều kiện loại 1, UNLESS và AS SOON AS","d":"Câu điều kiện loại 1 nói về điều CÓ THỂ xảy ra trong tương lai và kết quả của nó. Điểm đặc biệt: vế có if dùng thì hiện tại đơn, dù ý nghĩa là tương lai; vế kết quả mới dùng will. Unless nghĩa là \"trừ khi\" (= if … not). As soon as (ngay khi) cũng theo quy tắc này: không dùng will sau nó.","formula":["If + S + V (hiện tại đơn), S + will/won't + V","S + will/won't + V + if + S + V (đổi chỗ hai vế thì không cần dấu phẩy)","Unless + S + V (khẳng định) = If + S + don't/doesn't + V","As soon as + S + V (hiện tại đơn), S + will + V"],"ex":["If we launch next month, we'll have only two weeks for testing.","Sofia won't be happy if that happens.","We won't launch unless every number matches. (= if every number doesn't match)","I'll call Sofia as soon as we finish this meeting.","Hỏi về khả năng: What happens if we wait until July?"],"mistakes":[{"wrong":"If we will launch next month, we will have two weeks.","right":"If we launch next month, we'll have two weeks.","why":"Vế có if dùng hiện tại đơn, không dùng will, dù nghĩa là tương lai."},{"wrong":"I'll call Sofia as soon as we will finish.","right":"I'll call Sofia as soon as we finish.","why":"Sau as soon as (và when) nói về tương lai cũng dùng hiện tại đơn."},{"wrong":"Unless we don't test it, it will crash.","right":"Unless we test it, it will crash.","why":"unless đã mang nghĩa phủ định (trừ khi), không thêm don't."}]},"quiz":[{"q":"How much time will they have for testing if they launch next month?","o":["One month","Two weeks","Two days"],"a":1},{"q":"What is Minh's idea?","o":["Wait until next year","Cancel the launch","Launch with a small test group first"],"a":2},{"q":"If the client ___ the report today, we'll start the next step.","o":["approves","will approve","approved"],"a":0}],"practice":[{"s":"If we ___ next month, we'll have only two weeks for testing. (launch)","a":"launch","alt":[],"hint":"Vế if dùng hiện tại đơn."},{"s":"If we find serious bugs, we ___ have time to fix them.","a":"won't","alt":["will not"],"hint":"Vế kết quả, phủ định của will."},{"s":"Sofia won't be happy if the app ___ on the first day. (crash)","a":"crashes","alt":[],"hint":"Hiện tại đơn, chủ ngữ số ít: thêm -es."},{"s":"We won't launch ___ every number matches the old reports.","a":"unless","alt":[],"hint":"Từ nghĩa là \"trừ khi\"."},{"s":"I'll call Sofia as soon as we ___ this meeting. (finish)","a":"finish","alt":[],"hint":"Sau as soon as không dùng will."}],"speak":["If we launch next month, we'll have only two weeks for testing.","Sofia won't be happy if that happens.","I'll call Sofia as soon as we finish this meeting.","We won't launch unless every number matches the old reports."],"write":{"vi":"Nhóm bạn đang cân nhắc ra mắt một sản phẩm hoặc báo cáo mới sớm hơn kế hoạch. Viết email cho quản lý nêu ít nhất ba rủi ro và kết quả có thể xảy ra. Dùng câu điều kiện loại 1, unless và as soon as.","en":"Your team is thinking about launching a new product or report earlier than planned. Write an email to your manager about at least three risks and their possible results. Use the first conditional, unless and as soon as.","min":60},"summary":["Câu điều kiện loại 1: If + hiện tại đơn, will + V.","Không dùng will trong vế if và sau as soon as / when.","unless = if … not; sau unless dùng câu khẳng định.","Rất hữu ích để bàn về rủi ro: What happens if…? / What if…?"]},{"id":"s_opinion","ch":8,"level":"B1","title":"Giving opinions in a meeting","vi":"Nêu quan điểm thuyết phục","goals":["Sau bài này bạn có thể nêu quan điểm của mình trong cuộc họp một cách rõ ràng.","Sau bài này bạn có thể dựa vào số liệu để làm quan điểm thuyết phục hơn.","Sau bài này bạn có thể nói giảm nhẹ (hedging) khi chưa hoàn toàn chắc chắn."],"story":[{"who":"Sofia","en":"We're thinking about a new pricing model: five dollars a month for free delivery. What do you all think?","vi":"Chúng tôi đang cân nhắc một mô hình giá mới: năm đô mỗi tháng để được giao hàng miễn phí. Mọi người nghĩ sao?"},{"who":"Mark","en":"In my view, it's a smart move. Many retailers offer something similar.","vi":"Theo quan điểm của tôi, đó là một bước đi khôn ngoan. Nhiều nhà bán lẻ có dịch vụ tương tự."},{"who":"Sofia","en":"Lan, what does the data tell us?","vi":"Lan, dữ liệu cho chúng ta biết điều gì?"},{"who":"Lan","en":"Based on the data, it seems that our regular customers order about four times a month.","vi":"Dựa trên dữ liệu, có vẻ như khách hàng thường xuyên của chúng ta đặt hàng khoảng bốn lần một tháng."},{"who":"Lan","en":"They currently pay two dollars per delivery, so that's about eight dollars a month.","vi":"Hiện tại họ trả hai đô mỗi lần giao, tức là khoảng tám đô một tháng."},{"who":"Lan","en":"I believe many of them will choose the membership, because it saves them money.","vi":"Tôi tin rằng nhiều người trong số họ sẽ chọn gói thành viên, vì nó giúp họ tiết kiệm tiền."},{"who":"Sofia","en":"But won't we lose money on delivery?","vi":"Nhưng chúng ta có bị lỗ tiền giao hàng không?"},{"who":"Lan","en":"Probably not. In other markets, it looks like members usually spend more in each order.","vi":"Có lẽ là không. Ở các thị trường khác, có vẻ thành viên thường chi tiêu nhiều hơn trong mỗi đơn."},{"who":"Lan","en":"They spend around twenty percent more. But our customers might be different.","vi":"Họ chi nhiều hơn khoảng hai mươi phần trăm. Nhưng khách hàng của chúng ta có thể khác."},{"who":"Mark","en":"That's a fair point. So we shouldn't be too confident.","vi":"Ý đó hợp lý. Vậy chúng ta không nên quá tự tin."},{"who":"Lan","en":"Exactly. My suggestion is a three-month test in one city first.","vi":"Chính xác. Đề xuất của tôi là thử nghiệm ba tháng ở một thành phố trước."},{"who":"Sofia","en":"From my point of view, a small test is sensible. It's safer.","vi":"Theo quan điểm của tôi, một thử nghiệm nhỏ là hợp lý. Nó an toàn hơn."},{"who":"Mark","en":"I agree. Let's see what the numbers say after three months.","vi":"Tôi đồng ý. Hãy xem số liệu nói gì sau ba tháng."}],"vocab":[{"w":"pricing model","ipa":"/ˈpraɪsɪŋ ˈmɑːdl/","vi":"mô hình định giá","ex":"a new pricing model"},{"w":"retailer","ipa":"/ˈriːteɪlɚ/","vi":"nhà bán lẻ","ex":"Many retailers offer this."},{"w":"regular customer","ipa":"/ˈreɡjəlɚ ˈkʌstəmɚ/","vi":"khách hàng thường xuyên","ex":"our regular customers"},{"w":"currently","ipa":"/ˈkɝːəntli/","vi":"hiện tại, hiện nay","ex":"They currently pay two dollars."},{"w":"membership","ipa":"/ˈmembɚʃɪp/","vi":"gói thành viên, tư cách hội viên","ex":"a monthly membership"},{"w":"fair point","ipa":"/fer pɔɪnt/","vi":"ý kiến hợp lý, có lý","ex":"That's a fair point."},{"w":"confident","ipa":"/ˈkɑːnfɪdənt/","vi":"tự tin, chắc chắn","ex":"We shouldn't be too confident."},{"w":"sensible","ipa":"/ˈsensəbl/","vi":"hợp lý, khôn ngoan","ex":"a sensible plan"}],"grammar":{"t":"Nêu quan điểm và nói giảm nhẹ (hedging)","d":"Ở bài u10 bạn đã học cách đồng ý và phản đối. Bài này dạy cách NÊU ý kiến của chính mình cho thuyết phục. Người làm data mạnh nhất khi dựa vào số liệu (Based on the data…). Nhưng số liệu hiếm khi chắc chắn 100%, nên người bản xứ hay \"nói giảm nhẹ\" bằng it seems, probably, might, around… để không khẳng định quá mức. Như vậy nghe vừa chuyên nghiệp vừa trung thực.","formula":["Nêu ý kiến: In my view, … · I believe (that) … · From my point of view, …","Dựa vào số liệu: Based on the data, it seems that + S + V…","Nói giảm nhẹ: It looks like + S + V · probably · S + might + V · around/about + số","Đề xuất: My suggestion is + danh từ / to + V."],"ex":["In my view, it's a smart move.","Based on the data, it seems that our customers order about four times a month.","I believe many of them will choose the membership.","Probably not. / Our customers might be different.","So sánh: \"Members spend 20% more.\" (khẳng định chắc) → \"It looks like members spend around 20% more.\" (mềm, an toàn hơn)"],"mistakes":[{"wrong":"According to me, it's a good idea.","right":"In my view, it's a good idea.","why":"according to dùng cho người khác hoặc nguồn khác (according to the data), không dùng cho chính mình."},{"wrong":"In my opinion, I think it's a good idea.","right":"In my opinion, it's a good idea.","why":"In my opinion và I think cùng nghĩa, dùng cả hai là lặp ý."},{"wrong":"Based on the data, it seem that sales are growing.","right":"Based on the data, it seems that sales are growing.","why":"Chủ ngữ it là số ít nên seem phải thêm -s."}]},"quiz":[{"q":"How much is the new membership?","o":["Two dollars a month","Five dollars a month","Eight dollars a month"],"a":1},{"q":"What does Lan suggest?","o":["A three-month test in one city","Starting everywhere next week","Cancelling the idea"],"a":0},{"q":"Which phrase is NOT correct for giving your own opinion?","o":["In my view,","I believe","According to me,"],"a":2}],"practice":[{"s":"In my ___, it's a smart move.","a":"view","alt":["opinion"],"hint":"In my ___ = theo quan điểm của tôi."},{"s":"___ on the data, it seems that customers order four times a month.","a":"Based","alt":[],"hint":"___ on = dựa trên."},{"s":"I ___ many customers will choose the membership.","a":"believe","alt":["think"],"hint":"Động từ nghĩa là \"tin rằng\"."},{"s":"It ___ like members usually spend more.","a":"looks","alt":[],"hint":"It ___ like = có vẻ như (chủ ngữ it, thêm -s)."},{"s":"Our customers ___ be different, so we shouldn't be too confident.","a":"might","alt":["may","could"],"hint":"Động từ khuyết thiếu chỉ khả năng, không chắc chắn."}],"speak":["In my view, it's a smart move.","Based on the data, it seems that our regular customers order about four times a month.","I believe many of them will choose the membership.","My suggestion is a three-month test in one city first."],"write":{"vi":"Công ty bạn đang cân nhắc một thay đổi (giá, chính sách, công cụ mới…). Viết email gửi nhóm nêu quan điểm của bạn, đưa ra ít nhất một số liệu làm bằng chứng, dùng hai cách nói giảm nhẹ và kết thúc bằng một đề xuất.","en":"Your company is thinking about a change (prices, a policy, a new tool…). Write an email to your team giving your opinion. Support it with at least one number, use two hedging expressions, and finish with a suggestion.","min":60},"summary":["Nêu ý kiến: In my view, … / I believe … / From my point of view, …","Dựa vào số liệu: Based on the data, it seems that…","Nói giảm nhẹ khi chưa chắc: it looks like, probably, might, around.","Không nói \"According to me\" và không dùng In my opinion cùng I think."]},{"id":"s_interrupt","ch":8,"level":"B1","title":"Interrupting politely","vi":"Ngắt lời và giành lượt nói","goals":["Sau bài này bạn có thể ngắt lời người khác một cách lịch sự khi có ý quan trọng.","Sau bài này bạn có thể giữ lượt nói khi bị người khác chen ngang.","Sau bài này bạn có thể đưa cuộc thảo luận quay lại một ý trước đó."],"story":[{"who":"Peter","en":"…and the data shows that Hue is our best performer, so we should open two more stores there.","vi":"…và dữ liệu cho thấy Huế là nơi hoạt động tốt nhất, nên chúng ta nên mở thêm hai cửa hàng ở đó."},{"who":"Lan","en":"Sorry to interrupt, but can I add something quickly?","vi":"Xin lỗi vì ngắt lời, nhưng tôi có thể bổ sung nhanh một điều được không?"},{"who":"Peter","en":"Sure, go ahead.","vi":"Được, chị cứ nói."},{"who":"Lan","en":"The numbers for Hue are missing October. There was a problem with the data that month.","vi":"Số liệu của Huế đang thiếu tháng Mười. Tháng đó dữ liệu gặp sự cố."},{"who":"Peter","en":"Oh, I didn't know that.","vi":"Ồ, tôi không biết điều đó."},{"who":"Mark","en":"So the real numbers could be lower?","vi":"Vậy số liệu thực tế có thể thấp hơn à?"},{"who":"Lan","en":"Possibly lower, or possibly higher. We don't know yet, so…","vi":"Có thể thấp hơn, cũng có thể cao hơn. Chúng ta chưa biết, nên…"},{"who":"Mark","en":"Then we should stop the whole plan and…","vi":"Vậy thì chúng ta nên dừng toàn bộ kế hoạch và…"},{"who":"Lan","en":"Sorry, Mark, let me just finish. I can have the October numbers by Thursday. Then we can decide.","vi":"Xin lỗi anh Mark, cho tôi nói nốt. Tôi có thể có số liệu tháng Mười trước thứ Năm. Khi đó chúng ta có thể quyết định."},{"who":"Mark","en":"Of course. Sorry, go on.","vi":"Tất nhiên rồi. Xin lỗi, chị nói tiếp đi."},{"who":"Sofia","en":"Good. Going back to what Peter said about new stores, how much will two stores cost?","vi":"Tốt. Quay lại điều Peter nói về các cửa hàng mới, hai cửa hàng sẽ tốn bao nhiêu?"},{"who":"Peter","en":"About half a million dollars. That's why the data matters so much.","vi":"Khoảng nửa triệu đô la. Đó là lý do số liệu quan trọng đến vậy."},{"who":"Sofia","en":"Then let's wait until Thursday. Thanks for catching that, Lan.","vi":"Vậy hãy đợi đến thứ Năm. Cảm ơn chị đã phát hiện ra điều đó, Lan."}],"vocab":[{"w":"interrupt","ipa":"/ˌɪntəˈrʌpt/","vi":"ngắt lời, cắt ngang","ex":"Sorry to interrupt."},{"w":"go ahead","ipa":"/ɡoʊ əˈhed/","vi":"cứ tự nhiên, cứ nói đi","ex":"Sure, go ahead."},{"w":"best performer","ipa":"/best pɚˈfɔːrmɚ/","vi":"đơn vị/người có kết quả tốt nhất","ex":"Hue is our best performer."},{"w":"missing","ipa":"/ˈmɪsɪŋ/","vi":"bị thiếu","ex":"The October data is missing."},{"w":"possibly","ipa":"/ˈpɑːsəbli/","vi":"có thể, có lẽ","ex":"Possibly lower, possibly higher."},{"w":"go on","ipa":"/ɡoʊ ɑːn/","vi":"nói tiếp, tiếp tục","ex":"Sorry, go on."},{"w":"matter (verb)","ipa":"/ˈmætɚ/","vi":"quan trọng, có ý nghĩa","ex":"The data matters."},{"w":"catch (a mistake)","ipa":"/kætʃ/","vi":"phát hiện (lỗi)","ex":"Thanks for catching that."}],"grammar":{"t":"Ngắt lời, nhường lời, giữ lượt và quay lại ý cũ","d":"Trong cuộc họp dài, nếu chờ đến lúc mọi người im lặng thì có thể bạn sẽ không bao giờ được nói. Ngắt lời là bình thường, miễn là có câu xin lỗi ngắn ở đầu. Ngược lại, khi bị chen ngang, bạn có quyền lịch sự giữ lượt nói của mình. Mỗi tình huống có vài câu cố định.","formula":["Ngắt lời: Sorry to interrupt, but… · Can I add something? · Could I just say something?","Nhường lời: Sure, go ahead. · Sorry, go on.","Giữ lượt: Sorry, let me just finish. · Could I just finish my point?","Quay lại ý cũ: Going back to + danh từ / what + người + said, …"],"ex":["Sorry to interrupt, but can I add something quickly?","Sure, go ahead.","Sorry, Mark, let me just finish.","Going back to what Peter said about new stores, …","Going back to the budget, how much will it cost?"],"mistakes":[{"wrong":"Sorry for interrupt.","right":"Sorry to interrupt. / Sorry for interrupting.","why":"Sau for phải là V-ing; nếu dùng động từ nguyên mẫu thì phải là to + V."},{"wrong":"Wait, wait! Let me talk!","right":"Sorry, let me just finish.","why":"Câu ra lệnh trống không nghe rất gắt; thêm Sorry và just để mềm hơn."},{"wrong":"Going back to Peter said, …","right":"Going back to what Peter said, …","why":"Sau to cần một danh từ; \"what Peter said\" = điều Peter đã nói."}]},"quiz":[{"q":"What is the problem with the Hue numbers?","o":["They are from last year","October is missing","They are too high"],"a":1},{"q":"When can Lan have the October numbers?","o":["By Monday","By Friday","By Thursday"],"a":2},{"q":"Someone interrupts you before you finish. What do you say?","o":["Sorry, let me just finish.","Stop talking!","Sure, go ahead."],"a":0}],"practice":[{"s":"Sorry to ___, but can I add something?","a":"interrupt","alt":[],"hint":"Động từ nghĩa là \"ngắt lời\"."},{"s":"Sure, go ___.","a":"ahead","alt":[],"hint":"Câu nhường lời: go ___ = cứ nói đi."},{"s":"Sorry, Mark, let me just ___.","a":"finish","alt":[],"hint":"Giữ lượt: cho tôi nói ___."},{"s":"___ back to what Peter said, how much will two stores cost?","a":"Going","alt":[],"hint":"Cụm mở đầu để quay lại ý cũ, dạng V-ing."},{"s":"Can I ___ something quickly?","a":"add","alt":["say"],"hint":"Động từ nghĩa là \"bổ sung\"."}],"speak":["Sorry to interrupt, but can I add something quickly?","Sure, go ahead.","Sorry, Mark, let me just finish.","Going back to what Peter said about new stores, how much will two stores cost?"],"write":{"vi":"Trong cuộc họp hôm nay, bạn không kịp nói một ý quan trọng vì mọi người nói liên tục. Viết email ngắn gửi cả nhóm: nhắc lại điều một đồng nghiệp đã nói (Going back to what… said), bổ sung ý của bạn kèm số liệu, và đề xuất bước tiếp theo.","en":"In today's meeting, you could not make an important point because everyone kept talking. Write a short email to the team: go back to what a colleague said (Going back to what… said), add your point with some data, and suggest the next step.","min":60},"summary":["Ngắt lời lịch sự: Sorry to interrupt, but… / Can I add something?","Nhường lời: Sure, go ahead. / Sorry, go on.","Giữ lượt khi bị chen ngang: Sorry, let me just finish.","Quay lại ý cũ: Going back to + danh từ / what X said."]},{"id":"x8_2","ch":8,"level":"B1","after":"s_interrupt","title":"Could you tell me when…?","vi":"Câu hỏi gián tiếp lịch sự","goals":["Sau bài này bạn có thể hỏi thông tin lịch sự hơn bằng Could you tell me… / Do you know…","Sau bài này bạn có thể đặt đúng trật tự từ trong câu hỏi gián tiếp (không đảo ngữ).","Sau bài này bạn có thể dùng if / whether cho câu hỏi Có / Không gián tiếp."],"story":[{"who":"Lan","en":"Hi Tom, it's Lan from DataPeak. Do you have a minute?","vi":"Chào anh Tom, tôi là Lan ở DataPeak. Anh có rảnh một phút không?"},{"who":"Tom","en":"Sure, Lan. What can I do for you?","vi":"Có chứ, Lan. Tôi giúp gì được chị?"},{"who":"Lan","en":"Could you tell me what happened to the October data from the Hue store?","vi":"Anh có thể cho tôi biết chuyện gì đã xảy ra với dữ liệu tháng Mười của cửa hàng Huế không?"},{"who":"Tom","en":"Ah, yes. The store changed its cash register system that month.","vi":"À, vâng. Tháng đó cửa hàng đổi hệ thống máy tính tiền."},{"who":"Lan","en":"I see. Do you know if the old data still exists?","vi":"Tôi hiểu. Anh có biết dữ liệu cũ còn không?"},{"who":"Tom","en":"I think so. It's on a backup drive in the store.","vi":"Tôi nghĩ là còn. Nó nằm trong một ổ đĩa sao lưu ở cửa hàng."},{"who":"Lan","en":"Great. Do you know when you can send it to us?","vi":"Tuyệt. Anh có biết khi nào anh có thể gửi cho chúng tôi không?"},{"who":"Tom","en":"I'm not sure yet. I need to check who has access to the drive.","vi":"Tôi chưa chắc. Tôi cần kiểm tra xem ai có quyền truy cập ổ đĩa đó."},{"who":"Lan","en":"No problem. Could you let me know how long it will take?","vi":"Không sao. Anh có thể báo cho tôi biết việc đó mất bao lâu không?"},{"who":"Tom","en":"Of course. I'll email you by the end of the day.","vi":"Dĩ nhiên. Tôi sẽ email cho chị trước cuối ngày."},{"who":"Lan","en":"Thanks. One more thing: do you know whether the November data is complete?","vi":"Cảm ơn anh. Thêm một việc nữa: anh có biết dữ liệu tháng Mười Một có đầy đủ không?"},{"who":"Tom","en":"Yes, November is fine. I checked it yesterday.","vi":"Có, tháng Mười Một ổn. Tôi đã kiểm tra hôm qua."},{"who":"Lan","en":"Perfect. I'll wait for your email. Thanks for your help, Tom.","vi":"Hoàn hảo. Tôi sẽ chờ email của anh. Cảm ơn anh đã giúp, Tom."}],"vocab":[{"w":"Do you have a minute?","ipa":"/duː juː hæv ə ˈmɪnɪt/","vi":"Bạn có rảnh một chút không?","ex":"Hi Tom, do you have a minute?"},{"w":"exist","ipa":"/ɪɡˈzɪst/","vi":"tồn tại, còn","ex":"Does the old data still exist?"},{"w":"backup drive","ipa":"/ˈbækʌp draɪv/","vi":"ổ đĩa sao lưu","ex":"It's on a backup drive."},{"w":"access","ipa":"/ˈækses/","vi":"quyền truy cập","ex":"Who has access to the drive?"},{"w":"let (someone) know","ipa":"/let ˈsʌmwʌn noʊ/","vi":"báo cho ai biết","ex":"Could you let me know how long it will take?"},{"w":"by the end of the day","ipa":"/baɪ ði end əv ðə deɪ/","vi":"trước cuối ngày","ex":"I'll email you by the end of the day."},{"w":"whether","ipa":"/ˈweðɚ/","vi":"liệu… hay không","ex":"Do you know whether it's complete?"},{"w":"complete","ipa":"/kəmˈpliːt/","vi":"đầy đủ, hoàn chỉnh","ex":"The November data is complete."}],"grammar":{"t":"Câu hỏi gián tiếp (indirect questions)","d":"Hỏi thẳng \"When can you send it?\" không sai, nhưng với đối tác thì hơi cộc. Người bản xứ hay mở đầu bằng Could you tell me… hoặc Do you know… để lịch sự hơn. Quy tắc quan trọng nhất: phần câu hỏi phía sau quay về trật tự câu khẳng định (chủ ngữ đứng trước động từ), không đảo ngữ nữa, và không dùng do/does/did.","formula":["Câu hỏi Wh-: Could you tell me / Do you know + từ hỏi + S + V…? (When can you send it? → Do you know when you can send it?)","Câu hỏi Có/Không: Do you know + if/whether + S + V…? (Is it complete? → Do you know if it is complete?)","Bỏ do/does/did, chia động từ chính: Where does Tom work? → Do you know where Tom works?","Khi từ hỏi là chủ ngữ, giữ nguyên: What happened? → Could you tell me what happened?"],"ex":["Could you tell me what happened to the October data?","Do you know if the old data still exists?","Do you know when you can send it to us?","Could you let me know how long it will take?","Do you know whether the November data is complete?"],"mistakes":[{"wrong":"Could you tell me when can you send it?","right":"Could you tell me when you can send it?","why":"Trong câu hỏi gián tiếp không đảo ngữ: chủ ngữ (you) đứng trước động từ (can send)."},{"wrong":"Do you know where does Tom work?","right":"Do you know where Tom works?","why":"Bỏ does và chia động từ chính theo chủ ngữ (works)."},{"wrong":"Do you know is the data complete?","right":"Do you know if the data is complete?","why":"Câu hỏi Có/Không gián tiếp cần if hoặc whether, rồi đến S + V."}]},"quiz":[{"q":"Why is the October data missing?","o":["The store changed its cash register system","The store closed","Tom deleted it"],"a":0},{"q":"When will Tom email Lan?","o":["Next week","Tomorrow morning","By the end of the day"],"a":2},{"q":"Which question is correct?","o":["Do you know where is the file?","Do you know where the file is?","Do you know where does the file is?"],"a":1}],"practice":[{"s":"Could you tell me what ___ to the October data? (happen, quá khứ)","a":"happened","alt":[],"hint":"what là chủ ngữ, động từ chia quá khứ."},{"s":"Do you know ___ the old data still exists?","a":"if","alt":["whether"],"hint":"Câu hỏi Có/Không gián tiếp cần từ nào?"},{"s":"Do you know when you ___ send it to us?","a":"can","alt":[],"hint":"Không đảo ngữ: you + ___ + send."},{"s":"Could you let me know how long it ___ take?","a":"will","alt":[],"hint":"Trật tự khẳng định: it + ___ + take."},{"s":"Do you know where Tom ___? (work)","a":"works","alt":[],"hint":"Bỏ does, chia động từ theo Tom."}],"speak":["Could you tell me what happened to the October data?","Do you know if the old data still exists?","Do you know when you can send it to us?","Could you let me know how long it will take?"],"write":{"vi":"Bạn cần thông tin từ bộ phận IT của khách hàng về một tệp dữ liệu bị thiếu. Viết email lịch sự hỏi ít nhất bốn câu hỏi gián tiếp (Could you tell me…, Do you know if…, Could you let me know…).","en":"You need information from your client's IT team about a missing data file. Write a polite email with at least four indirect questions (Could you tell me…, Do you know if…, Could you let me know…).","min":60},"summary":["Câu hỏi gián tiếp lịch sự hơn: Could you tell me… / Do you know… / Could you let me know…","Phần sau quay về trật tự khẳng định: từ hỏi + S + V, không đảo ngữ.","Bỏ do/does/did và chia động từ chính.","Câu hỏi Có/Không dùng if hoặc whether."]},{"id":"s_minutes","ch":8,"level":"B1","title":"Summarising a meeting","vi":"Câu tường thuật cơ bản","goals":["Sau bài này bạn có thể kể lại lời người khác nói bằng said that / told me that.","Sau bài này bạn có thể tường thuật câu hỏi bằng asked if.","Sau bài này bạn có thể lùi thì cơ bản khi viết biên bản họp."],"story":[{"who":"Mark","en":"Hi Lan. Sorry I missed the meeting with Sofia. What happened?","vi":"Chào Lan. Xin lỗi tôi đã lỡ cuộc họp với Sofia. Có chuyện gì vậy?"},{"who":"Lan","en":"No problem. I'm writing the minutes now. First, Sofia said that the new dashboard was very useful.","vi":"Không sao. Tôi đang viết biên bản. Trước hết, Sofia nói rằng dashboard mới rất hữu ích."},{"who":"Mark","en":"Great! Did she say anything about the deadline?","vi":"Tuyệt! Bà ấy có nói gì về hạn chót không?"},{"who":"Lan","en":"Yes. She said that they needed the final version by June 30th.","vi":"Có. Bà ấy nói rằng họ cần bản cuối cùng trước ngày 30 tháng Sáu."},{"who":"Lan","en":"She also told me that her boss wanted a weekly summary.","vi":"Bà ấy cũng nói với tôi rằng sếp của bà ấy muốn có bản tóm tắt hằng tuần."},{"who":"Mark","en":"A weekly summary? That's new. Did anyone mention the cost?","vi":"Bản tóm tắt hằng tuần à? Cái đó mới đấy. Có ai nhắc đến chi phí không?"},{"who":"Lan","en":"Yes. Peter asked if the price included the weekly summary.","vi":"Có. Peter hỏi liệu giá đã bao gồm bản tóm tắt hằng tuần chưa."},{"who":"Mark","en":"And what did you tell him?","vi":"Thế chị trả lời anh ấy thế nào?"},{"who":"Lan","en":"I told him that I would check with you.","vi":"Tôi nói với anh ấy rằng tôi sẽ hỏi ý kiến anh."},{"who":"Lan","en":"Sofia also asked if we could start the new work next week.","vi":"Sofia cũng hỏi liệu chúng ta có thể bắt đầu phần việc mới vào tuần sau không."},{"who":"Mark","en":"Next week is fine. Can you add all of this to the minutes?","vi":"Tuần sau thì được. Chị thêm tất cả những điều này vào biên bản được không?"},{"who":"Lan","en":"Sure. I'll send them to you and the team in ten minutes.","vi":"Chắc chắn rồi. Mười phút nữa tôi sẽ gửi cho anh và cả nhóm."},{"who":"Mark","en":"Thanks, Lan. Your notes always save me a lot of time.","vi":"Cảm ơn Lan. Ghi chép của chị luôn giúp tôi tiết kiệm rất nhiều thời gian."}],"vocab":[{"w":"miss (a meeting)","ipa":"/mɪs/","vi":"lỡ, vắng mặt (cuộc họp)","ex":"Sorry I missed the meeting."},{"w":"minutes","ipa":"/ˈmɪnɪts/","vi":"biên bản cuộc họp","ex":"I'm writing the minutes now."},{"w":"final","ipa":"/ˈfaɪnl/","vi":"cuối cùng","ex":"the final version"},{"w":"boss","ipa":"/bɔːs/","vi":"sếp","ex":"Her boss wanted a summary."},{"w":"That's new.","ipa":"/ðæts nuː/","vi":"Cái đó mới đấy (chưa nghe bao giờ).","ex":"A weekly summary? That's new."},{"w":"mention","ipa":"/ˈmenʃn/","vi":"nhắc đến, đề cập","ex":"Did anyone mention the cost?"},{"w":"check with (someone)","ipa":"/tʃek wɪð/","vi":"hỏi ý kiến, xác nhận với ai","ex":"I'll check with Mark."},{"w":"save (someone) time","ipa":"/seɪv taɪm/","vi":"giúp ai tiết kiệm thời gian","ex":"Your notes save me a lot of time."}],"grammar":{"t":"Câu tường thuật cơ bản: said, told, asked if","d":"Khi kể lại lời người khác nói (ví dụ khi viết biên bản họp), ta dùng câu tường thuật. Vì lời nói đã xảy ra trong quá khứ, động từ thường \"lùi\" về quá khứ một bước: is → was, want → wanted, will → would, can → could. Nhớ đổi cả đại từ cho hợp: \"I\" của Sofia sẽ thành \"she\".","formula":["S + said (that) + S + V (lùi thì)","S + told + người + (that) + S + V (lùi thì)","Câu hỏi Có/Không: S + asked (+ người) + if/whether + S + V (không đảo ngữ)","Lùi thì: am/is/are → was/were · V (hiện tại) → V2 · will → would · can → could"],"ex":["\"The dashboard is very useful.\" → Sofia said (that) the dashboard was very useful.","\"My boss wants a weekly summary.\" → She told me (that) her boss wanted a weekly summary.","\"Does the price include the summary?\" → Peter asked if the price included the summary.","\"I will check with Mark.\" → I told him (that) I would check with Mark.","\"Can you start next week?\" → Sofia asked if we could start next week."],"mistakes":[{"wrong":"She said me that her boss wanted a summary.","right":"She told me that her boss wanted a summary.","why":"say không đi trực tiếp với người; muốn nói \"với ai\" thì dùng tell + người."},{"wrong":"Peter asked if did the price include the summary.","right":"Peter asked if the price included the summary.","why":"Câu hỏi tường thuật không đảo ngữ và không dùng did; chia động từ chính ở quá khứ."},{"wrong":"Sofia asked if we can start next week.","right":"Sofia asked if we could start next week.","why":"Khi kể lại sau cuộc họp, can lùi thành could."}]},"quiz":[{"q":"Why does Mark need Lan's notes?","o":["He is the client","He missed the meeting","He lost his notes"],"a":1},{"q":"When does BrightMart need the final version?","o":["Next week","By July 30th","By June 30th"],"a":2},{"q":"\"I can help.\" → She said that she ___ help.","o":["could","can","will"],"a":0}],"practice":[{"s":"Sofia ___ that the new dashboard was very useful.","a":"said","alt":[],"hint":"Không có người nghe đi sau: dùng say ở quá khứ."},{"s":"She ___ me that her boss wanted a weekly summary.","a":"told","alt":[],"hint":"Có người nghe (me) đi sau: dùng tell ở quá khứ."},{"s":"Peter asked ___ the price included the weekly summary.","a":"if","alt":["whether"],"hint":"Tường thuật câu hỏi Có/Không."},{"s":"I told him that I ___ check with Mark. (will)","a":"would","alt":[],"hint":"will lùi thì thành gì?"},{"s":"Sofia asked if we ___ start next week. (can)","a":"could","alt":[],"hint":"can lùi thì thành gì?"}],"speak":["Sofia said that the new dashboard was very useful.","She told me that her boss wanted a weekly summary.","Peter asked if the price included the weekly summary.","I told him that I would check with you."],"write":{"vi":"Quản lý của bạn vắng mặt trong một cuộc họp với khách hàng. Viết email tóm tắt cuộc họp cho họ: khách hàng đã nói gì, đã hỏi gì và bạn đã trả lời thế nào. Dùng said that, told me that và asked if, nhớ lùi thì.","en":"Your manager missed a meeting with a client. Write an email to summarise the meeting: what the client said, what they asked and how you answered. Use said that, told me that and asked if, and remember to change the tenses.","min":60},"summary":["said (that) + S + V; told + người + (that) + S + V. Không nói \"said me\".","Tường thuật câu hỏi Có/Không: asked if/whether + S + V, không đảo ngữ.","Lùi thì cơ bản: is → was, want → wanted, will → would, can → could.","Nhớ đổi đại từ: I → she/he, my → her/his."]},{"id":"x8_3","ch":8,"level":"B1","after":"s_minutes","title":"Action points and deadlines","vi":"Phân công việc và hạn chót: BY và UNTIL","goals":["Sau bài này bạn có thể phân công việc và nhận việc ở cuối cuộc họp.","Sau bài này bạn có thể phân biệt by (hạn chót) và until (kéo dài đến lúc).","Sau bài này bạn có thể dùng be responsible for / be in charge of + danh từ hoặc V-ing."],"story":[{"who":"Mark","en":"Before we finish, let's go through the action points.","vi":"Trước khi kết thúc, chúng ta điểm lại các việc cần làm."},{"who":"Mark","en":"First, who's responsible for cleaning the October data?","vi":"Thứ nhất, ai chịu trách nhiệm làm sạch dữ liệu tháng Mười?"},{"who":"Lan","en":"I'll take care of that. I can finish it by Thursday.","vi":"Tôi sẽ lo việc đó. Tôi có thể xong trước thứ Năm."},{"who":"Mark","en":"Great. Minh, you need to update the dashboard after that.","vi":"Tốt. Minh, sau đó em cần cập nhật dashboard."},{"who":"Minh","en":"OK. But I'm on leave until Wednesday, so I'll start on Thursday afternoon.","vi":"Vâng. Nhưng em nghỉ phép đến hết thứ Tư, nên em sẽ bắt đầu vào chiều thứ Năm."},{"who":"Mark","en":"That's fine. Can you finish it by Monday?","vi":"Được. Em có thể xong trước thứ Hai không?"},{"who":"Minh","en":"Yes, Monday is fine.","vi":"Vâng, thứ Hai thì được ạ."},{"who":"Mark","en":"And I'm responsible for talking to Sofia about the weekly summary.","vi":"Còn tôi chịu trách nhiệm nói chuyện với Sofia về bản tóm tắt hằng tuần."},{"who":"Lan","en":"Should we wait until Sofia replies before we start the summary?","vi":"Chúng ta có nên đợi đến khi Sofia trả lời rồi mới bắt đầu bản tóm tắt không?"},{"who":"Mark","en":"No, let's not wait. Please send me a first draft by Friday.","vi":"Không, đừng đợi. Chị gửi tôi bản nháp đầu tiên trước thứ Sáu nhé."},{"who":"Lan","en":"Got it. And who's in charge of the meeting notes this time?","vi":"Rõ rồi. Còn lần này ai phụ trách ghi biên bản họp?"},{"who":"Mark","en":"Minh is. Minh, please share them with everyone by the end of today.","vi":"Minh. Minh, em gửi cho mọi người trước cuối ngày hôm nay nhé."},{"who":"Mark","en":"OK, so: Lan by Thursday, Minh by Monday, and I'll call Sofia tomorrow. Thanks, everyone.","vi":"Được rồi: Lan xong trước thứ Năm, Minh trước thứ Hai, còn tôi sẽ gọi Sofia vào ngày mai. Cảm ơn mọi người."}],"vocab":[{"w":"action point","ipa":"/ˈækʃn pɔɪnt/","vi":"việc cần làm (sau cuộc họp)","ex":"Let's go through the action points."},{"w":"go through","ipa":"/ɡoʊ θruː/","vi":"điểm lại, xem lần lượt","ex":"Let's go through the list."},{"w":"be responsible for","ipa":"/bi rɪˈspɑːnsəbl fɚ/","vi":"chịu trách nhiệm về","ex":"I'm responsible for the report."},{"w":"take care of","ipa":"/teɪk ker əv/","vi":"lo, xử lý (việc gì)","ex":"I'll take care of that."},{"w":"on leave","ipa":"/ɑːn liːv/","vi":"đang nghỉ phép","ex":"I'm on leave until Wednesday."},{"w":"reply","ipa":"/rɪˈplaɪ/","vi":"trả lời, hồi âm","ex":"Let's wait until she replies."},{"w":"draft","ipa":"/dræft/","vi":"bản nháp","ex":"a first draft"},{"w":"in charge of","ipa":"/ɪn tʃɑːrdʒ əv/","vi":"phụ trách","ex":"Who's in charge of the notes?"}],"grammar":{"t":"BY và UNTIL; be responsible for / be in charge of","d":"Tiếng Việt nói \"đến thứ Sáu\" cho cả hai nghĩa, nên người Việt rất hay nhầm. BY là HẠN CHÓT: việc phải xong vào lúc đó hoặc sớm hơn. UNTIL là KÉO DÀI: việc tiếp diễn liên tục cho đến lúc đó rồi mới dừng. Khi phân việc, ta dùng be responsible for / be in charge of, và sau giới từ (for, of) động từ phải ở dạng V-ing.","formula":["BY + thời điểm = hạn chót, xong trước hoặc đúng lúc đó: Finish it by Monday.","UNTIL + thời điểm = kéo dài liên tục đến lúc đó: I'm on leave until Wednesday.","be responsible for / be in charge of + danh từ hoặc V-ing","Phân việc: Who's responsible for…? · I'll take care of… · X, you need to + V."],"ex":["I can finish it by Thursday. (xong muộn nhất là thứ Năm)","I'm on leave until Wednesday. (nghỉ liên tục, thứ Năm đi làm lại)","Should we wait until Sofia replies? (đợi suốt đến khi cô ấy trả lời)","I'm responsible for talking to Sofia.","Who's in charge of the meeting notes?"],"mistakes":[{"wrong":"Please send me the draft until Friday.","right":"Please send me the draft by Friday.","why":"Đây là hạn chót nên dùng by; until chỉ dùng cho việc kéo dài liên tục."},{"wrong":"I'm responsible for clean the data.","right":"I'm responsible for cleaning the data.","why":"Sau giới từ for, động từ phải thêm -ing."},{"wrong":"Who's in charge the notes?","right":"Who's in charge of the notes?","why":"Cụm cố định là in charge OF + danh từ."}]},"quiz":[{"q":"When will Lan finish cleaning the October data?","o":["By Monday","By Thursday","By Friday"],"a":1},{"q":"Why can't Minh start before Thursday?","o":["He is sick","He is in Singapore","He is on leave until Wednesday"],"a":2},{"q":"Please send me the report ___ 5 p.m. (hạn chót)","o":["until","by","since"],"a":1}],"practice":[{"s":"Can you finish the dashboard ___ Monday?","a":"by","alt":[],"hint":"Hạn chót: xong trước hoặc đúng thứ Hai."},{"s":"I'm on leave ___ Wednesday.","a":"until","alt":["till"],"hint":"Nghỉ liên tục đến thứ Tư."},{"s":"Who's responsible ___ cleaning the October data?","a":"for","alt":[],"hint":"be responsible ___ + V-ing."},{"s":"I'm responsible for ___ to Sofia about the summary. (talk)","a":"talking","alt":[],"hint":"Sau giới từ, động từ thêm -ing."},{"s":"Don't worry. I'll take care ___ that.","a":"of","alt":[],"hint":"take care ___ = lo việc gì."}],"speak":["Let's go through the action points.","Who's responsible for cleaning the October data?","I'll take care of that. I can finish it by Thursday.","I'm on leave until Wednesday."],"write":{"vi":"Sau cuộc họp nhóm, viết email tổng hợp các việc cần làm: mỗi người phụ trách việc gì và hạn chót khi nào. Dùng ít nhất ba lần by, một lần until, và cụm be responsible for / be in charge of.","en":"After a team meeting, write an email listing the action points: who is responsible for each task and the deadline for each one. Use by at least three times, until once, and be responsible for / be in charge of.","min":60},"summary":["BY = hạn chót (xong trước hoặc đúng lúc đó); UNTIL = kéo dài liên tục đến lúc đó.","be responsible for / be in charge of + danh từ hoặc V-ing.","Nhận việc: I'll take care of that. Giao việc: X, you need to + V.","Kết thúc họp: Let's go through the action points."]},{"id":"s_who","ch":8,"level":"B1","title":"The client who called","vi":"Mệnh đề quan hệ","goals":["Sau bài này bạn có thể mô tả người, vật và nơi chốn bằng who, which, that, where.","Sau bài này bạn có thể nối hai câu ngắn thành một câu dài, tự nhiên hơn.","Sau bài này bạn có thể giới thiệu khách hàng, công cụ và dự án cho đồng nghiệp mới."],"story":[{"who":"Ben","en":"Hi Lan. As your new teammate, I have a lot of questions. Who's Sofia Ortiz?","vi":"Chào chị Lan. Là thành viên mới của nhóm, em có rất nhiều câu hỏi. Sofia Ortiz là ai ạ?"},{"who":"Lan","en":"Sofia is the client who manages the data team at BrightMart.","vi":"Sofia là khách hàng quản lý nhóm dữ liệu ở BrightMart."},{"who":"Lan","en":"She's the person that you'll talk to most often.","vi":"Bà ấy là người mà em sẽ nói chuyện thường xuyên nhất."},{"who":"Ben","en":"OK. And what's PeakView?","vi":"Vâng. Còn PeakView là gì ạ?"},{"who":"Lan","en":"It's the app which shows BrightMart's sales every morning.","vi":"Đó là ứng dụng hiển thị doanh số của BrightMart mỗi sáng."},{"who":"Ben","en":"And Hue? I see that name in a lot of reports.","vi":"Còn Huế? Em thấy tên đó trong rất nhiều báo cáo."},{"who":"Lan","en":"Hue is the city where BrightMart has its best store.","vi":"Huế là thành phố nơi BrightMart có cửa hàng tốt nhất."},{"who":"Ben","en":"Who's Tom? He sent me an email this morning.","vi":"Tom là ai ạ? Sáng nay anh ấy gửi email cho em."},{"who":"Lan","en":"Tom is the IT guy who looks after BrightMart's servers.","vi":"Tom là anh chàng IT phụ trách các máy chủ của BrightMart."},{"who":"Lan","en":"He's the one that helped us find the missing October data.","vi":"Anh ấy là người đã giúp chúng ta tìm lại dữ liệu tháng Mười bị thiếu."},{"who":"Ben","en":"And what's the tool that everyone here uses for dashboards?","vi":"Còn công cụ mà mọi người ở đây dùng để làm dashboard là gì ạ?"},{"who":"Lan","en":"That's ChartPro. It's the tool that we chose after a long discussion.","vi":"Đó là ChartPro. Đó là công cụ mà chúng ta đã chọn sau một cuộc thảo luận dài."},{"who":"Ben","en":"Thanks! Now I know the people and the tools that I'll work with.","vi":"Cảm ơn chị! Giờ em đã biết những người và công cụ mà em sẽ làm việc cùng."}],"vocab":[{"w":"teammate","ipa":"/ˈtiːmmeɪt/","vi":"đồng đội, thành viên cùng nhóm","ex":"my new teammate"},{"w":"manage","ipa":"/ˈmænɪdʒ/","vi":"quản lý","ex":"She manages the data team."},{"w":"most often","ipa":"/moʊst ˈɔːfn/","vi":"thường xuyên nhất","ex":"the person you'll talk to most often"},{"w":"guy","ipa":"/ɡaɪ/","vi":"anh chàng, người (thân mật)","ex":"the IT guy"},{"w":"look after","ipa":"/lʊk ˈæftɚ/","vi":"trông nom, phụ trách","ex":"He looks after the servers."},{"w":"the one (that)","ipa":"/ðə wʌn/","vi":"người/cái (mà)","ex":"He's the one that helped us."},{"w":"discussion","ipa":"/dɪˈskʌʃn/","vi":"cuộc thảo luận","ex":"after a long discussion"},{"w":"work with","ipa":"/wɝːk wɪð/","vi":"làm việc cùng","ex":"the people I'll work with"}],"grammar":{"t":"Mệnh đề quan hệ với who, which, that, where","d":"Mệnh đề quan hệ giúp nói rõ \"người nào, cái nào, nơi nào\" bằng cách nối hai câu thành một. Nó giống chữ \"mà\", \"người mà\", \"nơi mà\" trong tiếng Việt, và luôn đứng ngay sau danh từ nó mô tả. Who dùng cho người, which cho vật, that cho cả người và vật, where cho nơi chốn.","formula":["Người: danh từ + who/that + V… (the client who manages the team)","Vật: danh từ + which/that + V… (the app which shows sales)","Nơi chốn: danh từ + where + S + V… (the city where BrightMart has its best store)","Khi who/which/that làm tân ngữ (có chủ ngữ khác theo sau), có thể bỏ: the tool (that) we chose"],"ex":["Sofia is the client. She manages the data team. → Sofia is the client who manages the data team.","PeakView is the app which shows BrightMart's sales every morning.","Hue is the city where BrightMart has its best store.","He's the one that helped us find the missing data.","ChartPro is the tool (that) we chose."],"mistakes"
