ractice":[{"s":"___ you send me the sales file, please?","a":"Could","alt":["Can"],"hint":"Cách nhờ lịch sự nhất."},{"s":"Could you ___ me with this report?","a":"help","alt":[],"hint":"Động từ nguyên mẫu: giúp."},{"s":"Excuse me, do you have a ___?","a":"minute","alt":[],"hint":"Hỏi người khác có rảnh chút không."},{"s":"Sorry, I ___. I'm in a meeting.","a":"can't","alt":["cannot"],"hint":"Từ chối lịch sự."},{"s":"Let me ___ if you need anything else.","a":"know","alt":[],"hint":"Cho tôi biết."}],"summary":["Could you + động từ nguyên mẫu? lịch sự hơn Can you…?; dùng Could you với đối tác và cấp trên.","Mở lời bằng Excuse me, do you have a minute?","Đồng ý: Sure / Of course / No problem; từ chối: Sorry, I can't + lý do.","Kết thúc: Thank you so much. / Let me know if you need anything else."]},"u6":{"goals":["Sau bài này bạn có thể mở đầu cuộc gọi công việc: This is… from…","Sau bài này bạn có thể nói mục đích cuộc gọi lịch sự bằng I'd like to + động từ.","Sau bài này bạn có thể xin người kia nói lại khi đường truyền kém và đọc địa chỉ email."],"formula":["Nghe máy: Good morning, + công ty. + tên + speaking.","Giới thiệu khi gọi: This is + tên + from + công ty / bộ phận.","Nói mục đích: I'd like to + V nguyên mẫu (I'd like to ask about…)","Không nghe rõ: Could you say that again? / Could you speak more slowly, please?"],"mistakes":[{"wrong":"Hello, I am Lan.","right":"Hello, this is Lan.","why":"Trên điện thoại người bản xứ giới thiệu bằng This is…, không dùng I am."},{"wrong":"I'd like ask about the numbers.","right":"I'd like to ask about the numbers.","why":"Sau I'd like phải có to trước động từ."},{"wrong":"What? Repeat!","right":"Sorry, could you say that again?","why":"Nói cộc như vậy rất bất lịch sự với khách hàng."}],"practice":[{"s":"Good morning. ___ is Lan from the data team.","a":"This","alt":[],"hint":"Giới thiệu trên điện thoại."},{"s":"I'd like ___ ask about your store numbers.","a":"to","alt":[],"hint":"I'd like + ___ + động từ."},{"s":"Sorry, the ___ is bad. I can't hear you.","a":"line","alt":[],"hint":"Đường truyền kém."},{"s":"Could you say that ___, please?","a":"again","alt":[],"hint":"Nói lại."},{"s":"My email is lan dot tran ___ datapeak dot com.","a":"at","alt":[],"hint":"Cách đọc ký hiệu @."}],"summary":["Gọi điện giới thiệu bằng This is + tên + from + công ty.","I'd like to + động từ = tôi muốn (lịch sự hơn I want to).","Không nghe rõ: Could you say that again? / Could you speak more slowly, please?","Đọc email: @ = at, dấu chấm = dot."]},"u11":{"goals":["Sau bài này bạn có thể gọi món lịch sự bằng I'd like… / I'll have…","Sau bài này bạn có thể hỏi và đưa gợi ý món ăn cho đối tác.","Sau bài này bạn có thể mời đối tác và nói mình trả tiền: It's on me."],"formula":["Gọi món: I'd like + món, please. / I'll have + món.","Hỏi gợi ý: What do you recommend? · Gợi ý: The … here is very good.","Hỏi ngắn với TO BE: Is it + tính từ? → Yes, it is. / No, it isn't.","Mời trả tiền: It's on me. / This lunch is on me. / Let me get this."],"mistakes":[{"wrong":"I want pho.","right":"I'd like the pho, please.","why":"I want nghe cộc khi gọi món; dùng I'd like… please."},{"wrong":"Today I invite you.","right":"Today it's on me.","why":"Muốn nói \"tôi mời (trả tiền)\" thì dùng It's on me; invite là mời đến một sự kiện."},{"wrong":"Is it spicy? — Yes, spicy.","right":"Is it spicy? — Yes, it is.","why":"Trả lời ngắn câu hỏi với to be: Yes, it is. / No, it isn't."}],"practice":[{"s":"Are you ready to ___?","a":"order","alt":[],"hint":"Người phục vụ hỏi gọi món."},{"s":"What do you ___? — The pho is very good.","a":"recommend","alt":[],"hint":"Hỏi gợi ý."},{"s":"I'd ___ the pho, please.","a":"like","alt":[],"hint":"Gọi món lịch sự."},{"s":"Is it spicy? — No, it ___.","a":"isn't","alt":["is not"],"hint":"Trả lời ngắn phủ định."},{"s":"Don't worry about the bill. This lunch is ___ me.","a":"on","alt":[],"hint":"Tôi mời."}],"summary":["Gọi món: I'd like the…, please. / I'll have the…","Hỏi gợi ý: What do you recommend?","Trả lời ngắn với to be: Yes, it is. / No, it isn't.","Mời trả tiền: It's on me. (không nói I invite you)."]},"u14":{"goals":["Sau bài này bạn có thể mở đầu small talk trước giờ họp: How was your weekend?","Sau bài này bạn có thể trả lời kèm một chi tiết và hỏi lại: How about you?","Sau bài này bạn có thể chuyển sang công việc tự nhiên: Anyway, shall we start?"],"formula":["Bước 1 – Hỏi: How was your weekend? / How's your week going?","Bước 2 – Đáp + một chi tiết: It was + tính từ (lovely, great, busy). + I went / I stayed…","Bước 3 – Hỏi lại: How about you? / What about you?","Chuyển sang việc: Anyway, shall we start? · Thích làm gì: like + V-ing"],"mistakes":[{"wrong":"I like read books.","right":"I like reading books.","why":"Nói sở thích dùng like + V-ing."},{"wrong":"My weekend is good.","right":"It was good, thanks.","why":"Cuối tuần đã qua nên dùng was, không dùng is."},{"wrong":"Fine.","right":"Fine, thanks. How about you?","why":"Trả lời một chữ làm cuộc nói chuyện dừng lại; hãy hỏi lại."}],"practice":[{"s":"How ___ your weekend?","a":"was","alt":[],"hint":"Cuối tuần đã qua → quá khứ của is."},{"s":"It was lovely, thanks. How ___ you?","a":"about","alt":[],"hint":"Hỏi lại người kia."},{"s":"I like ___ (read) history books.","a":"reading","alt":[],"hint":"like + V-ing."},{"s":"I went to the beach. — That ___ great!","a":"sounds","alt":[],"hint":"Nghe tuyệt quá."},{"s":"Anyway, ___ we start the meeting?","a":"shall","alt":[],"hint":"Gợi ý bắt đầu họp."}],"summary":["Small talk 3 bước: hỏi → đáp kèm một chi tiết → hỏi lại (How about you?).","Cuối tuần đã qua: How was…? / It was…","Nói sở thích: like + V-ing (I like reading).","Chuyển sang việc: Anyway, shall we start?"]},"u7":{"goals":["Sau bài này bạn có thể kể lại một việc đã xảy ra ở chỗ làm bằng thì quá khứ đơn.","Sau bài này bạn có thể thêm -ed cho động từ có quy tắc và dùng was / were đúng chủ ngữ.","Sau bài này bạn có thể hỏi và phủ định ở quá khứ với did / didn't + động từ nguyên mẫu."],"formula":["Khẳng định: S + V-ed (finished, checked) hoặc V2 bất quy tắc (found, had)","Phủ định: S + didn't + V nguyên mẫu (We didn't finish.)","Câu hỏi: (Wh-) + did + S + V nguyên mẫu? (How did you fix it?)","To be: I/he/she/it + was · you/we/they + were"],"mistakes":[{"wrong":"Yesterday I check the file.","right":"Yesterday I checked the file.","why":"Tiếng Việt không đổi động từ theo thời gian, nhưng tiếng Anh phải chia quá khứ: thêm -ed."},{"wrong":"Did the client liked it?","right":"Did the client like it?","why":"Đã có did thì động từ sau đó giữ nguyên mẫu."},{"wrong":"Some numbers was wrong.","right":"Some numbers were wrong.","why":"Chủ ngữ số nhiều (numbers) đi với were."}],"practice":[{"s":"We ___ the dashboard on Wednesday. (finish)","a":"finished","alt":[],"hint":"Động từ có quy tắc: thêm -ed."},{"s":"Some numbers ___ wrong.","a":"were","alt":[],"hint":"Quá khứ của be với chủ ngữ số nhiều."},{"s":"How ___ you fix the problem?","a":"did","alt":[],"hint":"Trợ động từ cho câu hỏi quá khứ."},{"s":"I ___ the duplicate rows. (remove)","a":"removed","alt":[],"hint":"remove + -d."},{"s":"We didn't ___ the problem at first. (see)","a":"see","alt":[],"hint":"Sau didn't dùng nguyên mẫu."}],"summary":["Quá khứ đơn nói việc đã xong trong quá khứ (last week, on Wednesday).","Có quy tắc: thêm -ed; bất quy tắc phải học thuộc (find → found, have → had).","Hỏi và phủ định: did / didn't + động từ nguyên mẫu.","Was cho I/he/she/it; were cho you/we/they."]},"u8":{"goals":["Sau bài này bạn có thể nói về kế hoạch đã định trước bằng be going to.","Sau bài này bạn có thể dùng will cho quyết định ngay lúc nói và cho dự đoán.","Sau bài này bạn có thể đưa gợi ý trong nhóm với How about...?, Why don't we...? và Let's..."],"formula":["Kế hoạch đã định: S + am/is/are + going to + V nguyên mẫu","Quyết định ngay / dự đoán: S + will ('ll) + V nguyên mẫu","Gợi ý: How about + V-ing / danh từ? · Why don't we + V? · Let's + V"],"mistakes":[{"wrong":"I going to ask them tomorrow.","right":"I'm going to ask them tomorrow.","why":"Going to luôn cần am/is/are phía trước."},{"wrong":"How about add a chart?","right":"How about adding a chart?","why":"Sau How about là danh từ hoặc V-ing."},{"wrong":"Let's to meet on Monday.","right":"Let's meet on Monday.","why":"Sau Let's dùng động từ nguyên mẫu, không có to."}],"practice":[{"s":"I'm ___ to ask the client tomorrow.","a":"going","alt":[],"hint":"Kế hoạch đã định: be ... to."},{"s":"How about ___ customer numbers? (add)","a":"adding","alt":[],"hint":"Sau How about dùng V-ing."},{"s":"___ don't we meet again on Monday?","a":"Why","alt":[],"hint":"Gợi ý: ... don't we + V?"},{"s":"OK, I ___ tell the client right now.","a":"will","alt":["'ll"],"hint":"Quyết định ngay lúc nói."},{"s":"___ check the plan together.","a":"Let's","alt":["Let us"],"hint":"\"Hãy cùng...\""}],"summary":["Be going to + V: kế hoạch đã định từ trước.","Will + V: quyết định ngay lúc nói hoặc dự đoán.","Gợi ý: How about + V-ing? · Why don't we + V? · Let's + V.","Sau going to, will, Let's, Why don't we đều dùng động từ nguyên mẫu."]},"u12":{"goals":["Sau bài này bạn có thể viết một email công việc theo khung 5 bước: chào, mục đích, nội dung, đề nghị, kết.","Sau bài này bạn có thể dùng các câu mẫu: I am writing to..., Please find attached..., I look forward to hearing from you.","Sau bài này bạn có thể chào và ký tên đúng cách trong email trang trọng."],"formula":["Chào: Dear Mr. / Ms. + họ, (Dear Mr. Chen,)","Mục đích: I am writing to + V nguyên mẫu","Gửi kèm và đề nghị: Please find attached + danh từ · Could you let me know if...?","Kết: I look forward to + V-ing / danh từ. Best regards, + tên"],"mistakes":[{"wrong":"I look forward to hear from you.","right":"I look forward to hearing from you.","why":"To trong look forward to là giới từ, nên sau nó dùng V-ing."},{"wrong":"Please find attach the report.","right":"Please find attached the report.","why":"Cụm cố định dùng attached (được đính kèm)."},{"wrong":"Dear Mr. David, (David là tên riêng)","right":"Dear Mr. Smith,","why":"Mr. / Ms. đi với họ, không đi với tên riêng; nếu dùng tên riêng thì bỏ Mr.: Dear David,"}],"practice":[{"s":"I am writing ___ follow up on our call last Tuesday.","a":"to","alt":[],"hint":"I am writing ... + V (mục đích)."},{"s":"Please find ___ the sales report for October.","a":"attached","alt":[],"hint":"\"Xin gửi kèm\"."},{"s":"I look forward to ___ from you.","a":"hearing","alt":[],"hint":"Sau look forward to dùng V-ing."},{"s":"Could you ___ me know if you have any questions?","a":"let","alt":[],"hint":"\"Cho tôi biết\"."},{"s":"Best ___, Lan Tran","a":"regards","alt":[],"hint":"Lời ký kết trang trọng."}],"summary":["Khung 5 bước: chào → mục đích → nội dung → đề nghị → kết.","Dear Mr. / Ms. + họ; ký: Best regards, + tên.","I am writing to + V; Please find attached + tài liệu.","I look forward to + V-ing (hearing, meeting)."]},"u15":{"goals":["Sau bài này bạn có thể dùng thì hiện tại tiếp diễn để nói việc đang xảy ra ngay lúc họp.","Sau bài này bạn có thể báo các sự cố khi họp online: You're breaking up, You're on mute, It's still loading.","Sau bài này bạn có thể hỏi người khác có nghe, có thấy màn hình của bạn không."],"formula":["Khẳng định: S + am/is/are + V-ing (I'm sharing my screen.)","Phủ định: S + am not / isn't / aren't + V-ing","Câu hỏi: Am/Is/Are + S + V-ing? (Are you sharing your screen?)"],"mistakes":[{"wrong":"I sharing my screen now.","right":"I'm sharing my screen now.","why":"Thì tiếp diễn luôn cần am/is/are trước V-ing."},{"wrong":"You are break up.","right":"You're breaking up.","why":"Sau are phải là V-ing: breaking."},{"wrong":"Can you hear me? – Yes, I hear.","right":"Can you hear me? – Yes, I can hear you.","why":"Trả lời câu hỏi với can thì dùng can, và cần tân ngữ (you)."}],"practice":[{"s":"I'm ___ my screen now. Can you see it? (share)","a":"sharing","alt":[],"hint":"am + V-ing."},{"s":"Sorry, Mark, you're ___ up.","a":"breaking","alt":[],"hint":"Tiếng bị ngắt quãng."},{"s":"It's still ___. Please wait. (load)","a":"loading","alt":[],"hint":"Đang tải."},{"s":"Please mute yourself when you ___ speaking.","a":"aren't","alt":["are not"],"hint":"Phủ định của are."},{"s":"Lan, I can't hear you. You're ___ mute.","a":"on","alt":[],"hint":"\"Bạn đang tắt mic\" = You're ... mute."}],"summary":["Hiện tại tiếp diễn: am/is/are + V-ing = đang xảy ra ngay lúc nói.","Phủ định: isn't / aren't + V-ing; câu hỏi: đảo am/is/are lên đầu.","Câu cứu nguy: Can you hear me? · You're breaking up. · You're on mute. · Can you see my screen?","Nhắc lịch sự: Please mute yourself when you aren't speaking."]},"u16":{"goals":["Sau bài này bạn có thể góp ý cụ thể bằng so sánh hơn (clearer, shorter, more useful).","Sau bài này bạn có thể dùng so sánh nhất (the most important, the best) để chọn ra điểm chính.","Sau bài này bạn có thể góp ý mềm mỏng và nhận góp ý lịch sự."],"formula":["Từ ngắn: adj + -er (+ than) · the + adj + -est","Từ dài: more + adj (+ than) · the most + adj","Bất quy tắc: good → better → the best · bad → worse → the worst","Góp ý mềm: It's a bit + adj. Could you make it + adj-er?"],"mistakes":[{"wrong":"The charts are more easy to read.","right":"The charts are easier to read.","why":"Tính từ ngắn (kể cả tận cùng -y) thêm -er: easy → easier."},{"wrong":"This version is more better.","right":"This version is better.","why":"Better đã là so sánh hơn, không thêm more."},{"wrong":"The second one is clearer the first one.","right":"The second one is clearer than the first one.","why":"So sánh hai thứ phải có than."}],"practice":[{"s":"The second version is ___ than the first. (clear)","a":"clearer","alt":[],"hint":"Từ ngắn + -er."},{"s":"The charts are bigger and ___ to read. (easy)","a":"easier","alt":[],"hint":"easy → đổi y thành i + -er."},{"s":"Keep only the three ___ important points.","a":"most","alt":[],"hint":"So sánh nhất với từ dài: the ... important."},{"s":"This report is ___ than last month's. (good)","a":"better","alt":[],"hint":"Bất quy tắc của good."},{"s":"The summary is a ___ long. Could you make it shorter?","a":"bit","alt":[],"hint":"\"Hơi\" dài."}],"summary":["So sánh hơn: từ ngắn + -er; từ dài: more + adj; nhớ than khi so hai thứ.","So sánh nhất: the + adj-est / the most + adj.","Bất quy tắc: good → better → best; bad → worse → worst.","Góp ý mềm: It's a bit long. Could you make it shorter? Nhận góp ý: Thanks for the feedback."]},"u9":{"goals":["Sau bài này bạn có thể mô tả xu hướng tăng, giảm, đạt đỉnh trong một biểu đồ.","Sau bài này bạn có thể dùng trạng từ mức độ (sharply, slowly, slightly) để nói tăng/giảm nhanh hay chậm.","Sau bài này bạn có thể phân biệt BY (tăng/giảm một lượng) và TO (tăng/giảm đến mức)."],"formula":["Tăng / giảm: S + rose / increased / fell / dropped (+ trạng từ: sharply, slowly, slightly)","Lượng thay đổi: rise / fall + BY + con số (dropped by 20%)","Mức đạt tới: rise / fall + TO + con số (rose to $250,000)","Đỉnh và tổng thể: reach a peak in + thời gian · Overall, + S + V"],"mistakes":[{"wrong":"Sales were increased by 15%.","right":"Sales increased by 15%.","why":"Doanh số tự tăng, không ai \"làm\" nó tăng, nên dùng chủ động."},{"wrong":"Sales rised slowly until March.","right":"Sales rose slowly until March.","why":"rise là động từ bất quy tắc: rise – rose – risen."},{"wrong":"Sales increased 20 percents.","right":"Sales increased by 20 percent.","why":"percent không thêm -s, và nên có by để nói lượng thay đổi."}],"practice":[{"s":"Sales ___ slowly until March. (rise, quá khứ)","a":"rose","alt":[],"hint":"Quá khứ bất quy tắc của rise."},{"s":"In April, sales dropped ___ by twenty percent.","a":"sharply","alt":[],"hint":"Trạng từ nghĩa là \"mạnh, đột ngột\"."},{"s":"Overall, sales increased ___ fifteen percent.","a":"by","alt":[],"hint":"Nói lượng thay đổi: ___ + con số."},{"s":"After that, sales recovered and reached a ___ in June.","a":"peak","alt":[],"hint":"reach a ___ = đạt đỉnh."},{"s":"Sales were $200,000 in January and rose ___ $250,000 in March.","a":"to","alt":[],"hint":"Nói mức đạt tới: ___ + con số."}],"summary":["Tăng: rise, increase, grow · Giảm: fall, drop, decrease · Giữ nguyên: stay stable.","Thêm trạng từ để nói mức độ: sharply (mạnh), steadily (đều), slightly (nhẹ).","BY + lượng thay đổi; TO + mức đạt tới.","Kết bằng xu hướng chung: Overall, the trend is positive."]},"u10":{"goals":["Sau bài này bạn có thể đồng ý với ý kiến của người khác một cách tự nhiên.","Sau bài này bạn có thể phản đối lịch sự bằng cách ghi nhận ý người khác trước.","Sau bài này bạn có thể đưa ra đề xuất mềm mỏng bằng Maybe we could…"],"formula":["Đồng ý: I agree (with + người). / That's true. / Exactly.","Phản đối mềm: I see your point, but + ý của bạn. / That's true, but…","Đề xuất mềm: Maybe we could + V (nguyên mẫu)."],"mistakes":[{"wrong":"I am agree with Mark.","right":"I agree with Mark.","why":"agree là động từ, không dùng thêm am/is/are."},{"wrong":"You are wrong.","right":"I see your point, but…","why":"Nói thẳng \"bạn sai\" với đối tác là thiếu lịch sự; hãy ghi nhận ý họ trước."},{"wrong":"Maybe we could to cut the TV ads.","right":"Maybe we could cut the TV ads.","why":"Sau could là động từ nguyên mẫu, không có to."}],"practice":[{"s":"I ___ with Mark. The data shows that online ads work well.","a":"agree","alt":[],"hint":"Động từ nghĩa là \"đồng ý\" (không có am)."},{"s":"I see your ___, but marketing brings in new customers.","a":"point","alt":[],"hint":"I see your ___ = tôi hiểu ý bạn."},{"s":"That's ___, but our costs are too high.","a":"true","alt":[],"hint":"Ghi nhận ý người khác: That's ___."},{"s":"Maybe we ___ cut the TV ads and keep the online ads.","a":"could","alt":[],"hint":"Đề xuất mềm: Maybe we ___ + V."},{"s":"That sounds ___. Could you send me the numbers?","a":"reasonable","alt":[],"hint":"Tính từ nghĩa là \"hợp lý\"."}],"summary":["Đồng ý: I agree (with you). / That's true. / Exactly. (không nói \"I am agree\").","Phản đối mềm: ghi nhận trước rồi mới nói ý mình: I see your point, but…","Đề xuất mềm: Maybe we could + V nguyên mẫu.","Kết thúc thảo luận: So we all agree on the plan."]}}};
const HAND=Object.fromEntries(LESSONS.map(l=>[l.id,l]));
for(const id in BAKED.enrich){const l=HAND[id],e=BAKED.enrich[id];if(!l)continue;
  Object.assign(l,{goals:e.goals,practice:e.practice,summary:e.summary});Object.assign(l.grammar,{formula:e.formula,mistakes:e.mistakes})}
(()=>{const lastAfter={};
  BAKED.lessons.forEach(l=>{HAND[l.id]=l;
    if(!l.after)return;const ch=CHAPTERS.find(c=>c.n===l.ch);if(!ch)return;
    const anchor=lastAfter[l.after]||l.after;
    const i=ch.items.findIndex(it=>(typeof it==="string"?it:it[0])===anchor);
    ch.items.splice(i<0?ch.items.length:i+1,0,l.id);lastAfter[l.after]=l.id;});})();
const SYLLABUS=[]; const CH_OF={};
CHAPTERS.forEach(ch=>ch.items.forEach(it=>{
  const e=typeof it==="string"?{id:it,title:HAND[it].title,vi:HAND[it].vi,level:ch.level}:{id:it[0],title:it[1],vi:it[2],g:it[3],sc:it[4],level:ch.level};
  e.ch=ch.n; SYLLABUS.push(e); CH_OF[e.id]=ch;
}));
const CONTENT={}; // AI-written syllabus lessons, id → lesson
try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k&&k.startsWith("bt-L-")){const l=JSON.parse(localStorage.getItem(k)); if(l&&l.id) CONTENT[l.id]=l}}}catch(e){}

/* ===================== STATE ===================== */
const DEFAULT_STATE={tests:{},log:{},done:{},cards:{},streak:{last:"",count:0},xp:0,gen:[],daily:{},badges:[],placed:"",stats:{talk:0,ielts:0,fixes:0,sound:0}};
let state=JSON.parse(JSON.stringify(DEFAULT_STATE));
let cap={db:null,user:null,sample:null,dict:null,tts:null};
let uid=null, saveTimer=null, saving=false, saveAgain=false;
const LS_KEY="bacthang-english-v1";
try{const s=localStorage.getItem(LS_KEY); if(s) state=Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)),JSON.parse(s));}catch(e){}

function logXP(n){if(!state.log)state.log={};const t=today();state.log[t]=(state.log[t]||0)+n;}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dayDiff(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}
function touchStreak(){const t=today(); if(state.streak.last===t) return;
  state.streak.count = state.streak.last && dayDiff(state.streak.last,t)===1 ? state.streak.count+1 : 1; state.streak.last=t;}
function addXP(n){state.xp+=n; logXP(n); touchStreak(); save(); renderStat();}
function save(){
  checkBadges(); if(typeof push==="function") push(); if(typeof renderCoach==="function") setTimeout(renderCoach,0);
  try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}
  if(!cap.db||!uid) return;
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,800);
}
async function flush(){
  if(saving){saveAgain=true;return}
  saving=true;
  try{await cap.db.collection("data/users/"+uid).doc("progress").set(JSON.parse(JSON.stringify(state)))}catch(e){}
  saving=false; if(saveAgain){saveAgain=false;flush()}
}
function syllabusLessons(){return SYLLABUS.map(x=>HAND[x.id]?Object.assign({},HAND[x.id],{level:x.level}):CONTENT[x.id]||Object.assign({stub:true},x))}
function allLessons(){return syllabusLessons().concat(state.gen||[])}
function lessonById(id){return allLessons().find(l=>l.id===id)}
function doneOf(id){return state.done[id]||(state.done[id]={})}
function markSkill(id,sk,xp){daily().skill=true;checkDaily();const d=doneOf(id); const first=!d[sk]; d[sk]=true; if(first){addXP(xp||10); if(SKILLS.every(s=>d[s.k])) toast("Hoàn thành bài! Từ vựng đã vào hộp Ôn từ.")} else save(); }
function addCards(lesson){(lesson.vocab||[]).forEach(v=>{if(!state.cards[v.w]) state.cards[v.w]={box:1,due:today(),vi:v.vi,ex:v.ex,ipa:v.ipa}}); save();}

/* ===================== AUDIO ===================== */
let speakingLine=null;
function voiceFor(who){const map={Narrator:"buttery",Lan:"airy",Mark:"rounded",Sofia:"glassy"};return map[who]||"buttery"}
async function say(text,opts={}){
  const rate=opts.rate||state.rate||0.8;
  if(cap.tts){try{await cap.tts.speak(text,{rate,language:"en",voice:opts.voice||"buttery"});return}catch(e){if(e&&e.code==="busy"){toast("Đang nghe micro, dừng nói trước đã.");return} if(e&&(e.code==="stopped"))return;}}
  if("speechSynthesis" in window){return new Promise(res=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=rate;u.onend=res;u.onerror=res;speechSynthesis.speak(u)})}
  toast("Trình duyệt này không đọc được âm thanh.");
}
async function sayLines(lines,onLine){
  const rate=state.rate||0.8;
  if(cap.tts){
    let un=null; try{un=cap.tts.onLine(({line})=>onLine&&onLine(line))}catch(e){}
    try{await cap.tts.speak(lines.map((l,i)=>({text:l.en,voice:voiceFor(l.who),language:"en",id:"l"+i})),{rate})}catch(e){}
    if(typeof un==="function")un(); onLine&&onLine(-1); return;
  }
  for(let i=0;i<lines.length;i++){onLine&&onLine(i); await say(lines[i].en,{rate}); if(stopAll) break;}
  onLine&&onLine(-1); stopAll=false;
}
let stopAll=false;
function stopAudio(){stopAll=true;try{cap.tts&&cap.tts.stop()}catch(e){};try{speechSynthesis.cancel()}catch(e){}}
const ICON_PLAY='<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>';

/* ===================== DICTATION ===================== */
let dictTarget=null; // {onPartial, onFinal, onEnd}
function setupDictation(){
  const d=cap.dict; if(!d) return;
  d.onPartial(({text})=>dictTarget&&dictTarget.onPartial&&dictTarget.onPartial(text));
  d.onFinal(({text})=>dictTarget&&dictTarget.onFinal&&dictTarget.onFinal(text));
  d.onState(({state:s})=>{document.querySelectorAll("[data-mic]").forEach(b=>{const on=s!=="idle"&&b===activeMic; b.classList.toggle("rec",on); b.querySelector("span").textContent=on?"Dừng":b.dataset.label});
    if(s==="idle"&&dictTarget){const t=dictTarget;dictTarget=null;activeMic=null;t.onEnd&&t.onEnd()}});
}
let activeMic=null;
function micButton(label,target){
  if(!cap.dict) return null;
  const b=el("button",{class:"btn small","data-mic":"1","data-label":label},`<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M8 10a2.5 2.5 0 0 0 2.5-2.5v-4a2.5 2.5 0 0 0-5 0v4A2.5 2.5 0 0 0 8 10zm4-2.5a.5.5 0 0 0-1 0 3 3 0 0 1-6 0 .5.5 0 0 0-1 0 4 4 0 0 0 3.5 3.97V13H6a.5.5 0 0 0 0 1h4a.5.5 0 0 0 0-1H8.5v-1.53A4 4 0 0 0 12 7.5z"/></svg><span>${label}</span>`);
  b.onclick=()=>{
    if(cap.dict.active()&&activeMic===b){cap.dict.stop().catch(()=>{});return}
    stopAudio(); activeMic=b; dictTarget=target();
    cap.dict.start({language:"en-US"}).catch(e=>{activeMic=null;dictTarget=null;
      if(e&&e.code==="not_granted"){toast("Micro chưa được cho phép. Bạn có thể gõ thay.");cap.dict=null;render()}
      else if(e&&e.code!=="stopped") toast("Chưa bật được micro, thử lại nhé.")});
  };
  return b;
}

/* ===================== HELPERS ===================== */
function el(tag,attrs={},html){const e=document.createElement(tag);for(const k in attrs){if(k==="on"){for(const ev in attrs.on)e.addEventListener(ev,attrs.on[ev])}else e.setAttribute(k,attrs[k])} if(html!=null)e.innerHTML=html; return e}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
let toastT=null;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}
function words(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean)}
function compareSpeech(target,said){
  const t=words(target), s=words(said);
  const n=t.length,m=s.length; const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=t[i]===s[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(n).fill(false); let i=0,j=0; while(i<n&&j<m){if(t[i]===s[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  const tw=target.split(/\s+/); // display tokens align with words() when punctuation is attached
  let k=0; const html=tw.map(tok=>{const clean=words(tok); if(!clean.length) return esc(tok); const ok=hit[k]; k+=clean.length; return `<span class="${ok?"hit":"miss"}">${esc(tok)}</span>`}).join(" ");
  return {score:n?Math.round(100*hit.filter(Boolean).length/n):0,html};
}
async function ask(prompt,opts={}){
  if(!cap.sample) throw {code:"unavailable"};
  return cap.sample.json(prompt,Object.assign({modelTier:"default"},opts));
}
function aiError(e){
  if(e&&e.code==="unavailable") return cloudReady()?"Đăng nhập ở trang Hồ sơ để dùng AI (chỉ tài khoản được cấp quyền), hoặc mở bản trên claude.ai.":"Phần chấm bài bằng AI chỉ chạy khi mở trang này trên claude.ai khi đã đăng nhập.";
  if(e&&e.code==="offline") return "Đang không có mạng. Phần AI cần mạng, các phần khác vẫn học bình thường.";
  if(e&&e.code==="refused") return "AI không xử lý được nội dung này. Thử viết lại câu khác nhé.";
  if(e&&e.code==="not_granted") return "Bạn chưa cho phép trang dùng Claude. Mở menu Permissions của artifact để bật.";
  if(e&&e.code==="rate_limited") return cap.sample&&cap.sample._cloud?"Hôm nay đã dùng hết lượt AI. Mai dùng tiếp nhé.":"Đang gửi quá nhiều yêu cầu. Đợi một phút rồi thử lại.";
  return "AI chưa trả lời được. Thử lại sau ít giây.";
}

  if(r.startsWith("lesson-")) renderLesson(r.slice(7));
  else if(r==="review") renderReview();
  else if(r==="talk") renderTalk();

// Merge two progress snapshots without losing anything learned on either device.
function mergeState(a,b){
  if(!b||typeof b!=="object")return a;
  const m=JSON.parse(JSON.stringify(a)), B=JSON.parse(JSON.stringify(b));
  m.done=m.done||{};for(const id in B.done||{})m.done[id]=Object.assign({},m.done[id],B.done[id]);
  m.cards=m.cards||{};for(const k in B.cards||{}){const x=m.cards[k],y=B.cards[k];m.cards[k]=!x?y:(y.box>x.box||(y.box===x.box&&y.due>x.due))?y:x}
  m.xp=Math.max(m.xp||0,B.xp||0);
  const sa=m.streak||{},sb2=B.streak||{};m.streak=(sb2.last||"")>(sa.last||"")?sb2:(sb2.last===sa.last?{last:sa.last,count:Math.max(sa.count||0,sb2.count||0)}:sa);
  m.log=m.log||{};for(const d in B.log||{})m.log[d]=Math.max(m.log[d]||0,B.log[d]);
  m.tests=m.tests||{};for(const n in B.tests||{}){const x=m.tests[n],y=B.tests[n];m.tests[n]=!x||y.best>x.best?y:x}
  m.badges=[...new Set([...(m.badges||[]),...(B.badges||[])])];
  m.stats=m.stats||{};for(const k in B.stats||{})m.stats[k]=Math.max(m.stats[k]||0,B.stats[k]);
  const ids=new Set((m.gen||[]).map(l=>l.id));m.gen=(m.gen||[]).concat((B.gen||[]).filter(l=>!ids.has(l.id)));
  m.stories=Object.assign({},B.stories,m.stories);
  m.placed=m.placed||B.placed||"";m.guideSeen=m.guideSeen||B.guideSeen;
  const da=m.daily||{},db=B.daily||{};
  if(db.date&&db.date>(da.date||""))m.daily=db;else if(db.date===da.date)m.daily={date:da.date,review:da.review||db.review,skill:da.skill||db.skill,talk:Math.max(da.talk||0,db.talk||0),bonus:da.bonus||db.bonus};
  return m;
}

/* ===================== WEEK CHART ===================== */
function weekChart(){
  const log=state.log||{}; const days=[];
  for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");days.push({k,d,v:log[k]||0})}
  const thisW=days.slice(7).reduce((a,b)=>a+b.v,0), lastW=days.slice(0,7).reduce((a,b)=>a+b.v,0), active=days.slice(7).filter(x=>x.v>0).length;
  const sec=el("section",{class:"panel",style:"margin-bottom:28px"},`<h2>Điểm học mỗi ngày</h2>
   <div class="kpis"><div><b>${thisW}</b>điểm 7 ngày qua</div><div><b>${lastW}</b>điểm 7 ngày trước đó</div><div><b>${active}/7</b>ngày có học</div></div>`);
  const W=640,H=170,pl=32,pr=8,pt=12,pb=26, max=Math.max(40,...days.map(x=>x.v)), step=max<=40?10:max<=100?25:50, top=Math.ceil(max/step)*step;
  const bw=(W-pl-pr)/days.length, y=v=>pt+(H-pt-pb)*(1-v/top);
  let g="";for(let v=0;v<=top;v+=step)g+=`<line class="gridl" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const wd=["CN","T2","T3","T4","T5","T6","T7"];
  const bars=days.map((x,i)=>{const cx=pl+i*bw, w=Math.max(4,bw-6), h=(H-pt-pb)-(y(x.v)-pt), r=Math.min(4,h/2);
    const path=h>0?`<path class="bar ${i===13?"today":""}" d="M${cx+3} ${y(0)} v${-(h-r)} q0 ${-r} ${r} ${-r} h${w-2*r} q${r} 0 ${r} ${r} v${h-r} z"/>`:"";
    return `${path}<text class="axis" x="${cx+bw/2}" y="${H-8}" text-anchor="middle">${i===13?"Nay":wd[x.d.getDay()]}</text><rect class="hit" data-i="${i}" x="${cx}" y="${pt}" width="${bw}" height="${H-pt-pb}"/>`}).join("");
  const wrap=el("div",{class:"chart-wrap"},`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Điểm học 14 ngày gần nhất, 7 ngày qua được ${thisW} điểm">${g}${bars}</svg>`);
  const tip=el("div",{class:"ctip",hidden:""});wrap.append(tip);
  wrap.querySelectorAll(".hit").forEach(r=>{const x=days[+r.dataset.i];
    const show=()=>{const box=wrap.getBoundingClientRect(),rb=r.getBoundingClientRect();tip.textContent=`${x.d.getDate()}/${x.d.getMonth()+1}: ${x.v} điểm`;tip.style.left=(rb.left-box.left+rb.width/2)+"px";tip.style.top=(rb.top-box.top+(y(x.v)-pt)*rb.height/(H-pt-pb))+"px";tip.hidden=false};
    r.addEventListener("mouseenter",show);r.addEventListener("click",show);r.addEventListener("mouseleave",()=>tip.hidden=true)});
  sec.append(wrap);
  if(lastW>0) sec.append(el("p",{class:"muted",style:"margin:6px 0 0;font-size:14px"},thisW>=lastW?`Tuần này nhiều hơn tuần trước ${thisW-lastW} điểm. Giữ nhịp này nhé.`:`Tuần này ít hơn tuần trước ${lastW-thisW} điểm. Chỉ cần 20 phút mỗi ngày là bắt kịp.`));
  return sec;
}

const wordCache={};
async function wordInfo(tok,sentence,box){
  const word=tok.replace(/^[^A-Za-z]+|[^A-Za-z'’-]+$/g,""); if(!word)return;
  box.hidden=false; say(word,{rate:0.8});
  box.innerHTML=`<div class="row" style="justify-content:space-between"><b style="font-size:20px">${esc(word)}</b><button class="btn small" id="wb-close">Đóng</button></div><div id="wb-body" class="muted">${cap.sample?'<span class="spin"></span> Đang tra nghĩa…':"Tra nghĩa bằng AI cần mở trang trên claude.ai."}</div>`;
  box.querySelector("#wb-close").onclick=()=>box.hidden=true;
  if(!cap.sample)return;
  const key=word.toLowerCase()+"|"+sentence;
  try{
    const r=wordCache[key]||(wordCache[key]=await ask(`A Vietnamese learner of English tapped the word "${word}" in this sentence: "${sentence}". Give the meaning in THIS context. Return ONLY JSON: {"base":"dictionary form of the word or the short phrase it belongs to","ipa":"/IPA/","vi":"short Vietnamese meaning in this context","ex":"one new simple example sentence"}`,{modelTier:"quick"}));
    const b=box.querySelector("#wb-body"); if(!b)return;

    const has=!!state.cards[r.base];
    const add=el("button",{class:"btn small primary",style:"margin-top:8px"},has?"Đã có trong hộp ôn":"Thêm vào hộp ôn");add.disabled=has;
    add.onclick=()=>{state.cards[r.base]={box:1,due:today(),vi:r.vi,ex:r.ex,ipa:r.ipa};save();renderStat();add.disabled=true;add.textContent="Đã thêm"};

    return `<g class="st ${st}"><circle cx="${xs[i]}" cy="${y(i)}" r="${st==="now"?17:12}"/>${st==="now"?`<circle class="halo" cx="${xs[i]}" cy="${y(i)}" r="26"/>`:""}

function normAns(x){return String(x||"").toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").replace(/^[\s.,!?;:"]+|[\s.,!?;:"]+$/g,"")}
function practicePanel(items,title,key){
  const p=el("section",{class:"panel"},`<h2>${title}</h2><p class="muted" style="margin:0 0 6px">Gõ từ còn thiếu rồi bấm Kiểm tra. Bí quá thì bấm Gợi ý.</p>`);
  const rows=items.map((it,i)=>{
    const [a,b]=it.s.split("___");
    const inp=el("input",{type:"text",id:key+"-"+i,autocomplete:"off",autocapitalize:"off",class:"gap","aria-label":"Chỗ trống câu "+(i+1)});
    const row=el("div",{class:"prow"});const line=el("div",{class:"pline"});
    line.append(el("span",{class:"pn"},(i+1)+"."),document.createTextNode(" "+a),inp,document.createTextNode(b));
    const fb=el("div",{class:"pfb"});const hb=el("button",{class:"btn small"},"Gợi ý");hb.onclick=()=>{fb.className="pfb muted";fb.textContent=it.hint||""};
    row.append(line,el("div",{class:"row"}),fb);row.children[1].append(hb);
    inp.onkeydown=e=>{if(e.key==="Enter")check.click()};
    return {it,inp,fb,row};
  });
  rows.forEach(r=>p.append(r.row));
  const check=el("button",{class:"btn primary",style:"margin-top:12px"},"Kiểm tra");
  const res=el("span",{style:"margin-left:12px;font-weight:700"});
  check.onclick=()=>{let ok=0;rows.forEach(({it,inp,fb})=>{const good=[it.a,...(it.alt||[])].map(normAns).includes(normAns(inp.value));
      if(good)ok++;inp.classList.toggle("ok",good);inp.classList.toggle("no",!good);
      fb.className="pfb";fb.innerHTML=good?`<span style="color:var(--good)">Đúng</span>`:`<span style="color:var(--bad)">Đáp án: <b>${esc(it.a)}</b></span>${it.hint?` · <span class="muted">${esc(it.hint)}</span>`:""}`});
    res.textContent=`${ok}/${rows.length} câu đúng`;if(ok===rows.length){addXP(5);toast("Đúng hết! +5 điểm")}};
  const w=el("div",{class:"row"});w.append(check,res);p.append(w);return p;
}
function tabSpeak(l){

        const r=compareSpeech(sent,buf); said.innerHTML=r.html; sc.textContent=r.score+"%"; sc.style.color=r.score>=80?"var(--good)":"var(--amber)";

function summaryPanel(l){return l.summary&&l.summary.length?el("section",{class:"panel summary"},`<h2>Tóm tắt bài</h2><ul>${l.summary.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`):null}

Student text:
"""${text}"""
Correct real errors only (grammar, word choice, spelling, unnatural phrasing). Explain each in simple Vietnamese. Keep the better version at the student's level, just a little more natural.
Return ONLY JSON: {"score":0-10 integer,"praiseVi":"one sentence in Vietnamese about what was good","errors":[{"wrong":"exact wrong part","right":"corrected","whyVi":"short Vietnamese explanation"}],"better":"improved full text in English","tipVi":"one concrete tip in Vietnamese for next time"}`);

        `<div class="better"><div class="label">Bản tự nhiên hơn</div>${esc(r.better)}</div><p style="margin:0"><b>Lần sau:</b> ${esc(r.tipVi)}</p>`;
      const lb=el("button",{class:"btn small"},"Nghe bản sửa");lb.onclick=()=>say(r.better);out.append(lb);

/* ===================== REVIEW (Leitner boxes) ===================== */
const GAP=[0,1,2,4,8,16];
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
/* Lỗi sai của chính bạn (từ bài viết, hội thoại, IELTS) cũng thành thẻ ôn: sửa lại câu sai là cách nhớ lâu nhất. */
function addMistakes(list){(list||[]).forEach(e=>{if(!e||!e.right||!e.wrong)return;const k="✎ "+e.right;if(!state.cards[k])state.stats.fixes++;if(!state.cards[k])state.cards[k]={box:1,due:addDays(1),kind:"fix",wrong:e.wrong,right:e.right,vi:e.whyVi||""}});save()}
function renderReview(){
  const all=Object.entries(state.cards); const due=all.filter(([,c])=>c.due<=today());
  const top=el("section",{class:"panel"},`<h2>Ôn từ và lỗi sai</h2><p class="muted" style="margin:0">Từ nhớ được sẽ lên hộp cao hơn và lâu hơn mới quay lại (1, 2, 4, 8, 16 ngày). Từ quên quay về hộp 1. Lên hộp cao, bài ôn khó dần: từ lật thẻ, sang nhìn nghĩa gõ từ, rồi nghe và gõ lại. Lỗi sai trong bài viết và hội thoại của bạn cũng được đưa vào đây.</p>`);
  const boxes=el("div",{class:"boxes"});
  for(let b=1;b<=5;b++)boxes.append(el("div",{class:"box"},`<b>${all.filter(([,c])=>c.box===b).length}</b>Hộp ${b}`));
  top.append(boxes); app.append(top);
  const card=el("section",{class:"panel"}); app.append(card);
  if(!all.length){card.innerHTML=`<p>Chưa có từ nào. Học phần Đọc của <a href="#lesson-u1">bài 1</a> để thêm từ.</p>`;return}
  if(!due.length){card.innerHTML=`<p>Hôm nay đã ôn xong. Quay lại ngày mai nhé.</p>`;daily().review=true;checkDaily();save();return}
  const queue=due.map(([w])=>w).sort(()=>Math.random()-.5); let i=0;
  function show(){
    if(i>=queue.length){card.innerHTML=`<p>Xong ${queue.length} thẻ hôm nay. <a href="#home">Về hành trình</a></p>`;daily().review=true;checkDaily();addXP(5);renderStat();return}
    const w=queue[i], c=state.cards[w];
    const plain=w.replace(/\(.*?\)/g,"").trim();
    // Desirable difficulty: the higher the box, the harder the recall task.
    const mode=c.kind==="fix"?"fix":c.box<=1?"flip":c.box===2?"type":"listen";
    const modeName={flip:"Lật thẻ",type:"Nhìn nghĩa, gõ từ tiếng Anh",listen:"Nghe và gõ lại",fix:"Sửa lỗi sai của chính bạn"}[mode];
    card.innerHTML=`<div class="label">${i+1}/${queue.length} · ${modeName}</div>`;
    const f=el("div",{class:"flash"});
    const back=el("div",{hidden:""});
    const row=el("div",{class:"row",style:"justify-content:center;margin-top:14px"});
    const no=el("button",{class:"btn",hidden:""},"Quên rồi"); const yes=el("button",{class:"btn primary",hidden:""},"Nhớ");
    const reveal=()=>{back.hidden=false;no.hidden=false;yes.hidden=false};
    no.onclick=()=>{c.box=1;c.due=addDays(0);queue.push(w);i++;save();show()};
    yes.onclick=()=>{c.box=Math.min(5,c.box+1);c.due=addDays(GAP[c.box]);i++;save();show()};
    if(mode==="flip"){
      f.innerHTML=`<div class="word">${esc(w)}</div><div class="ipa">${esc(c.ipa||"")}</div>`;
      const pb=el("button",{class:"btn small"},"Nghe");pb.onclick=()=>say(plain);f.append(pb);
      back.innerHTML=`<div style="font-size:20px;font-weight:700">${esc(c.vi)}</div><div class="muted"><i>${esc(c.ex)}</i></div>`;
      const flip=el("button",{class:"btn primary"},"Xem nghĩa");flip.onclick=()=>{flip.hidden=true;reveal()};row.append(flip);
    }else{
      if(mode==="type") f.innerHTML=`<div class="word" style="font-size:28px">${esc(c.vi)}</div><div class="muted">Gõ từ hoặc cụm tiếng Anh</div>`;
      if(mode==="listen"){f.innerHTML=`<div class="muted">Bấm nghe rồi gõ lại đúng những gì bạn nghe</div>`;const pb=el("button",{class:"btn primary"},"Nghe");pb.onclick=()=>say(c.ex||plain);f.append(pb)}
      if(mode==="fix") f.innerHTML=`<div class="muted">Câu này bạn từng viết sai. Viết lại cho đúng:</div><div style="font-size:20px;color:var(--bad)"><s>${esc(c.wrong)}</s></div>`;
      const target=mode==="listen"?(c.ex||plain):mode==="fix"?c.right:plain;
      const inp=el("input",{type:"text",id:"rv-"+i,autocomplete:"off",autocapitalize:"off",style:"width:100%;max-width:420px;text-align:center;font-size:18px"});
      const chk=el("button",{class:"btn primary"},"Kiểm tra");
      chk.onclick=()=>{const r=compareSpeech(target,inp.value);chk.hidden=true;inp.disabled=true;
        back.innerHTML=`<div class="said" style="font-size:18px">${r.html}</div><div class="score" style="color:${r.score>=80?"var(--good)":"var(--amber)"}">${r.score}%</div>${mode!=="fix"?`<div><b>${esc(w)}</b> <span class="ipa">${esc(c.ipa||"")}</span> · ${esc(c.vi)}</div>`:`<div class="muted">${esc(c.vi)}</div>`}`;
        reveal(); if(r.score>=80) yes.focus(); else no.focus(); say(target)};
      inp.onkeydown=e=>{if(e.key==="Enter"&&!chk.hidden)chk.click()};
      f.append(inp); row.append(chk); setTimeout(()=>inp.focus(),50);
    }
    f.append(back); row.append(no,yes); card.append(f,row);
  }
  show();
}

/* ===================== TALK (AI role-play) ===================== */
const SCENARIOS=[
  {id:"meet",t:"Gặp đối tác lần đầu",d:"Chào hỏi, giới thiệu, small talk",role:"Daniel, a friendly business partner from Singapore meeting the learner for the first time at a video call. Start with a greeting and a simple question."},
  {id:"report",t:"Họp báo cáo số liệu",d:"Đối tác hỏi về con số, bạn giải thích",role:"Ms. Sofia Ortiz, a client who asks the learner (a data analyst) to explain last month's sales report. Ask one question at a time about numbers, trends and reasons."},
  {id:"phone",t:"Gọi điện xin thông tin",d:"Hỏi file, xin gửi email, xác nhận",role:"a receptionist at a partner company. The learner is calling to ask for a data file. Answer the phone first."},
  {id:"small",t:"Nói chuyện giờ nghỉ",d:"Cuối tuần, đồ ăn, du lịch",role:"Mark, a friendly Australian colleague chatting during a coffee break. Ask about weekend, food, travel."},
  {id:"nego",t:"Thương lượng deadline",d:"Xin lùi hạn, đưa lý do, đề xuất",role:"a partner's project manager who wants the dashboard delivered in 3 days. The learner needs more time. Be firm but reasonable."},
  {id:"ielts",t:"Phỏng vấn IELTS Speaking",d:"Giám khảo hỏi Part 1 → Part 3",role:"an IELTS Speaking examiner. Run Part 1 (4 questions), then a Part 2 cue card, then 2 Part 3 questions. Ask one question per turn."}
];
let talk={sc:null,level:"A2",msgs:[]};
function renderTalk(){
  const p=el("section",{class:"panel"},`<h2>Giao tiếp với AI</h2><p class="muted" style="margin:0">Chọn tình huống. AI đóng vai người nước ngoài, nói ngắn, đúng trình độ bạn chọn, và sửa câu của bạn sau mỗi lượt.</p>`);

  const lv=el("div",{class:"row",style:"margin-top:12px"},`<span class="label">Độ khó</span>`);
  const sel=el("select",{id:"talk-level"},`<option value="A1">Rất dễ (A1)</option><option value="A2">Dễ (A2)</option><option value="B1">Vừa (B1)</option><option value="B2">Khó (B2)</option>`);

  const sc=el("div",{class:"scen"});
  SCENARIOS.forEach(s=>{const b=el("button",{class:talk.sc===s.id?"on":""},`<b>${s.t}</b><span>${s.d}</span>`);b.onclick=()=>{talk={sc:s.id,level:sel.value,msgs:[]};renderTalk2()};sc.append(b)});

function renderTalk2(){app.innerHTML="";renderTalk();aiTurn()}
function drawChat(){
  const c=document.getElementById("talkpanel"); if(!c) return;
  const s=SCENARIOS.find(x=>x.id===talk.sc);
  c.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${s.t}</h2></div>`;
  const chat=el("div",{class:"chat"});
  talk.msgs.forEach(m=>{
    if(m.role==="assistant"){const b=el("div",{class:"msg ai"},esc(m.text));const pb=el("button",{class:"icon-btn",style:"margin-top:6px","aria-label":"Nghe"},ICON_PLAY);pb.onclick=()=>say(m.text,{rate:talk.level<"B1"?0.85:1});b.append(pb);
      if(m.vi){const v=el("div",{class:"vi muted",style:"font-size:14px;margin-top:4px",hidden:""},esc(m.vi));const t=el("button",{class:"btn small",style:"margin:6px 0 0 6px"},"Dịch");t.onclick=()=>v.hidden=!v.hidden;b.append(t,v)}
      chat.append(b)}
    else{chat.append(el("div",{class:"msg me"},esc(m.text)));if(m.fix)chat.append(el("div",{class:"fix"},m.fix))}
  });
  if(talk.busy) chat.append(el("div",{class:"msg ai"},`<span class="spin"></span>`));
  c.append(chat);
  const comp=el("div",{class:"composer"});
  const ta=el("textarea",{id:"talk-input",placeholder:"Gõ hoặc bấm micro để nói tiếng Anh…"});
  ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};
  const sendB=el("button",{class:"btn primary"},"Gửi");sendB.onclick=send;
  let base="";
  const mic=micButton("Nói",()=>{base=ta.value.trim();return{onPartial:t=>{ta.value=(base+" "+t).trim()},onFinal:t=>{base=(base+(base?" ":"")+t.trim()).trim();ta.value=base},onEnd:()=>{if(ta.value.trim())send()}}});
  comp.append(ta);if(mic)comp.append(mic);comp.append(sendB);c.append(comp);
  const hint=el("p",{class:"muted",style:"font-size:13px;margin:8px 0 0"},"Không biết nói gì? Gõ tiếng Việt cũng được, AI sẽ chỉ cách nói bằng tiếng Anh.");c.append(hint);
  chat.scrollTop=chat.scrollHeight;
  function send(){const t=ta.value.trim();if(!t||talk.busy)return;talk.msgs.push({role:"user",text:t});ta.value="";aiTurn()}

async function aiTurn(){
  const s=SCENARIOS.find(x=>x.id===talk.sc); talk.busy=true; drawChat();
  const transcript=talk.msgs.map(m=>(m.role==="user"?"LEARNER: ":"YOU: ")+m.text).join("\n");
  const prompt=`Role-play for a Vietnamese adult learning English for work. You are ${s.role}
Speak at CEFR ${talk.level}: ${talk.level<"B1"?"very short simple sentences (max 2 sentences, under 20 words), common words only, like VOA Learning English":"natural but clear, max 3 sentences"}. Ask exactly one question per turn so the learner must answer.
Conversation so far:
${transcript||"(no messages yet, you start)"}
${talk.msgs.length?`Also check the LEARNER's last message. If it has errors or is written in Vietnamese, give the natural English version. If it is already good, set better to "".`:""}
Return ONLY JSON: {"reply":"your next line in English","vi":"Vietnamese translation of reply","better":"corrected/natural English for the learner's last message or empty","noteVi":"very short Vietnamese note on the main mistake, or empty"}`;
  try{
    const r=await ask(prompt,{cache:false,modelTier:"quick"});
    const last=talk.msgs[talk.msgs.length-1];
    if(last&&last.role==="user"&&r.better) addMistakes([{wrong:last.text,right:r.better,whyVi:r.noteVi}]);
    if(last&&last.role==="user"&&r.better) last.fix=`<b>Nói tự nhiên hơn:</b> ${esc(r.better)}${r.noteVi?`<br><span class="muted">${esc(r.noteVi)}</span>`:""}`;
    talk.msgs.push({role:"assistant",text:r.reply,vi:r.vi});
    if(talk.msgs.some(m=>m.role==="user")){state.stats.talk++;const dd=daily();dd.talk=(dd.talk||0)+1;checkDaily();save()}
    if(talk.msgs.filter(m=>m.role==="user").length===3) addXP(10);
    talk.busy=false; drawChat(); say(r.reply,{rate:talk.level<"B1"?0.85:1});
  }catch(e){talk.busy=false;drawChat();toast(aiError(e))}
}

/* ===================== IELTS ===================== */
const IELTS={
  w1:"The table shows the monthly sales (in thousand dollars) of a company's online store and its physical stores from January to June.\nOnline: Jan 120, Feb 135, Mar 150, Apr 170, May 190, Jun 210\nStores: Jan 200, Feb 195, Mar 190, Apr 150, May 160, Jun 165\nSummarise the information by selecting and reporting the main features, and make comparisons where relevant. Write at least 150 words.",
  w2:["Some people believe that working from home is better for employees, while others think it harms teamwork. Discuss both views and give your own opinion. Write at least 250 words.",
      "Many companies now use data to make decisions about their staff. Do the advantages of this outweigh the disadvantages? Write at least 250 words.",
      "Some people think that learning English is essential for career success, while others think technical skills are more important. Discuss both views and give your opinion. Write at least 250 words."],
  sp:[{p:"Part 1",q:"Do you work or are you a student? What do you like about your job?"},
      {p:"Part 1",q:"How do you usually spend your weekends?"},
      {p:"Part 2",q:"Describe a skill you learned at work. You should say: what the skill is, when you learned it, how you learned it, and explain why it is useful for you. (Nói 1–2 phút)"},
      {p:"Part 3",q:"Why do some adults find it difficult to learn new skills? What can companies do to help them?"}]
};
let ieltsTab="w2", w2i=0, spi=0;
function renderIelts(){
  const p=el("section",{class:"panel"},`<h2>Phòng luyện IELTS</h2><p class="muted" style="margin:0">AI chấm theo 4 tiêu chí của IELTS và cho band ước lượng. Đây là điểm tham khảo để biết mình đang ở đâu, không thay được giám khảo thật.</p>`);
  const tabs=el("div",{class:"skilltabs"});
  [["w1","Writing Task 1"],["w2","Writing Task 2"],["sp","Speaking"]].forEach(([k,n])=>{const b=el("button",{class:ieltsTab===k?"on":""},n);b.onclick=()=>{ieltsTab=k;render()};tabs.append(b)});
  p.append(tabs);app.append(p);
  if(!cap.sample){app.append(el("section",{class:"panel"},`<p class="hint">${aiError({code:"unavailable"})}</p>`));return}
  const q=el("section",{class:"panel"});app.append(q);
  if(ieltsTab==="sp") return speakingIelts(q);
  const task=ieltsTab==="w1"?IELTS.w1:IELTS.w2[w2i];
  q.append(el("div",{class:"hint",style:"white-space:pre-line;color:var(--ink)"},esc(task)));
  if(ieltsTab==="w2"){const nb=el("button",{class:"btn small",style:"margin-top:8px"},"Đổi đề khác");nb.onclick=()=>{w2i=(w2i+1)%IELTS.w2.length;render()};q.append(nb)}
  const {ta,cnt}=writeBox("ielts-"+ieltsTab+(ieltsTab==="w2"?w2i:""),ieltsTab==="w1"?150:250);ta.style.minHeight="280px";ta.style.marginTop="12px";
  const b=el("button",{class:"btn primary"},"Chấm band");const out=el("div",{class:"fb"});
  q.append(ta,el("div",{class:"row",style:"justify-content:space-between;margin-top:8px"},""),out);q.children[q.children.length-2].append(cnt,b);
  b.onclick=async()=>{
    const text=ta.value.trim();if(words(text).length<60){toast("Bài quá ngắn để chấm. Viết ít nhất 60 từ.");return}
    b.disabled=true;b.innerHTML=`<span class="spin"></span> Đang chấm…`;out.innerHTML="";
    try{
      const tk=ieltsTab==="w1"?"Task 1 (Task Achievement)":"Task 2 (Task Response)";
      const r=await ask(`You are an experienced IELTS Writing examiner. Grade strictly with the official public band descriptors for Academic Writing ${tk}. Use half bands. The candidate is Vietnamese; explain in Vietnamese.
Task: ${task}
Answer (${words(text).length} words):
"""${text}"""
Return ONLY JSON: {"overall":6.0,"criteria":[{"name":"${ieltsTab==="w1"?"Task Achievement":"Task Response"}","band":6,"commentVi":"..."},{"name":"Coherence & Cohesion","band":6,"commentVi":"..."},{"name":"Lexical Resource","band":6,"commentVi":"..."},{"name":"Grammatical Range & Accuracy","band":6,"commentVi":"..."}],"errors":[{"wrong":"...","right":"...","whyVi":"..."}] (up to 8 most important),"nextBandVi":"3 concrete things in Vietnamese to reach the next band","model":"a band 7.5 rewrite of the candidate's answer, same ideas"}`,{modelTier:"complex"});
      out.innerHTML=`<div class="row"><span class="score big" style="color:var(--accent)">${r.overall}</span><span class="muted">Band ước lượng</span></div>
        <div class="vocab">${r.criteria.map(c=>`<div class="vcard"><div class="t"><b style="font-size:15px">${esc(c.name)}</b><span class="score" style="font-size:22px">${c.band}</span></div><div class="muted" style="font-size:14px">${esc(c.commentVi)}</div></div>`).join("")}</div>
        ${(r.errors||[]).length?`<div><div class="label">Lỗi quan trọng</div>${r.errors.map(e=>`<div class="err" style="margin-top:6px"><s>${esc(e.wrong)}</s> → <ins>${esc(e.right)}</ins><div class="muted">${esc(e.whyVi)}</div></div>`).join("")}</div>`:""}
        <div><div class="label">Để lên band tiếp theo</div><p style="margin:4px 0;white-space:pre-line">${esc(r.nextBandVi)}</p></div>
        <details><summary style="cursor:pointer;font-weight:600">Xem bài mẫu band 7.5 viết lại từ ý của bạn</summary><div class="better" style="margin-top:8px;white-space:pre-line">${esc(r.model)}</div></details>`;
      state.stats.ielts++;addMistakes(r.errors);addXP(20);
    }catch(e){out.innerHTML=`<p class="muted">${aiError(e)}</p>`}
    b.disabled=false;b.textContent="Chấm lại";
  };
}
function speakingIelts(q){
  const it=IELTS.sp[spi];
  q.innerHTML=`<div class="label">${it.p} · câu ${spi+1}/${IELTS.sp.length}</div><p style="font-size:19px;font-weight:600;margin:6px 0 10px">${esc(it.q)}</p>`;
  const row=el("div",{class:"row"});
  const pb=el("button",{class:"btn small"},"Nghe câu hỏi");pb.onclick=()=>say(it.q.replace(/\(.*\)/,""),{rate:0.95});
  const nx=el("button",{class:"btn small"},"Câu khác");nx.onclick=()=>{spi=(spi+1)%IELTS.sp.length;render()};
  row.append(pb,nx);q.append(row);
  const ta=el("textarea",{id:"sp-ans",placeholder:cap.dict?"Bấm \"Trả lời bằng giọng nói\" và nói như đang thi. Lời bạn nói sẽ hiện ở đây.":"Gõ câu trả lời như bạn sẽ nói."});ta.style.marginTop="12px";
  const r2=el("div",{class:"row",style:"margin-top:8px"});let base="";
  const mic=micButton("Trả lời bằng giọng nói",()=>{base=ta.value.trim();return{onPartial:t=>ta.value=(base+" "+t).trim(),onFinal:t=>{base=(base+(base?" ":"")+t.trim()).trim();ta.value=base},onEnd:()=>{}}});
  const b=el("button",{class:"btn primary"},"Chấm câu trả lời");const out=el("div",{class:"fb"});
  if(mic)r2.append(mic);r2.append(b);q.append(ta,r2,out);
  b.onclick=async()=>{
    const text=ta.value.trim();if(words(text).length<15){toast("Trả lời dài hơn một chút nhé.");return}
    b.disabled=true;b.innerHTML=`<span class="spin"></span> Đang chấm…`;
    try{
      const r=await ask(`You are an IELTS Speaking examiner. The text is a speech-to-text transcript of a Vietnamese candidate's spoken answer, so ignore punctuation and do not judge pronunciation (say it cannot be judged from text). Question (${it.p}): ${it.q}
Transcript: """${text}"""
Return ONLY JSON: {"band":5.5,"fluencyVi":"comment on fluency & coherence in Vietnamese","lexicalVi":"comment on vocabulary","grammarVi":"comment on grammar","errors":[{"wrong":"...","right":"...","whyVi":"..."}] (max 5),"model":"a natural band 7 answer using the candidate's ideas, spoken style, ${it.p==="Part 2"?"about 180 words":"3-5 sentences"}","phrases":["3 useful phrases to memorise"]}`,{modelTier:"complex"});
      out.innerHTML=`<div class="row"><span class="score big" style="color:var(--accent)">${r.band}</span><span class="muted">Band ước lượng (chưa tính phát âm)</span></div>
        <div class="err"><b>Độ trôi chảy:</b> ${esc(r.fluencyVi)}</div><div class="err"><b>Từ vựng:</b> ${esc(r.lexicalVi)}</div><div class="err"><b>Ngữ pháp:</b> ${esc(r.grammarVi)}</div>
        ${(r.errors||[]).map(e=>`<div class="err"><s>${esc(e.wrong)}</s> → <ins>${esc(e.right)}</ins><div class="muted">${esc(e.whyVi)}</div></div>`).join("")}
        <div class="better"><div class="label">Câu trả lời mẫu</div>${esc(r.model)}</div>
        <div><div class="label">Cụm nên thuộc</div><ul style="margin:4px 0">${(r.phrases||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
      const lb=el("button",{class:"btn small"},"Nghe câu trả lời mẫu rồi nhại theo");lb.onclick=()=>say(r.model,{rate:0.9});out.append(lb);
      state.stats.ielts++;addMistakes(r.errors);addXP(15);
    }catch(e){out.innerHTML=`<p class="muted">${aiError(e)}</p>`}
    b.disabled=false;b.textContent="Chấm lại";
  };
}
