áng làm việc của một chuyên viên phân tích."},{"who":"Lan","en":"Exactly. And the evidence suggests the problem is growing. Errors have risen every quarter this year.","vi":"Chính xác. Và bằng chứng cho thấy vấn đề đang lớn dần. Năm nay quý nào số lỗi cũng tăng."},{"who":"Hoa","en":"But would new tools really solve it?","vi":"Nhưng công cụ mới có thật sự giải quyết được không?"},{"who":"Lan","en":"They would. Automated checks would not only catch errors earlier but also free up our analysts for real analysis.","vi":"Có ạ. Kiểm tra tự động không chỉ phát hiện lỗi sớm hơn mà còn giải phóng thời gian cho các chuyên viên làm phân tích thật sự."},{"who":"Daniel","en":"The pilot we ran with BrightMart did show strong results.","vi":"Dự án thử nghiệm chúng ta làm với BrightMart quả thật cho kết quả rất tốt."},{"who":"Lan","en":"It did. Errors in that project fell by seventy percent in two months. Isn't that worth the investment?","vi":"Đúng vậy. Lỗi trong dự án đó giảm bảy mươi phần trăm trong hai tháng. Chẳng phải điều đó đáng để đầu tư sao?"},{"who":"Hoa","en":"Those are impressive numbers. What exactly are you asking for?","vi":"Những con số rất ấn tượng. Cụ thể em đề xuất gì?"},{"who":"Lan","en":"Fifty thousand dollars for tools and training. It would not only pay for itself within a year but also protect our reputation.","vi":"Năm mươi nghìn đô cho công cụ và đào tạo. Khoản này không chỉ tự hoàn vốn trong vòng một năm mà còn bảo vệ uy tín của chúng ta."},{"who":"Hoa","en":"You've made a convincing case. Send me the full proposal, and I'll take it to the board.","vi":"Em đã đưa ra lập luận rất thuyết phục. Gửi chị đề xuất đầy đủ, chị sẽ trình lên hội đồng."}],"vocab":[{"w":"deserve","ipa":"/dɪˈzɜːrv/","vi":"xứng đáng","ex":"This idea deserves more attention."},{"w":"evidence","ipa":"/ˈɛvɪdəns/","vi":"bằng chứng","ex":"The evidence is very clear."},{"w":"automated","ipa":"/ˈɔːtəmeɪtɪd/","vi":"tự động","ex":"We use automated checks."},{"w":"pilot","ipa":"/ˈpaɪlət/","vi":"dự án thử nghiệm","ex":"The pilot lasted two months."},{"w":"worth","ipa":"/wɜːrθ/","vi":"đáng giá, đáng để","ex":"It's worth the money."},{"w":"pay for itself","ipa":"/peɪ fɔːr ɪtˈsɛlf/","vi":"tự hoàn vốn","ex":"The tool will pay for itself in a year."},{"w":"reputation","ipa":"/ˌrɛpjəˈteɪʃən/","vi":"uy tín, danh tiếng","ex":"Errors can hurt our reputation."},{"w":"convincing","ipa":"/kənˈvɪnsɪŋ/","vi":"có sức thuyết phục","ex":"She gave a convincing answer."}],"grammar":{"t":"Ngôn ngữ thuyết phục","d":"Để thuyết phục, hãy để số liệu nói trước: 'The evidence suggests…'. 'Not only… but also…' giúp bạn cộng thêm lợi ích thứ hai. Thêm do / does / did trước động từ để nhấn mạnh 'thật sự', nhất là khi đáp lại một ý nghi ngờ. Câu hỏi tu từ (không cần trả lời) khiến người nghe tự đi đến kết luận của bạn.","formula":["The evidence / The data suggests (that) + mệnh đề","S + not only + V… but also + V… (hai vế cùng dạng từ)","Nhấn mạnh: S + do / does / did + V nguyên mẫu","Câu hỏi tu từ: Isn't that worth…? / How much is … costing us?"],"ex":["The evidence suggests the problem is growing.","Automated checks would not only catch errors but also save time.","We do care about quality. (thật sự quan tâm)","The pilot did show strong results. (quả thật đã cho thấy)","Isn't that worth the investment?"],"mistakes":[{"wrong":"The pilot did showed strong results.","right":"The pilot did show strong results.","why":"Sau do / does / did dùng động từ nguyên mẫu."},{"wrong":"It not only saves time but saves also money.","right":"It not only saves time but also saves money.","why":"'But also' đi liền nhau, đứng trước vế thứ hai."},{"wrong":"The evidences suggest that…","right":"The evidence suggests that…","why":"'Evidence' là danh từ không đếm được, không thêm -s, động từ chia số ít."}]},"quiz":[{"q":"What share of client reports had errors last quarter?","o":["8%","18%","70%"],"a":1},{"q":"What does Hoa ask Lan to do at the end?","o":["Send the full proposal","Cut the budget","Run another pilot"],"a":0},{"q":"Which sentence uses emphatic 'do' correctly?","o":["We do cared about quality.","We does care about quality.","We do care about quality."],"a":2}],"practice":[{"s":"The evidence ___ that errors are increasing.","a":"suggests","alt":[],"hint":"Evidence không đếm được → động từ số ít."},{"s":"The tool would not only save time ___ also reduce errors.","a":"but","alt":[],"hint":"not only… ___ also…"},{"s":"We ___ care about quality, but the budget is small.","a":"do","alt":[],"hint":"Nhấn mạnh ở hiện tại với chủ ngữ we."},{"s":"The pilot ___ show strong results last year.","a":"did","alt":[],"hint":"Nhấn mạnh ở quá khứ."},{"s":"___ that worth fifty thousand dollars?","a":"Isn't","alt":[],"hint":"Câu hỏi tu từ phủ định với be."}],"speak":["How much is bad data costing us right now?","The evidence suggests the problem is growing.","Automated checks would not only catch errors earlier but also free up our analysts.","Isn't that worth the investment?"],"write":{"vi":"Bạn muốn công ty đầu tư vào một công cụ hoặc khóa đào tạo mới. Viết email thuyết phục giám đốc: nêu vấn đề hiện tại kèm số liệu, lợi ích (dùng not only… but also…), chi phí, và kết thúc bằng một câu hỏi tu từ cùng đề nghị cụ thể.","en":"You want your company to invest in a new tool or training. Write a persuasive email to your director: describe the current problem with numbers, the benefits (use not only… but also…), the cost, and finish with a rhetorical question and a clear request.","min":100},"summary":["Để số liệu dẫn dắt: The evidence suggests…","not only… but also… để cộng thêm lợi ích.","do / does / did + V nguyên mẫu để nhấn mạnh 'thật sự'.","Câu hỏi tu từ như Isn't that worth…? giúp người nghe tự đồng ý với bạn."]},{"id":"x10_3","ch":10,"level":"B2","after":"s_persuade","title":"Conditions in the contract","vi":"Đặt điều kiện: provided that, as long as","goals":["Sau bài này bạn có thể đọc và bàn các điều kiện trong một hợp đồng dịch vụ.","Sau bài này bạn có thể dùng provided that, as long as, on condition that và otherwise.","Sau bài này bạn có thể đặt điều kiện cho đối tác một cách rõ ràng nhưng lịch sự."],"story":[{"who":"James","en":"Thanks for joining, Lan and Mark. I'd like to go through the conditions in section four.","vi":"Cảm ơn Lan và Mark đã tham gia. Tôi muốn rà qua các điều kiện ở mục bốn."},{"who":"Mark","en":"Sure. Let's start with payment.","vi":"Được. Mình bắt đầu với phần thanh toán nhé."},{"who":"James","en":"We'll pay each invoice within thirty days, provided that the monthly report is delivered on time.","vi":"Chúng tôi sẽ thanh toán mỗi hóa đơn trong vòng ba mươi ngày, với điều kiện báo cáo hằng tháng được giao đúng hạn."},{"who":"Lan","en":"That's fine, as long as your data arrives by the fifth of each month.","vi":"Được thôi, miễn là dữ liệu của anh đến trước ngày mùng năm mỗi tháng."},{"who":"James","en":"Agreed. Otherwise, the report deadline moves back by the same number of days.","vi":"Đồng ý. Nếu không, hạn nộp báo cáo sẽ lùi lại đúng số ngày trễ đó."},{"who":"Mark","en":"And what about changes to the scope?","vi":"Còn thay đổi về phạm vi công việc thì sao?"},{"who":"James","en":"Small changes are free, as long as they take less than two days of work.","vi":"Thay đổi nhỏ thì miễn phí, miễn là chúng mất dưới hai ngày công."},{"who":"Lan","en":"We'd accept that on condition that larger changes are agreed in writing first.","vi":"Chúng tôi chấp nhận, với điều kiện những thay đổi lớn hơn phải được thống nhất bằng văn bản trước."},{"who":"James","en":"That's reasonable. Now, data security: you may only store our data on approved cloud servers.","vi":"Hợp lý. Giờ đến bảo mật dữ liệu: các anh chị chỉ được lưu dữ liệu của chúng tôi trên các máy chủ đám mây đã được phê duyệt."},{"who":"Lan","en":"Understood. Provided we get your list of approved servers this week, we'll be ready before the start date.","vi":"Đã rõ. Miễn là chúng tôi nhận được danh sách máy chủ được duyệt trong tuần này, chúng tôi sẽ sẵn sàng trước ngày bắt đầu."},{"who":"James","en":"I'll send it today. Finally, either side can end the contract with ninety days' notice.","vi":"Hôm nay tôi sẽ gửi. Cuối cùng, mỗi bên đều có thể chấm dứt hợp đồng nếu báo trước chín mươi ngày."},{"who":"Mark","en":"As long as the notice is given in writing, we're happy with that.","vi":"Miễn là thông báo được gửi bằng văn bản, chúng tôi đồng ý."}],"vocab":[{"w":"section","ipa":"/ˈsɛkʃən/","vi":"mục, phần (trong văn bản)","ex":"Please read section four."},{"w":"invoice","ipa":"/ˈɪnvɔɪs/","vi":"hóa đơn","ex":"We'll send the invoice tomorrow."},{"w":"provided (that)","ipa":"/prəˈvaɪdɪd ðæt/","vi":"với điều kiện là","ex":"We'll pay, provided that the work is done."},{"w":"as long as","ipa":"/æz ˈlɔːŋ æz/","vi":"miễn là","ex":"It's fine as long as you tell us."},{"w":"on condition that","ipa":"/ɑːn kənˈdɪʃən ðæt/","vi":"với điều kiện là (trang trọng)","ex":"We agree on condition that the price stays the same."},{"w":"otherwise","ipa":"/ˈʌðərwaɪz/","vi":"nếu không thì","ex":"Send it today. Otherwise, we'll be late."},{"w":"approved","ipa":"/əˈpruːvd/","vi":"đã được phê duyệt","ex":"Use only approved software."},{"w":"notice","ipa":"/ˈnoʊtɪs/","vi":"thông báo trước, thời gian báo trước","ex":"You must give thirty days' notice."}],"grammar":{"t":"Đặt điều kiện: provided that, as long as, on condition that, otherwise","d":"Các từ này giống 'if' nhưng mạnh hơn: chúng có nghĩa là 'chỉ khi điều này xảy ra'. 'As long as' thân mật nhất, 'provided (that)' dùng nhiều trong công việc, 'on condition that' trang trọng nhất, hay gặp trong hợp đồng. Giống mệnh đề 'if' loại 1, sau các từ này dùng thì hiện tại đơn dù nói về tương lai. 'Otherwise' đứng đầu câu sau, nghĩa là 'nếu không thì'.","formula":["Mệnh đề chính (will / can…) + provided (that) / as long as / on condition that + S + V (hiện tại đơn)","Có thể đảo lên đầu: As long as + S + V, mệnh đề chính.","Câu 1. Otherwise, + hậu quả (will / would…)"],"ex":["We'll pay within thirty days, provided that the report is on time.","As long as your data arrives by the fifth, we'll deliver on time.","We'd accept that on condition that changes are agreed in writing.","Send the list this week. Otherwise, we won't be ready.","So với: We'll pay if the report is on time. (nhẹ hơn, không nhấn mạnh 'chỉ khi')"],"mistakes":[{"wrong":"We'll pay provided that the report will be on time.","right":"We'll pay provided that the report is on time.","why":"Sau provided / as long as dùng hiện tại đơn, không dùng 'will'."},{"wrong":"We'll deliver on time as long the data arrives.","right":"We'll deliver on time as long as the data arrives.","why":"Cụm đầy đủ là 'as long as'."},{"wrong":"Send the data. If not, otherwise the report is late.","right":"Send the data. Otherwise, the report will be late.","why":"'Otherwise' đã có nghĩa 'nếu không', không cần thêm 'if not'."}]},"quiz":[{"q":"When will BrightMart pay each invoice?","o":["Within 30 days","Within 90 days","On the fifth"],"a":0},{"q":"How can either side end the contract?","o":["With a phone call","With ninety days' notice","After two days of work"],"a":1},{"q":"We'll start on time ___ we receive the server list this week.","o":["otherwise","unless","provided that"],"a":2}],"practice":[{"s":"We'll pay within 30 days, provided ___ the report is on time.","a":"that","alt":[],"hint":"provided ___ = với điều kiện là."},{"s":"Small changes are free as ___ as they take less than two days.","a":"long","alt":[],"hint":"as ___ as = miễn là."},{"s":"Send the data by the fifth. ___, the report will be late.","a":"Otherwise","alt":[],"hint":"Nếu không thì."},{"s":"We agree on ___ that changes are agreed in writing.","a":"condition","alt":[],"hint":"on ___ that (trang trọng)."},{"s":"As long as the data ___ (arrive) on time, we'll deliver on time.","a":"arrives","alt":[],"hint":"Sau as long as dùng hiện tại đơn."}],"speak":["We'll pay each invoice within thirty days, provided that the report is delivered on time.","That's fine, as long as your data arrives by the fifth.","Otherwise, the deadline moves back.","We'd accept that on condition that larger changes are agreed in writing."],"write":{"vi":"Bộ phận mua hàng của khách gửi bản nháp hợp đồng. Viết email phản hồi nêu ít nhất bốn điều kiện của bên bạn (thanh toán, dữ liệu đầu vào, thay đổi phạm vi, chấm dứt hợp đồng), dùng provided that, as long as, on condition that và otherwise.","en":"The client's procurement team has sent you a draft contract. Write a reply stating at least four conditions from your side (payment, input data, scope changes, ending the contract), using provided that, as long as, on condition that and otherwise.","min":100},"summary":["provided (that), as long as, on condition that = 'chỉ khi', mạnh hơn if.","Sau các từ này dùng hiện tại đơn, kể cả khi nói về tương lai.","as long as thân mật hơn; on condition that trang trọng nhất, hay có trong hợp đồng.","Otherwise đứng đầu câu sau, nghĩa là 'nếu không thì'."]},{"id":"s_tactful","ch":10,"level":"B2","title":"Mistakes were made","vi":"Nói khéo bằng câu bị động","goals":["Sau bài này bạn có thể giải thích một lỗi với khách hàng mà không đổ lỗi cho ai.","Sau bài này bạn có thể dùng câu bị động thì quá khứ và hiện tại hoàn thành.","Sau bài này bạn có thể nói giảm, nói tránh với It seems that…, It appears that…."],"story":[{"who":"Sofia","en":"Lan, our finance team says the March figures in your report don't match our records.","vi":"Lan, bộ phận tài chính của chúng tôi nói số liệu tháng Ba trong báo cáo của chị không khớp với sổ sách của chúng tôi."},{"who":"Lan","en":"Thank you for flagging this, Sofia. We've looked into it, and it seems that some sales were counted twice.","vi":"Cảm ơn chị đã báo vấn đề này, Sofia. Chúng tôi đã kiểm tra, và có vẻ là một số giao dịch bán hàng đã bị tính hai lần."},{"who":"Sofia","en":"Counted twice? How did that happen?","vi":"Bị tính hai lần? Sao lại thế được?"},{"who":"Lan","en":"It appears that a new data file was uploaded on the twentieth, and some March sales were included in it again.","vi":"Có vẻ là một tệp dữ liệu mới đã được tải lên ngày hai mươi, và một số giao dịch tháng Ba bị đưa vào tệp đó thêm lần nữa."},{"who":"Sofia","en":"Who uploaded it? Was it someone from your team?","vi":"Ai đã tải nó lên? Có phải người bên nhóm chị không?"},{"who":"Lan","en":"I'd rather not point fingers. The file came through the normal process, but our checks didn't catch the duplicates, and that's our responsibility.","vi":"Tôi không muốn đổ lỗi cho ai. Tệp đến theo quy trình bình thường, nhưng khâu kiểm tra của chúng tôi đã không phát hiện các bản ghi trùng, và đó là trách nhiệm của chúng tôi."},{"who":"Sofia","en":"I appreciate that. Has the report been corrected?","vi":"Tôi cảm kích điều đó. Báo cáo đã được sửa chưa?"},{"who":"Lan","en":"Yes. The duplicate records have been removed, and all March totals have been recalculated.","vi":"Rồi ạ. Các bản ghi trùng đã được xóa, và mọi con số tổng tháng Ba đã được tính lại."},{"who":"Sofia","en":"So what's the real figure?","vi":"Vậy con số thật là bao nhiêu?"},{"who":"Lan","en":"Total sales were slightly lower than we reported, by about two percent. The overall trend hasn't changed.","vi":"Tổng doanh số thấp hơn một chút so với chúng tôi đã báo cáo, khoảng hai phần trăm. Xu hướng chung không thay đổi."},{"who":"Sofia","en":"That's a relief. What are you doing to prevent this from happening again?","vi":"Thế thì nhẹ nhõm rồi. Các chị đang làm gì để chuyện này không lặp lại?"},{"who":"Lan","en":"A new duplicate check has been added to the pipeline, and every upload is now reviewed by a second analyst.","vi":"Một bước kiểm tra trùng lặp mới đã được thêm vào quy trình xử lý dữ liệu, và mỗi lần tải lên giờ đều được một chuyên viên thứ hai rà soát."},{"who":"Sofia","en":"Good. Please send me a short written explanation for our finance team.","vi":"Tốt. Chị gửi cho tôi một bản giải thích ngắn bằng văn bản cho bộ phận tài chính nhé."}],"vocab":[{"w":"flag","ipa":"/flæɡ/","vi":"báo, chỉ ra (một vấn đề)","ex":"Thanks for flagging this issue."},{"w":"look into","ipa":"/lʊk ˈɪntuː/","vi":"tìm hiểu, điều tra","ex":"We're looking into the problem."},{"w":"it appears that","ipa":"/ɪt əˈpɪrz ðæt/","vi":"có vẻ là","ex":"It appears that the file was wrong."},{"w":"duplicate","ipa":"/ˈduːplɪkət/","vi":"bản trùng lặp; trùng lặp","ex":"We removed the duplicate records."},{"w":"point fingers","ipa":"/pɔɪnt ˈfɪŋɡərz/","vi":"đổ lỗi, chỉ trích người khác","ex":"Let's fix it, not point fingers."},{"w":"recalculate","ipa":"/riːˈkælkjəleɪt/","vi":"tính lại","ex":"All totals were recalculated."},{"w":"overall","ipa":"/ˌoʊvərˈɔːl/","vi":"tổng thể, nói chung","ex":"The overall trend is up."},{"w":"prevent","ipa":"/prɪˈvɛnt/","vi":"ngăn chặn","ex":"How can we prevent errors?"}],"grammar":{"t":"Câu bị động quá khứ và hoàn thành để nói khéo","d":"Khi có lỗi, câu chủ động thường gọi tên người làm sai ('Your team uploaded a bad file') và dễ gây căng thẳng. Câu bị động đưa sự việc lên đầu và giấu người làm: 'A file was uploaded twice'. Kết hợp với It seems / appears that… và các từ giảm nhẹ (slightly, about) để lời nói mềm hơn. Tuy vậy, khi lỗi là của mình, vẫn nên nhận trách nhiệm rõ ràng.","formula":["Bị động quá khứ: S + was / were + V3 (Some sales were counted twice.)","Bị động hiện tại hoàn thành: S + has / have been + V3 (The records have been removed.)","Nói giảm: It seems / appears that + mệnh đề; slightly, about, a little"],"ex":["Chủ động: Your team uploaded the file twice. → Bị động: The file was uploaded twice.","Mistakes were made in the March report.","The report has been corrected.","A new check has been added to the pipeline.","It seems that some sales were counted twice."],"mistakes":[{"wrong":"The data was upload twice.","right":"The data was uploaded twice.","why":"Câu bị động cần V3 (uploaded), không dùng động từ nguyên mẫu."},{"wrong":"The report has corrected.","right":"The report has been corrected.","why":"Thiếu 'been' thì câu thành chủ động và sai nghĩa, như thể bản báo cáo tự đi sửa một thứ gì đó."},{"wrong":"Your team made a mistake in the file.","right":"It seems that a mistake was made in the file.","why":"Nói thẳng 'your team' dễ làm khách mất lòng; bị động + it seems tập trung vào sự việc."}]},"quiz":[{"q":"What was wrong with the March figures?","o":["Some stores were missing","The dates were wrong","Some sales were counted twice"],"a":2},{"q":"How much lower were the real total sales?","o":["About 20 percent","About 2 percent","They didn't change"],"a":1},{"q":"Which sentence is the most tactful?","o":["It seems that a duplicate file was uploaded.","You sent us a bad file.","Your team made a mistake."],"a":0}],"practice":[{"s":"Some sales ___ counted twice.","a":"were","alt":[],"hint":"Bị động quá khứ, chủ ngữ số nhiều."},{"s":"The duplicate records have ___ removed.","a":"been","alt":[],"hint":"Bị động hiện tại hoàn thành: have ___ + V3."},{"s":"It ___ that the file was uploaded twice.","a":"seems","alt":["appears"],"hint":"Nói giảm: It ___ that…"},{"s":"All March totals have been ___ (recalculate).","a":"recalculated","alt":[],"hint":"V3 của recalculate."},{"s":"A new check ___ been added to the pipeline.","a":"has","alt":[],"hint":"Chủ ngữ số ít: ___ been + V3."}],"speak":["Thank you for flagging this.","It seems that some sales were counted twice.","The duplicate records have been removed.","A new duplicate check has been added to the pipeline."],"write":{"vi":"Báo cáo tuần trước gửi khách hàng có số liệu sai. Viết email giải thích cho bộ phận tài chính của khách: chuyện gì đã xảy ra (dùng bị động, không đổ lỗi cho ai), những gì đã được sửa, mức độ ảnh hưởng, và biện pháp phòng ngừa đã được áp dụng.","en":"Last week's report to your client had wrong figures. Write an email to the client's finance team explaining what happened (use the passive and don't blame anyone), what has been corrected, how big the impact is, and what has been done to prevent it from happening again.","min":100},"summary":["Bị động quá khứ: was / were + V3; hiện tại hoàn thành: has / have been + V3.","Bị động giúp tập trung vào sự việc, không gọi tên người làm sai.","Thêm It seems / appears that…, slightly, about để lời nói mềm hơn.","Khéo léo nhưng vẫn nhận trách nhiệm và nói rõ cách khắc phục."]},{"id":"s_deduce","ch":10,"level":"B2","title":"It must be a data error","vi":"Động từ khuyết thiếu để suy đoán","goals":["Sau bài này bạn có thể suy đoán nguyên nhân của một vấn đề với mức độ chắc chắn khác nhau.","Sau bài này bạn có thể dùng must / might / can't + be cho hiện tại.","Sau bài này bạn có thể dùng must have / might have / can't have + V3 cho quá khứ."],"story":[{"who":"Mark","en":"Have you seen this? BrightMart's online sales dropped by forty percent yesterday.","vi":"Mọi người thấy chưa? Doanh số trực tuyến của BrightMart hôm qua giảm bốn mươi phần trăm."},{"who":"Minh","en":"Forty percent in one day? That can't be right. It must be a data error.","vi":"Bốn mươi phần trăm trong một ngày? Không thể đúng được. Chắc chắn là lỗi dữ liệu."},{"who":"Lan","en":"It might be. Let's check before we panic. Has all the data loaded?","vi":"Có thể. Kiểm tra trước đã rồi hãy hoảng. Dữ liệu đã tải lên đủ chưa?"},{"who":"Minh","en":"Yes, all the files are here. So the pipeline can't have failed.","vi":"Rồi ạ, đủ hết các tệp. Vậy quy trình xử lý dữ liệu không thể bị lỗi được."},{"who":"Mark","en":"Could it be a holiday? People might be shopping in stores instead.","vi":"Có thể là ngày lễ không? Có lẽ mọi người mua ở cửa hàng thay vì mua trên mạng."},{"who":"Lan","en":"It can't be a holiday. Yesterday was a normal Tuesday.","vi":"Không thể là ngày lễ được. Hôm qua là thứ Ba bình thường."},{"who":"Minh","en":"Look at this. Mobile sales are almost zero, but desktop sales look normal.","vi":"Xem này. Doanh số trên điện thoại gần như bằng không, nhưng trên máy tính thì vẫn bình thường."},{"who":"Lan","en":"Interesting. The mobile app must have stopped working. Or the tracking code might have broken after an update.","vi":"Thú vị đấy. Ứng dụng di động chắc chắn đã ngừng hoạt động. Hoặc có thể mã theo dõi đã bị hỏng sau một bản cập nhật."},{"who":"Mark","en":"BrightMart released a new version of the app on Monday. That must be the reason.","vi":"BrightMart phát hành phiên bản ứng dụng mới hôm thứ Hai. Chắc chắn đó là nguyên nhân."},{"who":"Minh","en":"If customers couldn't pay, they must have complained on social media.","vi":"Nếu khách hàng không thanh toán được, chắc chắn họ đã phàn nàn trên mạng xã hội."},{"who":"Lan","en":"Good thinking. Let's see… Yes, lots of users say the payment page won't load.","vi":"Ý hay. Để xem nào… Đúng rồi, rất nhiều người dùng nói trang thanh toán không tải được."},{"who":"Mark","en":"So the sales weren't lost in our data. Customers just couldn't buy anything.","vi":"Vậy doanh số không bị mất trong dữ liệu của chúng ta. Chỉ là khách hàng không mua được gì."},{"who":"Lan","en":"Exactly. I'll call Sofia now. Her IT team must be working on it already, but they need our numbers.","vi":"Chính xác. Tôi sẽ gọi Sofia ngay. Nhóm IT của chị ấy chắc hẳn đang xử lý rồi, nhưng họ cần số liệu của chúng ta."}],"vocab":[{"w":"panic","ipa":"/ˈpænɪk/","vi":"hoảng loạn","ex":"Don't panic. Let's check the data."},{"w":"load","ipa":"/loʊd/","vi":"tải (dữ liệu, trang web)","ex":"The page won't load."},{"w":"desktop","ipa":"/ˈdɛsktɑːp/","vi":"máy tính để bàn","ex":"Desktop sales look normal."},{"w":"tracking code","ipa":"/ˈtrækɪŋ koʊd/","vi":"mã theo dõi (trên web, ứng dụng)","ex":"The tracking code is broken."},{"w":"release","ipa":"/rɪˈliːs/","vi":"phát hành","ex":"They released a new app on Monday."},{"w":"payment page","ipa":"/ˈpeɪmənt peɪdʒ/","vi":"trang thanh toán","ex":"The payment page is very slow."},{"w":"social media","ipa":"/ˈsoʊʃəl ˈmiːdiə/","vi":"mạng xã hội","ex":"Customers complained on social media."},{"w":"Good thinking.","ipa":"/ɡʊd ˈθɪŋkɪŋ/","vi":"Ý hay đấy. (khen người nghĩ ra cách)","ex":"Good thinking, Minh!"}],"grammar":{"t":"Suy đoán với must / might / can't","d":"Khi chưa chắc chắn 100%, người bản xứ dùng động từ khuyết thiếu để cho biết mình chắc đến đâu. 'Must' = gần như chắc chắn đúng; 'might / may / could' = có thể đúng; 'can't' = gần như chắc chắn không đúng. Suy đoán về hiện tại dùng + be / V; suy đoán về quá khứ dùng + have + V3.","formula":["Hiện tại: must / might / can't + be (+ tính từ / danh từ / V-ing)","Quá khứ: must / might / can't + have + V3","Mức độ: must (≈ 90%) > might / may / could (≈ 50%) > can't (≈ 0%)"],"ex":["It must be a data error. (gần như chắc)","People might be shopping in stores. (có thể)","It can't be a holiday. (chắc chắn không)","The app must have stopped working. (quá khứ, gần như chắc)","The pipeline can't have failed. (quá khứ, chắc chắn không)"],"mistakes":[{"wrong":"It mustn't be a holiday.","right":"It can't be a holiday.","why":"'Mustn't' nghĩa là 'cấm'; suy đoán phủ định phải dùng 'can't'."},{"wrong":"The app must stopped working.","right":"The app must have stopped working.","why":"Suy đoán về quá khứ: must + have + V3."},{"wrong":"It might has broken.","right":"It might have broken.","why":"Sau động từ khuyết thiếu luôn dùng 'have', không dùng 'has'."}]},"quiz":[{"q":"How much did BrightMart's online sales drop?","o":["40%","14%","4%"],"a":0},{"q":"What was the real cause of the drop?","o":["A public holiday","The data pipeline failed","The mobile payment page didn't load"],"a":2},{"q":"Yesterday was a normal Tuesday. It ___ a holiday.","o":["mustn't be","can't be","might be"],"a":1}],"practice":[{"s":"Forty percent in one day? That ___ be right.","a":"can't","alt":["cannot"],"hint":"Chắc chắn không đúng."},{"s":"All the files are here, so the pipeline can't ___ failed.","a":"have","alt":[],"hint":"Suy đoán quá khứ: can't ___ + V3."},{"s":"Mobile sales are zero. The app must have ___ (stop) working.","a":"stopped","alt":[],"hint":"V3 của stop."},{"s":"I'm not sure. The tracking code ___ have broken.","a":"might","alt":["may","could"],"hint":"Có thể (khoảng 50%)."},{"s":"She isn't answering. She ___ be in a meeting.","a":"must","alt":["might","may","could"],"hint":"Gần như chắc chắn (ví dụ: lịch của cô ấy ghi đang họp)."}],"speak":["That can't be right. It must be a data error.","It can't be a holiday.","The mobile app must have stopped working.","The tracking code might have broken after an update."],"write":{"vi":"Số người dùng trên dashboard của khách hàng đột ngột giảm một nửa trong một ngày. Viết email gửi khách: mô tả con số, những nguyên nhân đã loại trừ (can't be / can't have), nguyên nhân có thể (might have) và nguyên nhân gần như chắc chắn (must have), kèm bước tiếp theo.","en":"The number of users on your client's dashboard suddenly fell by half in one day. Write an email to the client: describe the numbers, the causes you have ruled out (can't be / can't have), possible causes (might have), the most likely cause (must have), and the next steps.","min":100},"summary":["must = gần như chắc chắn; might / may / could = có thể; can't = chắc chắn không.","Hiện tại: modal + be / V; quá khứ: modal + have + V3.","Phủ định khi suy đoán dùng can't, không dùng mustn't.","Sau modal luôn là 'have', không bao giờ 'has'."]},{"id":"s_summary","ch":11,"level":"B2","title":"Writing an executive summary","vi":"Viết bản tóm tắt cho lãnh đạo","goals":["Sau bài này bạn có thể viết câu chủ đề (topic sentence) nêu rõ ý chính ngay đầu đoạn.","Sau bài này bạn có thể sắp xếp bản tóm tắt theo ba phần: phát hiện, hệ quả, đề xuất.","Sau bài này bạn có thể cắt bỏ cụm từ thừa để câu văn ngắn gọn, rõ ràng."],"story":[{"who":"Mark","en":"Lan, the directors won't read twenty pages. Can you boil your analysis down to one?","vi":"Lan ơi, các giám đốc sẽ không đọc hai mươi trang đâu. Em rút gọn bản phân tích xuống còn một trang được không?"},{"who":"Lan","en":"Sure. But where should I start?","vi":"Được ạ. Nhưng em nên bắt đầu từ đâu?"},{"who":"Mark","en":"Start with the bottom line. Every paragraph needs a clear topic sentence.","vi":"Bắt đầu bằng điều quan trọng nhất. Mỗi đoạn cần một câu chủ đề rõ ràng."},{"who":"Lan","en":"So the first sentence gives the main point, and the rest supports it?","vi":"Vậy câu đầu tiên nêu ý chính, và các câu còn lại bổ trợ cho nó ạ?"},{"who":"Mark","en":"Exactly. Then put everything under three headings: findings, implications and recommendations.","vi":"Chính xác. Sau đó xếp mọi thứ vào ba đề mục: phát hiện, hệ quả và đề xuất."},{"who":"Lan","en":"Okay. Key finding: online sales grew by 18%, while store sales fell by 6%.","vi":"Được. Phát hiện chính: doanh số online tăng 18%, trong khi doanh số tại cửa hàng giảm 6%."},{"who":"Mark","en":"Good. Now, what's the implication? Why should the directors care?","vi":"Tốt. Giờ hệ quả là gì? Tại sao các giám đốc nên quan tâm?"},{"who":"Lan","en":"The implication is that we are spending too much on stores that customers visit less and less.","vi":"Hệ quả là chúng ta đang chi quá nhiều cho những cửa hàng mà khách ngày càng ít đến."},{"who":"Mark","en":"Nice. And keep it concise. Cut phrases like 'it is important to note that'.","vi":"Hay đấy. Và viết cho súc tích. Bỏ những cụm như 'điều quan trọng cần lưu ý là'."},{"who":"Lan","en":"Got it. 'Due to the fact that' simply becomes 'because'.","vi":"Em hiểu rồi. 'Do thực tế là' chỉ cần viết là 'vì'."},{"who":"Mark","en":"Right. Finally, your recommendations should be specific and actionable.","vi":"Đúng. Cuối cùng, các đề xuất phải cụ thể và làm được ngay."},{"who":"Lan","en":"We recommend moving 15% of the store budget to online channels by the third quarter.","vi":"Chúng tôi đề xuất chuyển 15% ngân sách cửa hàng sang các kênh online trước quý ba."},{"who":"Mark","en":"Perfect. One page, three sections, no filler. They'll love it.","vi":"Hoàn hảo. Một trang, ba phần, không chữ thừa. Họ sẽ rất thích."}],"vocab":[{"w":"executive summary","ipa":"/ɪɡˈzɛkjətɪv ˈsʌməri/","vi":"bản tóm tắt cho lãnh đạo","ex":"The executive summary is on page one."},{"w":"boil down (to)","ipa":"/bɔɪl daʊn/","vi":"rút gọn, cô đọng lại","ex":"Can you boil it down to three points?"},{"w":"bottom line","ipa":"/ˈbɑːtəm laɪn/","vi":"điểm mấu chốt, kết luận chính","ex":"The bottom line is that costs are too high."},{"w":"topic sentence","ipa":"/ˈtɑːpɪk ˈsɛntəns/","vi":"câu chủ đề (câu nêu ý chính của đoạn)","ex":"Start each paragraph with a topic sentence."},{"w":"finding","ipa":"/ˈfaɪndɪŋ/","vi":"phát hiện, kết quả phân tích","ex":"Our main finding is surprising."},{"w":"implication","ipa":"/ˌɪmplɪˈkeɪʃən/","vi":"hệ quả, ý nghĩa kéo theo","ex":"What are the implications for our budget?"},{"w":"concise","ipa":"/kənˈsaɪs/","vi":"ngắn gọn, súc tích","ex":"Keep your email short and concise."},{"w":"actionable","ipa":"/ˈækʃənəbəl/","vi":"có thể thực hiện ngay","ex":"We need actionable recommendations."}],"grammar":{"t":"Viết súc tích: câu chủ đề và bố cục Phát hiện – Hệ quả – Đề xuất","d":"Lãnh đạo thường chỉ đọc một trang, nên ý chính phải nằm ngay ở câu đầu của mỗi đoạn (câu chủ đề). Bản tóm tắt chuẩn đi theo ba bước: dữ liệu cho thấy gì (phát hiện), điều đó có ý nghĩa gì (hệ quả), và nên làm gì (đề xuất). Câu nào không giúp người đọc ra quyết định thì bỏ.","formula":["Đoạn văn: Câu chủ đề (ý chính) + 2–3 câu bổ trợ (số liệu, lý do)","Phát hiện: The data shows that… / X rose/fell by + %","Hệ quả: This means that… / This suggests that… / The implication is that…","Đề xuất: We recommend + V-ing… / We recommend that + S + V…"],"ex":["Dài: Due to the fact that sales fell → Gọn: Because sales fell","Dài: It is important to note that costs rose → Gọn: Costs rose","Dài: In the event that the budget is cut → Gọn: If the budget is cut","Câu chủ đề: Online channels are now our main source of growth.","Đề xuất cụ thể: We recommend hiring two analysts by June. (không viết: We should do more things.)"],"mistakes":[{"wrong":"We recommend to move the budget online.","right":"We recommend moving the budget online.","why":"Sau recommend dùng V-ing hoặc mệnh đề that, không dùng to + V."},{"wrong":"In this report, I will talk about many things about sales.","right":"Online sales grew by 18% and are now our main source of growth.","why":"Câu chủ đề phải nêu ý chính ngay, không giới thiệu chung chung."},{"wrong":"Due to the fact that the sales is decrease…","right":"Because sales decreased…","why":"Viết gọn bằng 'because'; sales là số nhiều và cần chia động từ đúng thì."}]},"quiz":[{"q":"Why does Mark want a one-page summary?","o":["The directors won't read twenty pages","The printer is broken","Lan's analysis is wrong"],"a":0},{"q":"What does Lan recommend?","o":["Closing all the stores","Hiring more store staff","Moving 15% of the store budget online"],"a":2},{"q":"Which sentence is the most concise?","o":["Due to the fact that costs rose, profit fell.","Profit fell because costs rose.","It is important to note that profit fell owing to the fact that costs rose."],"a":1}],"practice":[{"s":"We recommend ___ 15% of the budget to online channels.","a":"moving","alt":["shifting","transferring"],"hint":"recommend + V-ing"},{"s":"Store sales fell by 6%. This ___ that customers prefer to shop online.","a":"suggests","alt":["means","shows"],"hint":"Câu nêu hệ quả: điều này cho thấy…"},{"s":"Write 'because' instead of 'due to the ___ that'.","a":"fact","alt":[],"hint":"Cụm dài dòng: due to the … that"},{"s":"The first sentence of a paragraph, the ___ sentence, gives the main idea.","a":"topic","alt":[],"hint":"Câu chủ đề"},{"s":"Our key ___ is that online sales grew by 18%.","a":"finding","alt":[],"hint":"Phát hiện chính (danh từ)"}],"speak":["Every paragraph needs a clear topic sentence.","Key finding: online sales grew by 18%, while store sales fell by 6%.","The implication is that we are spending too much on stores that customers visit less and less.","We recommend moving 15% of the store budget to online channels by the third quarter."],"write":{"vi":"Bạn vừa phân tích dữ liệu khách hàng quý trước. Hãy viết một bản tóm tắt cho lãnh đạo gồm ba phần: một phát hiện chính có số liệu, hệ quả của nó, và một đề xuất cụ thể. Mỗi đoạn bắt đầu bằng câu chủ đề.","en":"You have just analysed last quarter's customer data. Write an executive summary with three parts: one key finding with numbers, its implication, and one specific recommendation. Start each paragraph with a topic sentence.","min":100},"summary":["Câu chủ đề nêu ý chính ngay đầu đoạn; các câu sau chỉ bổ trợ bằng số liệu và lý do.","Bố cục tóm tắt: Findings (phát hiện) → Implications (hệ quả) → Recommendations (đề xuất).","Cắt cụm thừa: due to the fact that → because; it is important to note that → bỏ.","recommend + V-ing hoặc recommend that + S + V; đề xuất phải cụ thể, có thời hạn."]},{"id":"s_linkers","ch":11,"level":"B2","title":"However, therefore, although","vi":"Từ nối","goals":["Sau bài này bạn có thể dùng although, despite, whereas, however để nói ý tương phản.","Sau bài này bạn có thể dùng therefore, as a result để nói kết quả.","Sau bài này bạn có thể viết một đoạn báo cáo so sánh hai khu vực mạch lạc, đúng dấu câu."],"story":[{"who":"Lan","en":"Mark, can you check my paragraph comparing the North and South regions?","vi":"Mark, anh xem giúp em đoạn văn so sánh khu vực miền Bắc và miền Nam được không?"},{"who":"Mark","en":"Sure. Read me the first sentence.","vi":"Được. Đọc anh nghe câu đầu đi."},{"who":"Lan","en":"Sales in the North rose by 12%, whereas sales in the South stayed flat.","vi":"Doanh số miền Bắc tăng 12%, trong khi doanh số miền Nam đi ngang."},{"who":"Mark","en":"Good use of 'whereas'. It puts two facts side by side.","vi":"Dùng 'whereas' tốt đấy. Nó đặt hai sự thật cạnh nhau để so sánh."},{"who":"Lan","en":"Next: Although the South has more stores, it made less profit.","vi":"Tiếp theo: Mặc dù miền Nam có nhiều cửa hàng hơn, nó lại có lợi nhuận thấp hơn."},{"who":"Mark","en":"Nice. And what about the marketing budget?","vi":"Hay. Còn ngân sách marketing thì sao?"},{"who":"Lan","en":"Despite a bigger marketing budget, the South didn't attract many new customers.","vi":"Dù có ngân sách marketing lớn hơn, miền Nam không thu hút được nhiều khách hàng mới."},{"who":"Mark","en":"Correct. 'Despite' is followed by a noun, so never write 'despite it had'.","vi":"Đúng. Sau 'despite' là một danh từ, nên đừng bao giờ viết 'despite it had'."},{"who":"Lan","en":"Then: Prices in the South are higher. As a result, many customers chose competitors.","vi":"Sau đó: Giá ở miền Nam cao hơn. Kết quả là nhiều khách hàng đã chọn đối thủ cạnh tranh."},{"who":"Mark","en":"Great. And how do you finish?","vi":"Tuyệt. Còn em kết đoạn thế nào?"},{"who":"Lan","en":"Store costs in the South are high. However, the region still has strong potential.","vi":"Chi phí cửa hàng ở miền Nam cao. Tuy nhiên, khu vực này vẫn có tiềm năng lớn."},{"who":"Mark","en":"So you're saying we should fix prices before we close any stores?","vi":"Vậy ý em là chúng ta nên điều chỉnh giá trước khi đóng cửa hàng nào?"},{"who":"Lan","en":"Exactly. Therefore, we recommend a price review in the South first.","vi":"Chính xác. Vì vậy, chúng tôi đề xuất rà soát giá ở miền Nam trước."}],"vocab":[{"w":"whereas","ipa":"/wɛrˈæz/","vi":"trong khi (so sánh hai điều trái ngược)","ex":"Sales rose in the North, whereas they fell in the South."},{"w":"although","ipa":"/ɔːlˈðoʊ/","vi":"mặc dù","ex":"Although it rained, the store was busy."},{"w":"despite","ipa":"/dɪˈspaɪt/","vi":"mặc dù, bất chấp (+ danh từ)","ex":"Despite the rain, the store was busy."},{"w":"therefore","ipa":"/ˈðɛrfɔːr/","vi":"vì vậy, do đó (trang trọng)","ex":"Costs rose. Therefore, we raised prices."},{"w":"as a result","ipa":"/æz ə rɪˈzʌlt/","vi":"kết quả là","ex":"The server failed. As a result, the report was late."},{"w":"stay flat","ipa":"/steɪ flæt/","vi":"đi ngang, không tăng không giảm","ex":"Revenue stayed flat in March."},{"w":"competitor","ipa":"/kəmˈpɛtɪtər/","vi":"đối thủ cạnh tranh","ex":"Our main competitor cut its prices."},{"w":"potential","ipa":"/pəˈtɛnʃəl/","vi":"tiềm năng","ex":"The region has strong potential."}],"grammar":{"t":"Từ nối chỉ tương phản và kết quả","d":"Từ nối giúp người đọc thấy quan hệ giữa các ý: trái ngược nhau hay ý này dẫn đến ý kia. Điều quan trọng là mỗi từ đi với một cấu trúc riêng: có từ cần cả mệnh đề (S + V), có từ chỉ đi với danh từ, có từ phải đứng đầu câu mới và có dấu phẩy.","formula":["Tương phản trong 1 câu: Although + S + V, S + V.  /  S + V, whereas + S + V.","Tương phản với danh từ: Despite + danh từ / V-ing, S + V.","Nối 2 câu: S + V. However, S + V.","Kết quả: S + V. Therefore, / As a result, S + V."],"ex":["Although the South has more stores, it made less profit.","Despite higher costs, the South stayed profitable. (= Despite having higher costs…)","The North grew quickly, whereas the South stayed flat.","Costs are high. However, the region has strong potential.","Prices were too high. As a result, customers chose competitors."],"mistakes":[{"wrong":"Although sales rose, but profit fell.","right":"Although sales rose, profit fell.","why":"Tiếng Việt nói 'Mặc dù… nhưng…', còn tiếng Anh chỉ dùng MỘT từ: although HOẶC but."},{"wrong":"Despite sales rose, profit fell.","right":"Despite the rise in sales, profit fell. / Although sales rose, profit fell.","why":"Despite + danh từ hoặc V-ing; muốn dùng S + V thì phải dùng although."},{"wrong":"Sales rose, however profit fell.","right":"Sales rose. However, profit fell.","why":"However thường mở đầu câu mới (hoặc sau dấu chấm phẩy) và có dấu phẩy theo sau."}]},"quiz":[{"q":"What happened to sales in the South?","o":["They rose by 12%","They stayed flat","They fell sharply"],"a":1},{"q":"What does Lan recommend?","o":["A price review in the South","Closing stores in the North","A bigger marketing budget"],"a":0},{"q":"Choose the correct sentence.","o":["Despite it had more stores, the South made less profit.","Although the South had more stores, but it made less profit.","Despite having more stores, the South made less profit."],"a":2}],"practice":[{"s":"___ the South has more stores, it made less profit.","a":"Although","alt":["Though","Even though"],"hint":"Mặc dù + mệnh đề (S + V)"},{"s":"___ a bigger budget, the South attracted few new customers.","a":"Despite","alt":["In spite of"],"hint":"Mặc dù + danh từ"},{"s":"Sales in the North rose, ___ sales in the South stayed flat.","a":"whereas","alt":["while"],"hint":"Trong khi (so sánh hai vế)"},{"s":"Prices were too high. As a ___, customers chose competitors.","a":"result","alt":[],"hint":"Kết quả là…"},{"s":"Costs are rising. ___, we need to review our prices.","a":"Therefore","alt":["As a result","Consequently"],"hint":"Vì vậy (đầu câu, có dấu phẩy)"}],"speak":["Sales in the North rose by 12%, whereas sales in the South stayed flat.","Although the South has more stores, it made less profit.","Despite a bigger marketing budget, the South didn't attract many new customers.","Therefore, we recommend a price review in the South first."],"write":{"vi":"Viết một đoạn báo cáo (ít nhất 100 từ) so sánh kết quả kinh doanh của hai khu vực hoặc hai sản phẩm mà bạn biết. Dùng ít nhất năm từ nối: although, despite, whereas, however, therefore hoặc as a result.","en":"Write a report paragraph (at least 100 words) comparing the results of two regions or two products you know. Use at least five linkers: although, despite, whereas, however, therefore or as a result.","min":100},"summary":["Although + S + V (không dùng thêm but); despite + danh từ / V-ing.","Whereas nối hai vế trái ngược trong cùng một câu.","However / Therefore / As a result thường đứng đầu câu mới, theo sau là dấu phẩy.","Một đoạn báo cáo tốt: so sánh → giải thích nguyên nhân → kết luận bằng therefore."]},{"id":"x11_2","ch":11,"level":"B2","after":"s_linkers","title":"What really matters is…","vi":"Câu chẻ để nhấn mạnh ý chính","goals":["Sau bài này bạn có thể dùng câu chẻ 'What… is…' để làm nổi bật ý quan trọng nhất.","Sau bài này bạn có thể dùng 'It is/was… that…' để chỉ rõ nguyên nhân hoặc người làm.","Sau bài này bạn có thể viết thông điệp chính của báo cáo rõ ràng, có trọng tâm."],"story":[{"who":"Mark","en":"Your report is accurate, Lan, but the key message gets lost.","vi":"Báo cáo của em chính xác, Lan, nhưng thông điệp chính bị chìm mất."},{"who":"Lan","en":"What do you mean exactly?","vi":"Ý anh cụ thể là sao ạ?"},{"who":"Mark","en":"What I mean is that readers need to see the main point immediately.","vi":"Ý anh là người đọc cần thấy ngay điểm chính."},{"who":"Lan","en":"So I should put the most important idea first?","vi":"Vậy em nên đặt ý quan trọng nhất lên đầu?"},{"who":"Mark","en":"Yes, and make it stand out. Try a cleft sentence.","vi":"Đúng, và làm cho nó nổi bật. Thử dùng câu chẻ xem."},{"who":"Lan","en":"Like this? 'What really matters is customer retention, not new sign-ups.'","vi":"Thế này ạ? 'Điều thực sự quan trọng là giữ chân khách hàng, chứ không phải lượt đăng ký mới.'"},{"who":"Mark","en":"Exactly. Now the cause. Was it the price change?","vi":"Chính xác. Giờ đến nguyên nhân. Có phải do thay đổi giá không?"},{"who":"Lan","en":"No. It was the delivery delays that drove customers away, not the prices.","vi":"Không. Chính sự chậm trễ giao hàng mới làm khách bỏ đi, chứ không phải giá."},{"who":"Mark","en":"Great. That 'It was… that…' pattern shows readers exactly where to look.","vi":"Tuyệt. Mẫu câu 'It was… that…' chỉ cho người đọc biết chính xác cần nhìn vào đâu."},{"who":"Lan","en":"And for the recommendation: 'What we need to do is fix the delivery process.'","vi":"Còn phần đề xuất: 'Điều chúng ta cần làm là sửa quy trình giao hàng.'"},{"who":"Mark","en":"Perfect. Just don't overuse it. Two or three per report is enough.","vi":"Hoàn hảo. Chỉ đừng lạm dụng. Hai hoặc ba câu mỗi báo cáo là đủ."},{"who":"Lan","en":"Got it. What I'll do is highlight only the key points.","vi":"Em hiểu rồi. Điều em sẽ làm là chỉ làm nổi bật các điểm chính."}],"vocab":[{"w":"key message","ipa":"/kiː ˈmɛsɪdʒ/","vi":"thông điệp chính","ex":"What is the key message of this slide?"},{"w":"stand out","ipa":"/stænd aʊt/","vi":"nổi bật","ex":"Use bold text to make the number stand out."},{"w":"cleft sentence","ipa":"/klɛft ˈsɛntəns/","vi":"câu chẻ (câu tách ra để nhấn mạnh)","ex":"'It was Lan who found it' is a cleft sentence."},{"w":"retention","ipa":"/rɪˈtɛnʃən/","vi":"sự giữ chân (khách hàng, nhân viên)","ex":"Customer retention fell to 70%."},{"w":"sign-up","ipa":"/ˈsaɪnʌp/","vi":"lượt đăng ký","ex":"We had 2,000 new sign-ups in May."},{"w":"drive away","ipa":"/draɪv əˈweɪ/","vi":"làm (ai) bỏ đi","ex":"Slow service drives customers away."},{"w":"overuse","ipa":"/ˌoʊvərˈjuːz/","vi":"lạm dụng, dùng quá nhiều","ex":"Don't overuse bold text."},{"w":"highlight","ipa":"/ˈhaɪlaɪt/","vi":"làm nổi bật, nhấn mạnh","ex":"Highlight the three key numbers."}],"grammar":{"t":"Câu chẻ (cleft sentences) để nhấn mạnh","d":"Câu chẻ là cách 'tách' một câu bình thường thành hai phần để dồn sự chú ý vào một thông tin. Dùng 'What… is…' khi muốn nhấn mạnh điều cần làm hoặc điều quan trọng; dùng 'It is/was… that…' khi muốn chỉ rõ chính cái gì/ai gây ra việc đó (thường để sửa một hiểu lầm).","formula":["What + S + V + is/was + danh từ / (to) V / that + mệnh đề","It is/was + phần cần nhấn mạnh + that/who + phần còn lại","Câu thường → câu chẻ: We need better delivery. → What we need is better delivery."],"ex":["Retention really matters. → What really matters is retention.","We need to fix delivery. → What we need to do is fix delivery.","Delivery delays drove customers away. → It was delivery delays that drove customers away.","Lan found the error. → It was Lan who found the error.","I mean that readers need the main point first. → What I mean is that readers need the main point first."],"mistakes":[{"wrong":"What we need is to fixing the process.","right":"What we need is to fix the process. / What we need to do is fix the process.","why":"Sau 'is' dùng to + V hoặc V nguyên mẫu (khi trước đó có 'do'), không dùng V-ing ở đây."},{"wrong":"It was the delays caused the drop.","right":"It was the delays that caused the drop.","why":"Câu chẻ 'It was…' luôn cần 'that' (hoặc 'who' với người) để nối phần còn lại."},{"wrong":"What I mean that we need more data.","right":"What I mean is that we need more data.","why":"Phải có động từ 'is' nối hai phần của câu chẻ."}]},"quiz":[{"q":"What is the problem with Lan's report?","o":["The numbers are wrong","The key message gets lost","It is too short"],"a":1},{"q":"According to Lan, what drove customers away?","o":["The price change","Delivery delays","New sign-ups"],"a":1},{"q":"Choose the correct cleft sentence.","o":["It was the delays that caused the drop.","It was the delays caused the drop.","What caused the drop the delays."],"a":0}],"practice":[{"s":"What really ___ is customer retention.","a":"matters","alt":[],"hint":"Điều thực sự quan trọng là… (động từ, số ít)"},{"s":"It was the delivery delays ___ drove customers away.","a":"that","alt":["which"],"hint":"It was… ___ … (từ nối)"},{"s":"What we need to do ___ fix the delivery process.","a":"is","alt":[],"hint":"Động từ nối hai phần câu chẻ"},{"s":"___ I mean is that readers need the main point first.","a":"What","alt":[],"hint":"Điều tôi muốn nói là…"},{"s":"___ was Lan who found the error in the data.","a":"It","alt":[],"hint":"Chính là Lan… (It is/was… who…)"}],"speak":["What I mean is that readers need to see the main point immediately.","What really matters is customer retention, not new sign-ups.","It was the delivery delays that drove customers away, not the prices.","What we need to do is fix the delivery process."],"write":{"vi":"Hãy viết phần 'Thông điệp chính' (ít nhất 100 từ) cho một báo cáo về một vấn đề ở công ty bạn (ví dụ: khách hàng rời đi, chi phí tăng). Dùng ít nhất hai câu 'What… is…' và một câu 'It was… that…' để nhấn mạnh nguyên nhân và việc cần làm.","en":"Write the 'Key message' section (at least 100 words) of a report about a problem at your company (for example, customers leaving or costs rising). Use at least two 'What… is…' sentences and one 'It was… that…' sentence to emphasise the cause and what needs to be done.","min":100},"summary":["What + S + V + is… : nhấn mạnh điều quan trọng hoặc điều cần làm.","It is/was + X + that/who…: chỉ rõ chính X (nguyên nhân, người) gây ra việc.","Đừng quên 'is' trong câu What… và 'that' trong câu It was….","Chỉ dùng 2–3 câu chẻ mỗi báo cáo để ý chính thật sự nổi bật."]},{"id":"s_badnews","ch":11,"level":"B2","title":"Delivering bad news by email","vi":"Báo tin xấu khéo léo","goals":["Sau bài này bạn có thể báo tin xấu rõ ràng mà vẫn lịch sự bằng Unfortunately / I'm afraid.","Sau bài này bạn có thể đưa ra giải pháp thay thế bằng We would like to propose….","Sau bài này bạn có thể viết một email báo trễ hạn theo bố cục: cảm ơn – báo tin – lý do – giải pháp – kết."],"story":[{"who":"Mark","en":"Have you told Sofia about the delay yet?","vi":"Em đã báo Sofia về việc trễ hạn chưa?"},{"who":"Lan","en":"Not yet. I'm writing the email now, but bad news is hard to write.","vi":"Chưa ạ. Em đang viết email, nhưng viết tin xấu khó thật."},{"who":"Mark","en":"Don't open with the problem. Thank her first, then give the news clearly.","vi":"Đừng mở đầu bằng vấn đề. Cảm ơn chị ấy trước, rồi báo tin một cách rõ ràng."},{"who":"Lan","en":"How about this: 'Thank you for your patience during the data migration.'","vi":"Thế này được không: 'Cảm ơn chị đã kiên nhẫn trong quá trình chuyển đổi dữ liệu.'"},{"who":"Mark","en":"Good. Now the bad news. Soften it, but don't hide it.","vi":"Tốt. Giờ đến tin xấu. Nói mềm mỏng, nhưng đừng giấu."},{"who":"Lan","en":"'Unfortunately, we will need two more weeks to complete the dashboard.'","vi":"'Rất tiếc, chúng tôi sẽ cần thêm hai tuần để hoàn thành dashboard.'"},{"who":"Mark","en":"Clear and polite. Do you explain why?","vi":"Rõ ràng và lịch sự. Em có giải thích lý do không?"},{"who":"Lan","en":"Yes: 'I'm afraid some of the source files contained errors that we had to correct.'","vi":"Có: 'Tôi e rằng một số file nguồn có lỗi mà chúng tôi phải sửa.'"},{"who":"Mark","en":"Fine. Now offer a solution, so she doesn't feel stuck.","vi":"Ổn. Giờ đưa ra giải pháp để chị ấy không thấy bế tắc."},{"who":"Lan","en":"'We would like to propose sending you a preview of the sales section by Friday.'","vi":"'Chúng tôi xin đề xuất gửi chị bản xem trước phần doanh số trước thứ Sáu.'"},{"who":"Mark","en":"Great idea. And how do you close?","vi":"Ý hay. Còn em kết thư thế nào?"},{"who":"Lan","en":"'We regret any inconvenience this may cause, and we appreciate your understanding.'","vi":"'Chúng tôi rất lấy làm tiếc vì sự bất tiện này có thể gây ra, và cảm ơn chị đã thông cảm.'"},{"who":"Mark","en":"Perfect. Honest, polite and helpful. Send it.","vi":"Hoàn hảo. Trung thực, lịch sự và hữu ích. Gửi đi."}],"vocab":[{"w":"patience","ipa":"/ˈpeɪʃəns/","vi":"sự kiên nhẫn","ex":"Thank you for your patience."},{"w":"migration","ipa":"/maɪˈɡreɪʃən/","vi":"sự chuyển đổi (dữ liệu, hệ thống)","ex":"The data migration took a month."},{"w":"soften","ipa":"/ˈsɔːfən/","vi":"làm mềm, nói giảm nhẹ","ex":"Soften the message, but stay clear."},{"w":"source file","ipa":"/sɔːrs faɪl/","vi":"file nguồn","ex":"Two source files were missing."},{"w":"stuck","ipa":"/stʌk/","vi":"bế tắc, mắc kẹt","ex":"I feel stuck with this problem."},{"w":"preview","ipa":"/ˈpriːvjuː/","vi":"bản xem trước","ex":"We can send you a preview on Friday."},{"w":"regret","ipa":"/rɪˈɡrɛt/","vi":"lấy làm tiếc","ex":"We regret the delay."},{"w":"inconvenience","ipa":"/ˌɪnkənˈviːniəns/","vi":"sự bất tiện","ex":"Sorry for any inconvenience."}],"grammar":{"t":"Làm mềm tin xấu trong email công việc","d":"Khi báo tin xấu, người bản xứ không nói vòng vo, nhưng cũng không nói cụt lủn. Họ dùng các cụm 'làm mềm' (Unfortunately, I'm afraid, We regret) ngay trước tin xấu, rồi đưa ngay một giải pháp. Bố cục chuẩn: cảm ơn → báo tin → lý do ngắn → giải pháp → lời xin lỗi/cảm ơn cuối thư.","formula":["Báo tin: Unfortunately, + S + V…  /  I'm afraid (that) + S + V…","Trang trọng hơn: We regret to inform you that + S + V…  /  We regret + danh từ (the delay, any inconvenience)","Giải pháp: We would like to propose + V-ing / danh từ…","Kết: We appreciate your understanding. / Thank you for your patience."],"ex":["Unfortunately, the dashboard will be two weeks late.","I'm afraid we cannot meet the original deadline.","We regret to inform you that the launch has been delayed.","We would like to propose a new deadline of 30 June.","We regret any inconvenience this may cause."],"mistakes":[{"wrong":"Unfortunately, the project will late two weeks.","right":"Unfortunately, the project will be two weeks late.","why":"'late' là tính từ, cần 'be'; khoảng thời gian (two weeks) đứng trước late."},{"wrong":"I'm afraid of we will miss the deadline.","right":"I'm afraid (that) we will miss the deadline.","why":"'I'm afraid of' nghĩa là 'sợ cái gì'; muốn báo tin xấu lịch sự thì dùng I'm afraid (that) + mệnh đề."},{"wrong":"We regret for the delay.","right":"We regret the delay. / We apologise for the delay.","why":"regret đi thẳng với danh từ, không có 'for'; apologise mới đi với 'for'."}]},"quiz":[{"q":"What does Mark say Lan should do first in the email?","o":["Explain the errors","Thank Sofia","Apologise three times"],"a":1},{"q":"What solution does Lan offer?","o":["A discount on the project","A new team member","A preview of the sales section by Friday"],"a":2},{"q":"Which sentence softens bad news correctly?","o":["I'm afraid we will need two more weeks.","I'm afraid of we need two more weeks.","We regret for needing two more weeks."],"a":0}],"practice":[{"s":"___, we will need two more weeks to complete the dashboard.","a":"Unfortunately","alt":[],"hint":"Rất tiếc, … (trạng từ đầu câu)"},{"s":"I'm ___ some of the source files contained errors.","a":"afraid","alt":[],"hint":"Tôi e rằng…"},{"s":"We ___ to inform you that the launch has been delayed.","a":"regret","alt":[],"hint":"Chúng tôi lấy làm tiếc phải thông báo…"},{"s":"We would like to ___ a new deadline of 30 June.","a":"propose","alt":["suggest"],"hint":"Đề xuất (động từ)"},{"s":"Thank you for your ___ during the data migration.","a":"patience","alt":[],"hint":"Sự kiên nhẫn (danh từ)"}],"speak":["Thank you for your patience during the data migration.","Unfortunately, we will need two more weeks to complete the dashboard.","We would like to propose sending you a preview of the sales section by Friday.","We regret any inconvenience this may cause, and we appreciate your understanding."],"write":{"vi":"Dự án báo cáo cho khách hàng của bạn sẽ trễ một tuần vì dữ liệu từ phía khách gửi muộn. Viết email báo tin cho khách theo bố cục: cảm ơn – báo tin – lý do – giải pháp – kết thư. Dùng Unfortunately, I'm afraid và We would like to propose.","en":"Your client report will be one week late because the client sent their data late. Write an email to the client: thank them, give the news, explain the reason, offer a solution and close politely. Use Unfortunately, I'm afraid and We would like to propose.","min":100},"summary":["Bố cục email tin xấu: cảm ơn → báo tin → lý do ngắn → giải pháp → kết.","Làm mềm: Unfortunately, … / I'm afraid (that) … / We regret to inform you that ….","Đưa giải pháp: We would like to propose + V-ing / danh từ.","regret + danh từ (không có for); apologise for + danh từ."]},{"id":"x11_1","ch":11,"level":"B2","after":"s_badnews","title":"Formal or informal?","vi":"Văn phong trang trọng và thân mật","goals":["Sau bài này bạn có thể nhận ra một email quá suồng sã với người lạ hoặc cấp cao.","Sau bài này bạn có thể đổi từ thân mật sang trang trọng: get → receive, ask for → request, need → require.","Sau bài này bạn có thể mở đầu, nhờ vả và kết thư đúng mức độ trang trọng."],"story":[{"who":"Lan","en":"Mark, I need to email BrightMart's finance director. Is this okay? 'Hi! Got your note. Can you send the invoice ASAP? Thanks!'","vi":"Mark, em cần email cho giám đốc tài chính của BrightMart. Thế này ổn không? 'Chào! Nhận được tin rồi. Gửi hóa đơn sớm nhé? Cảm ơn!'"},{"who":"Mark","en":"That's fine for Sofia, but it's too casual for a director you've never met.","vi":"Viết cho Sofia thì được, nhưng quá suồng sã với một giám đốc em chưa từng gặp."},{"who":"Lan","en":"So how do I make it more formal?","vi":"Vậy làm sao để trang trọng hơn ạ?"},{"who":"Mark","en":"Start with 'Dear Mr. Wilson,' and avoid contractions like 'can't' or 'I'm'.","vi":"Mở đầu bằng 'Dear Mr. Wilson,' và tránh dạng viết tắt như 'can't' hay 'I'm'."},{"who":"Lan","en":"Okay. 'Dear Mr. Wilson, Thank you for your message.'","vi":"Được. 'Kính gửi ông Wilson, Cảm ơn ông đã gửi tin nhắn.'"},{"who":"Mark","en":"Good. Formal emails often use longer words: 'receive' instead of 'get', 'request' instead of 'ask for'.","vi":"Tốt. Email trang trọng hay dùng từ dài hơn: 'receive' thay cho 'get', 'request' thay cho 'ask for'."},{"who":"Lan","en":"'We have received your note and would like to request a copy of the invoice.'","vi":"'Chúng tôi đã nhận được ghi chú của ông và xin được đề nghị một bản sao hóa đơn.'"},{"who":"Mark","en":"Better. Now replace 'Can you send…?' with something softer.","vi":"Tốt hơn rồi. Giờ thay 'Can you send…?' bằng câu mềm mỏng hơn."},{"who":"Lan","en":"'I would be grateful if you could send it at your earliest convenience.'","vi":"'Tôi sẽ rất biết ơn nếu ông có thể gửi nó vào thời điểm sớm nhất thuận tiện cho ông.'"},{"who":"Mark","en":"Excellent. That sounds polite but still clear.","vi":"Xuất sắc. Nghe lịch sự mà vẫn rõ ràng."},{"who":"Lan","en":"And the ending? 'Thanks!' feels too short now.","vi":"Còn phần kết? Giờ 'Thanks!' có vẻ cụt quá."},{"who":"Mark","en":"Use 'Kind regards' for most clients. 'Yours sincerely' is even more formal.","vi":"Dùng 'Kind regards' cho hầu hết khách hàng. 'Yours sincerely' còn trang trọng hơn nữa."},{"who":"Lan","en":"Got it. Formal for new contacts and senior people, friendly for colleagues I know well.","vi":"Em hiểu rồi. Trang trọng với người mới quen và cấp cao, thân mật với đồng nghiệp em biết rõ."}],"vocab":[{"w":"casual","ipa":"/ˈkæʒuəl/","vi":"suồng sã, thân mật, không trang trọng","ex":"This email is too casual for a client."},{"w":"contraction","ipa":"/kənˈtrækʃən/","vi":"dạng viết tắt (I'm, can't…)","ex":"Avoid contractions in formal letters."},{"w":"request","ipa":"/rɪˈkwɛst/","vi":"yêu cầu, đề nghị (trang trọng)","ex":"I would like to request a meeting."},{"w":"invoice","ipa":"/ˈɪnvɔɪs/","vi":"hóa đơn","ex":"Please find the invoice attached."},{"w":"grateful","ipa":"/ˈɡreɪtfəl/","vi":"biết ơn","ex":"I would be grateful for your help."},{"w":"at your earliest convenience","ipa":"/æt jɔːr ˈɜːrliəst kənˈviːniəns/","vi":"sớm nhất khi thuận tiện (trang trọng)","ex":"Please reply at your earliest convenience."},{"w":"senior","ipa":"/ˈsiːnjər/","vi":"cấp cao, thâm niên","ex":"She is a senior manager."},{"w":"register","ipa":"/ˈrɛdʒɪstər/","vi":"văn phong, mức độ trang trọng","ex":"Choose the right register for your reader."}],"grammar":{"t":"Văn phong (register): trang trọng và thân mật","d":"Cùng một ý nhưng tiếng Anh có cách nói thân mật (với đồng nghiệp quen) và cách nói trang trọng (với người mới, cấp cao, văn bản chính thức). Viết quá suồng sã thì bị coi là thiếu tôn trọng, viết quá trang trọng với bạn thân thì nghe xa cách. Hãy chọn văn phong theo người đọc.","formula":["Từ vựng: get → receive; ask for → request; need → require; help → assist; ASAP → as soon as possible","Nhờ vả: Can you…? → Could you…? → I would be grateful if you could + V…","Không viết tắt: I'm → I am; can't → cannot; don't → do not","Mở/kết: Hi Sofia, / Thanks! → Dear Mr./Ms. + họ, / Kind regards, / Yours sincerely,"],"ex":["Thân mật: Got your email. → Trang trọng: Thank you for your email.","Thân mật: Can you send it ASAP? → Trang trọng: Could you send it as soon as possible?","Thân mật: We need more time. → Trang trọng: We require additional time.","Thân mật: Let me know. → Trang trọng: Please let us know at your earliest convenience.","Người lạ, cấp cao, khiếu nại, hợp đồng → trang trọng; đồng nghiệp quen, chat nội bộ → thân mật."],"mistakes":[{"wrong":"Dear Mr. John,","right":"Dear Mr. Wilson, (họ của ông John Wilson)","why":"Mr./Ms. đi với HỌ, không đi với tên riêng như cách gọi 'anh John' trong tiếng Việt."},{"wrong":"I would be grateful if you can send the invoice.","right":"I would be grateful if you could send the invoice.","why":"Sau 'I would be grateful if you' dùng 'could' cho đồng bộ và lịch sự."},{"wrong":"Best regard,","right":"Best regards, / Kind regards,","why":"'regards' luôn ở dạng số nhiều trong lời kết thư."}]},"quiz":[{"q":"Why is Lan's first message a problem?","o":["It is too long","It is too casual for a director","It has the wrong invoice number"],"a":1},{"q":"Which ending does Mark suggest for most clients?","o":["Kind regards","Thanks!","See ya"],"a":0},{"q":"Which sentence is the most formal?","o":["Can you send it ASAP?","Send it, thanks!","I would be grateful if you could send it as soon as possible."],"a":2}],"practice":[{"s":"I would be ___ if you could send the invoice.","a":"grateful","alt":[],"hint":"Tôi sẽ rất biết ơn nếu…"},{"s":"We have ___ your message. (formal for 'got')","a":"received","alt":[],"hint":"Từ trang trọng của 'get'"},{"s":"I would like to ___ a copy of the contract. (formal for 'ask for')","a":"request","alt":[],"hint":"Từ trang trọng của 'ask for'"},{"s":"Please reply at your earliest ___.","a":"convenience","alt":[],"hint":"…khi thuận tiện sớm nhất"},{"s":"Dear ___ Wilson,","a":"Mr.","alt":["Mr","Ms.","Ms"],"hint":"Danh xưng + họ"}],"speak":["That's fine for Sofia, but it's too casual for a director you've never met.","We have received your note and would like to request a copy of the invoice.","I would be grateful if you could send it at your earliest convenience.","Use 'Kind regards' for most clients."],"write":{"vi":"Đây là tin nhắn bạn định gửi cho một giám đốc khách hàng mới: 'Hi! Need the sales data for Q3 ASAP. Can you send it? Also can we meet next week? Thanks!' Hãy viết lại thành một email trang trọng, đầy đủ lời mở, lời nhờ và lời kết.","en":"Here is a message you planned to send to a new client director: 'Hi! Need the sales data for Q3 ASAP. Can you send it? Also can we meet next week? Thanks!' Rewrite it as a formal email with a proper greeting, polite requests and a closing.","min":100},"summary":["Chọn văn phong theo người đọc: người lạ/cấp cao → trang trọng; đồng nghiệp quen → thân mật.","Từ trang trọng: receive, request, require, assist; không viết tắt (I am, cannot).","Nhờ vả trang trọng: I would be grateful if you could + V.","Dear Mr./Ms. + HỌ; kết bằng Kind regards hoặc Yours sincerely."]},{"id":"s_if3","ch":11,"level":"B2","title":"If we had tested it…","vi":"Câu điều kiện loại 3","goals":["Sau bài này bạn có thể nói về điều kiện không có thật trong quá khứ bằng câu điều kiện loại 3.","Sau bài này bạn có thể dùng should have / shouldn't have + V3 để nói điều lẽ ra nên (không nên) làm.","Sau bài này bạn có thể tham gia buổi họp rút kinh nghiệm mà không đổ lỗi."],"story":[{"who":"Mark","en":"Okay, everyone. This is our post-mortem on the app launch. What went wrong?","vi":"Được rồi, mọi người. Đây là buổi họp rút kinh nghiệm về đợt ra mắt ứng dụng. Điều gì đã sai?"},{"who":"Lan","en":"The main problem was the payment bug. If we had tested the app on older phones, we would have found it.","vi":"Vấn đề chính là lỗi thanh toán. Nếu chúng ta đã thử ứng dụng trên điện thoại đời cũ, chúng ta đã phát hiện ra nó."},{"who":"Minh","en":"But we didn't have time. The client moved the launch date forward.","vi":"Nhưng chúng ta không có thời gian. Khách hàng đã dời ngày ra mắt lên sớm hơn."},{"who":"Mark","en":"True. If they hadn't changed the date, we could have run a full test.","vi":"Đúng. Nếu họ không đổi ngày, chúng ta đã có thể chạy kiểm thử đầy đủ."},{"who":"Lan","en":"Still, we should have explained the risk to them more clearly.","vi":"Dù vậy, lẽ ra chúng ta nên giải thích rủi ro cho họ rõ ràng hơn."},{"who":"Mark","en":"Agreed. We shouldn't have promised a date we couldn't keep.","vi":"Đồng ý. Lẽ ra chúng ta không nên hứa một ngày mà mình không giữ được."},{"who":"Minh","en":"And if we had checked the error logs that night, we would have fixed the bug much sooner.","vi":"Và nếu tối hôm đó chúng ta kiểm tra nhật ký lỗi, chúng ta đã sửa được lỗi sớm hơn nhiều."},{"who":"Lan","en":"Customers left angry reviews. If the app had worked, our rating wouldn't have dropped so much.","vi":"Khách hàng để lại nhiều đánh giá giận dữ. Nếu ứng dụng chạy tốt, điểm đánh giá của chúng ta đã không tụt nhiều như vậy."},{"who":"Mark","en":"We can't change the past, but we can learn from it.","vi":"Chúng ta không thay đổi được quá khứ, nhưng có thể học từ nó."},{"who":"Lan","en":"Next time, we'll test on at least ten devices before any launch.","vi":"Lần sau, chúng ta sẽ thử trên ít nhất mười thiết bị trước mỗi lần ra mắt."},{"who":"Minh","en":"And I'll create alerts, so we notice errors immediately.","vi":"Và em sẽ tạo cảnh báo để chúng ta phát hiện lỗi ngay lập tức."},{"who":"Mark","en":"Good. Let's write down the lessons learned, so the next team doesn't repeat our mistakes.","vi":"Tốt. Hãy ghi lại những bài học rút ra, để nhóm sau không lặp lại sai lầm của chúng ta."}],"vocab":[{"w":"post-mortem","ipa":"/ˌpoʊstˈmɔːrtəm/","vi":"buổi họp rút kinh nghiệm (sau sự việc)","ex":"We held a post-mortem after the outage."},{"w":"go wrong","ipa":"/ɡoʊ rɔːŋ/","vi":"bị trục trặc, sai","ex":"What went wrong with the report?"},{"w":"move (a date) forward","ipa":"/muːv ˈfɔːrwərd/","vi":"dời (ngày) lên sớm hơn","ex":"They moved the meeting forward to Monday."},{"w":"error log","ipa":"/ˈɛrər lɔːɡ/","vi":"nhật ký lỗi","ex":"Check the error log first."},{"w":"rating","ipa":"/ˈreɪtɪŋ/","vi":"điểm đánh giá","ex":"The app has a rating of 4.5 stars."},{"w":"device","ipa":"/dɪˈvaɪs/","vi":"thiết bị","ex":"Test it on different devices."},{"w":"alert","ipa":"/əˈlɜːrt/","vi":"cảnh báo (tự động)","ex":"Set an alert for failed payments."},{"w":"lessons learned","ipa":"/ˈlɛsənz lɜːrnd/","vi":"bài học kinh nghiệm","ex":"Share the lessons learned with the team."}],"grammar":{"t":"Câu điều kiện loại 3 và should have / could have + V3","d":"Câu điều kiện loại 3 nói về một điều KHÔNG xảy ra trong quá khứ và kết quả tưởng tượng của nó (thực tế: chúng ta không thử → không tìm ra lỗi). Should have + V3 dùng để tiếc nuối hoặc nhận lỗi: lẽ ra nên làm mà không làm. Could have + V3: lẽ ra đã có thể làm.","formula":["Loại 3: If + S + had (not) + V3, S + would (not) have + V3","Khả năng trong quá khứ: S + could have + V3 (lẽ ra đã có thể)","Tiếc nuối / nhận lỗi: S + should have / shouldn't have + V3"],"ex":["If we had tested it, we would have found the bug. (Thực tế: không thử, không tìm ra.)","If the client hadn't changed the date, we could have run a full test.","We should have explained the risk. (Lẽ ra nên giải thích, nhưng đã không làm.)","We shouldn't have promised that date. (Đã hứa, và đó là sai lầm.)","Khi nói: would have → would've /ˈwʊdəv/, should have → should've /ˈʃʊdəv/."],"mistakes":[{"wrong":"If we would have tested it, we would have found the bug.","right":"If we had tested it, we would have found the bug.","why":"Mệnh đề If dùng had + V3, không dùng would."},{"wrong":"If we had tested it, we would found the bug.","right":"If we had tested it, we would have found the bug.","why":"Mệnh đề kết quả cần đủ 'would have + V3'."},{"wrong":"We should tested it on older phones.","right":"We should have tested it on older phones.","why":"Nói về quá khứ phải dùng should have + V3; 'should + V' là lời khuyên cho hiện tại/tương lai."}]},"quiz":[{"q":"What was the main problem with the launch?","o":["The design was ugly","The server was too slow","A payment bug"],"a":2},{"q":"Why didn't the team run a full test?","o":["The client moved the date forward","Minh was on holiday","They had no devices"],"a":0},{"q":"Choose the correct sentence.","o":["If we would have checked the logs, we would fix it.","If we had checked the logs, we would have fixed it.","If we checked the logs, we would have fix it."],"a":1}],"practice":[{"s":"If we had ___ the app on older phones, we would have found the bug.","a":"tested","alt":[],"hint":"had + V3 của test"},{"s":"If the client hadn't changed the date, we ___ have run a full test.","a":"could","alt":["would"],"hint":"lẽ ra đã có thể"},{"s":"We ___ have explained the risk more clearly.","a":"should","alt":[],"hint":"lẽ ra nên"},{"s":"If the app had worked, our rating wouldn't ___ dropped so much.","a":"have","alt":[],"hint":"would not + ___ + V3"},{"s":"We ___ have promised a date we couldn't keep.","a":"shouldn't","alt":["should not"],"hint":"lẽ ra không nên"}],"speak":["If we had tested the app on older phones, we would have found it.","If they hadn't changed the date, we could have run a full test.","We shouldn't have promised a date we couldn't keep.","We can't change the past, but we can learn from it."],"write":{"vi":"Nhớ lại một dự án hoặc báo cáo không suôn sẻ (có thật hoặc tưởng tượng). Viết phần 'Bài học kinh nghiệm' cho buổi họp rút kinh nghiệm: điều gì đã sai, nếu làm khác thì kết quả ra sao, lẽ ra nên làm gì, và lần sau sẽ làm gì. Dùng ít nhất hai câu điều kiện loại 3 và hai câu should have.","en":"Think about a project or report that did not go well (real or imagined). Write the 'Lessons learned' section for a post-mortem: what went wrong, what would have happened if you had acted differently, what you should have done, and what you will do next time. Use at least two third conditionals and two 'should have' sentences.","min":100},"summary":["Loại 3: If + had + V3, would have + V3 — điều không xảy ra trong quá khứ.","could have + V3: lẽ ra đã có thể; should (n't) have + V3: lẽ ra nên (không nên).","Không dùng would trong mệnh đề If.","Trong họp rút kinh nghiệm: nói 'we' thay vì đổ lỗi cho một người, và kết bằng hành động cho lần sau."]},{"id":"s_reported","ch":11,"level":"B2","title":"What the client said","vi":"Tường thuật nâng cao","goals":["Sau bài này bạn có thể tường thuật lời người khác bằng các động từ suggest, recommend, insist, deny, agree, promise.","Sau bài này bạn có thể dùng đúng cấu trúc theo sau mỗi động từ (to V, V-ing, that…).","Sau bài này bạn có thể báo lại góp ý của khách hàng cho nhóm một cách chính xác, ngắn gọn."],"story":[{"who":"Mark","en":"So, how did the call with Sofia go?","vi":"Thế cuộc gọi với Sofia thế nào rồi?"},{"who":"Lan","en":"Mostly well. She agreed to extend the contract for another six months.","vi":"Phần lớn là tốt. Chị ấy đồng ý gia hạn hợp đồng thêm sáu tháng."},{"who":"Minh","en":"Great news! Did she say anything about the dashboard?","vi":"Tin tuyệt quá! Chị ấy có nói gì về dashboard không?"},{"who":"Lan","en":"Yes. She suggested adding a filter for each region.","vi":"Có. Chị ấy gợi ý thêm bộ lọc cho từng khu vực."},{"who":"Mark","en":"That's easy. What else?","vi":"Cái đó dễ. Còn gì nữa?"},{"who":"Lan","en":"She recommended that we send the weekly report on Mondays instead of Fridays.","vi":"Chị ấy khuyên chúng ta gửi báo cáo tuần vào thứ Hai thay vì thứ Sáu."},{"who":"Minh","en":"Did she mention the wrong numbers last month?","vi":"Chị ấy có nhắc đến số liệu sai tháng trước không?"},{"who":"Lan","en":"She did. She insisted on checking the raw data herself from now on.","vi":"Có. Chị ấy nhất quyết từ giờ sẽ tự kiểm tra dữ liệu thô."},{"who":"Mark","en":"Did she blame us for it?","vi":"Chị ấy có đổ lỗi cho chúng ta không?"},{"who":"Lan","en":"No. In fact, she denied saying that our team was careless. Someone had misquoted her.","vi":"Không. Thật ra chị ấy phủ nhận đã nói nhóm mình cẩu thả. Ai đó đã trích dẫn sai lời chị ấy."},{"who":"Minh","en":"What a relief.","vi":"Nhẹ cả người."},{"who":"Lan","en":"Finally, I promised to send her the new version by the 20th.","vi":"Cuối cùng, em đã hứa gửi chị ấy phiên bản mới trước ngày 20."},{"who":"Mark","en":"Good. Let's make sure we keep that promise.","vi":"Tốt. Chúng ta phải giữ đúng lời hứa đó."}],"vocab":[{"w":"extend","ipa":"/ɪkˈstɛnd/","vi":"gia hạn, kéo dài","ex":"They extended the deadline by a week."},{"w":"insist on","ipa":"/ɪnˈsɪst ɑːn/","vi":"nhất quyết, khăng khăng","ex":"He insisted on paying for lunch."},{"w":"deny","ipa":"/dɪˈnaɪ/","vi":"phủ nhận","ex":"She denied making the mistake."},{"w":"blame","ipa":"/bleɪm/","vi":"đổ lỗi","ex":"Don't blame the new intern."},{"w":"careless","ipa":"/ˈkɛrləs/","vi":"cẩu thả","ex":"It was a careless mistake."},{"w":"misquote","ipa":"/ˌmɪsˈkwoʊt/","vi":"trích dẫn sai lời","ex":"The article misquoted our CEO."},{"w":"relief","ipa":"/rɪˈliːf/","vi":"sự nhẹ nhõm","ex":"It was a relief to hear the good news."},{"w":"raw data","ipa":"/rɔː ˈdeɪtə/","vi":"dữ liệu thô","ex":"Send me the raw data, not the chart."}],"grammar":{"t":"Động từ tường thuật và cấu trúc theo sau","d":"Thay vì lặp lại 'She said…', người viết giỏi chọn động từ cho biết ý định của người nói: gợi ý (suggest), khuyên (recommend), nhất quyết (insist), phủ nhận (deny), đồng ý (agree), hứa (promise). Mỗi động từ đi với một cấu trúc cố định, nên cần học theo cụm.","formula":["suggest / recommend + V-ing  hoặc  + that + S + V (nguyên mẫu)","agree / promise / refuse + to V","insist on + V-ing;  deny + V-ing (hoặc + that + S + V)"],"ex":["'Let's add a filter.' → She suggested adding a filter.","'You should send it on Mondays.' → She recommended that we send it on Mondays.","'OK, I'll extend the contract.' → She agreed to extend the contract.","'I must see the raw data.' → She insisted on seeing the raw data.","'I never said that.' → She denied saying that.","'I'll send it by the 20th.' → I promised to send it by the 20th."],"mistakes":[{"wrong":"She suggested me to add a filter.","right":"She suggested adding a filter. / She suggested that we add a filter.","why":"suggest không đi theo cấu trúc 'suggest + người + to V'."},{"wrong":"She denied to say that.","right":"She denied saying that.","why":"deny + V-ing."},{"wrong":"She insisted to see the raw data.","right":"She insisted on seeing the raw data.","why":"insist đi với giới từ on, nên động từ sau đó ở dạng V-ing."}]},"quiz":[{"q":"What did Sofia agree to do?","o":["Pay more money","Extend the contract","Change the team"],"a":1},{"q":"What did Sofia deny?","o":["Saying the team was careless","Getting the weekly report","Seeing the dashboard"],"a":0},{"q":"Choose the correct sentence.","o":["She recommended us to send it on Monday.","She insisted to check the data.","She promised to send the files."],"a":2}],"practice":[{"s":"She suggested ___ a filter for each region.","a":"adding","alt":[],"hint":"suggest + V-ing"},{"s":"She agreed ___ the contract for six months.","a":"to extend","alt":[],"hint":"agree + to V"},{"s":"She insisted on ___ the raw data herself.","a":"checking","alt":["seeing"],"hint":"insist on + V-ing"},{"s":"She denied ___ that our team was careless.","a":"saying","alt":[],"hint":"deny + V-ing"},{"s":"I promised ___ her the new version by the 20th.","a":"to send","alt":[],"hint":"promise + to V"}],"speak":["She agreed to extend the contract for another six months.","She suggested adding a filter for each region.","She insisted on checking the raw data herself from now on.","I promised to send her the new version by the 20th."],"write":{"vi":"Bạn vừa họp với khách hàng. Họ đã nói: 'Let's meet every two weeks.' / 'You should add a chart for costs.' / 'I never asked for daily reports.' / 'OK, we'll pay the invoice this week.' Viết email báo lại cho nhóm, dùng suggest, recommend, deny, agree và promise.","en":"You have just met a client. They said: 'Let's meet every two weeks.' / 'You should add a chart for costs.' / 'I never asked for daily reports.' / 'OK, we'll pay the invoice this week.' Write an email reporting this to your team, using suggest, recommend, deny, agree and promise.","min":100},"summary":["Chọn động từ tường thuật thể hiện ý người nói, thay vì chỉ dùng said.","suggest / recommend + V-ing hoặc + that + S + V.","agree / promise / refuse + to V.","insist on + V-ing; deny + V-ing."]},{"id":"x11_3","ch":11,"level":"B2","after":"s_reported","title":"A, an or the?","vi":"Mạo từ trong văn viết công việc","goals":["Sau bài này bạn có thể chọn đúng a/an, the hoặc không dùng mạo từ trong báo cáo.","Sau bài này bạn có thể dùng 'an' theo âm (an hour, an 8% rise), không theo chữ cái.","Sau bài này bạn có thể tự soát lỗi mạo từ trước khi gửi văn bản."],"story":[{"who":"Lan","en":"Mark, could you proofread my report before I send it?","vi":"Mark, anh soát lỗi giúp em bản báo cáo trước khi em gửi được không?"},{"who":"Mark","en":"Of course. Overall, it's clear. Most of my notes are about articles.","vi":"Tất nhiên. Nhìn chung là rõ ràng. Phần lớn ghi chú của anh là về mạo từ."},{"who":"Lan","en":"Articles are hard for me. Vietnamese doesn't have 'a' or 'the'.","vi":"Mạo từ khó với em lắm. Tiếng Việt không có 'a' hay 'the'."},{"who":"Mark","en":"Here you wrote 'We launched new app in March.' It should be 'We launched a new app in March', because you're mentioning it for the first time.","vi":"Ở đây em viết 'We launched new app in March.' Phải là 'We launched a new app in March', vì đây là lần đầu em nhắc đến nó."},{"who":"Lan","en":"And then 'The app reached 50,000 users' is right, because the reader already knows which app?","vi":"Và sau đó 'The app reached 50,000 users' là đúng, vì người đọc đã biết là ứng dụng nào rồi?"},{"who":"Mark","en":"Exactly. Now this one: 'The customers prefer online shopping.'","vi":"Chính xác. Giờ câu này: 'The customers prefer online shopping.'"},{"who":"Lan","en":"Is that wrong? I'm talking about customers in general.","vi":"Câu đó sai ạ? Em đang nói về khách hàng nói chung mà."},{"who":"Mark","en":"That's the problem. For general statements, use no article: 'Customers prefer online shopping.'","vi":"Vấn đề là ở đó. Khi nói chung chung thì không dùng mạo từ: 'Customers prefer online shopping.'"},{"who":"Lan","en":"But for the BrightMart customers in our survey, I write 'the customers'?","vi":"Nhưng với những khách hàng BrightMart trong khảo sát của mình, em viết 'the customers'?"},{"who":"Mark","en":"Right, because they're a specific group. Also, it's 'the highest growth', not 'highest growth'.","vi":"Đúng, vì họ là một nhóm cụ thể. Ngoài ra, phải là 'the highest growth', không phải 'highest growth'."},{"who":"Lan","en":"Superlatives take 'the'. And I use 'an' before a vowel sound, like 'an hour' and 'an 8% rise'.","vi":"So sánh nhất đi với 'the'. Và em dùng 'an' trước âm nguyên âm, như 'an hour' và 'an 8% rise'."},{"who":"Mark","en":"Perfect. Fix those, and the report is ready to go.","vi":"Hoàn hảo. Sửa mấy chỗ đó là báo cáo sẵn sàng để gửi."}],"vocab":[{"w":"proofread","ipa":"/ˈpruːfriːd/","vi":"soát lỗi (văn bản)","ex":"Always proofread before you send."},{"w":"article","ipa":"/ˈɑːrtɪkəl/","vi":"mạo từ (a, an, the)","ex":"'The' is the definite article."},{"w":"overall","ipa":"/ˌoʊvərˈɔːl/","vi":"nhìn chung, tổng thể","ex":"Overall, the results are good."},{"w":"reach","ipa":"/riːtʃ/","vi":"đạt tới (con số)","ex":"The app reached one million users."},{"w":"general statement","ipa":"/ˈdʒɛnərəl ˈsteɪtmənt/","vi":"câu nói chung chung, khái quát","ex":"'Data is valuable' is a general statement."},{"w":"specific","ipa":"/spəˈsɪfɪk/","vi":"cụ thể, xác định","ex":"Can you give a specific example?"},{"w":"superlative","ipa":"/sʊˈpɜːrlətɪv/","vi":"dạng so sánh nhất","ex":"'Highest' is a superlative."},{"w":"vowel sound","ipa":"/ˈvaʊəl saʊnd/","vi":"âm nguyên âm","ex":"'Hour' starts with a vowel sound."}],"grammar":{"t":"Mạo từ a/an, the và không mạo từ","d":"Tiếng Việt không có mạo từ nên người Việt hay bỏ quên hoặc thêm thừa. Hãy tự hỏi hai câu: (1) Danh từ đếm được số ít hay không? (2) Người đọc đã biết chính xác cái nào chưa? Chưa biết → a/an; đã biết hoặc chỉ có một → the; nói chung chung với số nhiều hoặc danh từ không đếm được → không dùng mạo từ.","formula":["a/an + danh từ đếm được số ít, nhắc lần đầu (an trước ÂM nguyê
